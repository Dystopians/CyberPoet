<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>诗歌偏好标注</title><style>
:root{--bg:#faf9f7;--fg:#1c1a17;--card:#fff;--line:#e3ded6;--accent:#7c5c3e;--muted:#6b655c}
@media(prefers-color-scheme:dark){:root{--bg:#16151300;--bg:#161513;--fg:#eae6df;--card:#1f1e1b;--line:#33302b;--accent:#c79a6c;--muted:#9a938a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
font:16px/1.75 "Noto Serif CJK SC","Songti SC",Georgia,serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;z-index:9}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px}
.bar div{height:100%;background:var(--accent);border-radius:2px;transition:width .2s}
main{max-width:1100px;margin:0 auto;padding:20px}
.prompt{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
padding:12px 16px;margin-bottom:18px;font-size:15px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.row{grid-template-columns:1fr}}
.poem{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;cursor:pointer}
.poem:hover{border-color:var(--accent)}
.poem h3{margin:0 0 10px;font-size:13px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.poem pre{margin:0;font:inherit;white-space:pre-wrap}
.keys{margin-top:18px;color:var(--muted);font-size:14px;text-align:center}
button{font:inherit;padding:7px 14px;border:1px solid var(--line);background:var(--card);
color:var(--fg);border-radius:5px;cursor:pointer;margin-left:8px}
button:hover{border-color:var(--accent)}
.done{text-align:center;padding:60px 20px}
</style></head><body>

<script>
const PAIRS = [{"i": 0, "prompt": "写一首以旧气象站为场景的现代诗。风向标坏了，但纸带记录仪还在走，值班员听见远处雷声。", "pk": "A:cp-v1-004", "A": {"id": "cd728a4cac071013", "body": "昨夜的风\n从屋顶掠过\n风向标坏了\n值班员没有觉察\n而纸带记录仪仍在向前跑\n雷声\n在远方隐隐滚动"}, "B": {"id": "92f6fe050bcc7ee5", "body": "铅字被时间推着移动\n铁皮屋顶漏雨的声音\n像一个老人咳嗽\n\n一只乌鸦停在桅杆上\n看着风向标不动了\n它忽然飞起，绕着屋顶盘旋\n\n墙上的温度计\n仍然指在36度的位置\n仿佛永远没有变化\n\n窗外的云\n从北往南飘来\n天空变得灰暗"}}, {"i": 1, "prompt": "写一首山中隧道维修夜班的现代诗。工人敲击岩壁，以回声判断空洞，偶尔有水滴落在安全帽上。", "pk": "B:cp-v1-012", "A": {"id": "a209f2da09bb2737", "body": "他们敲击岩壁\n以回声判断空洞\n有时用口哨传递消息\n有时用绳子吊下工具\n\n敲击岩壁\n敲击岩壁\n他们用口哨传递消息\n用绳子吊下工具\n\n有时用口哨传递消息\n有时用绳子吊下工具\n有时把碎石装进背篓\n有时把碎石装进背篓\n\n敲击岩壁\n有时用口哨传递消息\n有时用绳子吊下工具\n有时把碎石装进背篓\n\n有时把碎石装进背篓"}, "B": {"id": "f7895338079befd8", "body": "把头灯拧到最暗\n他们开始敲击岩壁\n用回声判断空洞\n用钢钎探测地层的伤口\n\n有时停下来擦拭安全帽\n擦掉脸上的汗\n用扳手把螺丝拧紧\n在石缝里插一截木棍\n\n敲击岩壁\n用回声判断空洞\n把头灯拧到最暗\n用钢钎探测地层的伤口"}}, {"i": 2, "prompt": "写一首以旧气象站为场景的现代诗。风向标坏了，但纸带记录仪还在走，值班员听见远处雷声。", "pk": "B:cp-v1-004", "A": {"id": "7284dd1e49411933", "body": "风向标坏了一年又一年\n而纸带记录仪仍在走\n云层中隐隐传来声音\n像有人在敲打一口钟\n\n值班员坐在窗口记笔记\n他的脸对着玻璃\n用指甲在上面划着\n写下一些算式\n\n他把剩下的墨水倒进搪瓷盆\n然后去擦干桌子\n把凳子摞到墙角\n把椅子摆到外面\n\n有一阵风穿过走廊\n使铁丝网微微晃动\n他把脸转向窗外\n用指甲在玻璃上划着\n写下一些算式"}, "B": {"id": "7568719d09390c61", "body": "有人用粉笔在地上画出坐标系\n用指甲敲击铁桶\n测量水位\n一只铜尺\n放在窗台\n晒了一年\n它的边缘有点发蓝\n\n风向标坏了\n但纸带记录仪还在走\n值班员听见远处雷声\n他把窗关严\n然后把插销拧回去\n他想，那些云朵肯定记住了航线\n像一群鸽子\n衔着绳子\n飞过屋顶\n它们的影子落在地上\n变成一条条河\n在地图上\n它们只是小小的黑点\n而我们\n住在里面"}}, {"i": 3, "prompt": "写一首博物馆修复室的现代诗。修复师用极细的笔补一幅古画中的裂隙，窗外正在修高架桥。", "pk": "B:cp-v1-029", "A": {"id": "08164b60d9b1dd2e", "body": "一盏灯罩着那幅画\n用极细的笔补一幅古画中的裂隙\n修复师用极细的笔补一幅古画中的裂隙\n外面有人在修高架桥"}, "B": {"id": "1fdf0e3434c36fc0", "body": "把一小片云移到画外\n他用镊子夹起一粒白头翁\n窗外\n把一根钢索拧进岩石\n他用棉签蘸松节油\n擦掉一块污渍\n把一枚硬币按回原处\n他用刀尖挑开一小块漆皮\n用砂纸打磨边缘\n外面把一段水管接到另一段水管上\n他用毛刷扫去碎屑\n把一个口沿对准另一个口沿\n外面把一块砖放在另一块砖上\n他用棉球吸干水迹\n把一条裂缝填平\n外面把一棵树移走\n把另一棵树栽下"}}, {"i": 4, "prompt": "写一首山中隧道维修夜班的现代诗。工人敲击岩壁，以回声判断空洞，偶尔有水滴落在安全帽上。", "pk": "A:cp-v1-012", "A": {"id": "db5d44f087c4e488", "body": "咚——咚——咚——\n敲着岩石\n敲着岩石\n敲着岩石\n\n锤子的声音像一只鸟\n在洞里飞来飞去\n\n咚——咚——咚——\n敲着岩石\n敲着岩石\n敲着岩石\n\n叮的一声\n一滴水\n掉到安全帽上"}, "B": {"id": "c3446dc19d4b2fac", "body": "敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁\n敲击岩壁"}}, {"i": 5, "prompt": "写一首凌晨四点面包房的现代诗，把发酵、炉火与尚未醒来的城市放在同一时间结构里。", "pk": "A:cp-v1-003", "A": {"id": "6dca8f3c403eba6b", "body": "凌晨四点，烤箱开始做梦：\n面团从内部膨胀，像一座座小城。\n酵母在其中穿行——如一队盲人，\n寻找着出口。而炉火，是那唯一的眼。\n\n门廊外，街灯亮得有点过头了，\n仿佛整座城市刚刚醒来，便开始失眠。\n一只流浪猫穿过巷子，在黑暗中潜伏，\n它已习惯于这样的时刻。\n\n面包房内却是一片沉寂，只有炉火在跳动，\n像一个正在被驯服的灵魂。"}, "B": {"id": "e42e65366a46c256", "body": "凌晨四点\n有人打开一扇门\n蒸汽从里面涌出\n水珠沿着墙壁爬到外面\n\n一个男人用木棍拨弄炉膛里的火\n他身边放着一把斧子\n女人在揉面\n她的手沾满面粉\n\n炉火映红了半边天空\n钟声传过街角\n钟声之后\n另一个声音跟着响起"}}, {"i": 6, "prompt": "写一首河流改道后的现代诗。桥还在原处，桥下长出高草，附近孩子把这里当作球场。", "pk": "B:cp-v1-006", "A": {"id": "6fc37eed2127f879", "body": "桥墩留在那里\n像一排倒置的牙齿\n河岸上\n有几株歪脖子杨树\n\n孩子们把这里当作球场\n用石块划线\n用木棍做球门\n他们的父亲\n曾在这里撒过网\n\n水声来自下游\n有人在打捞旧箱子\n箱子口沿豁了一小块\n里面装着碎玻璃和一把伞"}, "B": {"id": "11a91662ae0c663f", "body": "河床边缘有一处凹陷\n水从那里消失\n它的气味留在石头内部\n我们坐在井沿上喝水\n像坐在船头\n\n河底有座桥\n河水从它身上流过\n桥下长出高草\n附近的孩子把这里当作球场\n树根穿过桥洞\n把箱子顶起"}}, {"i": 7, "prompt": "写一首发生在末班地铁停运后的现代诗：一个清洁工在空站台发现一枚仍然温热的硬币。不要解释硬币的来历，让动作和声音推动诗。", "pk": "B:cp-v1-001", "A": {"id": "a61dcf08494e5266", "body": "他把硬币攥进掌心\n用一张纸巾把它擦亮\n放进上衣内袋\n熄灭手电筒\n把钥匙挂回门后\n把凳子摞到墙角\n关掉走廊尽头的灯\n把抹布叠成方块\n收起拖把\n将水倒进下水道\n把扫帚倚在墙上\n然后走进车厢\n用指甲刮去座椅上的口香糖"}, "B": {"id": "5287578f6eb93c09", "body": "他把那枚硬币握在手心\n把脸凑近水洼\n用掌心搓着\n擦去上面的污迹\n然后\n把它放回原处\n用袖子抹掉\n镜子上的雾\n擦掉窗上的水渍\n收起梯子\n踩灭脚印\n锁上大门\n把钥匙挂在门后\n关严后面的门\n把凳子摞在一起\n叠好扫帚\n把铁锹靠墙放好\n把口香糖从地上捡起来\n揉成一团\n扔进纸篓\n合上闸刀\n把灯关掉\n沿着台阶走下\n关掉路灯"}}, {"i": 8, "prompt": "写一首凌晨四点面包房的现代诗，把发酵、炉火与尚未醒来的城市放在同一时间结构里。", "pk": "B:cp-v1-003", "A": {"id": "9c6209f48347e8e4", "body": "凌晨四点\n面包房亮着灯\n像一只巨大的茧\n\n把发酵、炉火\n与尚未醒来的城市\n放在同一时间结构里\n\n一个男人在里面工作\n用铲子翻动面团\n他身后是面粉的白\n以及一扇漆过的门\n\n水桶提上楼去\n刷洗碗碟\n擦干灶台上的水渍\n关严滴水的龙头\n\n他收起砧板\n把刀架放回原处\n把盐罐盖拧回去\n把箱子按大小摞好\n\n然后走到窗前\n看天色渐渐变亮\n把钥匙挂回门后\n把地图折回原来的痕迹"}, "B": {"id": "2d11f45f3ecb7c71", "body": "凌晨四点\n水桶拎到井边\n用绳子绑住\n提上屋顶\n用刷子刷掉桶沿上的铁锈\n\n炉膛里\n火苗蹿起又落下\n木柴在灰烬中烧尽\n门把手上结了一层水珠\n雾从桥下升起\n把街道围起来"}}, {"i": 9, "prompt": "写一首春运候车室的现代诗。一位老人把纸质车票夹进透明手机壳，广播多次更换检票口。", "pk": "B:cp-v1-026", "A": {"id": "cb7971c6d4749d32", "body": "一个老人用塑料尺子\n把纸页抚平\n夹进透明手机壳\n广播里说\n改到三号检票口了\n\n他收起报纸\n把旧报纸叠成一摞\n放进提包\n又把提包拎起来\n再放回原处\n\n他收起报纸\n把旧报纸叠成一摞\n放进提包\n又把提包拎起来\n再放回原处"}, "B": {"id": "19aa5b2808341526", "body": "一个男人用指甲划开一小片窗膜\n外面的雪停了\n他把车票夹进手机套\n然后把旧报纸折成一只小船\n放进洗手池\n等水漫过门槛\n有人在远处朝这边喊\n“二号口开始检票了”"}}, {"i": 10, "prompt": "写一首清晨海鲜市场的现代诗，从一块正在融化的冰的视角观察摊贩、鱼鳞和天光。", "pk": "B:cp-v1-015", "A": {"id": "26304dcb7ce89454", "body": "我开始变小\n我的边缘有些发蓝\n他们把砧板剁得叮当响\n我听见自己的声音\n在他们的吆喝中碎裂\n他们用长柄勺捞起我\n像捞起一条条白毛巾\n他们把水泼向对方\n我听见水声穿过屋顶\n有人对着镜子刮胡子\n有人用刷子刷盘子\n有人用脚踩鱼鳞\n那些鳞片在石阶上\n闪了一下\n就不见了\n天空倾斜着\n我看到自己被放进一只桶\n提起来时\n我的影子摇晃了一下\n我开始变小\n我的边缘有些发蓝"}, "B": {"id": "c34ff52462d3e1f6", "body": "我的边缘有一处凹陷\n我正把内部掏空\n我的边缘有一处凹陷\n外面刷过一遍漆\n像一次失败的修复\n我的边缘有一处凹陷\n里面装着水\n用了很多年\n我的边缘有一处凹陷\n它被敲出一个口子\n水漏得比预期快一些\n我的边缘有一处凹陷\n它的底部有一处凹陷\n我的边缘有一处凹陷\n我的边缘有一处凹陷\n有人把我抬起来\n放进一只铁桶\n我的边缘有一处凹陷"}}, {"i": 11, "prompt": "写一首关于图书馆归还箱的现代诗。雨夜里一本受潮的书被投进去，机器给出正常回执。", "pk": "B:cp-v1-019", "A": {"id": "cfed6bb0022f17dc", "body": "箱子放在走廊尽头\n提手用铁丝缠过\n口沿有一处凹陷\n内部刷过一遍漆\n\n一叠旧报纸垫着底\n用了很多年\n里面放了一些东西：\n钥匙、账本、汇票存根\n一些账本、汇票存根\n一个木盒装着发夹\n一个发夹装着碎纸屑\n\n收据用绳子捆着\n外面贴了一张便条\n雨夜里一本受潮的书\n被投进去，机器\n给出正常回执"}, "B": {"id": "cb8abdf7a9df90c9", "body": "箱子放在走廊尽头\n像一只落单的箱子\n提手用铁丝缠过\n外面刷过一遍漆\n\n雨夜里一本受潮的书\n被投进去\n机器给出正常回执"}}, {"i": 12, "prompt": "写一首盐湖边废弃电影院的现代诗。银幕被风吹动，湖面的反光偶尔投进大厅。", "pk": "B:cp-v1-010", "A": {"id": "333549ba1038ac1a", "body": "水洼中，一只瓶子\n收拢它的边缘\n像收拢碎玻璃\n像收拢嘴唇\n像收拢一匹布\n像收拢天空\n像收拢一片海\n像收拢镜子\n像收拢镜子内部\n一个模糊的人形\n像收拢词语\n像收拢话语\n像收拢沉默\n像收拢你的目光"}, "B": {"id": "c081064886b51231", "body": "玻璃窗上结了一层水垢\n内部已经塌了\n门框歪着\n一只木桶放在台阶旁\n用了很多年\n\n有人把自行车停在外面\n用绳子捆住\n用了很多年\n银幕被风吹动\n湖面的反光偶尔投进大厅"}}, {"i": 13, "prompt": "写一首凌晨四点面包房的现代诗，把发酵、炉火与尚未醒来的城市放在同一时间结构里。", "pk": "B:cp-v1-003", "A": {"id": "a1ddf825f3d5c90c", "body": "凌晨四点\n有人把盐揉进面团\n窗台上的水壶滴着\n一个人的回声\n\n炉膛里的火焰\n舔着铁锅边缘\n像舔着一只碗沿\n有人在擦桌子\n\n有人把箱子摞到墙角\n把钥匙挂回门后\n有人把盐揉进面团\n用盆接住檐角滴下的水"}, "B": {"id": "68031fb9a4f6ce25", "body": "凌晨四点\n面包房的玻璃窗像一块冰\n把发酵的过程藏在里面\n炉火把夜色熔成一种暗红\n街边的树木正在吐出新叶\n它们将用树叶覆盖屋顶\n用枝条捆住井口\n用树根系住水龙头\n把旧报纸卷成喇叭形\n挂在门前晾干\n而那些未醒的城市\n把黎明放在一个抽屉里\n关严后插上一把钥匙"}}, {"i": 14, "prompt": "写一首台风登陆前理发店里的现代诗。店员用胶带贴玻璃，顾客坚持把最后一侧头发剪完。", "pk": "B:cp-v1-021", "A": {"id": "55efeeebe7db7878", "body": "店员用胶带贴玻璃\n外面传来钟声\n有人在收衣服\n而电闸仍然开着\n把最后一侧头发剪完\n是他的坚持\n镜子上结了一层水雾\n他对着镜子练习微笑\n像对着镜子练习发音\n用口哨吹一支小曲\n擦干镜面\n他开始刮脸\n泡沫溢出盆沿\n用毛巾擦了又擦\n用手指抹去镜上的雾\n用纸巾按住止血\n用另一张纸巾按住另一处出血\n他擦干手\n把碎玻璃扫进纸盒\n放进碎纸机\n把碎纸机的出口捏扁\n把插头拔下\n把线缠好\n把工具放回原处\n把门锁上\n把钥匙挂回门后"}, "B": {"id": "6d5fbfe8f66924c6", "body": "把最后半边脸凑近镜子\n我听见电锯般呼啸的风声\n外面有谁在收晾衣绳\n店员用胶布缠着窗框\n像缠着一根伤疤\n他对着镜子练习微笑\n说等会儿还要去修屋顶的瓦片\n我们坐着\n等待一场风暴过去\n有人把碎玻璃扫到角落\n有人把伞架回原处\n有人把凳子摞回去\n而风还在继续吹着\n直到街角传来一声巨响\n才想起关掉走廊尽头的灯"}}, {"i": 15, "prompt": "写一首围绕修表匠午睡时的梦展开的现代诗。梦中所有钟表指向不同的潮汐时刻。", "pk": "B:cp-v1-007", "A": {"id": "aff3a5565267cff4", "body": "他的手臂插在口袋里\n用一根铁丝拧紧螺丝\n他把脸埋进掌心\n像埋进一块田地\n\n他梦见自己从一口井中捞起月亮\n擦干水珠后装回盒子里\n他梦见自己走进一座钟表店\n把自己挂上墙\n他梦见一只白瓷缸口沿磕破了\n他梦见有人敲门\n他起身开门\n发现外面站着一个陌生人\n手里攥着一张纸条\n上面写着：\n你该刮胡子了"}, "B": {"id": "03526f468f000ee6", "body": "他的脸埋在地图里\n用一把小刀划开\n一个地方\n用另一把小刀划开另一个地方\n他收起工具箱\n擦掉桌面的水渍\n关上窗子\n把碎玻璃扫进纸盒\n他看见自己的头\n悬在半空\n像一颗被击落的行星\n他听见风声\n穿过街道\n用口哨吹出一串口令\n他梦见自己\n在一座桥下醒来\n提着箱子\n沿着堤岸走\n他走进一家杂货铺\n把钥匙放在柜台上\n把账本合上\n把闹钟拨到两点三十分\n然后沿着街走到\n修表匠的店里\n从窗口往里面看\n他看见自己\n正伏案工作\n窗外下着雪"}}, {"i": 16, "prompt": "写一首关于夜间无人仓库的现代诗。自动搬运车避开地上一只误入的麻雀，路线因此不断重算。", "pk": "B:cp-v1-025", "A": {"id": "0c40aaa7e9c2abea", "body": "在夜间无人的仓库里\n自动搬运车避开地上一只误入的麻雀\n路线因此不断重算\n\n机器与鸟都不拟人化\n用铁丝捆扎箱子的人\n把钥匙挂回门后\n锁上后转身离开\n外面下着雪\n他把脸埋进围巾\n像把脸埋进自己的身体\n外面下着雪"}, "B": {"id": "95ba44f32d4733e0", "body": "金属门锁转动时发出一阵咳嗽\n自动搬运车避开地上一只误入的麻雀\n路线因此不断重算\n它的后背驮着一扇铁门\n它把箱子按大小摞好\n用胶带缠紧\n它的后背驮着一扇铁门\n当警报响起\n它继续搬动箱子\n用胶带缠紧\n用脚踩住边缘\n使箱子摆正"}}, {"i": 17, "prompt": "写一首关于小城公共泳池冬季排水的现代诗。池底显出褪色的泳道线，一个维修人员从深水区走向浅水区。", "pk": "B:cp-v1-030", "A": {"id": "a5ed2e97d2ef2a62", "body": "用一根竹竿搅动底部\n他开始放水\n池底显出褪色的泳道线\n像一条条被遗忘的绳索\n\n他提着桶沿堤岸走\n沿着水迹\n走到一棵柳树下\n把水倒掉"}, "B": {"id": "f929f9e685a46d3d", "body": "用铁锹舀起最后半桶水\n他提着桶沿走下台阶\n把钥匙插回锁眼\n把脸擦干\n把口哨塞回裤袋\n把门闩挂回去\n把绳子重新系紧\n把盖板放回原处\n把石头垒回去\n把木头架回去\n把塑料凳摞回去\n把旧报纸收拢\n把口哨塞回裤袋\n把钥匙插回锁眼\n把脸擦干\n把桶拎到檐下"}}, {"i": 18, "prompt": "写一首关于城市停电十分钟的现代诗。叙述在不同楼层间移动，只通过窗、脚步和短暂亮起的手机呈现人群。", "pk": "A:cp-v1-009", "A": {"id": "a34b1cacb09d42fd", "body": "楼顶的水塔开始渗漏\n人们用脚掌丈量街道\n把影子叠进箱子\n收起晾了三天的衣服\n\n有人从三楼打开窗\n把半截蜡烛扔下来\n有人用口哨吹出一段旋律\n有人用手机照明\n把碎玻璃扫到树根旁\n\n十分钟后\n一盏灯突然亮起来"}, "B": {"id": "4feeabb34ef5a19a", "body": "楼顶的灯火熄灭了  \n一只鸟惊叫一声飞走了  \n\n十层窗口的手机光像流星坠落  \n在九层的阳台堆积成河  \n八层的婴儿哭了又睡了  \n\n七层的老人摸索着  \n从冰箱里取出一把冰块\n放进玻璃杯\n六层有人敲击铁锅  \n五层有人吹响口哨  \n\n四层有人对着镜子练习微笑  \n三层有人用牙刷搅动池子里的水  \n二层有人把鞋子扔出窗外  \n一层有人打开门迎接风"}}, {"i": 19, "prompt": "写一首盐湖边废弃电影院的现代诗。银幕被风吹动，湖面的反光偶尔投进大厅。", "pk": "A:cp-v1-010", "A": {"id": "e1b5fe76b0d09d00", "body": "胶片在暗盒里长出盐粒  \n风掀起幕布时  \n一尾鱼正从银幕游向观众席  \n\n座位空着，却有人  \n在黑暗中反复调试焦距  \n投影仪吐出褪色的光斑  \n像未寄出的信  \n\n湖水把倒影还给天空  \n而我们始终无法对镜  \n确认哪一边才是真实的  \n放映机  \n\n尘埃在光束中悬浮  \n如同某种未完成的  \n对白"}, "B": {"id": "c1b99a35287b947f", "body": "那年冬天，我们曾在这里观看一部黑白电影\n现在，门框歪了\n墙壁的裂缝中长出了青草\n\n一只碗扣在窗台上\n里面盛着雨水\n外面下着雪\n\n风掀起了银幕的一角\n它向湖面伸去\n像要抓住自己的倒影\n\n树根穿过墙洞\n把一棵桦树抱到院子里来\n有人用口哨吹着一支歌\n\n它的曲调\n来自一个遥远的地方\n没有结局"}}, {"i": 20, "prompt": "写一首关于小城公共泳池冬季排水的现代诗。池底显出褪色的泳道线，一个维修人员从深水区走向浅水区。", "pk": "B:cp-v1-030", "A": {"id": "24aefa6d09c8f7a3", "body": "池底显出褪色的泳道线\n一个维修人员\n从深水区走向浅水区\n\n他用脚丈量过\n许多个下午\n现在关掉水泵\n提桶清理残水\n把积水舀进铁皮桶\n提回办公室倒掉\n\n然后把钥匙挂在门后\n锁上大门\n锁上大门后\n沿着街走回家"}, "B": {"id": "61067a21d61b6980", "body": "水位下降时\n他走向浅水区\n像从一场大火中走来\n\n水抽干了\n池底显出\n褪色的泳道线\n他用长柄刷子\n刷着那些线条\n像擦洗一只破旧的脸盆\n\n他提着桶\n沿着台阶走下去\n把积水扫到一边\n把铁锹放回原处\n锁上大门"}}, {"i": 21, "prompt": "写一首关于旱季水库的现代诗。水位下降后露出旧村的屋脊，叙述者只在岸上观察，不进入回忆说明。", "pk": "B:cp-v1-002", "A": {"id": "4879a2daac447675", "body": "水位下降之后\n那些屋顶重新出现\n像被遗忘过的脸\n\n我沿着堤岸行走\n提防着野猪拱开铁丝网\n提防着蛇\n\n一些水鸟叼起碎玻璃飞走\n它们把波纹荡到更远的地方\n我收起绳子"}, "B": {"id": "91f83161da76de81", "body": "有人用绳子捆好井沿\n把旧船拖到堤坝下边\n放倒的树干重新立起\n用斧头削过一遍\n水位下降后露出旧村的屋脊\n像一群埋葬过的石头\n从河岸向外延伸\n叙述者只在岸上观察\n不进入回忆说明\n风把碎玻璃扫到一处\n用泥土填平了坑洼\n用铁丝拦起缺口\n把木桩敲进地面\n提着桶的人走向远处\n把水倒掉后关紧阀门"}}, {"i": 22, "prompt": "写一首以失灵的门禁系统为场景的现代诗。暴雨中住户互相替陌生人撑门，系统恢复后门立刻合上。", "pk": "B:cp-v1-028", "A": {"id": "04d0b292870ddd66", "body": "有人用脚尖把水洼拨大些\n把伞倾向对方\n他们彼此搀扶着\n走进楼道\n\n锁孔里塞满口香糖\n走廊尽头\n一只黑猫竖起耳朵\n在积水里扑腾\n\n有人把伞沿\n压得更低了些\n水珠从他们的袖口滴落\n像钟表内部\n漏掉的一些时间\n\n外面的世界突然变小了\n像被按了一下暂停键\n他们走进各自的房间\n收好钥匙\n擦干地面"}, "B": {"id": "9dd14dcd4b886b09", "body": "夜色中一扇门被推开又关上\n钥匙圈在锁孔里晃了晃\n有人把伞沿倾斜到另一侧\n雨水流进门槛外的洼地\n\n走廊尽头有人按过门铃\n门开了一瞬又合上\n外面下着雨\n他们替陌生人撑了一会儿门\n\n系统恢复后门立即合上\n像一个伤口愈合那样迅速\n有人收起伞\n把水迹擦干"}}, {"i": 23, "prompt": "写一首关于旱季水库的现代诗。水位下降后露出旧村的屋脊，叙述者只在岸上观察，不进入回忆说明。", "pk": "B:cp-v1-002", "A": {"id": "a79b462a541e7916", "body": "水位下降后\n露出旧村的屋脊\n\n一只桶提上岸来\n晾着，像一件破伞\n用了很多年\n\n我沿岸走了一圈\n把钥匙挂回门上\n锁上，再拧紧窗栓"}, "B": {"id": "39c608bf00c13271", "body": "水下有一匹马在吃草\n有人站在那里收起渔网\n用木棍敲打堤岸\n把脸埋进另一张脸\n\n旱季的水库\n像一只提过但未打开的箱子\n用了很多年\n仍能闻到它的气味\n\n一个村庄\n从水面退了下来\n水位下降后\n露出旧村的屋脊"}}, {"i": 24, "prompt": "写一首冬季渡口的现代诗：最后一班船离岸后，一只手套留在系缆柱上。", "pk": "A:cp-v1-008", "A": {"id": "870bc6016e85ea1b", "body": "最后一班船离岸后，\n一只手套留在系缆柱上。\n而我却把最后的告别留在\n那人的脸上。\n\n一九八○年的渡口\n没有一人发现这一点：\n我留下的只是目光。\n而那人的双手却在风中动了动。"}, "B": {"id": "99e25cabe60839c2", "body": "最后一班船离岸后\n一只手套留在系缆柱上\n雪落了下来\n水声减弱了\n雾从河对岸升起\n我收起梯子\n把绳头打个结\n把旧箱子搬到屋檐下\n提手用铁丝缠过\n钥匙插进锁孔\n门吱地叫了一声\n风穿过走廊\n外面更冷了"}}, {"i": 25, "prompt": "写一首凌晨渔船回港的现代诗。一名年轻船员第一次看见城市灯光倒映在装鱼的水箱里。", "pk": "B:cp-v1-023", "A": {"id": "1b15946cb5cf8098", "body": "把绳子系紧\n收起渔网\n解开缆绳\n把箱子按大小摞好\n\n他第一次看见\n城市的灯火\n倒映在装鱼的水箱里\n像一群游过之后又散开的鱼"}, "B": {"id": "b0f666ab861f2432", "body": "海水褪去\n舱底留下一层薄薄的盐\n他把缆绳系到桅杆上\n收起渔网时\n发现绳子中间有一处结\n\n他用袖子擦掉额头上的水\n擦干手后掏出钥匙\n插进锁孔\n打开门\n灯亮了"}}, {"i": 26, "prompt": "写一首发生在末班地铁停运后的现代诗：一个清洁工在空站台发现一枚仍然温热的硬币。不要解释硬币的来历，让动作和声音推动诗。", "pk": "A:cp-v1-001", "A": {"id": "487e3a750cac5620", "body": "他蹲下身来，捡起这枚硬币\n金属的温度让他惊讶\n\n接着，他用指甲擦去表面的一点灰尘\n然后，把硬币攥紧，塞进裤袋\n\n他走到扶梯口，停住脚步\n看一眼扶梯上最后一段空荡的阶梯\n\n随后，他拧开钥匙串上的小手电筒\n照了照墙壁，又朝天花板看了几眼\n\n然后，他关掉手电筒，握紧拳头\n继续往车站出口的方向走去\n\n一路走着，他偶尔停下来\n看看地面，再抬起头，向四周望望\n\n最后，当他走进夜色中的街道\n脚步声渐渐消失于远方"}, "B": {"id": "b268e21281aaa5b4", "body": "那枚硬币是温热的。\n他把它揣进工作服前袋，\n然后弯腰，用扫帚把最后一张\n纸币挑出洞口——\n“哐当”一声响，那枚硬币\n被扔进了铁轨尽头的\n一个漆黑的井，像\n黑夜中的一颗牙齿\n在一口深井中等待黎明。"}}, {"i": 27, "prompt": "写一首以“没有寄出的语音消息”为核心事件的现代诗。不要呈现消息全文，只写录制、删除与周围环境。", "pk": "B:cp-v1-011", "A": {"id": "6212bdf2c9bd97b1", "body": "我录下一段声音\n放在桌上\n用铅笔盖住话筒\n然后删掉\n\n窗外\n有人在擦玻璃\n把窗台上的水倒进花盆\n用报纸擦拭桌面\n收起晾了三天的衣服"}, "B": {"id": "819a736a94d8a206", "body": "我录下一段语音\n然后删掉\n反复几次之后\n把手机放进抽屉\n\n窗外有人在喊\n关严窗户\n用旧报纸裹住闹钟\n收起绳子上的衣服\n擦干桌子上的水渍\n\n把砧板立起来晾着\n收好散落的螺丝\n锁上工具箱\n检查煤气阀门\n把插头从墙上拔下\n\n把碎玻璃扫进纸盒\n擦掉镜子上的雾\n写下地址和姓名\n把信口朝下搁在窗台"}}, {"i": 28, "prompt": "写一首关于祖屋拆除前最后一次测量的现代诗。测量员报出数字，灰尘不断落在卷尺上。", "pk": "B:cp-v1-014", "A": {"id": "01537ee9cee1d4c5", "body": "用钢卷尺丈量过门框之后\n他把旧址画进地图\n把门板捆到一起\n把窗台上的积水舀干\n把碎玻璃扫进纸盒\n把箱子按大小摞好\n把砖块堆到墙根\n把铁丝拧成一股\n把木料用麻绳绑紧\n把钥匙挂在门环上\n把插销插回原处\n把窗框重新挂上\n把螺丝钉放进小盒子\n把钉头敲平\n把墙上的划痕抹掉\n把口哨挂回墙上\n把镜子装回去\n把门轴涂一层油\n把插销插回去"}, "B": {"id": "56e5d0376e195dd1", "body": "墙角有一处凹陷\n用粉笔画下记号\n把绳子系到树上\n\n从窗口量到窗台\n从门框量到门槛\n在墙上标出高度\n\n窗台上\n放了一把伞"}}, {"i": 29, "prompt": "写一首植物园闭馆后的现代诗。一株夜间开花的植物无人观看，监控摄像头缓慢转动。", "pk": "B:cp-v1-013", "A": {"id": "acff223d5150c1d0", "body": "夜色把门关上后\n它把内部的光收拢\n把花瓣翻过来\n向着黑暗折叠\n把香气捏成拳头\n攥在掌心\n把影子折进叶脉\n用露水擦亮叶片上的划痕\n把根从土里拔出\n把泥土按回原处\n把落叶扫到树下\n把石头放回原处\n把线头剪掉\n把绳子重新系紧\n把插销推回去\n把插头拔出来\n把落叶扫到树下\n把窗台上的水倒掉\n把镜子挂回去\n把门扣拧回去\n把锁舌合上\n把钥匙插回去\n把锁芯拧回去\n把螺丝拧回去\n把铁丝弯回去\n把钉子敲回去\n把碎玻璃扫起来\n把烟蒂掐灭\n把烟盒合上\n把纸折好\n把箱子盖上\n把书合上\n把地图卷起\n把照片按回原来的顺序\n把账本合上\n把铅笔削回去\n把橡皮擦干净\n把口香糖粘回去\n把口琴吹回去\n把提琴架回去\n把伞架回去\n把鞋摆回去\n把纽扣按回去\n把领带叠回去\n把围巾挂回去\n把衣服叠回去\n把箱子盖上\n把箱子搬到外面\n把箱子盖上\n把箱子搬出去"}, "B": {"id": "a5c8162b24637b2c", "body": "收起绳梯的人把门锁上\n锁上后又打开了一下\n花开了\n它周围的空气开始变凉"}}, {"i": 30, "prompt": "写一首发生在末班地铁停运后的现代诗：一个清洁工在空站台发现一枚仍然温热的硬币。不要解释硬币的来历，让动作和声音推动诗。", "pk": "A:cp-v1-001", "A": {"id": "1d8c920917ffa0f4", "body": "把硬币放进衣兜\n他踩着台阶走下去\n锁上后院的门\n把钥匙放回原处\n擦掉镜子上的雾\n收起晾了三天的衣服\n把水倒进桶里\n用抹布擦干灶台\n把剩饭装进保鲜盒\n把闹钟拨到五点半\n把绳子重新系紧\n把插头拔下\n把旧报纸捆成一摞\n把落叶扫到树根旁\n把自行车推进车棚\n把窗台上的水倒掉\n把碎玻璃扫进纸盒\n把烟蒂按灭\n把箱子合上\n把线头剪掉\n把账本合上\n把钥匙挂回墙上"}, "B": {"id": "b89ad7d809de1873", "body": "他弯下腰，金属碰撞的  \n一声轻响惊醒了瓷砖  \n最后一块余温  \n\n风从隧道深处卷来，  \n吹动制服袖口  \n像某种未完成的信号  \n\n他捏起硬币，指节  \n在月光里泛着潮湿的光  \n脚步声在空荡中回旋  \n\n扶梯仍在缓缓转动，  \n仿佛有人  \n刚刚离开  \n\n他把硬币放入口袋，  \n金属与钥匙相撞，  \n发出比心跳更迟钝的  \n一声回应。"}}, {"i": 31, "prompt": "写一首以“没有寄出的语音消息”为核心事件的现代诗。不要呈现消息全文，只写录制、删除与周围环境。", "pk": "A:cp-v1-011", "A": {"id": "0ac5574814d1f3cd", "body": "我录了一条语音消息\n然后删掉\n把手机倒扣在窗台\n看云\n擦着镜子\n把脸凑近\n用手指抹去雾气\n把镜子挂回去\n锁上卧室门\n走到阳台\n用指甲刮掉\n玻璃上的水渍\n用纸巾把桌面擦干\n再用另一张\n把桌子边缘擦干净\n把钥匙插进锁孔\n拧了半圈\n然后拔出来\n放进抽屉\n关严\n把药按天分好\n把盐罐盖拧回去\n用报纸垫起箱子\n把箱子摞到墙角\n用口红在镜子上\n写下今天要做的事情\n用拇指抹掉\n用指甲在墙上划一道\n用口哨吹一支歌\n把地图折回原来的痕迹\n用绳子把箱子捆紧\n把凳子摞起来\n把绳子绕成一团\n把线头剪掉\n用塑料袋装好\n放进柜子里\n锁上\n用钥匙在锁孔里\n拧半圈\n把钥匙插回去\n再拧半圈\n把钥匙取出来\n放进衣兜\n把窗户推开一指宽\n把剩饭装进保鲜盒\n把盒子放进冰箱\n用保鲜膜缠住\n把绳子系紧\n把袋子提起来\n把水龙头拧回去\n把伞架回去\n把伞尖磕在盆沿\n把水倒掉\n把盆架回去\n把抹布叠好\n把水桶拎回去\n把门虚掩上\n把凳子摞起来\n把碎纸扔进篓子\n把剩下的收起来\n把线头剪掉\n把绳子绕成一团\n把箱子摞到墙角\n用口哨吹一支歌"}, "B": {"id": "4566756764177b23", "body": "在电话机旁，\n他迟疑一下\n按下了送话键。\n\n接着又犹豫地\n将已录下的几句话删去。\n\n而窗外，一匹野狗正舔着\n被它刚刚咬断的绳索。\n这时他听到自己的声音\n随电流传到对方耳朵里去了。"}}, {"i": 32, "prompt": "写一首旧照相馆清点底片的现代诗。几张底片上的人脸因受潮黏在一起，无法完整分开。", "pk": "B:cp-v1-024", "A": {"id": "8826d1ad11570a03", "body": "收起绳梯后\n我坐在屋檐下\n把一些照片按年份摞好\n另一些装进纸袋\n放进箱子里\n\n把箱子搬到走廊尽头\n把箱子盖拧紧\n用胶带缠一圈\n贴上标签：\n“一九五二”\n\n擦掉镜子上的雾\n在窗台摆了一小盆水\n外面又下雪了"}, "B": {"id": "3bf6e00d6e4d92af", "body": "把底片按年代摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n旧照相馆清点底片\n\n把它们按大小摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按颜色摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按时间摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按月份摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按季节摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按年份摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按姓氏摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按名字摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按年龄摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按身高摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按体重摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按性别摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按星座摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按血型摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按籍贯摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按职业摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按地址摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按号码摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按时间摞好\n用纸夹住\n收进木盒\n把过期的显影液倒掉\n\n把它们按月份摞好"}}, {"i": 33, "prompt": "写一首关于一台老式电梯的现代诗。它每天在十三层短暂停顿，楼里却没有十三层按钮。", "pk": "B:cp-v1-017", "A": {"id": "38cc5a106eafba84", "body": "它的内部刷过一遍漆\n它的门刷过一遍漆\n它的外部刷过一遍漆\n它的边缘刷过一遍漆\n它的编号刷过一遍漆\n它的边缘刷过一遍漆\n它的编号刷过一遍漆\n它的边缘刷过一遍漆\n它的编号刷过一遍漆\n它的边缘刷过一遍漆\n它的编号刷过一遍漆\n它的边缘刷过一遍漆\n它的编号刷过一遍漆"}, "B": {"id": "dfc04f948f852246", "body": "它的门关得更严了\n在第七层\n有人往里面塞了一把伞\n接着是第八层\n第九层\n第十层\n有人往里面塞了一些口信\n第十一层\n有人往里面塞了一盒火柴\n十二层\n有人往里面塞了一些绳子\n然后是十三层\n它的门关得更严了"}}, {"i": 34, "prompt": "写一首冬季渡口的现代诗：最后一班船离岸后，一只手套留在系缆柱上。", "pk": "B:cp-v1-008", "A": {"id": "e7983b0fa29d09ed", "body": "一只手套留在系缆柱上\n水手把绳子收得更紧一些\n他的背影在雾中消失\n他把另一只手揣进衣兜\n提着箱子走了\n雪地上留下一串脚印\n像一串用粉笔画出的括号\n收留了一只破旧的手套\n风把河水吹得更加浑浊\n河堤上的芦苇互相碰撞\n把雪地踩出许多小坑\n天空很低，树上结满冰凌\n一个女人把脸埋在围巾里\n她的嘴一张一合\n对着水面练习喊叫"}, "B": {"id": "7772b2c9cc2d3056", "body": "最后一班船离岸后\n一只手套留在系缆柱上\n水声变轻了\n码头上只剩下铁桶的边缘\n一只手套留在系缆柱上\n冬天的气味更浓了\n雾从四面升起\n一只手套留在系缆柱上\n它的影子\n慢慢变小"}}, {"i": 35, "prompt": "写一首关于图书馆归还箱的现代诗。雨夜里一本受潮的书被投进去，机器给出正常回执。", "pk": "B:cp-v1-019", "A": {"id": "f0ea800216c17223", "body": "箱子在雨夜合上\n像一口装过水的棺木\n提手用铁丝缠过\n底部有一处凹陷\n\n一册受潮的书放了进去\n它的内页微微鼓起\n如同一片树叶收拢后\n重新舒展时那样\n\n它曾经被打开过\n在某个人的手中\n它的边缘有磕痕\n但没有残缺\n\n机器吐出一张纸条\n上面写着：正常"}, "B": {"id": "00e3b89ae09deb45", "body": "箱子放在台阶旁\n收旧物的人会来取\n用纸擦干它的边缘\n放进一辆手推车\n锁上后院的门\n他把钥匙留在窗台\n收旧物的人会来取"}}, {"i": 36, "prompt": "写一首夏夜高速公路服务区的现代诗。长途司机洗脸时，一群飞蛾围住坏掉一半的招牌。", "pk": "B:cp-v1-018", "A": {"id": "e905adc1c7b1630c", "body": "一群飞蛾围住坏掉一半的招牌\n远处传来汽笛声\n外面下过雨\n水渍像一张地图摊在柏油路上\n有人把箱子搬到停车场\n长途司机洗脸时\n用一只塑料杯舀水浇花\n用过的水泼向窗外\n他看着水洼中自己的脸\n把脸擦干\n收起毛巾"}, "B": {"id": "5fd6f43d87f72112", "body": "一只杯子盛满水\n用嘴吹出一小圈涟漪\n把头探进水盆\n他刮去脸上的水珠\n一群飞蛾围住坏掉一半的招牌\n它们从不同的方向靠近\n仿佛要把它拼回去\n一辆卡车轰隆驶过\n飞蛾停在路灯杆上\n远处有口钟敲了十二下\n然后是一辆运沙车\n它的后斗敞开着\n把一袋袋沙子倒进去\n一只母鸡蹲在公路边"}}, {"i": 37, "prompt": "写一首关于医院走廊自动售货机的现代诗：深夜，机器退回一枚硬币，等待的人没有再次投入。", "pk": "B:cp-v1-005", "A": {"id": "8aa006e529f825d3", "body": "深夜，机器退回一枚硬币\n玻璃窗上结了一层水雾\n外面有人用脚尖踢着石块\n把落叶踢到墙根\n把碎玻璃踢到树下\n把雪踢到街沿\n踢到路旁\n踢到水洼旁\n把影子踢到另一侧\n把声音踢进巷口\n把寂静踢进门洞\n把回声踢进院子\n把落叶踢进树根\n把碎玻璃踢进垃圾篓"}, "B": {"id": "0b69a3f7a8f69130", "body": "深夜，机器退回一枚硬币\n等待的人没有再次投入\n提着箱子的人走来走去\n玻璃上留着手指的印痕\n一盏灯亮了又熄灭\n走廊尽头传来一阵咳嗽\n有人用脚踢了一下\n箱子底部有一处凹陷"}}, {"i": 38, "prompt": "写一首关于被导航反复纠正路线的现代诗。骑车人穿过正在消失的城中村，屏幕上的道路比现实更完整。", "pk": "B:cp-v1-022", "A": {"id": "b6be411b9f4c3c37", "body": "你沿着一条路骑下去\n直到它变成另一条\n直到地图上的街道\n把真实的街道覆盖\n直到路口越来越少\n直到所有的岔口\n都通向同一个方向\n\n你把手机举到眼前\n看它的光线如何改变\n你继续骑下去\n像沿着一道伤疤骑下去\n像沿着一条线骑下去\n穿过正在消失的城中村\n穿过那些没有名字的地方\n穿过一个接一个拐弯\n穿过越来越窄的巷子\n穿过一些人从这里搬走之后\n留下的空地\n穿过一些人刚刚搬来之前\n留下的空地\n穿过那些还没有名字的地方\n穿过那些正在消失的地方\n穿过那些已经命名的地方\n穿过那些尚未命名的地方\n穿过那些不再属于你的地方\n穿过那些即将属于你的地方"}, "B": {"id": "75778a7923e3b71a", "body": "你把地图铺在膝头\n像铺开一张旧报纸\n用指节敲打路线\n直到它的边缘\n开始渗血\n\n风掠过屋顶\n你继续调整方向\n你熟悉所有的岔口\n它们都藏在括号里\n如同埋在地下的绳子\n\n你穿过一条窄巷\n一只鸟衔着纸片飞走\n你数着路口\n绕过一棵歪脖子树\n继续骑你的车\n\n收音机里有人\n讲到他的家乡\n那里有一条河\n流经一座桥\n你突然想起\n那个拐弯处\n曾有一盏路灯"}}, {"i": 39, "prompt": "写一首博物馆修复室的现代诗。修复师用极细的笔补一幅古画中的裂隙，窗外正在修高架桥。", "pk": "B:cp-v1-029", "A": {"id": "b1e3d23d158232ca", "body": "有人把一块碎玻璃\n按原样拼回窗框\n他把口红抹到镜子上\n再用口红擦掉\n\n有人把一片叶子\n按原样拼回树根\n他用小刀\n把鱼鳞刮净"}, "B": {"id": "a76ef99cf328a345", "body": "他把一张脸凑近镜面\n刮掉一层薄釉\n他把一张脸贴在窗玻璃上\n看外面刮风\n\n他用棉签把药水\n抹进木头的裂缝\n用棉签把唾沫\n抹进自己的衣领\n\n他从盒子里取出一粒糖\n含化了一小会儿\n又把盒子盖严\n他从盒子里取出一小块冰\n含化了一小会儿\n又把它放回原处\n\n他把一张脸凑近镜面\n刮掉一层薄釉\n他把一张脸贴在窗玻璃上\n看外面刮风"}}, {"i": 40, "prompt": "写一首矿区恢复成湿地后的现代诗。候鸟停在旧轨道旁，铁锈从浅水中显出。", "pk": "B:cp-v1-020", "A": {"id": "68b395ea3c9b93c6", "body": "把箱子摞到墙角\n擦掉镜子上的雾\n把凳子摞到墙角\n擦掉镜子上的雾\n擦掉镜子上的雾\n把箱子摞到墙角\n把凳子摞到墙角"}, "B": {"id": "474b88fe08e0662d", "body": "一铲一铲\n把坑填平\n用土掩住那些棱角\n我们曾用它们丈量大地\n\n草，又长了出来\n风沿着原来的路线吹过\n像从前那样\n把树叶吹进窗口\n\n一只白鹭停在旧轨道旁\n水面上\n有人看到过它的倒影\n\n矿石还在地下\n但不再被挖掘\n树根把石头撑裂"}}, {"i": 41, "prompt": "写一首以“没有寄出的语音消息”为核心事件的现代诗。不要呈现消息全文，只写录制、删除与周围环境。", "pk": "B:cp-v1-011", "A": {"id": "905f6018fa2e0821", "body": "我对着电话机自言自语\n把一些事重复了三遍\n反复删掉\n反复重录\n\n窗外刮了一夜风\n天亮之前\n我把语音消息删除了\n我把它放回原处\n像把一件旧衣服挂回去\n收起绳子时\n发现它的末端\n已经被老鼠啃过"}, "B": {"id": "9ba4b7313ccaafdb", "body": "录音键按下去的一瞬\n窗外有鸟叫过\n\n我收起伞\n把水倒进窗台上的盆里\n\n然后关掉走廊尽头的灯\n把剩饭装进保鲜盒\n\n语音消息被删去时\n有一小片寂静\n从屋顶坠落"}}, {"i": 42, "prompt": "写一首关于城市停电十分钟的现代诗。叙述在不同楼层间移动，只通过窗、脚步和短暂亮起的手机呈现人群。", "pk": "B:cp-v1-009", "A": {"id": "5c28a991f09c4d0d", "body": "走廊尽头，有人用口哨吹了一小段\n《欢乐颂》\n\n七楼的一扇窗突然亮了一下\n像一颗牙齿\n咬住了它的边缘\n\n有人把脸贴到玻璃上\n外面黑了十分钟\n里面仍亮着灯"}, "B": {"id": "9d35ced0abc4a138", "body": "楼顶传来一声口哨  \n有人把箱子摞到窗台  \n我从二楼朝上看  \n像从一口井里打水  \n\n有人把脸贴在玻璃上  \n把另一张脸按进去  \n走廊尽头 一只灯泡冒 : "把它们摊开在桌上\n用小刀刮去背面的水渍\n把它们按时间顺序摞好\n把它们装回玻璃罐\n\n把它们擦干\n用纸巾把它们包起来\n用绳子捆好\n把它们放进纸盒\n\n用指甲划开一截口香糖\n把它们分离开来\n把它们重新放回原来的信封\n把它们按时间顺序摞好\n\n把它们装回玻璃罐"}}, {"i": 46, "prompt": "写一首以旧气象站为场景的现代诗。风向标坏了，但纸带记录仪还在走，值班员听见远处雷声。", "pk": "B:cp-v1-004", "A": {"id": "70d5915b1c99156a", "body": "一只断了尾的漆盘\n放在窗台上\n口沿豁了一小块\n风向标坏了\n但纸带记录仪仍在走\n值班员听见远处雷声\n他的手指按在玻璃上\n他看到自己的脸\n被水汽晕开\n走廊尽头\n一扇门虚掩着\n钟敲过十下\n他合上笔记本起身\n用指甲划掉窗外的雾"}, "B": {"id": "db35beef8cd6f05a", "body": "旧气象站\n像一口废弃的钟\n停在原处\n\n风向标坏了\n用铁丝捆着\n口沿豁了一小块\n陶罐放在窗台晾着雨水\n\n纸带记录仪仍在走\n咔嗒\n咔嗒\n值班员听见远处的雷声\n他摘下眼镜擦了又擦\n然后把它放回盒子里"}}, {"i": 47, "prompt": "写一首关于医院走廊自动售货机的现代诗：深夜，机器退回一枚硬币，等待的人没有再次投入。", "pk": "B:cp-v1-005", "A": {"id": "774a39b741babb29", "body": "深夜，机器退回一枚硬币\n外面有人在敲门\n里面有人在擦玻璃\n用报纸\n折了一架纸飞机\n放进窗台上的水杯\n它又飞回来\n停在窗台上\n像一只落难的鸟"}, "B": {"id": "d1326351ad7a36e2", "body": "深夜，自动售货机退回一枚硬币\n它继续等待\n有人把零钱放回口袋\n有人把一张纸折成船\n放进水槽\n有人把剩饭装进塑料袋\n提走\n有人用指甲在墙上刻下一道白线\n外面下雪了\n有人把伞架回原处\n有人把钥匙挂回去\n有人把碎玻璃扫到一起\n有人关掉走廊尽头一盏灯"}}, {"i": 48, "prompt": "写一首围绕修表匠午睡时的梦展开的现代诗。梦中所有钟表指向不同的潮汐时刻。", "pk": "A:cp-v1-007", "A": {"id": "938baf910e8e2d00", "body": "修表匠把闹钟拨到三点\n然后躺下\n他梦见自己穿过一扇矮门\n进入一个摆满小石凳的小厅\n他脱掉鞋子\n坐下\n用指尖叩着石面\n听那声音像木鱼般回响\n\n一只水罐放在窗台\n提手用铁丝缠过\n另一只水罐放在走廊尽头\n口沿豁了一小块\n用白漆补过\n窗台上有一摞旧报纸\n压住一张借据\n借据上写着\n“今借到”\n\n修表匠把闹钟拨到五点\n然后躺下\n他梦见自己走进一片树林\n捡起一块石头\n放进裤兜\n又摸出一颗糖\n含在舌底\n慢慢嚼着\n林子边缘有座木头房子\n屋顶有一处凹陷\n他用指甲抠了抠\n里面有一小窝雨水"}, "B": {"id": "3f806b994042d856", "body": "他的睫毛垂落  \n像齿轮咬合时掉落的碎屑  \n在午后三点零七分  \n停摆的怀表突然渗出盐粒  \n\n一只黄铜指针游向窗外  \n海浪正用秒针丈量石阶  \n贝壳在耳蜗里重新校准了回声  \n而他的呼吸是滴答声中  \n一粒缓慢结晶的珍珠  \n\n床头的老座钟咳出沙粒  \n时间在它喉咙里结成珊瑚  \n他梦见自己拆开手腕  \n取出发条，放进月亮的漩涡  \n潮水便从指缝涨起  \n\n所有的钟表开始漂浮  \n它们的表面映着不同深浅的蓝  \n某个瞬间，他听见  \n自己的心跳与浪花共振  \n在表盘裂痕里，涨潮的刻度  \n正悄悄爬上他的眼睑"}}, {"i": 49, "prompt": "写一首河流改道后的现代诗。桥还在原处，桥下长出高草，附近孩子把这里当作球场。", "pk": "B:cp-v1-006", "A": {"id": "12ffa3370fd8a265", "body": "河床边缘，一块石头翻过身来\n水声不再流经它的内部\n我曾在这里埋下一只铁盒\n里面装满了沙子和纸\n河水在远处结冰后\n树根开始隆起，像鼓起的乳房\n\n有人用粉笔画了一条线\n孩子们围着它跳绳\n他们不知道当年\n这里是码头，运走粮食和酒\n用船尾敲打堤岸\n那声音持续了三十年\n\n当河床干涸，它只是\n一条大路，铺满卵石\n用脚踩下去会有弹性\n像踩进一片落叶中\n风从北方吹来\n水声从里面涌出"}, "B": {"id": "1fc6cceea273b7cb", "body": "河床露出脊背\n水声来自更远的地方\n河岸上站着一群陌生人\n\n桥下长出了高草\n有人在那儿踢球\n他们用脚丈量着天空"}}, {"i": 50, "prompt": "写一首关于城市停电十分钟的现代诗。叙述在不同楼层间移动，只通过窗、脚步和短暂亮起的手机呈现人群。", "pk": "A:cp-v1-009", "A": {"id": "d2d75821319d3201", "body": "电梯停了  \n楼道深处传来金属咬合的叹息  \n\n十七层的光从窗缝漏下来  \n像被剪断的电线  \n有人用手机照着台阶  \n影子便一节节爬下来  \n\n九楼的女人把钥匙串  \n晃成风铃  \n声音在黑暗里  \n长出细小的根  \n\n三楼的门突然打开  \n光柱中浮动着  \n无数个发光的点  \n像被困在琥珀里的星辰  \n\n我们彼此靠近  \n又各自退入  \n自己那方微弱的光里  \n仿佛整个城市  \n正在缓慢地  \n重新组装自己"}, "B": {"id": "b88937e2d2b11ad5", "body": "楼顶的灯火在风中飘摇\n十点钟了，我听见钟声传来\n\n在五楼的窗户上看见四楼的窗户上\n有人走过\n三楼的窗户上又多了一扇\n\n在二楼的窗户上看到一楼的窗口\n一个身影在晃动\n\n在底楼的窗户前，在没有路灯的街道上\n我的脚影在墙上的白漆上划动\n\n而当我在家中打开手机\n我看见所有的楼\n都从地上升起"}}, {"i": 51, "prompt": "写一首沙尘暴过后教室里的现代诗。黑板上昨天的公式仍在，窗槽积了一层细沙。", "pk": "B:cp-v1-016", "A": {"id": "c080d98ccc025f04", "body": "沙粒沿着窗台边缘结成一排小水珠\n它们将被擦掉\n而窗外的雪景\n正以同样的速度消融\n\n那块黑板\n保留着昨夜的划痕\n一只铅笔躺在地上\n它的影子正好\n罩住了那个圆点"}, "B": {"id": "b9d6d54ce4f10b83", "body": "擦过的黑板\n留下一道水痕\n粉笔字迹模糊了\n有人用指甲划过\n像擦掉一块玻璃上的雾\n擦得更亮一些\n外面的世界就显得更暗了\n\n一只雏鸟跌落在操场上\n它的翅膀还在抖动\n擦过的黑板\n留下一道水痕"}}, {"i": 52, "prompt": "写一首关于医院走廊自动售货机的现代诗：深夜，机器退回一枚硬币，等待的人没有再次投入。", "pk": "A:cp-v1-005", "A": {"id": "e19e938d5a0a5c9b", "body": "夜深了\n自动售货机退回一枚硬币\n门廊下有人走来走去\n提着一个纸袋\n口香糖\n被按进凹陷的掌心\n把剩钱塞回兜里\n他向我招手\n让我过来\n摸摸他的额头"}, "B": {"id": "72600793af68e34c", "body": "夜半\n退币孔又吐回一枚硬币\n那颗硬币仍在等著\n一个不眠的\n人"}}, {"i": 53, "prompt": "写一首退潮后的防波堤现代诗。石缝里卡着一只塑料玩具船，真正的货轮正驶向雾中。", "pk": "B:cp-v1-027", "A": {"id": "4f756d76eec5468d", "body": "退潮后\n防波堤上\n一只塑料玩具船\n卡在石缝里\n\n远处\n真正的货轮\n正驶向雾中"}, "B": {"id": "70ac5f732998a79c", "body": "退潮后\n防波堤上\n石缝里卡着一只塑料玩具船\n真正的货轮正驶向雾中"}}, {"i": 54, "prompt": "写一首山中隧道维修夜班的现代诗。工人敲击岩壁，以回声判断空洞，偶尔有水滴落在安全帽上。", "pk": "B:cp-v1-012", "A": {"id": "9610b1f3bfd55198", "body": "把铁锤举到肩头\n他们开始敲打岩壁\n在半山腰\n他们敲打岩壁\n直到听见一声闷响\n回声荡开\n像一扇门突然关上\n\n从矿井深处\n传来一声咳嗽\n他们敲打岩壁\n在半山腰\n他们敲打岩壁\n直到听见一声闷响\n回声荡开\n像一扇门突然关上\n\n他们敲打岩壁\n在半山腰\n他们敲打岩壁\n直到听见一声闷响\n回声荡开\n像一扇门突然关上"}, "B": {"id": "e0cb93260a65b898", "body": "当锤子落进石头\n石头内部便有了回声\n一铲一铲地挖着\n他们把时间填进去\n再挖出来\n\n岩石咬紧牙关\n把疼痛藏起来\n铁镐在头顶擦出火花\n他们把星星扫到一边\n再放回去\n\n当锤子落进石头\n石头内部便有了回声\n他们从里面敲击岩壁\n把外面的光收进来\n再放出去\n\n当锤子落进石头\n石头内部便有了回声"}}, {"i": 55, "prompt": "写一首关于被导航反复纠正路线的现代诗。骑车人穿过正在消失的城中村，屏幕上的道路比现实更完整。", "pk": "B:cp-v1-022", "A": {"id": "b6eeed005e7f8786", "body": "沿着地图走\n你说\n你总是沿着地图走\n你把地图折好放进背包\n你习惯用手指丈量距离\n你从没有迷过路\n\n在那些地方\n你只是经过\n你只是经过\n你把地图折好放进背包\n你习惯用手指丈量距离\n你从没有迷过路\n\n你把地图折好放进背包\n你习惯用手指丈量距离\n你从没有迷过路"}, "B": {"id": "d6c693367862ddfa", "body": "你穿过一条巷子\n用肩膀把门顶开\n接着关上\n锁舌咬住外面的世界\n\n手机里的地图\n不断提醒你\n这是一条死胡同\n而你已经走到了尽头\n\n拐过街角\n又是一条巷子\n用肩膀把门顶开\n接着关上\n锁舌咬住外面的世界"}}, {"i": 56, "prompt": "写一首夏夜高速公路服务区的现代诗。长途司机洗脸时，一群飞蛾围住坏掉一半的招牌。", "pk": "B:cp-v1-018", "A": {"id": "59ea02c3ba2e71ad", "body": "一只口杯放在窗台上\n擦干后又往里面倒水\n把脸埋进去\n他朝镜子吐了一口唾沫\n用袖子抹了抹\n窗外有辆卡车开过\n它的喇叭声像一个名字\n一群飞蛾围住坏掉一半的招牌\n一只口杯放在窗台上"}, "B": {"id": "33b516729c4811e7", "body": "一只蛾子撞上玻璃窗\n另一只停在路灯杆上\n第三只\n用翅尖试探着\n把它的影子投到柏油路上\n\n他用抹布擦干脸上的水\n然后打开收音机\n里面传出一串口令"}}, {"i": 57, "prompt": "写一首河流改道后的现代诗。桥还在原处，桥下长出高草，附近孩子把这里当作球场。", "pk": "A:cp-v1-006", "A": {"id": "bb4362a4cd68af06", "body": "风，吹动芦苇，\n如一个女孩儿的手。\n\n有人用粉笔在水泥地上画圆圈。\n一只断了腿的篮球滚进野草。\n几片纸屑，在风中飞起来又落下。\n\n桥拱的阴影投向水面，\n像一条横过河面的黑鱼。\n\n我曾在这里洗过衣服，\n那些碎布片如今已在某条小溪中变白。\n\n水已流到别处去了，\n人们说，那里有新的田地。\n\n我走过桥下的台阶。\n草里有一把断掉的钥匙。"}, "B": {"id": "f0cd2538765b36c8", "body": "河水退去之后\n石头开始说话\n那些词语\n被水泡软了\n用过的绳子晾在岸上\n风一吹就散了\n桥墩周围\n有人撒过盐\n鱼骨头躺在浅滩\n像一张张旧地图\n树根从桥洞钻出来\n缠住了它的腿\n河对岸那棵树\n去年砍掉了半边\n另一棵\n去年也砍掉了半边\n孩子们把这里\n当作球场\n他们把球踢到河里\n又捞上来\n接着再踢\n桥还在原处\n水位线以下\n埋着许多名字"}}, {"i": 58, "prompt": "写一首关于祖屋拆除前最后一次测量的现代诗。测量员报出数字，灰尘不断落在卷尺上。", "pk": "B:cp-v1-014", "A": {"id": "ec62c1528d51ce56", "body": "把窗台上的水倒掉\n把箱子按大小摞好\n把碎玻璃扫进纸盒\n把旧报纸捆成一摞\n用粉笔在地上画线\n把木梯架回原处\n把箱子按大小摞好\n用粉笔在地上画线\n把碎玻璃扫进纸盒\n把箱子按大小摞好\n用粉笔在地上画线\n把碎玻璃扫进纸盒"}, "B": {"id": "65272a9f00649ec6", "body": "门框内侧用红漆画了一条线\n他们用一把旧卷尺量过三次\n窗台边缘用白漆画了一条线\n他们用一把旧卷尺量过两次\n门框外侧用红漆画了一条线\n他们用一把旧卷尺量过一次\n墙角用黑漆画了一条线\n他们用一把旧卷尺量过四次\n窗台外沿用白漆画了一条线\n他们用一把旧卷尺量过五次"}}, {"i": 59, "prompt": "写一首凌晨渔船回港的现代诗。一名年轻船员第一次看见城市灯光倒映在装鱼的水箱里。", "pk": "B:cp-v1-023", "A": {"id": "279837c32a560cd1", "body": "水箱边缘结了一层薄冰\n他蹲下身擦洗甲板上的口红印\n把绳子重新系紧\n他摸了摸帆布袋里的钞票\n想给母亲买些苹果\n收起渔网时发现一只断掌\n用刀背刮掉鳞片\n他突然想起那只手\n曾攥住过一枚野樱桃\n天亮前他数着箱子\n像数着一匹布上的褶皱"}, "B": {"id": "d1ab5a2e1ed72fbf", "body": "甲板上的盐粒被风吹落\n他把绳子绕到桅杆上\n船头有一处凹陷\n用铁皮补过一次\n\n他把箱子摞在一起\n外面刷过一遍漆\n窗台上的水滴干了\n里面有一枚硬币\n\n月亮悬在屋顶上\n像一只破旧的提灯\n他打开舱门\n把箱子搬进屋子\n\n收起渔网时\n他突然想起\n去年秋天打瞌睡\n掉下去的那个桶"}}, {"i": 60, "prompt": "写一首盐湖边废弃电影院的现代诗。银幕被风吹动，湖面的反光偶尔投进大厅。", "pk": "B:cp-v1-010", "A": {"id": "d13f06c3aa5a4097", "body": "一只鸟衔着塑料袋飞过\n天空中有一处凹陷\n盐湖边的废影院\n用它的轮廓容纳了全部黄昏\n\n门廊下积着雨水\n铁皮屋顶在风里翻滚\n那些词语仍在里面回荡\n像一扇扇关着的门\n\n收音机里的音乐\n把夜晚缝进墙内\n一只耗子沿着墙根跑\n踩响了几粒石子"}, "B": {"id": "9f10e6637caa8a91", "body": "盐湖边废弃的电影院\n把天空挂到屋顶上\n用一根铁丝\n\n风穿过门厅时\n总是想起那些\n坐在后排嗑瓜子的人\n\n门锁用了一年半\n外面刷过一遍漆\n窗台上放着半盆水\n\n当有人从外面推门进来\n擦掉鞋底的泥\n把窗台上的水合上\n然后坐下\n把脸贴在玻璃上\n等它的反光重新聚拢"}}, {"i": 61, "prompt": "写一首冬季渡口的现代诗：最后一班船离岸后，一只手套留在系缆柱上。", "pk": "B:cp-v1-008", "A": {"id": "814273f274bcec40", "body": "一只手套留在系缆柱上\n雪地上\n留下一串脚印\n水罐放在窗台\n外面很冷\n用过的绳子缠回原来的木桩\n把钥匙挂回门后\n另一把插进锁孔\n擦干灶台上的水渍\n天黑之前\n把旧报纸捆成一摞\n把落叶扫到树根旁\n擦掉镜子上的雾\n把盐罐盖拧回去\n擦干灶台上的水渍\n把剩饭装进保鲜盒"}, "B": {"id": "01e4372fc63aa820", "body": "雪落之前\n钟声在崖壁上敲过一遍\n那只手\n把冬天提上岸\n用旧了的绳子缠着\n一只手套留在系缆柱上\n有人收起梯子\n另一只握紧拳头\n藏进大衣深处"}}, {"i": 62, "prompt": "写一首清晨海鲜市场的现代诗，从一块正在融化的冰的视角观察摊贩、鱼鳞和天光。", "pk": "B:cp-v1-015", "A": {"id": "9a4d714d6c69b989", "body": "我的边缘正被削去\n我把自己压得更薄\n水滴，沿着倾斜的砧板\n流到外面去了\n\n我看见自己的脸\n被擦过\n用一张旧报纸\n\n我看见刀口闪了一下\n鱼鳞在案板上摊开\n像一片片屋顶\n有人朝我走来\n把碎玻璃扫到一边\n\n他把水桶拎到台阶旁\n他弯下腰\n用铁丝串起那些内脏\n他用绳子捆好它们\n然后摞在一起\n用木棍支住\n它们将要塌陷的身体"}, "B": {"id": "0adfd11ba19b9e8a", "body": "我的边缘开始变软\n我看到自己在滴水\n天空倾斜着放倒一桶海水\n摊贩把箱子搬来搬去\n用脚踩鱼鳞\n它们像碎玻璃一样\n散开\n他们用刷子清理鱼内脏\n用纸擦干砧板\n收起绳子\n他们用抹布擦桌子\n把秤砣放回原处\n他们把冰块摞到一起\n放进冰柜\n我看到自己的轮廓\n正在缩小"}}, {"i": 63, "prompt": "写一首盐湖边废弃电影院的现代诗。银幕被风吹动，湖面的反光偶尔投进大厅。", "pk": "A:cp-v1-010", "A": {"id": "5f93277cc388f8d0", "body": "那年冬天，你最后一次在这里看电影。\n一个镜头中\n一匹狼从雪地升起，而另一只\n刚刚死去。\n\n今天，当夕阳把你的影子\n钉死在门上，\n里面的灯光突然暗了下来；\n你发现这里早已是\n一座空城。\n\n你摸到座位底下有张字条，\n上面写着：\n“请勿用脚趾头按压音响。”"}, "B": {"id": "6f53c6889ea958d6", "body": "那双靴子已经生了锈  \n门把手上凝结了一层盐垢  \n观众席的霉味混合着铁锈  \n风穿行其中，像一条咸鱼  \n\n湖水在窗外涌来，涨到脚踝  \n有人朝银幕扔石子，哗啦哗啦  \n声音从四面八方传回来  \n像是从一个没有人的座位传来的回声  \n\n影子们还在走来走去，但灯光暗了  \n一只鹰在屋顶盘旋，像电影里的镜头  \n最后，一盏灯突然亮起来  \n照见整个大厅满是水"}}, {"i": 64, "prompt": "写一首山中隧道维修夜班的现代诗。工人敲击岩壁，以回声判断空洞，偶尔有水滴落在安全帽上。", "pk": "A:cp-v1-012", "A": {"id": "715038a2f3dc3926", "body": "铁锤叩击岩层  \n一声  \n一声  \n\n回声在黑暗里游走  \n像蛇  \n寻找裂缝  \n\n他们用耳朵丈量  \n沉默的深处  \n有时是风  \n有时是水  \n\n水滴落进安全帽  \n叮  \n一粒星子坠入深井  \n\n铁锤叩击岩层  \n一声  \n一声  \n\n黑暗在他们身后  \n缓缓闭合  \n如巨兽吞下碎石  \n而光  \n始终悬在头顶  \n像未完成的句子"}, "B": {"id": "c6d57ce72951c405", "body": "敲——敲\n敲敲\n敲——敲敲\n\n敲——敲\n敲敲\n敲——敲敲\n\n敲——敲\n敲敲\n敲——敲敲\n（“空空”）\n\n敲——敲\n敲敲\n敲——敲敲\n（“空空”）\n敲——敲\n敲敲\n敲——敲敲\n（“空空”）\n敲——敲\n敲敲\n敲——敲敲\n（“空空”）……\n\n敲……敲……\n\n敲……敲……"}}, {"i": 65, "prompt": "写一首河流改道后的现代诗。桥还在原处，桥下长出高草，附近孩子把这里当作球场。", "pk": "A:cp-v1-006", "A": {"id": "ede5ead8937fd9a0", "body": "一九五七年\n那条河从桥下流过\n两岸风景多美\n孩子们在河边放风筝\n\n一九六六年\n那条河突然改了方向\n流到另一个地方去了\n老桥还在那里\n可是没有人再用它\n\n一九七三年\n春天来得特别早\n野花遍地开放\n小路旁的小麦长得很好\n一个男人牵着一头驴子走过\n\n一九七八年\n我站在桥头看风景\n河水哗啦哗啦流过去\n我的影子倒映在水里\n显得很孤独\n\n一九八二年\n桥下长满了高高的草\n孩子们在这里踢球玩耍\n谁还记得那些岁月\n谁还记得那些故事\n那条河就这样走了"}, "B": {"id": "04d1aa31108985d6", "body": "水退去后，石缝里漏下  \n铁锈的呼吸声  \n桥身斜倚在记忆的褶皱中  \n苔藓正在重新丈量它的长度  \n\n孩子们用脚尖踢飞黄昏  \n球鞋碾碎的不只是落叶  \n还有某种未被命名的沉默  \n他们奔跑时，风掠过桥墩  \n像翻动一本无人阅读的旧账  \n\n野草从混凝土裂缝钻出来  \n缠住栏杆的影子  \n仿佛要将整个下午  \n拖进更深的根系里  \n\n而河水已绕开旧伤疤  \n在远处，它正练习新的弯曲  \n如同某个尚未完成的动作  \n在地图上缓慢地  \n重新开始呼吸"}}, {"i": 66, "prompt": "写一首以旧气象站为场景的现代诗。风向标坏了，但纸带记录仪还在走，值班员听见远处雷声。", "pk": "A:cp-v1-004", "A": {"id": "de0b57c2c652bbc9", "body": "屋顶上有一处凹陷\n用铁皮补过一次\n用沥青补过两次\n\n门把手上挂着一把伞\n另一把放在走廊尽头\n备用的口琴收在铁盒子里\n\n玻璃窗后面\n有人用粉笔画了一个太阳\n擦掉之后又画了一个"}, "B": {"id": "7d34db254f51bf04", "body": "金属骨架在暮色里锈出年轮  \n风向标卡在西南方向  \n像一只被遗忘的钟摆  \n\n纸带记录仪仍在走  \n墨迹在纸上爬行  \n蜿蜒如未愈合的裂痕  \n\n值班员伏在玻璃窗前  \n耳朵贴紧潮湿的水泥地  \n远处传来雷声  \n像某种庞大的机器正在启动  \n\n电报机在角落发出咳嗽声  \n而所有数据都指向  \n一个尚未命名的黄昏"}}, {"i": 67, "prompt": "写一首围绕修表匠午睡时的梦展开的现代诗。梦中所有钟表指向不同的潮汐时刻。", "pk": "B:cp-v1-007", "A": {"id": "49472feaaf97bee1", "body": "窗台上的水珠滴进陶罐\n修表匠在午睡中翻身\n他的手搁在枕上\n像搁在一块旧木板上\n\n一只蝴蝶从玻璃外飞进来\n停在他脸上\n他梦见自己是钟表店老板\n坐在店堂里\n擦着桌子\n\n许多钟表在店里走动\n有的指向早晨五点\n有的指向下午三点\n有的指向十一点半\n\n他把手伸进冷水盆\n把脸浸进去\n擦干后，他发现自己\n变成了一块石头\n\n月亮照到他的脸上\n有雾的地方\n有许多钟表\n在滴答滴答地走动"}, "B": {"id": "7ea85a5b5c204118", "body": "他的手搁在窗台\n像两只搁浅的水罐\n梦中他回到旧居\n用小铲子刮去井沿上的青苔\n把桶重新挂回树上\n用木塞堵住泉眼\n用布条把绳子捆紧\n然后关掉灯\n摸黑走到床前\n摸到枕边的手表\n拨准了时间\n窗外月亮刚刚升起\n屋顶滴着水\n他梦见自己在旷野行走\n收起梯子\n锁上后院的门\n他摸到枕头下的一张纸\n把碎玻璃扫进纸盒\n系好绳子\n把纸盒提出去\n放进垃圾篓\n锁上铁门\n他摸到另一只手表\n拧开盖子\n将发条上紧\n然后关掉灯"}}, {"i": 68, "prompt": "写一首关于夜间无人仓库的现代诗。自动搬运车避开地上一只误入的麻雀，路线因此不断重算。", "pk": "B:cp-v1-025", "A": {"id": "7858cf67d2961803", "body": "夜晚无人的仓库里\n自动搬运车避开地上一只\n误入的麻雀\n路线因此不断重算\n\n它的边缘\n擦过一些箱子\n擦过另一些箱子\n擦过第三排箱子\n擦过第四排箱子\n擦过第五排箱子\n擦过第六排箱子\n擦过第七排箱子\n擦过第八排箱子\n擦过第九排箱子\n擦过第十排箱子\n擦过第十一排箱子\n擦过第十二排箱子\n擦过第十三排箱子\n擦过第十四排箱子\n擦过第十五排箱子\n擦过第十六排箱子\n擦过第十七排箱子\n擦过第十八排箱子\n擦过第十九排箱子\n擦过第二十排箱子\n\n擦过第二十一排箱子"}, "B": {"id": "c2605c6bf1256be5", "body": "外面下着雪\n一扇门开了又关上\n自动搬运车避开地上一只误入的麻雀\n路线因此不断重算\n在它身后\n一些金属箱子被摞到一起\n像一座临时的纪念碑\n一个动作停在那里\n等待指令"}}, {"i": 69, "prompt": "写一首关于旱季水库的现代诗。水位下降后露出旧村的屋脊，叙述者只在岸上观察，不进入回忆说明。", "pk": "A:cp-v1-002", "A": {"id": "00ff25f9b096b9b5", "body": "一只鸟飞过\n水面不再有波纹\n\n岸边\n提着桶的人停下脚步\n把脸转向这边\n\n树根从裂缝中撑出\n泥土暴露了它的形状\n天空把影子压得很低"}, "B": {"id": "aa82c3b01d90ed6b", "body": "旱季的水库，水位下降\n水面的倒影更清晰了\n像一件褪色的衣服\n挂在一个空荡荡的房间里\n岸边的树木都向水靠拢\n像是想要抓住什么\n但水已经退远了\n留下一些寂寞的贝壳\n和一只沉船\n在风干的日光下晒着\n偶尔有一些鱼\n跃出水面，又迅速下沉\n它们可能是在寻找氧气\n也可能只是想看看这个世界的另一面\n我站在岸上\n望着那些消失的水波\n想起过去的日子\n那时水是满的\n我们可以在上面划船\n而现在，只剩下一片沉默的泥沙\n和一些模糊的记忆\n风吹来，带走了最后一丝凉爽\n太阳照着，把一切变得更加荒凉\n我不知道明天会怎样\n也许会有更多的雨\n或者，这只是另一个干旱的季节\n不管怎样，我只能在这里等待\n看着水位继续下降\n直到所有的秘密都被揭示出来"}}, {"i": 70, "prompt": "写一首发生在末班地铁停运后的现代诗：一个清洁工在空站台发现一枚仍然温热的硬币。不要解释硬币的来历，让动作和声音推动诗。", "pk": "B:cp-v1-001", "A": {"id": "db0ad0d2bb948f39", "body": "把抹布拧干\n他用脚后跟踩着水\n把月光从台阶上踢下去\n把钥匙插回锁孔\n把门刷一遍漆\n把旧报纸捆成一摞\n把烟蒂按进窗台上的灰\n把擦过手的抹布\n搭在晾衣绳上\n把铁丝拧紧\n把落叶扫到树根旁\n把碎玻璃扫进纸盒\n把箱子摞到墙角\n把碎玻璃扫进纸盒"}, "B": {"id": "d11534da1b2ab314", "body": "把落叶扫到一边\n他蹲下来\n用手指试了试温度\n把硬币捏进掌心\n放进衣兜\n擦掉镜子上的雾\n他打开灯\n把水倒进桶里\n把钥匙插回锁孔\n拧紧水龙头\n把抹布挂回原来的地方\n把碎玻璃扫进纸盒\n把纸盒拎到门口\n把门关严\n把自行车推过道\n把车筐里的报纸叠好\n把伞架回原处\n把伞收拢\n把伞尖滴干的水\n拧回去\n把螺丝重新拧上\n把箱子盖严\n把绳子系紧\n把木板摞在一起\n把口哨含在嘴里\n吹了一声"}}, {"i": 71, "prompt": "写一首矿区恢复成湿地后的现代诗。候鸟停在旧轨道旁，铁锈从浅水中显出。", "pk": "B:cp-v1-020", "A": {"id": "301d3288a6f77493", "body": "矿坑边缘\n铁轨生了青苔\n一株桦树长到齐肩高\n有人用绳子捆过它\n后来再也没人管\n\n候鸟停在旧轨道旁\n铁锈从浅水中显出\n它的气味\n比去年淡了一些"}, "B": {"id": "c6329725e1808a48", "body": "矿井口用红漆画了一个圆圈\n那些年我们曾用它测量水位\n现在它的边缘爬满苔藓\n像一只提过的桶沿\n\n运煤的轨道铺到湖心\n候鸟停在旧轨道旁\n铁锈从浅水中显出\n它们用爪子刨着\n把碎玻璃从里面取出来\n放进提过的桶里\n倒掉后用石头压住边缘"}}, {"i": 72, "prompt": "写一首关于医院走廊自动售货机的现代诗：深夜，机器退回一枚硬币，等待的人没有再次投入。", "pk": "A:cp-v1-005", "A": {"id": "4aa2c76fb4211cba", "body": "金属的喉咙吐出一枚硬币  \n灯泡在头顶嗡嗡叫着  \n时间被装进一个透明的盒子  \n它知道明天是哪一天  \n\n无人投币，无人靠近  \n玻璃后，一个静物继续守望  \n黑暗从四面八方渗入  \n把一切重新变成寂静"}, "B": {"id": "a719738067f54069", "body": "金属喉咙吞下最后一粒光  \n寂静在玻璃后凝结成霜  \n指针游移，像未愈合的裂痕  \n货架深处，饮料瓶浮起幽蓝的月亮  \n\n硬币在暗处翻了个身  \n锈色爬上边缘，如同某种隐秘的伤  \n门禁卡在感应区发烫  \n而无人前来赎回沉默的回响  \n\n风穿过通风口，带走了  \n一串未完成的密码，和  \n某个夜晚未曾抵达的远方"}}, {"i": 73, "prompt": "写一首冬季渡口的现代诗：最后一班船离岸后，一只手套留在系缆柱上。", "pk": "A:cp-v1-008", "A": {"id": "31c906ceb1ab280c", "body": "风把最后的浪拍向石头\n水声退去时\n有人把一件外套扔在码头上\n一只灰色的手套仍在系缆柱上摇晃\n它曾紧握过舵柄，紧握过绳索\n现在却松开了一切\n桅杆上的鸟叫了一声\n另一只鸟应了一声\n雪落下来了，像一种遗忘\n雾升起时，像另一种遗忘"}, "B": {"id": "1a9fe01040011697", "body": "铁锈在暮色里渗出暗红  \n缆绳缠住半截指纹  \n风把影子吹成薄纸  \n折叠进对岸的雾  \n\n冰层下有东西在游动  \n像未寄出的信  \n被冻住的波纹  \n反复擦拭同一块礁石  \n\n灯塔眨眼时  \n那只手套正慢慢  \n褪成黄昏的灰"}}, {"i": 74, "prompt": "写一首春运候车室的现代诗。一位老人把纸质车票夹进透明手机壳，广播多次更换检票口。", "pk": "B:cp-v1-026", "A": {"id": "9919234a27bb5170", "body": "把地图折回原来的痕迹\n他用指甲划过一小块区域\n那里的名字被磨平了\n把纸币塞回裤兜\n把剩饭装进保鲜盒\n用塑料袋捆好\n用绳子把箱子系紧\n把钥匙串挂回去\n他把旧报纸按顺序叠好\n收起散落的零件\n拧紧水龙头\n把剩下的油装进小瓶\n把窗台上的水倒掉\n把箱子放在地上\n把箱子盖扣上\n把插头从墙上拔下\n把线绕成一匝\n把螺丝放回盒子\n把工具收进抽屉\n把碎玻璃扫到一处\n用纸擦干桌面\n把凳子摞起来\n把椅子搬到墙边\n把箱子装上车顶\n把门关严\n把锁舌按下\n把自行车推进车库\n把伞收起来\n把水壶架在炉头\n把煤气阀门拧紧\n把脸盆架回去\n把毛巾搭在晾衣杆上\n把剩菜装进保鲜盒\n把筷子插回碗里\n把盐罐盖上\n把汤勺搁回原处\n把砧板立起来\n把抹布叠好\n把洗洁精倒回去\n把水龙头拧紧\n把拖把挂回去\n把垃圾袋提出去\n把纸团扔进去\n把口香糖粘回去\n把烟蒂掐灭\n把烟盒合上\n把帽子挂回去\n把围巾搭在椅背上\n把袖套摘下来\n把工作服叠好\n把雨衣挂回去\n把绳子收起来\n把梯子靠回墙边\n把螺丝拧回去\n把铁丝弯回来\n把口哨放回口袋\n把剪刀插回鞘内\n把钳子放回工具箱\n把锤子架回去\n把锯条卸下来\n把螺丝钉收好\n把废料装进袋子\n把砂轮片取出来\n把胶带缠回去\n把口红盖上\n把粉饼盖好\n把唇膏收回盒子里\n把镜子擦干净\n把相框挂回去\n把发卡插回头发里\n把发圈系回手腕\n把戒指摘下来\n把手表摘下来\n把耳环摘下来\n把耳塞取出来\n把口罩摘下来\n把眼镜擦干净\n把假牙刷一遍\n把牙膏挤回去\n把牙刷挂回去\n把漱口杯放回去\n把药盒合上\n把药匙收起来\n把体温计收好\n把体温计甩几下\n把温度计收好\n把温度"}, "B": {"id": "da13c6ac7300f7a3", "body": "把钥匙挂回门后\n把纸折成一只小船\n放进窗台上的水盆\n他收起梯子\n用毛巾擦干手\n把箱子摞到墙角\n把伞架回原处\n他打开地图\n把指头按在那个圆点上\n把旧报纸揉成一团\n把零钱塞回钱包\n把剩下的药锁进柜子\n把绳子系紧\n把凳子摞到墙角\n把箱子摞到墙角\n把伞架回原处\n他收起梯子\n把钥匙挂回门后\n用毛巾擦干手\n把纸折成一只小船\n放进窗台上的水盆"}}, {"i": 75, "prompt": "写一首关于一台老式电梯的现代诗。它每天在十三层短暂停顿，楼里却没有十三层按钮。", "pk": "B:cp-v1-017", "A": {"id": "ffeebb0c9942db6a", "body": "它每天在十三层短暂停顿\n楼里却没有十三层按钮\n电梯门打开又关上\n里面没有人\n外面也没有人\n它的金属边缘有一处凹陷\n那是去年冬天留下的痕迹"}, "B": {"id": "623a0656a7a6f620", "body": "它的门开在九楼\n它的门关在八楼\n它的门开在七楼\n它的门关在六楼\n它的门开在五楼\n它的门关在四楼\n它的门开在三楼\n它的门关在二楼\n它的门开在一楼\n它的门关在地下"}}, {"i": 76, "prompt": "写一首凌晨四点面包房的现代诗，把发酵、炉火与尚未醒来的城市放在同一时间结构里。", "pk": "A:cp-v1-003", "A": {"id": "85bc076854ab2b4a", "body": "凌晨四点钟，面包房亮着灯，\n那孩子睡在烤暖的炉旁。\n小脸蛋埋在一双大手掌里，\n做着梦：妈妈会从远方来。\n\n她要给她梳好长长的辫子，\n还要讲许多有趣的故事。\n炉火映红了她的两颊，\n像一朵朵盛开的玫瑰。\n\n窗外是深沉的黑夜，\n只有星星在天空中眨眼。\n可是孩子并不知道，\n妈妈已经走了很远很远。\n\n面包房里的灯光渐渐暗淡，\n炉火也熄了。孩子还在睡，\n梦见妈妈温柔的声音，\n和那温暖的拥抱。"}, "B": {"id": "f01bd510e030ddaf", "body": "面团在玻璃窗后呼吸  \n蒸汽爬上凌晨的褶皱  \n烤箱吞下暗色的潮汐  \n\n街道蜷缩成未拆封的信  \n路灯是锈蚀的钟摆  \n悬停在梦与清醒之间  \n\n面粉尘埃落进排水沟  \n像无数个未完成的句点  \n而炉火正将沉默  \n锻造成金黄的裂痕  \n\n城市仍沉睡在自己的壳里  \n面包房却已开始  \n用香气缝合时间的裂缝"}}, {"i": 77, "prompt": "写一首沙尘暴过后教室里的现代诗。黑板上昨天的公式仍在，窗槽积了一层细沙。", "pk": "B:cp-v1-016", "A": {"id": "7e696b1913953df9", "body": "擦过玻璃后的天空\n像一块磨过的石头\n黑板上的公式仍然在\n用粉笔画一条线\n把它分成两半\n擦掉右边的一半\n剩下的另一半\n留到明天"}, "B": {"id": "d19275641c5ee31c", "body": "擦过的黑板\n留下一道水痕\n窗台上的半瓶水\n继续往下降"}}, {"i": 78, "prompt": "写一首围绕修表匠午睡时的梦展开的现代诗。梦中所有钟表指向不同的潮汐时刻。", "pk": "A:cp-v1-007", "A": {"id": "be078ff4d0be649e", "body": "修表匠\n在午睡时梦见了所有的钟表\n——在不同的潮汐时刻\n（从一只闹钟内部传出的歌声\n令他醒来之后心碎）\n\n所有的表盘上停着一个女孩儿\n她坐在床沿向我诉说\n我听见时间的水位不断下降\n而她的手指像两片新摘的菜叶\n当我在一只旧表里看到一颗熟透的水珠\n我就知道，这是可能的：\n她会因孤独而死去\n（从一只闹钟内部传出的歌声\n令他醒来之后心碎）\n\n她住在我的身体里面\n像住在一座迷宫中\n她总是突然出现又突然消失\n当我找到她，她已经走了\n留下一小瓶毒药和一袭白裙\n（从一只闹钟内部传出的歌声\n令他醒来之后心碎）\n\n她喜欢把玩一些小东西\n一枚邮票，一根发卡，一块口香糖\n然后就在我身上画出一道伤痕\n她总是说：“别怕，我会给你止痛药”\n却从不告诉我该到哪里去取\n（从一只闹钟内部传出的歌声\n令他醒来之后心碎）"}, "B": {"id": "99fd575a2c4864d2", "body": "他用一把银匙搅动一杯浓茶\n窗外的风忽然静止了\n一只断掉的发条在桌子上跳起华尔兹\n\n他的影子开始变形\n变成一个戴眼镜的陌生人\n坐在对面，把一枚铜币抛向空中\n在它落下之前，他闭上眼睛\n等待某种结果\n\n床头柜上的闹钟突然停止了\n一只蚂蚁爬进他的耳朵\n咬了一口\n他醒来后，发现一只小老鼠\n正在啃食那只铜制的钟摆"}}, {"i": 79, "prompt": "写一首关于旱季水库的现代诗。水位下降后露出旧村的屋脊，叙述者只在岸上观察，不进入回忆说明。", "pk": "A:cp-v1-002", "A": {"id": "3974933ca9916d89", "body": "水面缩回  \n如同退潮时的皮肤  \n裸露的泥土下  \n埋着未拆封的陶罐  \n\n石阶爬出裂缝  \n像某种古老的语法  \n被遗忘的井沿  \n长满铁锈色的苔藓  \n\n我站在边缘  \n数着裂纹里游动的光斑  \n它们不说话  \n只是反复擦拭  \n那些未曾命名的褶皱"}, "B": {"id": "9cb551ef966819ac", "body": "一只白鹭掠过水面  \n没有惊起一滴水珠  \n没有激起一声波纹  \n\n它停在一个木桩上  \n像一段枯枝横卧在时间里  \n像一块石头躺在另一块石头上  \n\n它的倒影比天空更蓝  \n比天空更远"}}, {"i": 80, "prompt": "写一首退潮后的防波堤现代诗。石缝里卡着一只塑料玩具船，真正的货轮正驶向雾中。", "pk": "B:cp-v1-027", "A": {"id": "7873a2f695b4bfb3", "body": "退潮后的防波堤\n像一条搁浅的水母\n边缘有磕痕\n内壁结了一层水垢\n\n石缝里卡着一只塑料玩具船\n真正的货轮正驶向雾中"}, "B": {"id": "b9dd05bb1f5b9b21", "body": "退潮后\n防波堤上散落着\n一些碎玻璃\n海水退去时\n留下一小片水洼\n像一块镜子"}}, {"i": 81, "prompt": "写一首植物园闭馆后的现代诗。一株夜间开花的植物无人观看，监控摄像头缓慢转动。", "pk": "B:cp-v1-013", "A": {"id": "0cb4f97683436c96", "body": "夜晚来得比预期更早\n一只蝉爬过树干\n把它的卵产在树皮上\n\n月亮从高处掉下来\n砸碎了水缸\n有人用木桶提水上楼\n滴了一夜\n直到天明"}, "B": {"id": "0d3ef8760df5eeb4", "body": "它的香气穿过栅栏\n向着街道飘去\n在路灯下\n它的影子比夜晚更黑"}}, {"i": 82, "prompt": "写一首关于城市停电十分钟的现代诗。叙述在不同楼层间移动，只通过窗、脚步和短暂亮起的手机呈现人群。", "pk": "B:cp-v1-009", "A": {"id": "dabd4535c5bbb236", "body": "楼顶的鸽子惊起后又落下\n我们坐在台阶上数着\n那些从窗台到窗台\n被突然截断的人影\n\n有人敲门\n问谁住在五楼\n我指了指对面的窗户\n我的手在黑暗中停顿了一下\n\n走廊尽头\n传来一阵咳嗽\n接着是拖鞋走动的声音\n像风穿过树林后的回声\n\n有人把收音机拧大了些\n另一些人关掉灯\n继续做着手里的事"}, "B": {"id": "616786b720e64b91", "body": "窗外有一棵树摇晃了十秒钟\n\n人们聚集到楼下\n又散开\n一些人把脸贴在玻璃上\n另一些人关掉走廊尽头的灯"}}, {"i": 83, "prompt": "写一首以“没有寄出的语音消息”为核心事件的现代诗。不要呈现消息全文，只写录制、删除与周围环境。", "pk": "A:cp-v1-011", "A": {"id": "c4d4bb44e548981d", "body": "我按下发送键\n声音像一匹被踢翻的布料\n从手机里抖落出来\n跌碎在木地板上\n我听见自己在里面尖叫\n而它只是静静地躺着\n像一段废弃的绳索\n等待着某只蚂蚁爬过\n然后慢慢变干\n最后缩成一堆死掉的字母\n我决定删掉它\n像拔掉一根多余的头发\n手指悬停时\n我忽然听到窗外的雨声\n变得有点像我刚才录下的那句\n话"}, "B": {"id": "c1de54604f650d7d", "body": "手指悬在发送键上方  \n三秒  \n空调吐出一串冷雾  \n把沉默吹得更长  \n\n床头灯照着  \n半杯凉透的茶  \n水纹里浮着  \n未完成的句子  \n\n耳机线缠绕成结  \n像某种未被说出的  \n隐喻  \n\n删除时  \n屏幕亮起  \n短暂的光  \n如同黄昏  \n忽然降临  \n又悄然退去  \n\n窗外的雨滴  \n正在练习  \n如何坠落而不发出声音"}}];
const KEY = "cyberpoet_prefs_v3";
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
function idx(){ for(let i=0;i<PAIRS.length;i++) if(!(i in labels)) return i; return -1; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(labels)); }catch(e){} }
function pick(v){ const i=idx(); if(i<0) return; labels[i]={choice:v,at:Date.now()}; save(); render(); }
function undo(){ const done=Object.keys(labels).map(Number).sort((a,b)=>a-b); if(!done.length) return;
  delete labels[done[done.length-1]]; save(); render(); }
function exp(){ const out=Object.entries(labels).map(([i,v])=>({
    prompt_key:PAIRS[i].pk, A:PAIRS[i].A.id, B:PAIRS[i].B.id, choice:v.choice}));
  const b=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="preference_labels.json"; a.click(); }
function render(){
  const i=idx(), n=Object.keys(labels).length;
  document.getElementById("n").textContent = n+" / "+PAIRS.length;
  document.getElementById("p").style.width = (100*n/PAIRS.length)+"%";
  const m=document.getElementById("m");
  if(i<0){ m.innerHTML='<div class="done"><h2>全部标完了</h2><p>点右上角「导出标注」保存结果。</p></div>'; return; }
  const p=PAIRS[i];
  m.innerHTML='<div class="prompt">'+(p.prompt||"（无题目文字）")+'</div><div class="row">'+
    '<div class="poem" onclick="pick(\'A\')"><h3>甲</h3><pre>'+esc(p.A.body)+'</pre></div>'+
    '<div class="poem" onclick="pick(\'B\')"><h3>乙</h3><pre>'+esc(p.B.body)+'</pre></div></div>'+
    '<div class="keys">← 选甲　→ 选乙　↓ <b>两首都不值得留</b>（哪怕一首没那么烂也按这个）　↑ 撤销</div>';
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") pick("A"); else if(e.key==="ArrowRight") pick("B");
  else if(e.key==="ArrowDown") pick("tie"); else if(e.key==="ArrowUp") undo();
});
render();
</script></body></html>
