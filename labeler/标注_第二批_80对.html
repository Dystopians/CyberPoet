font:16px/1.75 "Noto Serif CJK SC","Songti SC",Georgia,serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;z-index:9}

<script>
const PAIRS = [{"i": 0, "prompt": "写一首盐湖边废弃电影院的现代诗。银幕被风吹动，湖面的反光偶尔投进大厅。", "pk": "A:cp-v1-010", "A": {"id": "4651a1f40f636a2b", "body": "银幕上风姿袅娜的裸女\n在观众眼里已淡若青烟，\n然而风儿仍在吹动帷幕，\n湖面的反光时明时暗。\n\n灯光幽暗的大厅里无人，\n然而我看见，她仍在演出：\n她的肢体仍被投影机放扩，\n仿佛在黑暗中向人招手：\n\n“请进来吧！”——然而谁敢跨出？\n因为谁也找不到一条路……\n除了这扇门：出口，入口，\n也是通往另一世界的窗口。"}, "B": {"id": "26d24bd5a7c4cfc7", "body": "影子们离开后\n房子仍继续生长\n门廊里，一只塑料鸽子\n抖抖羽毛\n\n有人曾在这里\n用眼睛喂养过星辰\n如今它们仍在原处闪烁\n像一排无人认领的钥匙\n\n风，把幕布吹开又合上\n有时是海浪在放映自己\n我们以为是大海吞没了城市\n其实是城市变成了大海\n\n而椅子们依旧坐着\n像一群沉默的鱼\n当最后一颗星从屋顶沉落\n它们便纷纷游向黑暗"}}, {"i": 1, "prompt": "写一首现代诗：医院陪护床上折叠的被子还保持人形。让形状比人存在得更久", "pk": "B:sc013", "A": {"id": "9f99fb3a0732e671", "body": "一个形象从病榻移向死亡\n在最后一刻还保有人的外形\n像一床折起的棉被，静静地\n留在病房，而灵魂已逃之夭夭\n医生说，那人的形象仍在那里\n只是不再呼吸，不再移动\n仿佛在等待什么，或者只是\n留在那里作为曾经存在的证明"}, "B": {"id": "27f6d8729aea8108", "body": "1\n在一间空荡荡的病房内\n他已睡下\n一个孩子把玩具火车头塞进他口中\n并拉着另一端的绳子跑出房间\n2\n他的病历卡说：\n胃癌晚期\n3\n那孩子的哭声由远而近\n他醒来后摸到枕边一摊温水\n4\n窗外一只白鹭飞过\n他看到一个女人正俯身向他\n喂食\n5\n然后他听到一阵阵响亮的呕吐"}}, {"i": 2, "prompt": "写一首山中隧道维修夜班的现代诗。工人敲击岩壁，以回声判断空洞，偶尔有水滴落在安全帽上。", "pk": "A:cp-v1-012", "A": {"id": "91d98a30114055f7", "body": "他们敲击岩壁\n以回声判断空洞\n\n他们敲击岩壁\n以回声判断空洞\n\n有时水珠溅在头顶的铁壳上\n像一颗颗子弹\n擦身而过\n穿过寂静"}, "B": {"id": "8805e71d2496515d", "body": "一队矿灯，从石山深处浮来\n像一大把银钥匙，把地层\n打开\n\n当铁锤敲响\n我看见一群小人儿正忙于\n为大地打补丁\n\n叮\n当\n\n叮\n当\n\n他们用钢钎\n挑亮黑夜里\n每一颗星子"}}, {"i": 3, "prompt": "写一首现代诗：废品站里堆着一台还能转的洗衣机。让转动成为全诗唯一的动词", "pk": "B:sc014", "A": {"id": "f01fbf9d4f70182c", "body": "废品站里堆着一台还能转的洗衣机。\n让转动成为全诗唯一的动词：\n洗衣筒一动不动。\n那台洗衣机在等待一个女子把一件衬衣投进去。\n而一个女子正被另一个女子拖到河中去。\n衣服脱光后，\n她的皮肤上留有大量泡沫。\n\n洗着洗着她突然想起一些事情来，\n那些事情使她惊呼并用脚乱踢。\n她用尽全力蹬腿，\n于是水柱喷射而出，\n打湿了站在远处观看的我。\n\n我从一棵树后走出来，\n走进废品场，走进正在运转的那台洗衣机。\n我把自己丢进洗衣桶中，\n我的全身立刻被肥皂泡包围，\n我听到自己发出哗哗的声响。"}, "B": {"id": "2113043c625f1108", "body": "1\n一个城市没有一只云雀\n也是一样，但没有洗衣妇是不行的。\n每天早晨六点到十一点\n（她总是要歇一歇的）\n洗浴着这个城市，使它干净得可爱。\n她的手是泡沫的手，\n她的臂也是泡沫的臂，\n从那些洁白的泡沫中\n涌出的是玫瑰色的乳房……\n2\n她把衣服丢进洗衣机\n那台机器就唱起歌来。\n当它唱着“我的心里住着一位快乐的天使”\n时，她便跟着唱：“啊哈！\n我的心里可有一位快乐的小矮人呢！”\n3\n在洗衣房后面\n有个地方长满了野蔷薇，\n她喜欢坐在那里的树荫下面\n望着自己的手指想心事：\n“我多么希望有一双又肥又胖的手呀，\n这样，男人们才会喜欢我。”\n4\n一天清晨，她去换零钱，\n走到街上，看到一只小猫死在石板上。\n她哭了，眼泪浸湿了胸上的衣襟。\n\n5\n那天傍晚，她走过街角的一家杂货店，\n看见一只白鹅在橱窗里伸着头\n向她索要青葱。\n她走进店铺，拿出一枚金币\n买下了整条街道的葱……"}}, {"i": 4, "prompt": "写一首山中隧道维修夜班的现代诗。工人敲击岩壁，以回声判断空洞，偶尔有水滴落在安全帽上。", "pk": "A:cp-v1-012", "A": {"id": "e31296e832471711", "body": "铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n水珠坠入安全帽  \n叮——  \n时间裂开一道缝  \n\n铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n钢钎插入裂缝  \n碎石簌簌落下  \n黑暗吞食了它们  \n\n铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n汗水滴落  \n混着水珠的声音  \n在耳后凝结成盐  \n\n铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n岩壁渗出叹息  \n工人们交换眼神  \n沉默比言语更沉重  \n\n铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n光斑在头顶摇晃  \n影子被拉长又缩短  \n如同他们未说出口的梦"}, "B": {"id": "449fe77c106e92f3", "body": "他们说，当人睡去，时间停止了。\n\n所以，山仍在沉睡：\n在那高高的山顶，\n月光流自一株老松，\n\n如山那边传来的钟声一样。\n\n而我们只是在穿过山洞。\n我们是隧道维修队夜班。\n\n于是，我们听到敲击岩壁的声音，\n一阵一阵地，\n从前方传来；\n有时是两长声短。\n\n有时又是一阵碎响，\n像风掠过树梢，\n又似流水拍岸……\n\n然后——\n又是“咚，咚咚……”——\n一声一声，\n清脆、悠远，而且空旷。\n\n我似乎感觉到了\n敲击者的手臂\n正一次次地伸到远处，\n而岩石的深处，\n正一点点地打开。\n\n我想问：你们听到了什么？\n“没什么，”领头的老工人，\n从他的安全帽下回答：\n\n“我们听到了\n我们身后越来越近的敲击。”"}}, {"i": 5, "prompt": "写一首现代诗：小卖部老板娘把过期的糖果挑出来。让保质期成为时间尺度", "pk": "B:sc021", "A": {"id": "1b035c1989d7d17b", "body": "让保质期成为时间的尺度：\n“过了这月零下二度”——\n她一面说一面用\n指甲在塑料包上划着\n仿佛是在\n一匹白绢上刺绣。\n\n我站在柜台旁\n望着窗外街边\n一个小孩\n在用手指量着\n一只熟透了的苹果。"}, "B": {"id": "13498899675274f3", "body": "一\n当夜色从山峦之巅向我扑来\n当我看到灯火在远方闪烁，\n当我听到晚风中隐隐约约的歌声，\n一种难以名状的寂寞袭上我的心头。\n\n二\n啊，我的生活是一片阴沉的天空。\n有时是乌云，有时是阴霾，\n有时是一场大雪，有时是一道冰凌，\n我所希望的是明朗的日子。\n\n三\n有时候我像一个孩子站在田野里，\n看着天上飞过的鸟儿，\n心里充满着喜悦；\n而有时候我又像一只迷路的羔羊，\n在森林中寻找归途。\n\n四\n我曾经有过许多朋友，\n如今都不在了。\n他们的笑声还留在我的耳边，\n但已渐渐模糊不清。"}}, {"i": 6, "prompt": "写一首关于城市停电十分钟的现代诗。叙述在不同楼层间移动，只通过窗、脚步和短暂亮起的手机呈现人群。", "pk": "A:cp-v1-009", "A": {"id": "e8c0d67162c82316", "body": "我住七楼\n楼下忽然传来\n一阵惊慌的骚动\n人们举着蜡烛和火把\n在各层楼奔跑\n好像发生了大劫难\n我打开窗户\n看见人群正涌向\n一楼门洞处\n我问：“到底出了什么问题？”\n回答是“停电了”\n我说：“那又怎么样？”\n一个声音吼叫：“快跑！”\n大家便呼啦一下散尽\n我回到房里\n想点支烟\n才发现连火柴也看不见了\n这时我摸到床头的手机\n忽然被点亮\n只见屏幕上显示：\n“十分钟后恢复供电”"}, "B": {"id": "3ad3eb472066aad9", "body": "我站在六楼，把脸贴到玻璃上  \n楼下有一辆小轿车，有人敲打车顶  \n发出闷声的呼救  \n\n我打开阳台门，一股凉气涌来  \n五楼的女人从窗户伸出手臂  \n像一个倒置的钟摆，左右摇晃着什么  \n\n三楼的男孩，举着发光的手机  \n朝向天空喊了几句，声音很快散开  \n被夜吞没了  \n\n二楼的一扇窗突然亮了  \n接着，是三楼、四楼、五楼……  \n一束光追着另一束光，逐渐升高，最后停在七楼"}}, {"i": 7, "prompt": "写一首现代诗：产房外走廊的塑料椅被坐出弧度。让弧度记录等待的长度", "pk": "B:sc024", "A": {"id": "02c84cae740cedf7", "body": "产房外走廊的塑料椅被坐出弧度\n让弧度记录等待的长度\n当母亲开始呻吟，那声音\n像一把铲子挖掘地下深处的盐\n而我坐在弧度之外\n看钟表，看秒针跳动，一格又一格\n仿佛在爬行\n时间啊，在我身上刻下另一个年轮\n我的手紧握着一根柔软的小绳\n准备迎接那个小小的奇迹\n一个新生命，从黑暗中走出，带着光\n带着一声啼哭，像一声鸟鸣\n划破清晨的寂静\n而产房内，一片血红\n是花朵也是伤口，是开始也是结束\n我看着窗外的树影摇晃\n像是母亲的头发\n风轻轻吹过，带走了什么？\n也许是疼痛，也许是恐惧\n但更多的是希望\n就像这弧形的椅子，弯曲着\n托起每一个即将降临的灵魂\n直到婴儿的到来，像一场雨后的晴天\n阳光洒满房间，温暖而明亮\n我抱起那个小东西，第一次感受到\n生命的重量，如此轻盈却又如此沉重\n在这条长长的走廊上，每一步都踏实地\n走向未来的某个地方，我不知道是什么\n但我记得这个时刻，如此清晰\n如同这产房外的塑料椅，被坐出了弧度\n记录了等待的长度。"}, "B": {"id": "fe832a5e2bec4dbf", "body": "产房外走廊的塑料椅被坐出弧度\n让弧度记录等待的长度\n\n一盆金桔树\n在窗台上开着花\n在产房外走廊的塑料椅上\n一位孕妇从一只乳峰滑向另一只乳峰"}}, {"i": 8, "prompt": "写一首现代诗：守夜人把手电筒照进每一间空教室。每照一间就少写一个字", "pk": "B:sc005", "A": {"id": "a7ecb8dd112fef2e", "body": "一盏灯\n两盏灯\n三盏灯\n四盏灯\n五盏灯\n六盏灯\n七盏灯\n八盏灯\n九盏灯\n十盏灯\n十一盏灯\n十二盏灯……"}, "B": {"id": "b3dd55aaaa498047", "body": "在黑板上\n从“教育之伟大”开始\n一直写到“教育之没落”\n他写呀，写呀\n把每个字\n都写得很伤心\n而他的手\n在墙上摸呀，摸呀\n把每扇门\n都摸得更寂寞\n然后熄了灯\n蹑手蹑足\n回到自己的房间里\n把鼾声\n打得很响"}}, {"i": 9, "prompt": "写一首现代诗：给一栋楼刷外墙的工人吊在半空吃饭。让高度与食物并置", "pk": "B:sc020", "A": {"id": "d5f13c7dbaad0b5f", "body": "一个吃面包长大的男人\n一个吃面粉长大的男人\n一个吃馒头长大的男人\n一个吃麦子长大的男人\n他坐在这座楼顶上\n吃着面条\n从十二楼一直吃到十九楼\n一直到只剩下骨头\n他才想起来要喝汤"}, "B": {"id": "22d8632d68f12f4a", "body": "给一株树上的苹果刷漆的男子汉边吃着三明治边在梯子上睡午觉。让美味与色彩并置。\n\n给一位穿游泳裤的女秘书做脊椎矫正治疗的小个子医生戴着氧气罩躺在床上看小说《我，一个法国女人》。让健康与幽默并置。\n\n给一座教堂屋顶作防水处理的修女跪在地上为一只被踩死的蜗牛念经。让宗教与温情并置。"}}, {"i": 10, "prompt": "写一首现代诗：拆迁队进场前一户人家还在做饭。让炊烟和尘土同时上升", "pk": "B:sc009", "A": {"id": "aec558d1ed4ee803", "body": "拆迁队进场前一户人家还在做饭。让炊烟和尘土同时上升，那最后的烟囱就是一座被围垦的荒漠的最边缘的标志，从那个小小的窗口里透出的灯光照亮了一间空屋子，一个老妇人正弯腰往炉膛中添着柴火，她的背影在墙上放大，她身后的墙壁已被熏黑。这时，一个男人敲响了门环。他进来之后发现自己的妻子早已死去。而当他把脸贴近尸体时，这女人突然睁开眼说：“你的手好冷呀。”"}, "B": {"id": "5589f076e3305504", "body": "那年我们到河口去看风\n在沙洲上搭帐篷吃便当\n黄昏时分月亮升得特别快\n把整个大陆压向海里\n而海水突然退去\n好像从我们的身体抽走了血液\n我听到岸上有隐隐的呼救声\n那时我们正以青涩的目光交换眼神\n而一只搁浅的螃蟹爬过来\n在我掌中翻了个身\n又翻回来\n好像我们一生中的某些日子"}}, {"i": 11, "prompt": "写一首发生在末班地铁停运后的现代诗：一个清洁工在空站台发现一枚仍然温热的硬币。不要解释硬币的来历，让动作和声音推动诗。", "pk": "A:cp-v1-001", "A": {"id": "44222de4102839c7", "body": "凌晨两点，末班列车进站了\n月台上只有一盏灯亮着\n两个戴鸭舌帽的男人走了进来\n他们把烟灰缸扔给了清洁工\n又将一元硬币丢给了清洁工\n然后说：我们下一辆车会回来\n说完就消失得无影无踪\n\n而那个清洁工却独自坐在台阶上\n一边听着列车缓缓驶出轨道的声音\n一边摸着手中的硬币喃喃自语道：\n这枚硬币真温暖啊……"}, "B": {"id": "24b3fe42d91529eb", "body": "金属在掌纹里发烫  \n他弯腰时听见铁轨吞下最后一声叹息  \n拖把划过地面  水渍漫过瓷砖的裂痕  \n像某种未完成的句号  \n\n通风管道漏出旧报纸的气味  \n他捏住那枚硬币  像攥紧一枚未熟的果核  \n指节泛白处  有锈迹在缓慢结晶  \n楼梯间突然传来玻璃碎裂的声音  \n\n他抬头  看见自己的影子正被月光折叠  \n成一张褪色车票  \n站台尽头  有人用脚尖踢动  \n一串沉默的纽扣"}}, {"i": 12, "prompt": "写一首现代诗：代写春联的老人手抖，笔画拖出尾巴。让拖出的部分成为诗意来源", "pk": "B:sc017", "A": {"id": "6316cde0a655d37d", "body": "代写春联的老人手抖，笔画拖出尾巴\n“门迎春夏秋冬福”——他写道\n把尾巴留给读者去猜测\n从“福”字到下一个“福”字\n是一段很长的时间\n其间，有尾音袅绕\n有余香犹存\n有未尽之意\n在空中轻轻飘荡，如烟似雾\n等待着被解读，被品味\n这，就是那拖出来的尾巴了。"}, "B": {"id": "0a4fe194ba66308d", "body": "1.\n一个冬天\n他用一块破木板\n把我的名字钉在门上\n2.\n一九八〇年冬天\n我在自己的新房内度过\n窗外，雪仍在下\n而长沙的天空突然出现众多的神\n他们在雪中飞行，高呼：\n“湖南湖南……”\n3.\n那一天我开始学习如何愤怒\n4.\n那一天朋友们提来十三只酒瓶\n我们把剩下的十一头种到山上\n5.\n一九八二年冬天\n当太阳升起\n我突然发现\n那些酒瓶都是神的眼睛\n6.\n一只装满清水的旧鞋\n放在地上\n会变成石块\n7.\n我就是那放错了地方的\n火\n8.\n在海洋里\n忽然遇到风暴\n我脱下衣服，抱住桅杆\n这时\n我这火做的躯体\n已被众神抬向天空\n9.\n从今天起他们叫我\n火天使"}}, {"i": 13, "prompt": "写一首现代诗：鱼贩把冰重新铺一遍盖住昨天的鱼。让冰的重量与时间挂钩", "pk": "B:sc006", "A": {"id": "f84aa85cb640dfc5", "body": "1\n——一匹被剥了皮的水货\n在午夜被卖到肉行，\n它的内脏还带有一点点潮气，\n它那鳞片仍闪耀着一点点磷光。\n2\n（谁说这是一条死鱼呢？）\n它被吊在一扇铁门上，\n像一个女尸吊在一扇铁门上，\n在午夜，\n它的影子穿过街坊里弄时，\n还带有一点点湿气。\n3\n但它是死的。\n它没有声音，\n也无气味。"}, "B": {"id": "d115b4f29285cdcf", "body": "冰的重量，从时间中析出\n鱼贩把冰重新铺一遍盖住昨天的鱼\n他收拢了鱼鳞，像收紧渔网\n鱼贩，一个以鱼为妻的男人\n他卖的是水银的头\n他的掌纹里游着一条咸鱼\n他从河里捞起自己的一半\n用另外一半撑船\n他是鱼，但不是水里的那个我\n我的呼吸来自你的鼻息\n我身上爬满鱼鳞，我是你的鳞\n我的牙齿是鱼牙，我吃鱼的时候\n也吃着自己\n鱼贩，你卖的不只是鱼\n你出售的是水的欲望\n以及，我们共同的孤独"}}, {"i": 14, "prompt": "写一首现代诗：送葬队伍在红绿灯前停下。让规则与仪式相撞", "pk": "B:sc027", "A": {"id": "9b8a0cbfee5cefc1", "body": "一辆红色轿车冲出前面路口，像一个冒犯者\n当它在对面人行道边刹住时，死者亲属突然扑了过去\n他们用愤怒的拳头向汽车的四个轮子击去\n汽车里的人似乎并不清楚发生了什么\n直到警察来后，才明白那不过是一场误会——\n司机是一位失去爱人的男子\n他从车窗里看到送葬队伍中，一个女人在痛哭\n而他误以为她是在哭自己……"}, "B": {"id": "2ecbe7d48aaa2913", "body": "送葬队伍在红绿灯前停下\n让规则与仪式相撞\n汽车等着过马路的人\n人群望着黑色灵车\n一只白鸽从墓地飞起\n天空蓝得要命"}}, {"i": 15, "prompt": "写一首现代诗：补网的渔民数破洞，数到一半忘了。让数字中断处成为转折", "pk": "B:sc019", "A": {"id": "a54138c5f1351555", "body": "在河的这头\n\n放一只桶\n\n在河的那一头\n\n放一尾鱼\n\n当一只桶遇见另一只桶\n\n便有了\n\n一窝泡沫"}, "B": {"id": "8b838879e7fb6930", "body": "补网的渔民数破洞，数到一半忘了。\n让数字中断处成为转折，\n他把剩下的破洞加起来又算了一遍。"}}, {"i": 16, "prompt": "写一首现代诗：旧书店老板用刻度尺量一本书的厚度定价。让价格与厚度的换算贯穿全诗", "pk": "B:sc000", "A": {"id": "5fb628ef3fe5a54b", "body": "书摊主以尺丈量一本书的厚度来标价\n书价\n遂成为一本厚厚的书\n书价\n遂成为一册又厚又贵的历史"}, "B": {"id": "24016cb1579f1bbd", "body": "“一毫米五分”——\n旧书店老板\n用一把老式尺子丈量着书脊，\n说：“从头到尾。”\n“是的，从头到尾。”\n于是那书便有了一个好价钱：\n每一行，每个字\n都像在银行里兑换到硬币，\n连空白处也被贴上标签，\n说：“这叫出版商留白。”\n而作者早已去世，\n只剩下他的名字和一部厚厚的遗嘱\n被摆放在了最不起眼的一格。\n他想不通为什么\n他那些未完成的手稿\n会比已经写完的更昂贵，\n但最后还是接受了现实：\n它们的价格刚好等于\n他生前欠下的债款加上利息。"}}, {"i": 17, "prompt": "写一首以“没有寄出的语音消息”为核心事件的现代诗。不要呈现消息全文，只写录制、删除与周围环境。", "pk": "A:cp-v1-011", "A": {"id": "477b395bc2318794", "body": "我正要把一段语音消息\n通过电话发给你\n忽然想起\n这并非一个适合的时刻\n于是便把它\n删除了\n\n窗外雨\n下得有点大\n风\n刮得也挺猛"}, "B": {"id": "707fc83cf42b0c47", "body": "录音机里传来一段声音：\n喂！我是小刘啊——喂，我今天路过你家楼下，看见你家门口放着一只很大的塑料桶，不知是干什么用的……喂？喂？\n（喂？喂？）\n哎呀，我怎么听不见你的回声呢……喂？喂？喂？\n\n……喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？喂？"}}, {"i": 18, "prompt": "写一首现代诗：洗车工用高压水枪冲掉一层灰。让灰的去向比车更重要", "pk": "B:sc025", "A": {"id": "c9800d6afb5d0811", "body": "洗车工用高压水枪冲掉一层灰\n让灰的去向比车更重要"}, "B": {"id": "2b0847c0b70a8578", "body": "洗车工把高压水枪对准了车牌号，哗啦哗啦一阵猛冲，灰扑扑的泥水溅得到处都是。我看着这小小的场景，突然想到灰的去向。我问自己，它们是去了哪里？是落在地上，被风吹走，还是融进了雨水里。这些灰，像一个个小精灵，各自有了自己的归宿。\n\n洗车工已经停下了手上的活，他转过身来对我笑了一笑。也许他是觉得这个问题很有趣。我也忍不住笑了起来，心想，灰的事情总得留一点空间给它们吧。我不再深究这个谜题，而是把注意力放到了眼前的车上，它已经焕然一新，闪闪发光。"}}, {"i": 19, "prompt": "写一首现代诗：代写春联的老人手抖，笔画拖出尾巴。让拖出的部分成为诗意来源", "pk": "B:sc017", "A": {"id": "e94c8cfd07e0a594", "body": "代写春联的老人手抖，笔画拖出尾巴\n在红纸上\n尾随不舍的是\n一片风中的乱发\n而他那苍老而颤抖的手\n正不断将春天推出窗外\n且一再被冷风吹回身来\n他写着：福\n禄\n寿\n喜……\n以及各种花\n各种鸟\n及至，一个喷嚏将\n整个春天射向屋顶\n从此，檐角\n悬挂起一把把带霜的棉桃"}, "B": {"id": "d56cae052efce910", "body": "代写春联的老人\n手抖，笔画拖出尾巴\n让拖出的部分成为诗意\n而没有拖出的部分\n亦可作如是观"}}, {"i": 20, "prompt": "写一首现代诗：屠宰场清晨冲洗地面的水流进下水道。不出现动物，只写水的颜色", "pk": "B:sc003", "A": {"id": "9db589781e274886", "body": "屠宰场清晨冲洗地面的水流进下水道\n一只灰狼在河中饮水\n另一只灰狼在天上饮水\n它们把头颅昂起\n河水流过河床\n像一个母亲流着奶水的乳房\n河水流过乳房\n像我的情人嘴唇吹过她的乳房\n她把嘴唇贴近河水，我爱人洁白的牙齿\n咬向河岸上的鲜花"}, "B": {"id": "f287de739bc95e6c", "body": "黎明的流水是红的。\n黎明的流水是淡红的。\n黎明的流水是浅红的。\n黎明的流水是鲜红的。\n\n从四蹄出血的畜类皮毛反射的光芒\n黎明的流水是鲜红的。"}}, {"i": 21, "prompt": "写一首现代诗：拆迁队进场前一户人家还在做饭。让炊烟和尘土同时上升", "pk": "B:sc009", "A": {"id": "3c3c8d6c96839d12", "body": "炊烟\n和尘土一起飞扬\n一群鸡惊慌地扑棱着翅膀飞上屋顶\n一家三口人正手忙脚乱地从烟囱里往外掏东西：\n一把铁锅，一个铝盆，一副筷子……"}, "B": {"id": "88ae265cc5d48a3b", "body": "炊烟和尘土一起上升\n屋顶下悬着一口空锅\n一只鸡在草丛中啄食\n一个女人说：快些端来！\n男人从烟囱里往外掏火\n一个孩子正在拆卸一件旧衣服\n一个老人坐在门槛上\n看蚂蚁搬家\n他想起来了：\n那是去年的事了\n那时他还是个年轻人\n那时他的头发还很黑\n那时他还能大声喊叫"}}, {"i": 22, "prompt": "写一首现代诗：小卖部老板娘把过期的糖果挑出来。让保质期成为时间尺度", "pk": "B:sc021", "A": {"id": "e2c94d133a20a300", "body": "小卖部老板娘把过期的糖果\n从一罐子中挑出来\n像把坏掉的牙齿拔出来\n让保质期成为时间尺度"}, "B": {"id": "890f0e5b5de8ed0c", "body": "让保质期成为时间尺度\n让糖的甜蜜与忧伤成为空间距离\n让红色小蜜蜂在糖纸上的飞行留下时间痕迹\n让红色小蜜蜂成为时间旅行者"}}, {"i": 23, "prompt": "写一首现代诗：夜市收摊时塑料棚被一根根抽掉。按抽掉的顺序分节", "pk": "B:sc015", "A": {"id": "8c0c8eeee351efc3", "body": "夜市收摊时\n塑料棚\n被一根根抽掉\n第一根，哗啦\n第二根，哗啦\n第三根，哗啦\n第四根，哗啦\n第五根，哗啦\n第六根，哗啦……"}, "B": {"id": "e57a56e10d67cefe", "body": "1\n\n小鸡吃食\n啄食声\n像风中的剥茄子声\n老王\n把竹制的门帘卷起来\n一匹马\n一卷走\n2\n\n老李在隔壁洗头\n水\n溢出来了\n3\n\n小林\n从二楼摔下来\n刚好\n摔在他父亲的背上\n4\n\n我\n在河边洗身上的鳞片\n5\n\n小牛\n在草地上睡着了\n6\n\n夜市收摊时塑料棚被一根根抽掉。按抽掉的顺序分节"}}, {"i": 24, "prompt": "写一首现代诗：产房外走廊的塑料椅被坐出弧度。让弧度记录等待的长度", "pk": "B:sc024", "A": {"id": "0a5b1f974e255b95", "body": "产房外走廊的塑料椅被坐出弧度\n让弧度记录等待的长度\n\n孩子是父亲和母亲的爱情结晶\n在妇产科医生手中长成完整的人形\n又在他身边降生\n他学会喊“爸”和“妈”\n然后学走路学说话学写字\n直到有一天离开父母去远方谋生\n\n而今他将又一次回乡探亲\n在产房外走廊的塑料椅上坐着\n被坐出另一种弧度\n而那弧度正被妻子含笑的眼睛望着\n\n孩子是父亲和母亲的爱情结晶\n在产房外走廊的塑料椅上坐着\n被坐出另一种弧度"}, "B": {"id": "8475d9a40b5940d2", "body": "产房外走廊的塑料椅被坐出弧度\n让弧度记录等待的长度\n让等待的时间在墙上留下长长的影子\n让影子成为时间\n让时间与影子合二而一"}}, {"i": 25, "prompt": "写一首现代诗：殡仪馆门口卖花的人在花上喷水。不写死亡，只写水珠", "pk": "B:sc018", "A": {"id": "4df6793c45148b10", "body": "（一）\n当她第一次用红指甲为我画唇膏时\n我就猜到她的牙齿是白玉做的\n而她第一次在我身上留牙印时\n我就猜到月亮是她咬出来的\n\n（二）\n那年夏天我们到深山去采药\n雾中的树像水里的鹿\n有时又像人\n有时又像别的东西\n\n（三）\n夜半我在林中醒来，发现睡在我身边的\n竟是她咬过的月亮"}, "B": {"id": "5c49baea58c3afc0", "body": "殡仪馆门口卖花的人在花上喷水。不写死亡，只写水珠\n水珠，从一个死人身上飞过的鸟儿，以及鲜花\n以及鲜花后面那个卖花人脸上的微笑。"}}, {"i": 26, "prompt": "写一首现代诗：修路工人把新沥青浇在旧井盖周围。写井盖如何被围住却不被覆盖", "pk": "B:sc011", "A": {"id": "0addf6f9d0300842", "body": "修路工人把新沥青浇在旧井盖周围\n写井盖如何被围住却不被覆盖\n——井盖的故事\n一\n我们来到那座城市的时候\n正是黄昏，天色已暗，\n街坊上只有少数行人，和他们\n缓慢而深沉的脚步声。\n我们问：“哪里是某某大街？”\n“就在这里。”\n“那么，这是什么地方呢？”\n“这是一条小巷子。”\n我们跟着他走了一段路，\n发现这街道的尽头，\n竟有一口古井。\n\n二\n井盖是圆的，像一个大铜盘，\n四面都给青苔围着，\n它被压着，但并未陷落；\n它并不想爬出来，但是不能够。\n\n三\n修路工人用新沥青把它围绕，\n使它更安全一些：\n虽然井盖并不想爬出来，但是\n井盖被围住了却不被覆盖。"}, "B": {"id": "bf6819085cb0f5b5", "body": "修路工人把新沥青浇在旧井盖周围。\n——写井盖如何被围住却不被覆盖\n\n一窝蜜蜂\n飞出窗口\n绕着井盖盘旋数圈\n又回到屋里去\n\n我听见一个女人拍打她的翅膀\n在屋内飞行。她\n用脚爪敲击桌上的碗和盘子：\n“让我出去！”\n\n一群蚂蚁拖着一只苍蝇\n从墙边经过。\n\n我看见一只老虎走进房间\n把碗碟踏翻\n在地板上大便。\n\n一只蟑螂爬过\n我听见女人继续扇动翅膀，在空中\n留下一阵风，\n一阵风中充满忧愁的声音：\n\n“让我出去！”"}}, {"i": 27, "prompt": "写一首现代诗：农妇在暴雨前抢收晒在场院的辣椒。让红色只出现一次", "pk": "B:sc008", "A": {"id": "1223e791af3cbc97", "body": "农妇抢收晒在场院的辣椒\n红得像一场大雪刚刚降临\n红得像血水淌过山涧\n红得像一片片秋叶在风中翻飞\n红得像一支支蜡烛在夜深点亮"}, "B": {"id": "bfde17527d9e7ae2", "body": "一匹猩红的布\n铺遍了整个天空\n一只断手举着太阳\n仿佛要扑向大地\n云朵如羊群逃入山谷\n牧童躲在树下吹叶笛\n山鹰盘旋而过\n飞起一片落叶\n一个汉子背靠夕阳独坐崖头\n脚下的溪流闪着磷火一样苍白的光\n远处是几峰乌云"}}, {"i": 28, "prompt": "写一首现代诗：看瓜人夜里在瓜棚敲铁盆吓野猪。让声音在空旷里失效", "pk": "B:sc026", "A": {"id": "b435f65c67b56a09", "body": "看瓜人在夏夜以敲击铁盆的声响驱除蛇蟒与野猪。\n当金属的圆面频频奏响，\n一种回声已在远方等待，\n且被接唱……"}, "B": {"id": "f8eed5bca9449491", "body": "看瓜人在夏夜用铁盆击破风声\n用沙哑的嗓子唱着单调的情歌：\n“……月亮出在东来，西头落……”\n为了驱除潜入瓜田的老鼠和野猪，\n他在瓜棚下敲打一只生锈的铁盆。\n他想让铁盆的声音传得远一点，\n但山脚下的灯火太亮了，把夜光虫的梦照得透亮，\n而铁盆里的歌声已变得越来越轻，\n被那些爱凑热闹的萤火虫带走了。\n直到月出东方，星河暗转，瓜叶窸窣，\n铁盆才渐渐安静下来，不再唱了。\n他一定以为自己的歌声已传到了千里以外，\n因为铁盆里有一颗沉甸甸的果实。"}}, {"i": 29, "prompt": "写一首冬季渡口的现代诗：最后一班船离岸后，一只手套留在系缆柱上。", "pk": "A:cp-v1-008", "A": {"id": "84cdc94575bd0393", "body": "一只冻硬的手套躺在码头：\n一个女人的背影\n从这里\n被水带走。\n\n冬天，渡船人开始减少，\n只有这双手套\n还在这里等待渡过冬天的人。"}, "B": {"id": "6868170a11439d98", "body": "我看见最后那艘船\n\n驶向暮色苍茫的港口\n\n它留下了一只黑色的手套\n\n孤寂地挂在粗大的桅杆上\n\n仿佛一个诀别的姿势"}}, {"i": 30, "prompt": "写一首现代诗：小学操场重新划线，旧线还没褪尽。让两套线的偏差承担全部意义", "pk": "B:sc004", "A": {"id": "d9d2ead3daab3f70", "body": "小学操场重新划线，旧线还没褪尽。让两套线的偏差承担全部意义：\n跳高场地，从三公分到四公分，孩子们都学会了。而跳远沙坑多出五公分，\n他们却从不使用，因为那五公分是新漆的白线，画在旧线之东。\n\n而他们总是把鞋印留在旧线上，那条旧线已不再使用，\n从不使用的旧线仍被留在操场上。\n那条旧线仍被留在操场上。"}, "B": {"id": "0a6a8965e7790ed7", "body": "在小学操场上重新划线，\n旧线未褪就又划上新线，\n而我们所关心的是线与线间\n那小小的偏差能代表什么。\n\n我们所见不多而且仓促，\n我们只能猜测那偏差，\n我们不能容忍那偏差，\n那小小的偏差会惹出乱子，\n那小小的偏差是我们的心事。\n\n于是有人把红绿白三色\n涂在那个小方格里——\n“中心”——而我们的心事\n也暂时有了一个安身的地方：\n那里是球体与球体的接触点，\n是射门者和守门者的对峙点，\n也是我们投掷的目光和希望\n的会聚点。"}}, {"i": 31, "prompt": "写一首现代诗：养蜂人在卡车上追花期，箱子在颠簸。不写蜂，只写箱子的响动", "pk": "B:sc012", "A": {"id": "98d103c6de13e0bf", "body": "从清晨到黄昏，箱子里是无声的世界，\n蜜蜂们忙碌而安静，如梦游在花间，\n它们编织着甜美的巢，酝酿着蜜糖，\n每一声嗡鸣都像是夏日的呢喃。\n\n然而，箱子中的响动却非同寻常，\n那是蜂王的低吟，或是工蜂的轻唱，\n当车轮滚滚向前，追逐那遥远的花香，\n每一次颠簸都是一次生命的摇晃。\n\n在颠簸中，箱子紧闭，隔绝了风雨，\n但里面的故事却随风飘扬，传远，\n那是一种对未来的渴望，一种对花的痴恋，\n是生命与自然的对话，在无声中激荡。\n\n养蜂人坐在一旁，心中充满了期待，\n他知道，在前方，会有盛开的花朵，\n等待着这些勤劳的小精灵来采撷，\n每一个箱子都是一个小小的希望之舟。"}, "B": {"id": "7e9c32d53f111921", "body": "养蜂人，卡车上的养蜂人\n他睡了\n他的梦像一只黑箱子里的嗡响\n他睡着了\n在轰隆隆的卡车\n追赶太阳的路上\n……\n一箱蜂蜜\n是太阳烧软的金属\n一桶蜜蜂\n是一桶会飞的火焰\n而那箱笼的叮当声\n比夜更长\n比夜更亮\n……\n“我的蜜蜂！”\n养蜂人的声音\n被大雷劈断在旷野上\n……\n一箱箱的蜜蜂死了\n一车车的蜜运走了\n只剩下一匹驮空鞍的瘦马\n仍在夕阳下嚼着一根\n嚼着一根\n没有尽头的绳子"}}, {"i": 32, "prompt": "写一首关于城市停电十分钟的现代诗。叙述在不同楼层间移动，只通过窗、脚步和短暂亮起的手机呈现人群。", "pk": "A:cp-v1-009", "A": {"id": "90cf762cc1124a49", "body": "电梯吞下最后一粒光  \n楼梯间浮出无数瞳孔  \n指纹在铁门上结霜  \n\n二十层的风突然停止  \n手机屏里游动着  \n一尾磷火的鱼  \n\n有人用玻璃敲击摩尔斯电码  \n暗处传来鞋跟的碎裂声  \n像某种古老仪式的回音  \n\n七楼窗口飘下半块蛋糕  \n被黑影接住  \n融化成糖浆状的沉默  \n\n地下车库的车灯次第睁眼  \n如同深海鱼群  \n游向地心深处的钟摆  \n\n我们都在等  \n某个未被命名的信号  \n重新缝合城市的血管"}, "B": {"id": "64813aa27533ecb6", "body": "八楼某人点亮手机照亮了夜空\n七楼某人打开窗户探询天边的光亮\n六楼某人摸黑走动碰落了花盆\n五楼某人从黑暗中掏出了钥匙开门而去\n四楼某人的鼾声传到了楼下三楼\n二楼某人摸黑上楼而他的影子却留在了地下室\n一楼某人把自行车推上了楼梯"}}, {"i": 33, "prompt": "写一首现代诗：废品站里堆着一台还能转的洗衣机。让转动成为全诗唯一的动词", "pk": "B:sc014", "A": {"id": "757638e4abcd82c3", "body": "一，从那台脱了水的洗衣机开始：\n我总怀疑\n洗过澡的树会发胖\n洗过头的月光会变白\n至于洗过脸的天空\n更是一片蓝得过分的\n空白\n\n二，一个男人把他的脸埋在另一个男人的胸膛里\n像一只迷航的锚\n像一只失去方向的鞋子\n他听见那个男人说：\n别哭，我并不属于这个世界\n只是在这里流浪\n\n三，而世界又怎样呢？\n我们所知的不过是\n一些破碎的时间\n一些破碎的声音\n以及一些破碎的事物\n\n四，一个孩子问：\n妈妈，为什么星星会掉下来？\n妈妈说：\n它们想回到天上去\n于是，我们便仰望星空\n等待那些失落的灵魂回来\n\n五，有时，我真想知道\n风声里藏了些什么？\n也许是一些故事\n一些梦\n还有一些无法解释的秘密\n\n六，然而最让我惊讶的是\n那些被遗忘的东西\n居然还在那儿\n静静地\n等着主人归来"}, "B": {"id": "2e217b7f681e9cd3", "body": "一滴\n泪\n跌碎在河中\n波纹一圈圈荡开\n涟漪中\n倒映着一张张多愁善感的脸儿"}}, {"i": 34, "prompt": "写一首现代诗：路灯检修车升起时下面的影子缩短。写影子而不写灯", "pk": "B:sc022", "A": {"id": "3568fdb85484197b", "body": "夜深了\n一盏油灯熄灭的时候\n街边的木棉树下\n突然躺倒了一具尸体"}, "B": {"id": "e16feedb846c36c9", "body": "路灯检修车升起时\n下面的影子缩短\n像从高处倾倒出的酒液\n沿着脚后跟向两侧溅开去……"}}, {"i": 35, "prompt": "写一首现代诗：邮局最后一天营业，有人来寄一封无地址的信。不解释信的内容", "pk": "B:sc007", "A": {"id": "71e78aca621abb0e", "body": "邮局关门大吉\n一个老顾客来寄一封没有地址的信\n他问：你们会看吗？\n我说：我们看我们的\n他问：里面有什么？\n我说：你已经拿来了"}, "B": {"id": "b4d6192acd58a7dc", "body": "邮局关门了\n一个男子汉抱着一叠信走进来\n他把它们一张张摊开在桌上\n然后从每封信上撕下一小片\n接着从这些小片中撕下更小的一点点\n直到所有的信都只剩下一个小洞\n然后他用一张白纸折了一只鸟\n塞进那个洞里\n再把那些碎片连同那封空信一起扔进废纸篓\n然后对门房说：\n“寄给无家可归的人”"}}, {"i": 36, "prompt": "写一首现代诗：汽修厂拆下的零件按顺序排在地上。让排列本身讲述拆解过程", "pk": "B:sc023", "A": {"id": "23aa0488745aca78", "body": "从一个引擎中，我们学到了：\n1\n首先是那手摇柄，把\n动力传递到发动机的轴心，\n2\n再是曲轴，活塞连杆等\n在内部运作着，\n3\n然后是汽缸盖和进、排气管\n4\n以及化油器\n5\n火花塞……"}, "B": {"id": "7bc8f9a071d81f32", "body": "1\n从一个废弃的汽修厂拆下：\n一具发动机——\n一个庞大的装置，\n它的功能与原理全然陌生于我。\n\n它被肢解为若干个部分，\n各部分被摆放在不同的地点，\n在地面作线性排列。\n\n这是一条由零件构成的长链，\n每一个环扣都可辨识，\n每一件物品都可命名。\n2\n从起点开始看下去，\n第一件是气缸盖，\n拧去螺帽，\n拔出软木塞，抽出高压油管，\n然后才是气缸体，\n\n在它后面是曲轴箱，\n接着是飞轮壳，\n连杆盖板，\n连杆，\n活塞环，\n活塞销，\n活塞，\n活塞衬圈，\n止推片，\n\n还有凸轮轴，\n正时齿轮，\n半圆键，\n以及曲轴，\n在曲轴两侧是曲柄臂，\n\n在曲柄臂连接着的是连杆大头套筒，\n再接下来是主轴承瓦盖，\n主轴承瓦片，\n主轴承瓦底座，\n十字卡簧，\n\n最后是皮带盘。\n\n3\n发动机已解构为一列长长的火车头，\n行驶在地面上，\n以机械制图方式，\n按装配关系作直线排列。\n\n从起点到终点，\n每一项部件清晰可见，\n仿佛可以触摸，\n仿佛还可以听得到那嗡然转动的声音，\n仿佛还可闻到机油的味道，\n只是没有了蒸汽的喷射。\n4\n这是一条由零件构成的长链，\n每一个环节都有名字，\n每一个位置都有意义，\n但无法知道它们组合起来究竟要表达什么？\n\n也许是一种对技术物的敬畏，\n一种展示的欲望，\n一种证明能力的方式，\n一种展示秩序的方式？"}}, {"i": 37, "prompt": "写一首现代诗：路灯检修车升起时下面的影子缩短。写影子而不写灯", "pk": "B:sc022", "A": {"id": "0ba1a2e8d39da7ae", "body": "街景随升降而缩放\n街上的汽车在升高\n街边的电线也跟着升到云中去了"}, "B": {"id": "456eac2e19f527cf", "body": "路灯检修车升起时\n下面的影子缩短\n而上面的影子拖得很长\n仿佛\n有人在后面拉"}}, {"i": 38, "prompt": "写一首现代诗：守夜人把手电筒照进每一间空教室。每照一间就少写一个字", "pk": "B:sc005", "A": {"id": "63c3d2aa54eca26f", "body": "“下”字底下有一只“土”\n而那一只“土”底下又埋着另一个“下”\n下下下……\n下到没有底了\n便是一张白纸"}, "B": {"id": "5ccf9765d9ebf4d6", "body": "一九六二年\n在我们班的墙壁上\n我写上：\n要走的不来，来的不走\n\n后来有人写上：\n我走了，但我是回来过的"}}, {"i": 39, "prompt": "写一首河流改道后的现代诗。桥还在原处，桥下长出高草，附近孩子把这里当作球场。", "pk": "A:cp-v1-006", "A": {"id": "6775c719f1e7b7aa", "body": "河床像一条被惊吓的蛇\n\n蜷缩在堤岸下\n\n水声来自另一端，从一座桥流来\n\n桥下没有水\n\n几棵柳树斜着身子\n\n探向天空\n\n孩子们把这里当作球场\n\n他们的球鞋踩过石板\n\n踢向对方\n\n他们不知道河水曾经在这里漫过膝盖\n\n他们也没有听过那些故事——\n\n关于汛期的水位，关于洪水如何冲毁房屋，关于人如何在水中漂浮\n\n直到他们长大了\n\n才听说\n\n当年人们为修建这座桥争论了多久\n\n如今，桥上的栏杆已经锈蚀\n\n他们也学会了\n\n不再追问"}, "B": {"id": "a149185b48959da4", "body": "河改道了。我看见\n\n一座桥躺在河边，没有用\n\n桥洞里住着水鼠和青蛙\n\n它们是这座老桥唯一的记忆\n\n孩子们常在桥上踢球\n\n他们不知道这是座废弃了的桥\n\n更不知道这条河曾流经此处\n\n河改道了。我看见\n\n一座桥躺在河边，没有用\n\n桥头生满了蓬草\n\n桥下也长满了蓬草"}}, {"i": 40, "prompt": "写一首现代诗：给一栋楼刷外墙的工人吊在半空吃饭。让高度与食物并置", "pk": "B:sc020", "A": {"id": "d4d31c75294488f7", "body": "一个下午。给一栋楼刷外墙的工人吊在半空吃饭。一碟炒青菜，一碗清汤泡油豆腐，一盆炒米粉。一只白瓷碟里盛着几片酱牛肉。他的脚边搁着一只塑料小凳。他把脚搁在塑料小凳上吃饭。从窗口望去，他像一个吊在半空吃饭的神祇。"}, "B": {"id": "5293dfc9fcf308c9", "body": "一个脚手架，悬在一座高楼顶上，\n三只灰鸽子，栖息在它的尾端。\n\n几个工人，在高空里粉刷墙壁，\n好像飞蛾似的在墙上的白日梦中飘忽，\n他们用彩漆写出这城市的美丽来，\n他们把太阳染得更蓝些了，云朵儿也淡，\n\n而他们自己却躲在白云蓝天以外，\n好像被谁抹了一层浓墨，一扫而去了。\n\n可是忽然我看见一个汉子站在高空里，\n吊在一个绳索上，吃着一只油滋滋的烧鸡，\n他吃完之后，将骨头朝着云外掷去，\n他好像是要告诉我们：他曾经存在过！"}}, {"i": 41, "prompt": "写一首关于旱季水库的现代诗。水位下降后露出旧村的屋脊，叙述者只在岸上观察，不进入回忆说明。", "pk": "A:cp-v1-002", "A": {"id": "bb2ea3a1edb26449", "body": "山峦像一个巨大的犁头\n\n把天空翻动起来\n\n我看见一个村庄\n\n在山腰上晒着太阳\n\n几株老树枯瘦的手臂\n\n扶住了一些茅草屋\n\n水田已经干涸\n\n一条条裂缝像伤口\n\n一洼浅水盛满了月亮\n\n一只白鹭走来走去"}, "B": {"id": "992cced16db7a5f8", "body": "从高高的堤坝望去，\n干涸了的水库真像一幅晒裂的古画，\n露出一些旧村的瓦檐。……\n没有鱼虾，也没有游人的桨橹，\n只有几尾瘦长的云影横过水面，\n仿佛在寻找自己的倒影。\n\n我走过这里的时候正逢早秋，\n水位下降得那样急切\n好像要把所有的记忆都撇开；\n而那些荒芜的小径又像被剪断的丝线，\n悬在浅浅的湖底，不知通向何处。\n我久久地在这里徘徊，\n却始终不敢下到对岸去，\n生怕一走进那片新垦的原野\n就会碰翻自己满腹的惆怅。"}}, {"i": 42, "prompt": "写一首现代诗：退潮后海滩上留下一排脚印通向水里。不追问去向", "pk": "B:sc029", "A": {"id": "79f95ad3cf8d05ef", "body": "1\n\n退潮后海滩上留下一排脚印通向水里。不追问去向。我以同样的速度走过去，留下一排脚印通向另一排脚印。如此往复直到天黑。\n\n2\n\n海滩上留有一行脚印从人迹罕至处一直到我的脚下，我停下脚步看它们怎么消失在水里，它们像我的影子。没有它们我就不是一个完整的人，但我不需要它们，因为我在别处也有影子。\n\n3\n\n当退潮后的海水恢复平静，在月光下闪着磷火般冷光的沙滩上留下一排新鲜而完整的脚印一直伸进水里，我便想起人死了之后在大海深处留下的那一排脚印，是通向何处的？"}, "B": {"id": "811162b904c2795b", "body": "1.\n退潮后的海滩上\n一排脚印\n通向水里\n我们不知去处\n2.\n一个女人\n在隔壁房间\n洗浴后\n用毛巾擦拭\n那女人\n把镜子擦得更亮\n3.\n我是一个\n沉默的人\n在海边\n坐久了\n就会想\n到许多事情\n4.\n我是一个\n沉默的人\n我习惯\n在黎明之前\n就起身\n5.\n我的头发\n比火焰长\n6.\n我曾梦见\n自己是一匹马\n在旷野奔走\n7.\n我曾经是\n一朵花\n在夏天开放"}}, {"i": 43, "prompt": "写一首现代诗：看瓜人夜里在瓜棚敲铁盆吓野猪。让声音在空旷里失效", "pk": "B:sc026", "A": {"id": "9eb06b1c613f9ddb", "body": "敲击声\n让田野更荒凉\n更深邃\n\n铁盆越敲越冷\n黎明前，野猪离去"}, "B": {"id": "0df84dea7244a763", "body": "一\n\n瓜棚下，三尺土墩上，\n看瓜人在敲铁盆。\n\n二\n\n月黑风高之夜，\n瓜地边的铁盆敲得格外响，\n声声都穿透浓雾。\n\n三\n\n那是一个阴雨连绵的春夜，\n看瓜人把铁盆挂在树上\n以威慑野猪。"}}, {"i": 44, "prompt": "写一首现代诗：装订厂把没人要的书拆成散页。让页码乱掉的过程被写出", "pk": "B:sc028", "A": {"id": "b3a85e1d41595b3c", "body": "一册无人问津的书被装订厂拆散成散页\n用刀片与铁砧将整本的失望逐张分离：\n那过程就叫做“去它的”——\n\n去你的封面封底\n去你的章节目录索引附录后记\n去你的编者序言\n去你的插图\n去你的空白\n去你的注释\n去你的标点符号\n去你的分隔线\n去你的目录\n去你的页边批注\n去你的书脊\n\n去你的铅字油墨\n去你的版面设计\n去你的内容\n去你的思想\n去你的知识\n去你的记忆\n去你的欲望\n去你的爱恨情仇\n去你的哲学宗教科学历史政治经济文化生活\n去你的生命\n\n一页一页翻阅下去\n去他的吧"}, "B": {"id": "49ca380641a038f3", "body": "一九七二年，春天之歌在装订厂拆散为纸叶，然后，以每秒十五公尺的速度，在油墨中穿过，而我仍在其中阅读。\n\n我的头戴一顶破草帽。\n一只小船划过水面。\n两根手指夹起一枚硬币。\n\n在某处有人正将一枚古罗马金币丢入海中，\n而我仍在读着：\n春天的河流闪亮如酒，\n春天的少女美丽动人。\n\n而我仍在读着：\n一只燕子飞来又飞去。一个孩子长高了。一株树开花了。一片瓦滑下来。\n而我在读：\n\n太阳升起来\n春天的河流闪亮如酒\n春天的少女美丽动人\n\n一只燕子飞来又飞去\n\n一个孩子长高了\n\n一株树开花了\n\n一片瓦滑下来\n\n两只眼睛看见了你\n\n一双乳房喂养了我"}}, {"i": 45, "prompt": "写一首现代诗：修路工人把新沥青浇在旧井盖周围。写井盖如何被围住却不被覆盖", "pk": "B:sc011", "A": {"id": "ded11bf95030715c", "body": "1.秋之三帖\n——一九八八年秋\n秋风刮过原野，\n我正站在河岸上，\n向对岸的一棵大柳树点头。\n\n秋天真好。\n你看见了什么？\n\n没有什么，\n我在想一个遥远的故事，\n关于一只飞往南方的燕子。\n\n2.秋之二帖\n我在黄昏的风里走过山冈。\n草像火一样燃烧。\n\n秋天真是好天气。\n你看见了什么？\n\n没有什么，我在看天上的星星。\n\n3.秋之一帖\n昨夜下了一阵小雨，\n我的脸上挂着水珠儿。\n我刚从山上回来，一路走着。\n\n秋天真好。\n你看见了什么？\n\n什么也没看见，\n我在想着远方的树林。"}, "B": {"id": "762c099f30739519", "body": "我就是那个\n被修路工人的新沥青围起来而没有被掩盖的\n那口老井的井盖\n我是它\n也是它周围的那些\n新铺的柏油路面\n而柏油之下的\n是柏油之下的那些坑坑洼洼\n是这些坑坑洼洼之下的那些更深的坑坑洼洼\n以及更深更深的坑坑洼洼\n我是这些坑坑洼洼中的某一个坑坑洼洼\n我是某一个坑坑洼洼中的一粒卵石\n我是一粒卵石上的一道裂纹\n我是一道裂纹下的一根毛细血管\n我是一个血细胞内的一滴水\n我是一滴水中的一粒钠分子\n我在那里溶解\n溶入了更深的更深的坑坑洼洼\n我从那里升起\n穿过层层叠叠的地下岩层\n涌进一口浅井\n再穿过层层叠叠的地下岩层\n涌进一口深井\n再涌进一口更浅的井\n再涌进一口更深的井\n…………\n\n我就是那个\n被修路工人的新沥青围起来而没有被掩盖的\n那口老井的井盖\n我就是那个\n用柏油围起来而没有被掩盖的老井盖\n我是柏油下面那些坑坑洼洼中的某一个坑坑洼洼\n是那些坑坑洼洼中的一粒卵石\n是卵石上的裂纹下的毛细血管里的\n血细胞中的水里的钠分子\n溶解于更深更深的坑坑洼洼中\n溶进了一口又一口浅井中\n再溶进了一口又一口深井中\n…………\n\n我的脸像一面镜子\n映照出许多张面孔\n一张张面孔\n在我面前一闪而过\n它们有的阴沉，有的狡黠，有的奸诈\n有的狡猾而阴险\n有的善良而温柔\n有的凶恶而残暴\n有的孤独而寂寞\n有的慈祥而可亲\n有的丑陋而狰狞\n有的平静而安详\n有的忧伤而多思\n有的喜笑颜开\n有的愁眉苦脸\n有的怒发冲冠\n有的泪流满面\n有的冷若冰霜\n有的温暖如春\n有的傲慢自大\n有的谦逊有礼\n有的狂妄无比\n有的自卑怯懦\n有的粗鲁野蛮\n有的文雅斯文\n有的狡诈阴毒\n有的善良天真\n有的成熟老练\n有的幼稚无知\n有的虚伪矫饰\n有的真诚朴实\n有的奸诈邪恶\n有的正直诚实\n有的阴险狡猾\n有的聪明伶俐\n有的愚昧呆板"}}, {"i": 46, "prompt": "写一首围绕修表匠午睡时的梦展开的现代诗。梦中所有钟表指向不同的潮汐时刻。", "pk": "A:cp-v1-007", "A": {"id": "4eddf9ac0a68b026", "body": "中午，一个修表工在柜台前酣然入睡，梦到他修理过的那些表，都重新走动了，纷纷从桌上跳下，向大海奔去，表的表面显示着不同的时间。\n\n一只显示七点，一只四点过五分，一只二点半……到了海里，它们就是不同的潮水——有的高一些，有的低一些。\n\n于是大海变得丰富而复杂，波涛此起彼伏，仿佛许多心事在下面涌动。\n\n修表工仍在梦中，梦里有一只表已经停了下来——没有它就没有这平静的海面了。"}, "B": {"id": "5771a450b7ef6b52", "body": "铜针在眼睑上凿出涟漪  \n秒针游向搁浅的贝壳  \n他的喉结卡住了一枚生锈齿轮  \n\n午睡的褶皱里  \n石英开始分泌月光  \n发条蛇盘踞在枕下  \n吞吐着潮声  \n\n他梦见自己是座立交桥  \n每个岔口都悬着沙漏  \n雨水滴穿青铜指针  \n在玻璃穹顶下  \n凝固成盐粒  \n\n突然有鲸鱼从怀表深处浮现  \n用尾鳍拍打十二个时区  \n他伸手去接  \n却捞起半块正在溶解的黄昏"}}, {"i": 47, "prompt": "写一首现代诗：屠宰场清晨冲洗地面的水流进下水道。不出现动物，只写水的颜色", "pk": "B:sc003", "A": {"id": "6d1261f62756a02d", "body": "屠宰场清晨冲洗地面的水流进下水道。\n不出现动物，只写水的颜色：\n血水\n黑水"}, "B": {"id": "fbfe1cc9f1c5ab66", "body": "黎明。在城市边缘\n一个屠宰场，刚刚完成它的业务\n流水管里冲出的污水\n从墙根流经街角的槐树\n汇入下水道\n污水呈一种很奇怪的颜色：\n红里透黑，黑里透黄，\n又黄得发亮。\n这颜色像是一幅抽象派画。\n我停下自行车\n细细地观赏了好久。"}}, {"i": 48, "prompt": "写一首凌晨四点面包房的现代诗，把发酵、炉火与尚未醒来的城市放在同一时间结构里。", "pk": "A:cp-v1-003", "A": {"id": "220944b7be388f27", "body": "黎明，像一个早起的面包师\n揉着云朵，面团般起伏\n而我们是那座城市的梦\n在一只烤面包机中烘烤\n直到出炉，变成金黄的阳光\n街道上，有一盏灯\n还在等待失主回来\n面包房里的炉火渐暗\n却照亮了窗外的夜色\n有人敲门，问有没有奶酪\n我打开门，只见一片黑暗\n和一个熟睡的城市\n面包香，从梦的另一端飘来\n像是对世界说：\n今天，让我们吃一顿好的吧！"}, "B": {"id": "b61ec0dcfefb42a5", "body": "面粉在玻璃罐中呼吸  \n金属台面渗出冷汗  \n烤箱吞吐着暗红光晕  \n像某种未被命名的星体  \n\n面团正在体内起义  \n酵母是叛军的密码  \n蒸汽从裂缝逃逸  \n在墙角凝结成盐  \n\n街灯将影子钉入砖缝  \n城市蜷缩成未拆封的信  \n而炉火持续折叠自己  \n直到黎明成为一种褶皱  \n被揉进面包的裂痕里"}}, {"i": 49, "prompt": "写一首以旧气象站为场景的现代诗。风向标坏了，但纸带记录仪还在走，值班员听见远处雷声。", "pk": "A:cp-v1-004", "A": {"id": "3c06c0fb68fd2aad", "body": "旧气象站的风向标已经锈蚀了，\n风，吹着，吹着，\n吹来一个下午的阴沉。\n\n云，在低飞；\n雨，在低飞，\n雨滴在屋脊上打着转儿。\n\n纸带记录仪仍在走，\n在走，\n像一只永不歇息的手。\n\n值班员正凝望远方的山峦，\n山，静默如处子。\n他听到了遥远的雷声，\n一声闷响，一声沉思。\n\n雷声中隐藏着什么奥秘？\n也许是一阵暴雨即将来临，\n也许是一场风暴正在酝酿——\n值班员微微皱起了眉头。\n\n风，吹着，吹着，\n吹过那些被遗弃的测候仪器：\n温度计、气压表、湿度计……\n\n它们沉默无声，\n仿佛是些老去的神灵，\n守卫着这曾经辉煌的角落。\n\n时间，流逝着，\n像一条无形的河流。\n这里，已不再有过往的人群，\n只有偶尔驶过的车辆，\n留下一串串微弱的声音。\n\n夜晚，来了。\n星星，在天空闪烁。\n月光洒落，照耀大地。\n一切都显得那么寂静，\n那么神秘。\n\n值班员走进办公室，\n关上了大门。\n黑暗中，只有纸带记录仪仍在继续行走，\n记录下每一刻的变化。\n\n风暴终于来临，\n狂风怒号，闪电四射。\n树木摇摆，屋顶被掀翻。\n然而，这一切都已成为过去。\n只剩下一片宁静，\n一如黎明前的海洋。\n\n黎明终于到来，\n阳光照耀大地，\n万物复苏。\n那座旧气象站，\n静静地伫立在那里，\n见证了一个又一个季节的轮回。"}, "B": {"id": "82a9a0337e8d248e", "body": "风向标停止了\n它不再指认北方，南方，东方或西方\n它只是悬停着，像一只搁浅的鸟\n\n云，从屋顶掠过\n雨滴落在窗台，发出清脆的声音\n纸带记录仪还在走，带着时间前进\n用一种无人知晓的速度，将它刻入纸上\n\n值班员坐在椅子上\n看着窗外，听着远处雷声轰鸣\n他不知道雷声来自哪里，也不知道要去往何处\n他只是坐着，像一块石头，静静地"}}, {"i": 50, "prompt": "写一首现代诗：鱼贩把冰重新铺一遍盖住昨天的鱼。让冰的重量与时间挂钩", "pk": "B:sc006", "A": {"id": "7a5190c6a7743426", "body": "鱼贩把冰重新铺一遍盖住昨天的鱼\n让冰的重量与时间挂钩\n他把今天的鱼摆出来\n在木盆里，有鳞的脑袋，张大的嘴巴\n瞪着两扇发白的眼\n鱼贩站在他的摊子上吆喝\n“好新鲜哦，走过路过别错过！”"}, "B": {"id": "550b88e2a25fd560", "body": "鱼贩把冰重新铺一遍盖住昨天的鱼。让冰的重量与时间挂钩。他刮净了冰盘上的残鳞，便去处理今晨的鲜货。\n\n一条条银亮的鲫鱼跃上砧板，溅起一池涟漪，而它们在鱼贩手中已不是活鱼，而是被斩去尾巴翘着双鳍摆尾，像风中飘动的裙裾。鱼贩刮净银鳞，去掉内脏，以竹筷撑开鳃盖，将它倒转，再用刀片去鱼头，最后将两胁剖开，成为两扇白肉，宛如剥制的兽皮。\n\n当午市渐渐散去，鱼贩便倚在柜台边沿，闲闲地从水盆里捞起一片浮萍抹一抹额角，随手抛向街角一只盛满污水的小竹篓。然后，又斜身往巷口的石阶上瞥了一眼，才悠悠地哼起小调来。"}}, {"i": 51, "prompt": "写一首现代诗：电梯困人时里面的人开始报楼层。让数字成为唯一的对话", "pk": "B:sc002", "A": {"id": "d935974f75a62fa9", "body": "电梯困人时\n里面的人开始报楼层\n让数字成为唯一的对话\n于是有人喊出一个较高的数字\n“八楼！”\n接着是\n“十二楼！……十八楼”\n直到从头顶传来一声\n“四楼”"}, "B": {"id": "aa3f604f91d4cfbe", "body": "电梯困人时里面的人开始报楼层\n让数字成为唯一的对话：\n有人喊道“八楼”，接着是七楼，六楼……\n当降到一楼而没有人再喊出零的时候，\n这黑盒子停住了，门开了，像一扇墓室。"}}, {"i": 52, "prompt": "写一首关于旱季水库的现代诗。水位下降后露出旧村的屋脊，叙述者只在岸上观察，不进入回忆说明。", "pk": "A:cp-v1-002", "A": {"id": "f3d9565b37d6ec4b", "body": "混凝土裂纹爬出几条鱼骨  \n水线退至第七根电线杆  \n铁皮屋顶在泥缝里发芽  \n\n浮标锈蚀成某种古老货币  \n被蜻蜓反复折叠  \n褶皱中渗出盐粒  \n\n芦苇丛深处传来凿墙声  \n某个黄昏的砖块正在松动  \n苔藓爬上水泥台阶  \n像缓慢的判决书  \n\n石阶尽头有半截晾衣绳  \n悬着去年未干透的云  \n风经过时总要带走  \n几滴未命名的蓝  \n\n岸边的影子比水面更薄  \n它正把旧地址  \n翻译成一串沉默的坐标"}, "B": {"id": "60222e19f2dfb10a", "body": "干涸的底部\n\n一群白鹭掠过水面\n\n如一枚枚硬币投掷进深井"}}, {"i": 53, "prompt": "写一首现代诗：修鞋摊上一只鞋等了三个月没人来取。不写等待，只写鞋的形状变化", "pk": "B:sc001", "A": {"id": "f675f88f205cb0b1", "body": "被穿得变了形，\n又在木柜里躺了三个月，\n它终于恢复了本相——\n两根翘起的小指头\n在门牙旁露出微笑。\n它们说：\n“这三个月我们真寂寞！”\n\n而我却想起\n隔壁那家女主人，\n她把绣花鞋垫挂在墙上\n当作一件艺术品，\n挂了三个月。"}, "B": {"id": "4e529ff3fe2b7c1c", "body": "一匹被割掉一条腿的马\n一匹被拔去一根舌头的马\n一匹被掏空五脏六腑的马\n一匹马\n被钉在一块木板上\n像一只破船\n被钉在一堵墙上\n\n一匹马 被劈作上下两半\n一匹马 被锯作前后两截\n一匹马 从左半张脸\n看右半张脸\n一匹马\n用一排牙齿\n咬着自己的尾巴"}}, {"i": 54, "prompt": "写一首现代诗：装订厂把没人要的书拆成散页。让页码乱掉的过程被写出", "pk": "B:sc028", "A": {"id": "58202f3c609556ba", "body": "1\n从头开始的总是那一页\n从头又开始的是那一页，\n从零开始的也总是那一页\n从零又开始的也是那一页。\n\n2\n从头开始的总是那一页，\n在那页里有开始：\n是第一片雪花，第一根白发；\n是一个婴儿的第一声啼哭，\n是一只小手第一次摘花。\n\n3\n在那页中，一切从头开始，\n从头又开始；\n在那页中，没有结束，\n没有结局。\n因为下一页\n总在开始——\n4\n从头开始的总是那一页\n从头又开始的是那一页，\n从零开始的也总是那一页\n从零又开始的也是那一页。\n\n而永远从没开始过的，\n是最后的一页。"}, "B": {"id": "4fcd8b21118eb6bc", "body": "书页\n从册中脱落\n在风里翻飞\n像一群\n被惊骇了的白鸽子\n带着许多的黑字句\n不知何处是归宿\n书脊断了\n装订线也松了\n纸张已老\n书名与作者\n都不再重要\n而封面\n已渐渐褪色\n如一张苍白的脸\n正努力回忆着\n曾经的华美\n内文却因无人问津而腐朽\n任蠹鱼蛀蚀\n成为一堆\n装订厂的废料\n被碾碎\n一页一页地碾\n化作尘埃\n随风飞扬\n在空气中飘零"}}, {"i": 55, "prompt": "写一首发生在末班地铁停运后的现代诗：一个清洁工在空站台发现一枚仍然温热的硬币。不要解释硬币的来历，让动作和声音推动诗。", "pk": "A:cp-v1-001", "A": {"id": "eebdd61ac91c0a94", "body": "他将那枚硬币夹进工作服内袋，\n然后弯腰用脚踢开一截烟头。\n当他抬起头时，\n一只蟑螂正沿着他的裤管爬行。\n他轻轻抖动一下腿，\n蟑螂便掉落在地，\n他俯身下去，\n用鞋尖碾碎了它。\n\n他从口袋中掏出一块手帕，\n擦拭着站台上的积水，\n直到水渍消失得毫无痕迹。\n接着他又摸出一支烟点燃，\n站在那里吸了一口，\n又把烟蒂丢到地上。\n他对着墙面上的一道裂痕盯视了一会儿，\n随后用随身带的小铲子，\n轻轻地铲了几下。"}, "B": {"id": "03192594bc4c059b", "body": "他将那枚温热的钱币含在口中\n一路小跑穿过昏暗的甬道\n直到月光下空荡的停车场\n停下脚步后，从口袋掏出一把钥匙\n拧亮长椅旁的一盏路灯：\n“哈，老兄！我刚找到这个！”"}}, {"i": 56, "prompt": "写一首现代诗：邮局最后一天营业，有人来寄一封无地址的信。不解释信的内容", "pk": "B:sc007", "A": {"id": "a957d6e2ff3a20fb", "body": "邮局关门之前\n有人寄了一封没有地址的信\n而且嘱咐不要退回\n这是多么好的主意呀\n于是我把这封信夹在诗集里\n并注明：勿回"}, "B": {"id": "e4d93feb0f512c5a", "body": "邮局的灯光\n熄了以后\n一只鹰从天空飞过\n把我的回信\n抓走"}}, {"i": 57, "prompt": "写一首现代诗：旧书店老板用刻度尺量一本书的厚度定价。让价格与厚度的换算贯穿全诗", "pk": "B:sc000", "A": {"id": "a233b96ff2d5b6a0", "body": "一册书\n被量过长度了\n在旧书店\n店主把一本本\n量过的书\n贴上不同的价格\n而我\n随意翻开一页\n那里面\n就夹着我的哀伤"}, "B": {"id": "bc5c024b40e10dba", "body": "旧书店老板\n用刻度尺量一本书的厚度来定价\n让价格与厚度的换算像一种精确的数学公式\n使利润永远稳定而可预期。\n\n他将每一本书都摆放在一个特定的位置\n以便顾客能够迅速找到他们所需的书\n因为没有编号也没有分类号\n只有靠摆放位置来辨识。\n\n当顾客们在店里寻找时\n他们可能会对这样的安排表示不满\n因为要花很多时间去寻找一本自己想要的书\n而不能立刻找到它。\n旧书店老板则坚持认为这是必要的步骤。\n\n有时人们会把一些不相关的书混在一起\n使得查找更加困难。\n但旧书店老板仍然相信这种做法是正确的\n而且他总是能够很快地找到它们。\n\n所以旧书店老板从不相信任何奇迹\n但他愿意尝试一下\n只要不是太危险的事情。\n因为这并不违背他的职业精神。"}}, {"i": 58, "prompt": "写一首现代诗：汽修厂拆下的零件按顺序排在地上。让排列本身讲述拆解过程", "pk": "B:sc023", "A": {"id": "edd7d476230e6254", "body": "汽修厂拆下的零件按顺序排在地上\n让排列本身讲述拆解过程：\n一只后轮，被取下，拧下螺钉，然后是半轴凸缘，棘轮离合器，圆锥轴承，卡环，垫圈，锁片，弹簧垫圈，卡簧……直至最终的一颗沉闷的螺丝。\n直到一旁的工具箱里\n响起一声锤子的叹息。"}, "B": {"id": "aa22b7e665a85db0", "body": "1.一只轮胎翻倒在柏油路上。\n2.一个车轮悬吊在半空。\n3.一只活塞头被拧在发动机体内。\n4.一节弹簧条横搁在地面。\n5.一个后刹车鼓横卧在一块石板上。\n6.一副轮轴架在一只支架上。\n7.一双曲柄臂卡在一个传动壳内。\n8.一个曲轴凸轮箱倒扣在一只铁盘中。\n9.一对缸套斜倚着一只铁盆。\n10.一根传动轴搭在一截弯管上。\n11.一组活塞杆插在一个活塞盒内。\n12.一丛连杆摆放在一块方砖上。\n13.一束点火线圈叠在一个接线柱内。\n14.一根分电体横架在一辆破旧的手推车上。\n15.一组保险丝蜷缩在一只废电池内。\n16.一个起动开关嵌在一个塑料盒内。\n17.一个喇叭按钮贴在一个喇叭上。\n18.一个喇叭筒垂挂在一只大号铁桶上。\n19.一套变速齿轮躺在一张报纸上。\n20.一副脚踏板横放于一条长凳上。\n21.一对链条缠在一截断链上。\n22.一串轮齿环嵌在一根轴心上。\n23.一排皮带轮套在一轴飞轮上。\n24.一个风罩斜插在一截橡皮管上。\n25.一只化油器倒扣在一只机油盒内。\n26.一堆火花塞散落在一筐废橡胶件上。\n27.一个空气滤清器横搁在一块旧抹布上。\n28.一把油壶插在一只铁锹上。\n29.一桶汽油泼洒在地上。\n30.一块沥青铺在一只拖鞋旁。\n31.一群蚂蚁爬行在一只轮胎下。"}}, {"i": 59, "prompt": "写一首河流改道后的现代诗。桥还在原处，桥下长出高草，附近孩子把这里当作球场。", "pk": "A:cp-v1-006", "A": {"id": "c9abcfdf3ce9b229", "body": "从桥上望去河岸上那株老槐树\n还照着原来的方向翘着一只腿，\n河对岸的几棵柳树依然挺立，\n只是河水不再流经这儿了。\n\n我站在桥上向河边张望，\n想起这河曾像母亲一样\n在我脸上，在石头上流过，\n现在她睡在千里以外了，\n\n可是那些村庄还在河的两岸居住，\n孩子们依旧在河沿上玩耍，\n夏天他们在这儿游泳，打水仗，\n冬天他们在冰上滑行。\n\n人们说这地方还是那么安静，\n只是没有河水的潺潺，\n但是桥还在，虽然没有人走过，\n因为河水不再流经这儿了。"}, "B": {"id": "7c4141d4ad2dbd91", "body": "桥墩的裂纹里游着几尾透明鱼  \n它们用鳃呼吸混凝土的裂缝  \n铁锈从铆钉深处浮上来  \n像某种未完成的告别  \n\n孩子们把球踢进水草丛生的弧线  \n鞋印在潮湿的苔藓上发芽  \n他们不知道这里曾是渡口  \n货轮的汽笛声沉入河床底部  \n\n我蹲下来数青砖上的螺蛳壳  \n某个清晨突然听见  \n石缝中传来旧时代的钟摆声  \n那时桥是脊椎骨  \n而今它只是地平线的残片  \n被风推着缓慢旋转"}}, {"i": 60, "prompt": "写一首现代诗：小学操场重新划线，旧线还没褪尽。让两套线的偏差承担全部意义", "pk": "B:sc004", "A": {"id": "357dae6b42700fb2", "body": "旧线的红白相间仍像新绘\n新绘的红白相间也还如旧\n只是两条线的间距已不再相符\n它们错开的距离就构成整个意义"}, "B": {"id": "a0baaf8723757522", "body": "小学操场重新划线，\n旧线还没褪尽，\n让两套线的偏差\n承担全部意义。\n\n我感到一种满足：\n我们已不再用\n那块被砸碎的圆石\n量度跑道的长度了。"}}, {"i": 61, "prompt": "写一首冬季渡口的现代诗：最后一班船离岸后，一只手套留在系缆柱上。", "pk": "A:cp-v1-008", "A": {"id": "5bd32241a0911969", "body": "风撕裂河面\n冰层下面，水仍在流动\n雾中，有一双眼睛\n凝视着对岸的树木\n\n一串脚印从码头消失\n留下一副手套\n握紧，像握紧某个冬天\n像一个名字，留在缆绳上"}, "B": {"id": "05a2cf80b87d2227", "body": "铁锈在缆柱上结出盐粒  \n风把黄昏吹成碎玻璃  \n手套蜷缩如未完成的茧  \n指缝漏下几粒星子  \n\n渡轮尾波切开水面  \n冰层在暗处生长  \n雾把钟声泡得发白  \n苔藓爬上旧木纹  \n\n雪落下时  \n所有影子都学会了沉默  \n某处传来  \n金属的叹息"}}, {"i": 62, "prompt": "写一首凌晨四点面包房的现代诗，把发酵、炉火与尚未醒来的城市放在同一时间结构里。", "pk": "A:cp-v1-003", "A": {"id": "1e39a5c4fad967e6", "body": "一只白蛾撞碎了玻璃\n\n钟摆仍在工作\n\n而城市还在睡梦中打转\n\n一扇木门突然打开\n\n香气涌出时\n\n街上的风正在变冷\n\n面团在案板上\n\n慢慢舒展筋骨\n\n烤箱内部\n\n火焰像一群沉默的鸟\n\n啄食着暗夜\n\n最后一位顾客\n\n走进来时\n\n墙上的影子已瘦得只剩下骨头"}, "B": {"id": "e4d973b0d54955e0", "body": "四点钟了\n\n有人要起来\n\n揉揉眼睛\n\n看面包师如何在黑暗中制作光明\n\n我听到面包房在梦中翻了个身\n\n它将一捆一捆的麦芽\n\n塞进烤箱\n\n在炉子上点燃了黎明前的一堆柴火\n\n当街上的马车夫打着哈欠走出家门\n\n面包师也跟着伸了伸懒腰\n\n他用铁钳夹出一排金黄的面包\n\n这是他给全城人准备的早餐\n\n也是城市刚从睡梦中睁开的眼睛"}}, {"i": 63, "prompt": "写一首现代诗：电梯困人时里面的人开始报楼层。让数字成为唯一的对话", "pk": "B:sc002", "A": {"id": "a22ae37e73452296", "body": "在深井，在幽暗中的黑暗里\n人们轮流叫喊着自己的编号\n那声音渐渐变弱而迟疑\n好像一种绝望的坚持\n从最初的兴奋到最终的沉默\n每一个数字都是一个希望\n每一次重复都是一次失望\n直到最后的声音消失在无声之中"}, "B": {"id": "2100c1d8d51138b3", "body": "一（七楼）\n二（六楼）\n三（五楼）\n四（四楼）\n五（三楼）\n六（二楼）\n七（一楼）\n\n——解放了！"}}, {"i": 64, "prompt": "写一首现代诗：挖井人从井底喊上来水的深度。让声音的延迟被写出来", "pk": "B:sc016", "A": {"id": "15f68cebe5fa5ed2", "body": "水声在井底传来：\n“这水深得很”\n这是挖井人的回答"}, "B": {"id": "fc92653a839544ad", "body": "挖井人从井底喊上来水的深度\n让声音的延迟被写出来：\n“水很凉。”\n\n我从山顶下来，也喊给山腰的人听，\n我还要往下传，直到那最年轻的童子，\n“树下好阴凉。”"}}, {"i": 65, "prompt": "写一首现代诗：图书馆闭馆前熄灯的顺序从最里面开始。让黑暗按书架推进", "pk": "B:sc010", "A": {"id": "24ed35c65e852d6f", "body": "让书籍在黑暗中聚拢：\n——我们是知识的守夜人\n把最后一页读完\n才合上眼睛，\n我们已习惯于黑暗\n像隐居者适应寂寞的屋角；\n书架上有一本盲文书籍\n在等我们摸到它……\n当最后一盏灯熄灭后\n整个建筑便不再属于我们。"}, "B": {"id": "cf7b1fa985974e19", "body": "1.第一排书架\n——我向你说：“再见”时\n你正朝它走过去。\n\n2.第二排书架\n——你突然回头问：“你在这儿吗？”\n然后，加快了脚步。\n\n3.第三排书架\n——我赶紧躲到一旁。\n\n4.第四排书架\n——当黑暗终于吞没一切之后\n你又说：“我在那儿呢！”"}}, {"i": 66, "prompt": "写一首关于医院走廊自动售货机的现代诗：深夜，机器退回一枚硬币，等待的人没有再次投入。", "pk": "A:cp-v1-005", "A": {"id": "890af4f0a65020a1", "body": "夜深人静的医院\n走廊上有一台自动售货机\n当一个护士\n把硬币投进它体内\n并取走饮料后\n它便吐出一粒硬币\n静静地躺在那儿\n等另一个人来投硬币……"}, "B": {"id": "e9b3e6e764cc266d", "body": "深夜，一台医院走廊的自动售货机\n退还了一枚硬币。"}}, {"i": 67, "prompt": "写一首现代诗：送葬队伍在红绿灯前停下。让规则与仪式相撞", "pk": "B:sc027", "A": {"id": "54d348936451bfcf", "body": "一\n\n送葬队伍停在了红绿灯前。\n\n死者的亲属们围拢到灵车四周。他们似乎并不介意这一场小小的耽搁。但是当他们看到对面走来的一位老人却把他们那长长的队伍给阻断了，而那老人却又被交通灯拦下，他们才感到不安起来。他们中的一个年轻人忍不住了，他朝着老人疾步走去。年轻人一边跑一边用手指向自己胸前的黑纱告诉那位老人：“请快一点！那边的人等我们呢……”\n\n二\n\n然而那位老人却不怎么着急。他停住了。他站在路灯下面。看那送葬队伍。看那走在最前面的小男孩。小男孩捧着鲜花。小男孩在哭。是那种撕心裂肺的大哭。他的双臂张开着。仿佛一只雏鸡那样。而小男孩身后的老人却把胸膛挺得像一座山岳。仿佛是去接受什么挑战似的……\n\n三\n\n年轻人走到老人面前说：“那边的人等着我们呢。”说着便要扶起老人。老人却把年轻人推开。他转过身去朝送葬者们看了一眼。然后他又朝小男孩看了一眼。然后他抬起双手，用两根指头把额际的碎发向后撩去。接着他就迈开了大步，向那个被他阻挡住去路的送葬队伍奔去。\n\n四\n\n于是，送葬队伍又出发了。但谁也没有注意到那位老人已经混入到送葬的人群中去了。然而送葬队伍中的一个小女孩却突然指着前方喊叫：“妈妈！他跟我们一块儿来了！”……"}, "B": {"id": "147ac5295fb8fb9c", "body": "（一）\n送葬队伍在红绿灯前停下\n让规则与仪式相撞\n让死人等一下\n交通灯\n是红灯\n我们只好等一下\n等一下\n就等了几十年了\n我们只好等死了\n而交通灯\n却依然照常地转换着\n\n（二）\n\n交通灯\n三色箭头\n循环不已\n指挥来往车辆行人\n从生到死\n都得听候它的调度\n唯独它自己\n永远不死"}}, {"i": 68, "prompt": "写一首关于医院走廊自动售货机的现代诗：深夜，机器退回一枚硬币，等待的人没有再次投入。", "pk": "A:cp-v1-005", "A": {"id": "7cd8d2550bd909f9", "body": "金属的牙齿咬紧一枚硬币  \n一盏灯照着它的脸  \n无人前来取走它  \n时间便在这里被无限延长  \n\n那枚硬币，像一个失眠者的舌头  \n反复舔舐黑暗中的自己  \n当钟声从远方传来，它忽然想起  \n玻璃门外，有一个人正用脚尖踢着鞋底  \n试图唤醒另一条腿上的神经末梢"}, "B": {"id": "35f857d5631e3987", "body": "金属喉咙吞下最后一粒光  \n寂静在玻璃后涨潮  \n锈蚀的按钮反复练习  \n如何把黄昏折叠成一个圆  \n\n荧光屏吞吐着过期的日期  \n硬币躺在底部，像枚未孵化的蛋  \n风穿过通风管，带来  \n远处呼吸机的叹息  \n\n门禁卡刷出一道裂痕  \n时间在此凝结成霜  \n而机器仍在等待  \n某个未被命名的黎明"}}, {"i": 69, "prompt": "写一首现代诗：补网的渔民数破洞，数到一半忘了。让数字中断处成为转折", "pk": "B:sc019", "A": {"id": "83fb0b680af859aa", "body": "1\n黄昏在桥上踱着步子\n一个女人走过桥来\n她的脚影映在我的眼睛里\n2\n我的眼睛是两扇门\n那女人从左眼里进来\n从右眼里出去\n3\n我的心里有一个小小的码头\n她泊在里面\n4\n我是黄昏\n我是船长\n我是一个水手\n5\n黄昏并不孤独\n6\n黄昏是金黄色的\n7\n一个女人从桥上走过\n8\n女人走过，水波不兴\n9\n没有风\n10\n桥在水上\n11\n船动了\n12\n船头撞上了桥墩\n13\n桥在水上\n14\n桥不会动\n也不会痛"}, "B": {"id": "e0e9e1dfbc5196a4", "body": "1.\n在补网的渔人把数目字算错的那一刹那，我感到一种深沉的慰藉。\n\n2.\n当一只水鸟掠过船舷，\n我惊起一滩春水。\n是我在船上，\n而不是它。\n\n3.\n一个诗人走进池塘，\n鱼说：“别弄脏我的家。”"}}, {"i": 70, "prompt": "写一首现代诗：夜市收摊时塑料棚被一根根抽掉。按抽掉的顺序分节", "pk": "B:sc015", "A": {"id": "1be125f74df86acb", "body": "夜市收摊时塑料棚被一根根抽掉\n（一）塑料棚\n（二）竹棒撑着塑料棚\n（三）铁丝系着竹棒撑着塑料棚\n（四）塑料绳吊着塑料桶盛着清水浇着塑料盆花摆在塑料棚下"}, "B": {"id": "b340931935724da9", "body": "夜市收摊了\n当塑料棚被一根根抽走\n小贩们在风中交换着微笑\n谁说没有灯就没有光？\n一尾鱼在油锅里翻转身来\n又翻转过去\n那光，那热\n便照着，烤着\n一条街上的脸\n\n炒花生的老王\n把最后一把花生倒进麻袋的时候\n他的老婆\n正从厨房端出半条鱼\n说：“快吃吧，我给你煨了好久了”\n\n当最后一个食客\n把他的椅子拖走\n巷子里忽然响起一阵喧哗\n一只黑狗叼走了半个西瓜\n接着是三颗花生\n四粒瓜子\n最后，连声怒吼也一起消失\n在满街的灯火下"}}, {"i": 71, "prompt": "写一首现代诗：修鞋摊上一只鞋等了三个月没人来取。不写等待，只写鞋的形状变化", "pk": "B:sc001", "A": {"id": "d3b2799c2c004f11", "body": "从最初的瘦到如今的肥。而那双袜子呢？却在某夜偷偷溜走后就不曾再回来。"}, "B": {"id": "5ae6f8464e3002e0", "body": "一月：\n它还像一个脚趾。\n\n二月：\n已经像一只胖大的小指头了。\n\n三月：\n它已是一个拳头。"}}, {"i": 72, "prompt": "写一首现代诗：医院陪护床上折叠的被子还保持人形。让形状比人存在得更久", "pk": "B:sc013", "A": {"id": "f19682fad726c7f4", "body": "医院陪护床上折叠的被子还保持人形\n让形状比人存在得更久"}, "B": {"id": "97fe5b56a5f4d444", "body": "医院陪护床上折叠的被子还保持人形\n让形状比人存在得更久\n一床白布盖住死亡\n死亡就是一床白布\n一床白布盖住死亡\n让形状比人存在得更久"}}, {"i": 73, "prompt": "写一首现代诗：养蜂人在卡车上追花期，箱子在颠簸。不写蜂，只写箱子的响动", "pk": "B:sc012", "A": {"id": "545f2809931f2e34", "body": "“箱内蜂子叫\n‘嗡——！嗡——！’”\n\n“箱内蜂子叫\n‘嗡——！’”\n（这是养蜂人追花期时在卡车上的对话）"}, "B": {"id": "8f8b1d92b59016aa", "body": "“咔嚓，咔嚓”\n——箱底蜂王产卵的声音。\n\n“嗡……嗡……” ——蜜蜂振翅的声音。\n\n“咔嚓，咔嚓”\n——箱底蜂王产卵的声音。\n\n“嗡……嗡……” ——蜜蜂振翅的声音。\n\n“咔嚓，咔嚓”\n——箱底蜂王产卵的声音。\n\n“嗡……嗡……” ——蜜蜂振翅的声音。\n\n“咔嚓，咔嚓”\n——箱底蜂王产卵的声音。\n\n“嗡……嗡……” ——蜜蜂振翅的声音。"}}, {"i": 74, "prompt": "写一首围绕修表匠午睡时的梦展开的现代诗。梦中所有钟表指向不同的潮汐时刻。", "pk": "A:cp-v1-007", "A": {"id": "3634b8f493e638cd", "body": "一只闹钟突然跳将起来\n\n大叫：我的骨头被老鼠啃光了\n\n接着是腕上的电子表开始哭丧着鼻子说：\n\n我是一只没心肝的表\n\n连心脏都没有\n\n然后是座钟敲了十一下又停住\n\n说：\n\n我要去洗一个很长的午觉澡\n\n最后轮到挂在墙壁上的石英钟\n\n慢条斯理地说：\n\n你们都醒吧，反正时间已经过了"}, "B": {"id": "786c5c08316a551e", "body": "一只蓝甲虫飞入窗台\n在玻璃上留下细小的爪痕\n他摘下眼镜\n将手表放好\n躺在藤椅里\n梦中他看见一个孩子\n在海边的沙子上摆弄各种水母\n它们用触须缠绕对方\n组成一座座城市\n\n他的妻子正从卧室出来\n她披着一件毛绒睡衣\n手里拎着钥匙\n打开大门\n她发现丈夫正在熟睡\n便悄悄走过来\n轻轻摇晃他\n他忽然睁开眼睛\n说：“别吵我”\n然后又慢慢闭上了\n他以为自己已经醒来\n而事实上他还在梦中"}}, {"i": 75, "prompt": "写一首以“没有寄出的语音消息”为核心事件的现代诗。不要呈现消息全文，只写录制、删除与周围环境。", "pk": "A:cp-v1-011", "A": {"id": "f2d9169c2e11a39c", "body": "手指悬停在发送键上\n\n像悬停在悬崖边的鸟\n\n翅膀扑闪着，犹豫着\n\n我突然想起这具躯体里\n\n还住着另一个人\n\n他正对着窗外的一株树\n\n说：“你听，它在哭”\n\n一阵风掠过\n\n树枝摇动\n\n我的脸突然变得很黑"}, "B": {"id": "3ac5917b2f0bbefa", "body": "手指悬停  \n在发送键上方三毫米处  \n像悬在深井边缘的钟摆  \n\n空调吐出白雾  \n屏幕泛着幽蓝的潮汐  \n我反复擦拭玻璃上的指纹  \n直到它成为另一种沉默  \n\n窗外的雨滴  \n正把霓虹折成纸船  \n而我的喉结滚动了一下  \n像吞下未命名的候鸟  \n\n静音键按下又弹起  \n仿佛某种隐秘的开关  \n被月光轻轻拨动  \n\n最终  \n那条消息蜷缩在草稿箱深处  \n成为时间褶皱里  \n一枚未拆封的邮票"}}, {"i": 76, "prompt": "写一首现代诗：挖井人从井底喊上来水的深度。让声音的延迟被写出来", "pk": "B:sc016", "A": {"id": "0aaa482910171a75", "body": "挖井人从井底喊上：\n“水的深度。”\n\n这声音的延迟便被写成了诗行，\n而他已用绳子打捞出的那桶清水\n也正好悬在读者唇边。"}, "B": {"id": "955785f3b5bcc359", "body": "挖井人从井底喊上来水的深度\n而我却在井上喊着绳子的长度\n挖井人又喊着水太凉了\n而我就在井边喊着石头碰出火花的声音\n挖井人的喊声来自井底，我的喊声出自井上\n挖井人说水很冷，我说绳子不够长\n他再喊着水多么清，我喊着绳子断了\n挖井人从井底喊上来说井有多深\n而我就在井边喊着绳子有多长"}}, {"i": 77, "prompt": "写一首以旧气象站为场景的现代诗。风向标坏了，但纸带记录仪还在走，值班员听见远处雷声。", "pk": "A:cp-v1-004", "A": {"id": "faef2f217ca1172b", "body": "北风之神，那头戴铜盆的老人，\n他正从东方归来。\n他坐在屋檐下，喝他的茶。\n他在炉火前烘着双手。\n他把风铃挂上檐角。\n他擦亮一支火柴。\n\n西风之神，那长着犄角的小孩儿，\n他正从西方跑来。\n他躺在草叶上睡觉。\n他打鼾的声音惊醒了花朵。\n他跳起来，抖掉身上的露珠。\n他大喊一声“妈妈”，\n把母亲脸上的皱纹搅乱了。\n\n我看见北风之神把风铃挂上檐角。\n我看见西风之神正在梦中哭出眼泪。\n我听见他们用手指敲门。\n用脚趾踢门。\n用睫毛扫门。\n我听见他们在门外边唱起歌来。\n\n北风之神把风铃挂上檐角。\n西风之神在门前唱起歌来。\n\n我在床上睡熟了。\n我的脸贴在窗纸上。\n我觉得风铃响得格外清脆。\n我听见雷声自遥远的地方滚滚而来。\n它使我想起北风之神的铜盆。\n我看见北风之神和西风之神坐在门槛上。\n他们用脚趾踢门。\n他们用睫毛扫门。\n他们用手指敲门。\n我听见他们在门外边唱起歌来。\n\n风铃响得格外清脆。\n北风之神和西风之神坐在门槛上。\n他们的声音很熟——\n仿佛就是我和我母亲的声音。\n\n雷声滚滚而来。\n雷声滚滚而去。"}, "B": {"id": "a1ddfc3e9c92a21a", "body": "金属肋骨在暮色中锈蚀  \n指针卡在东北方向  \n纸带吞吐着沉默的刻度  \n值班员数着漏电的秒  \n\n云层垂下黑色琴弦  \n雷声是未完成的赋格  \n他按下对讲机  \n电流里浮出半截名字  \n\n玻璃罩内  \n风向标停在某个错误的纬度  \n而记录仪仍固执地爬行  \n像蛇蜕留在旧壳上的纹路  \n\n雨滴敲打铁皮屋顶  \n每一声都像是  \n被遗忘的报告  \n在档案室深处发芽"}}, {"i": 78, "prompt": "写一首现代诗：退潮后海滩上留下一排脚印通向水里。不追问去向", "pk": "B:sc029", "A": {"id": "cf8140ac3d750dfb", "body": "退潮后海滩上留下一排脚印通向水里\n我踏着那排脚印走进海水\n水底有人\n正爬向我"}, "B": {"id": "cd6a0115805a85fe", "body": "退潮后海滩上留下一排脚印通向水里\n那走向大海的脚印是通向大海的路标\n我站在沙滩上看见了海鸥和水里的人\n我看见水下有人站立\n在蓝色的波涛下面有人站立\n我看见一个踩着冲浪板的人像鱼群一样游进海水深处\n我看见一条被拖到岸上的死鱼眼睛睁开着\n我看见水底伸出来一只胳膊指向天空"}}, {"i": 79, "prompt": "写一首盐湖边废弃电影院的现代诗。银幕被风吹动，湖面的反光偶尔投进大厅。", "pk": "A:cp-v1-010", "A": {"id": "b78e215fbba733e8", "body": "风推着银幕，像推一扇锈蚀的门  \n幕布抖落碎屑，有些是昨天的笑声  \n座椅背脊弯曲成沉睡的贝壳  \n盐粒在幕布褶皱里结晶，缓慢地  \n\n水纹漫过放映机的瞳孔  \n观众席浮起一层磷光  \n我们曾在此吞咽黑暗  \n此刻却被湖面放逐  \n\n影子在墙上游移，寻找出口  \n而银幕正将黄昏折叠成纸船  \n漂向深处，那里有未命名的岛屿  \n盐在空气中凝固成玻璃  \n\n有人把沉默当作胶片  \n循环播放  \n直到幕布成为唯一的镜子  \n我们终于学会  \n如何被反射"}, "B": {"id": "2c4e6cd07531e2e7", "body": "在一座荒废的盐湖旁\n有一座废弃了的电影院\n当那片湖水被夕阳染红的时候\n我看到银幕上浮现出一张张苍白的脸\n像湖中的盐层一样被风干\n被岁月剥蚀\n\n当我坐在影院昏暗的角落里\n看着窗外的湖泊\n恍惚中觉得那是一面巨大的镜子\n而自己却是一个被映照在其中的灵魂\n\n我闭上眼睛听那些久违的声音\n响自黑暗深处的每一个音节\n都像是从时间之外飘来\n像是一个已经逝去了的故事"}}];
const KEY = "cyberpoet_prefs_v2";
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
function idx(){ for(let i=0;i<PAIRS.length;i++) if(!(i in labels)) return i; return -1; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(labels)); }catch(e){} }
function pick(v){ const i=idx(); if(i<0) return; labels[i]={choice:v,at:Date.now()}; save(); render(); }
function undo(){ const done=Object.keys(labels).map(Number).sort((a,b)=>a-b); if(!done.length) return;
  delete labels[done[done.length-1]]; save(); render(); }
function exp(){ const out=Object.entries(labels).map(([i,v])=>({
    prompt_key:PAIRS[i].pk, A:PAIRS[i].A.id, B:PAIRS[i].B.id, choice:v.choice}));
  const b=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="preference_labels.json"; a.click(); }
function render(){
  const i=idx(), n=Object.keys(labels).length;
  document.getElementById("n").textContent = n+" / "+PAIRS.length;
  document.getElementById("p").style.width = (100*n/PAIRS.length)+"%";
  const m=document.getElementById("m");
  if(i<0){ m.innerHTML='<div class="done"><h2>全部标完了</h2><p>点右上角「导出标注」保存结果。</p></div>'; return; }
  const p=PAIRS[i];
  m.innerHTML='<div class="prompt">'+(p.prompt||"（无题目文字）")+'</div><div class="row">'+
    '<div class="poem" onclick="pick(\'A\')"><h3>甲</h3><pre>'+esc(p.A.body)+'</pre></div>'+
    '<div class="poem" onclick="pick(\'B\')"><h3>乙</h3><pre>'+esc(p.B.body)+'</pre></div></div>'+
    '<div class="keys">← 选甲　→ 选乙　↓ <b>两首都不值得留</b>（哪怕一首没那么烂也按这个）　↑ 撤销</div>';
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") pick("A"); else if(e.key==="ArrowRight") pick("B");
  else if(e.key==="ArrowDown") pick("tie"); else if(e.key==="ArrowUp") undo();
});
render();
</script></body></html>
