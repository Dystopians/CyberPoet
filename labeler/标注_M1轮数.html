:root{--bg:#faf9f7;--fg:#1c1a17;--card:#fff;--line:#e3ded6;--accent:#7c5c3e;--muted:#6b655c}
@media(prefers-color-scheme:dark){:root{--bg:#16151300;--bg:#161513;--fg:#eae6df;--card:#1f1e1b;--line:#33302b;--accent:#c79a6c;--muted:#9a938a}}

font:16px/1.75 "Noto Serif CJK SC","Songti SC",Georgia,serif}

<script>
const PAIRS = [{"i": 0, "prompt": "写一首现代诗，其中出现「地平线」与「祖国」。", "pk": "ip-003", "A": {"id": "a1f4d4a993401ab0", "body": "在草原上，在西部的山峦\n太阳落下去\n大地承受了它滚动的光芒\n承受了如歌的灿烂和喧嚣\n把金色的寂静\n放得更深\n\n从此，我常常用\n一个漂泊者的目光\n看着大海\n看着东部的城市\n那鳞片闪光的天空\n仿佛来自祖国的\n另一种生活\n仿佛没有乡土的日子\n也打下了富裕的粮食"}, "B": {"id": "361fee98e8abadbb", "body": "1\n在北方有无数城市，\n在城市中有无数乡村，\n有一处——就在那地方\n住着我钟情的主人。\n\n在那里，天空颜色鲜艳，\n使人见了会心花怒放：\n红尘里藏着樱桃园，\n花园中生长着小红莓……\n\n2\n从樱桃园里摘下来，\n洗洗就放在冰盘上，\n加上点白糖和柠檬汁，\n酸酸甜甜好味道。\n\n3\n在盛夏里去也匆匆，\n秋天来得又忙又乱。\n一转眼冬天已来临，\n门前摆着雪白的大面包。\n\n4\n到过那里的人会相信，\n这真是我的故乡，\n虽然我不曾说过，\n而且也不必声明。\n\n5\n我的主人是土地，\n大地是他的产业；\n他住在自己的家中，\n像国王在金銮宝座上。\n\n6\n他的儿女们成群结队，\n向陌生的方向走去。\n他们用不着告别，\n告别意味着欺骗。\n\n7\n有人走了二十多年，\n去年回来真欢喜，\n看到一切都没变样，\n连老屋还叫它“老屋”。"}}, {"i": 1, "prompt": "写一首现代诗，其中出现「花粉」与「飞蛾」。", "pk": "ip-039", "A": {"id": "011825e03b955b52", "body": "花粉的季节\n蜜蜂们忙于嫁妆\n一对对飞蛾\n在灯下交拜\n\n月光照着山谷\n水面上浮动着白杨的硬币\n情侣坐满整个车厢\n我的顶髻垂落\n像一枝枯萎的玫瑰\n\n太阳沉到白杨树的背后\n鸽子们衔着情人的衣物\n纷纷飞出窗户\n山洞中的野羊伸出一只前爪\n摸到了我那堆满羽毛的口袋"}, "B": {"id": "1c5e1fb17e1a7de8", "body": "1\n初秋的雨\n潮湿了中原大地\n我站在黄河岸边\n听风儿诉说古往今来\n\n2\n河岸上\n芦苇\n映着夕阳在燃烧\n一柱柱火把\n从大山深处走来了\n是原始人类从洞窟中走出来呵\n\n3\n太阳落山\n野猪又嚎叫\n篝火在每一家门口燃起\n孩子们拉着母亲的手\n围着火堆跳跃\n唱着他们的歌\n\n4\n夜深了\n我坐在灯下写作\n忽然听到一阵风雨\n闪电照亮了我的稿纸：\n那上面爬满了蠕动的黑蚁\n\n5\n早晨起来\n发现书案上有片玫瑰花瓣\n是谁放在这里的？\n一阵暗香袭来\n莫非是我梦中的蝴蝶？\n\n6\n中午\n我在理发店理发明镜中\n看到一个戴白帽子的陌生人\n向我点了点头\n他走了\n却把寂寞留给我\n\n7\n花房里\n一位姑娘正在为一颗玫瑰花施肥\n无意中回头\n她看见自己的影子\n在墙上投得格外肥大而憔悴\n\n8\n下午\n一个小孩指着天空的一朵白云\n问他的母亲：“这是谁牵着一只狗？”\n天上的云和地上的人\n都沉默着\n\n9\n黄昏时分\n在一条泥泞的小路上\n两个年轻人手挽着手向前走去\n一对老夫妇掉转身去背向着他们\n默默地望着黄土渐远……\n\n10\n夜深沉\n晚风中飘来了阵阵悠扬的琴声\n从灯火辉煌的高楼的背后\n不知是谁在对着明月\n拉一支思乡曲"}}, {"i": 2, "prompt": "以《手艺》为题写一首现代诗。", "pk": "tp-027", "A": {"id": "1db3b446d60ee0df", "body": "1\n手艺人\n在城市边缘\n摆弄木头与绳子\n像摆弄自己\n摆弄语言\n2\n语言的尽头是手\n摆弄人的手\n3\n没有主人的手\n摆弄人的绳子\n和木头\n4\n一个女人牵一头驴子经过小溪\n另一个女人牵一头驴子经过小溪\n第三个女人牵一头驴子经过小溪\n第四个女人牵一头驴子经过小溪\n5\n……而他们只是\n手艺人\n在城市边缘\n摆弄绳子与木头\n6\n手艺人\n把最后一个词也摆上\n木头便开花\n7\n手艺人\n从词语中醒来\n看见了木头和绳子\n8\n木头开花了\n词群奔逃\n像鸽群"}, "B": {"id": "3c5611f88acd9995", "body": "泥炉中火苗微微颤动\n烧水的老汉昏昏睡去\n一只白瓷碗搁在长柄铜勺上\n他忽然想起一件心事\n猛然后坐起来\n“叮当”一声\n铜勺磕翻了茶具\n水溢满地\n炉熄……"}}, {"i": 3, "prompt": "以《给晚霞命名》为题写一首现代诗。", "pk": "tp-037", "A": {"id": "3f6e3ea65bcb7009", "body": "1\n晚霞的美丽照见了老境，\n在城市的顶楼上我将埋头。\n晚霞的美丽，谁能够忘却？\n可是谁能记得起少年的情谊？\n\n在青春的密林里我们迷失，\n我们在晨光里呼唤彼此，\n我们的手杖终于碰在一起，\n我们从密林中走出时已经黑夜。\n\n那时候我们有了会笑的嘴唇，\n互相吻着，在草丛中，森林下，\n在母亲的眼睑下，当我们做了父亲，\n再看见你们的美丽，我怎样解释？\n\n2\n晚霞的美丽照见了老境，\n在城市的顶楼上我将埋头。\n晚霞的美丽，谁能够忘却？\n可是谁能记得起乡间的欢乐？\n\n那是在春天，在泥土的腐殖层里\n有最浓烈的芬芳，当太阳下山，\n蟋蟀和别的鸣虫在草丛里合唱\n像一阵情欲的热浪滚滚而来。\n\n当我在夜里醒来，你的呼吸\n是那么近，像一个亲吻，当黎明\n从天空燃起，我们一同在田野上\n追逐蝴蝶，而寻找河里的游鱼。\n\n3\n晚霞的美丽照见了老境，\n在城市的顶楼上我将埋头。\n晚霞的美丽，谁能够忘却？\n可是谁能记得起流放的日子？\n\n在北方的寒夜，风在窗缝里嚎啕，\n我的手冻得不能移动，我想到\n故乡的水滨，那野鸭们的声音，\n它们已经在冰封下不再摇翔，\n\n想着我将永远失去那声音，\n那时候我才听见窗外有雪在飘落，\n我看见树影下有一个女人，\n她向我走来，她的头发迎风飞扬。\n\n4\n晚霞的美丽照见了老境，\n在城市的顶楼上有灯火万盏。\n晚霞的美丽，谁能够忘却？\n可是他们都已经沉睡，埋葬在尘埃里。\n\n在每一个清晨，每一扇窗口，\n他们都在醒转，他们的眼睛\n看见了城市和田野，他们开始工作，\n为了自己的生活，也为了别人的享受。\n\n在黄昏里，他们又都回到家里，\n他们在灯下休息，想心事，\n他们的孩子，他们的妻子，\n那些声音，笑声，哭泣声，使夜更沉重。\n\n5\n晚霞的美丽照见了老境，\n在城市的顶楼上有我埋头。\n晚霞的美丽，谁能够忘却？\n可是我忘记了自己，我独自走到海边。"}, "B": {"id": "667b56d10c18f4be", "body": "给晚霞命名\n如同把最后一个吻\n烙在她的额上\n我便离去，而她哭了\n我并未说那是假的\n只是我不必再说\n当夕阳将落\n她仍在等我\n一如明日之空虚\n一如昨日之实现\n于是风起花落\n群山苍茫无边\n而她的眼中已有整个秋天的成熟"}}, {"i": 4, "prompt": "写一首现代诗，其中出现「城池」与「我会」。", "pk": "ip-013", "A": {"id": "7af81cc9a1b6bd83", "body": "城墙上那面红旗在风中\n猛力张开的血臂\n挥舞着\n太阳的光轮滚动着大地的色块\n而我，一个小小的影子，在墙根下\n我的脸上的黑斑\n被阳光晒得更亮了……"}, "B": {"id": "0e66dd29f7ee580c", "body": "城墙上月光的伤口\n隐隐渗出锈味\n有人正梦着铁\n有人正梦见回家的鞋子\n钟声啊，你的额头有斑斑青苔\n摸摸我的头\n你说，那里有一座小小的城\n城里住满忧郁症患者\n他们用酒酿酒\n用泪水擦汗\n摸摸我的脚\n你说，那里有一条长长的路\n路上有几颗老树根\n盘在一起\n像一盘纠缠的绳子\n有人正梦到母亲的眼睛"}}, {"i": 5, "prompt": "以《哭泣或者遗忘》为题写一首现代诗。", "pk": "tp-017", "A": {"id": "908ad7e0b3d75e53", "body": "哭泣或者遗忘。\n哭泣，把我们所知道的从树上赶走。\n在被我们哭泣净尽的大地上，\n只剩下土地和心脏。\n\n遗忘\n是大概肯定要有的繁殖。\n是的，我们大概肯定愿意遗忘。\n遗忘，遗忘了所有的事情。"}, "B": {"id": "582f12c9b538637d", "body": "哭泣或者遗忘\n哭泣，把我们还给彼此\n还给这没有父亲的夜晚\n还给我那未完成的童年\n和童年的那些小傻瓜\n还给他那颗子弹头\n还给我们的手，我们的脸\n还给那已经走远的人\n那被你们踩碎的花\n和花中开放的那个下午\n和那个像鸟一样的孩子\n哭泣，把他放回故乡\n哭泣，让他再活一次\n和那只死在路旁的狼\n和它黑夜里幽暗的嗥叫\n还给我们自己……\n哭泣，就是歌唱"}}, {"i": 6, "prompt": "以《我坐在一棵木头中》为题写一首现代诗。", "pk": "tp-016", "A": {"id": "3c751eee596ce71a", "body": "我是一株花\n在你的土壤里\n从泥土里冒出来\n我是一株花的\n羞涩与期待\n\n我是月亮的\n圆，是太阳的\n光，是我心中的\n黑，也是我心上人的\n发\n\n在静静中开放\n在核儿中开放\n在小心中开放\n像夜空中的星星\n在我心上开放"}, "B": {"id": "f6f861da36a8ffe2", "body": "我坐在一棵木头中，\n如同多年没有走路的瞎子\n忘却了走路的声音。\n\n我坐在一棵木头中，\n如同夜色从土层中自死的种子\n忘却了花与果的名字。\n\n我坐在一棵木头中，\n如同被囚禁的动物\n念着一座又一座雪山，\n\n念着一只又一只鸟。\n\n他们黯淡的皮囊下\n太阳在空中照耀。\n\n我们原是相亲相爱的人\n为什么如今孤坐山中？\n难道仅仅因为这场大火？"}}, {"i": 7, "prompt": "以《习惯》为题写一首现代诗。", "pk": "tp-025", "A": {"id": "c1d121b655eff792", "body": "习惯把你的名字\n写在烟头\n然后把它\n丢进炉子\n让火舌们\n热烈地\n读给你听"}, "B": {"id": "2865dce8a319eabf", "body": "习惯把你的声音\n搁在夜半听，\n像泉水流自深谷，\n似清风飘自远方，\n那么纯净，柔和。\n\n习惯把你的絮语\n比燕巢在空中，\n有生命的摇曳，\n有春草的清新。\n因此我更感振奋。"}}, {"i": 8, "prompt": "以《从感觉出发》为题写一首现代诗。", "pk": "tp-009", "A": {"id": "eefc3228684d155e", "body": "从感觉的迷宫中闯出来\n走出那梦的底细\n走出那痛楚的岁月\n和血，汗织成的牢狱\n是苦难的灵魂渴望解放？\n\n在每一声笑里我寻找钥匙\n在每一条路上我寻找出口\n笑，是世人的面具\n路，伸入阴霾的尽头。\n\n直到有一天，我跨出感觉的樊篱\n像鸟儿飞出了鸟笼\n我突然发现：\n被囚禁的反而是我自己？\n我才忆起人世本是一片坦途，\n笑，原是哭泣后的释放\n路，原是自己为自己铺设！"}, "B": {"id": "0c70aec09c936238", "body": "从感觉的原野，我们采撷\n那叫人心醉的花汁，\n于是有忧郁，温柔和欢笑，\n随着春天的来临。\n\n是的，要从感觉的原野\n我们采撷那花汁，\n虽然常常迷失于小径，\n当我们寻求真理。"}}, {"i": 9, "prompt": "写一首现代诗，其中出现「心脏」与「肢体」。", "pk": "ip-025", "A": {"id": "d67279ed5340b8bb", "body": "1\n心脏跳动的节奏\n是太阳和潮汐的意志\n它比我的语言更深刻\n2\n在深山里有一条河\n在夜里有星星\n它们是一样的光明\n3\n我是如此弱小\n但我的血流得很快\n4\n我有一个好的身体\n我要用它来热爱\n5\n当秋天的月亮像火一样燃烧\n有一颗心脏在天上歌唱\n6\n我们来自尘土\n最后也归于泥土\n7\n生命短如朝露\n但爱情永恒"}, "B": {"id": "c116a1b2d8239008", "body": "1\n心脏跳动的瞬间\n那树上便开了一朵花\n我沿着小溪行走，一朵又一朵\n当我的手捧住其中一朵\n我就感到春天在其中流动\n2\n我看到自己的影子\n贴在一棵树干上\n和它一起慢慢走向阴影\n3\n我仿佛是在一条河的岸边走着\n我仿佛看见了自己的一颗头颅\n浮在水面上\n4\n一个男人走在街上\n他并没有想到天空和大地的关系\n他说，我冷\n5\n一只灰雀躲在一棵老松树里\n瑟瑟地抖着\n像我穿着一件别人穿过的旧棉袄\n6\n云朵飘过，阳光透过树枝照在我身上\n我坐在草地上\n摸着自己的头\n7\n在黄昏中\n一个女人沿街卖苹果\n我站在桥上望着她\n8\n冬天，一个老人在雪地里散步\n他回头望了一眼\n他的身影渐渐消失在风雪之中\n9\n夜已深，我在灯下写作\n突然听到一阵敲门声\n我打开门，只见一轮明月高挂空中\n10\n我的心碎了\n但愿我能将它一片片埋入地下\n任由野兽们撕扯吞食\n直到只剩下一副空壳"}}, {"i": 10, "prompt": "写一首现代诗，其中出现「体温」与「长发」。", "pk": "ip-035", "A": {"id": "7e47c232b8dc6ca9", "body": "体温\n在你的长发间燃烧\n我赤裸的身子\n在你怀中燃烧成灰\n\n火\n从你眼中飞出\n把所有的夜晚照亮"}, "B": {"id": "2a24a42e97d50fd9", "body": "体温\n和长发的风味\n在月光下\n缓缓消融……"}}, {"i": 11, "prompt": "写一首现代诗，其中出现「女王」与「泪水」。", "pk": "ip-004", "A": {"id": "2a9a46dc3f699ab8", "body": "女王把一顶\n新做的帽子\n插上头\n便出发\n向西走去\n太阳\n刚从地平线的尽头\n冒了出来\n她一路走来\n脚印也越积越多\n她身后有一大串\n拖着长尾巴的\n脚印\n一直拖到天亮\n而太阳\n始终挂在\n她那只孤独的\n落空了的\n鞋上"}, "B": {"id": "5a73e2b5748e48c3", "body": "女王把一顶王冠放在床头\n像放一把梳子一样随便\n她把一件披肩扔在沙发上\n就像扔一块废了的抹布\n女王睡得香甜\n整个宫殿飘满了葡萄酒和玫瑰香\n醉醺醺的侍从们在走廊上摇摆\n还有几个醉鬼在门后呕吐\n突然，一声枪响打破了梦寐\n国王睁开了眼\n他的脸变成了一个大坑\n他被剜掉双眼的手搁在坑中\n像一条死蛇\n他那身黑色长袍还在风中飘着\n仿佛只是暂时离开一下身子\n这时，从窗口飞进一只受伤的燕子\n血从它的翅翼滴下\n滴到国王的额角上\n而国王的脸还像一座冻结的湖\n这时，燕子已精疲力竭地扑向窗台\n它用最后一点气力\n回头看了宫殿一眼\n便倒下了\n而窗外的太阳正火辣辣地照着\n照着燕子冰凉的眼窝"}}, {"i": 12, "prompt": "以《选择》为题写一首现代诗。", "pk": "tp-006", "A": {"id": "be1e1b2330192389", "body": "1\n“我愿意”和“我愿意长久地”\n哪一个更合乎逻辑？\n时间啊\n哪一个是你更喜欢的男友？\n哪一种爱情更适合你的性别？\n\n2\n在没有别的选择的时候\n选择\n是一种美德\n一种无奈之下的道德\n一种受孕的方式？\n\n3\n生活是一道伤口\n或者是一种乐趣\n不要选择\n不要选择\n选择会使伤口更加疼痛\n会使乐趣减少一半"}, "B": {"id": "3a7c46c178d3198b", "body": "选择\n一瓣野花\n还是\n一堆粪便？\n\n他选择了\n一瓣野花\n而它选择了\n他\n\n（一阵咳嗽\n把其余的诗句\n吓跑了）\n\n在那条\n名叫\n梦的\n河上\n坐着一只空荡荡的渡船\n名叫\n死\n\n（一阵咳嗽\n震断了两岸的柳枝\n哗哗……）\n\n有一天\n那个青年又到河边坐下\n开始挑选石头\n堆一座桥\n一块儿一块儿\n耐心地\n耐心地\n比春天更耐心地\n\n（咳嗽！\n河中渡船越驶越远）"}}, {"i": 13, "prompt": "写一首现代诗，其中出现「世上」与「花瓣」。", "pk": "ip-010", "A": {"id": "2cf9876d5e9b4096", "body": "世上的病号用病号的姿势走着，\n我却以健全者的步履向你走近。\n你的双耳已失去听觉，但能听到吗\n那朗读的声音正响自我的嘴唇。\n\n这无言的一刻将留下怎样的印象？\n一个盲者被引到你身边，他哭了：\n“啊，她有着一颗多么端正的头颅！”\n这时我就朝你走去，轻轻吻在你的额上。"}, "B": {"id": "fdc9f3ae0c093a1e", "body": "1\n“……如果可能，\n让我们把一切的悲哀\n都留在过去的一季里，\n\n而我们，我们将不再听从病钟的警告。\n将不再看见\n世界在我们的前面\n\n像一本未完的书似的摊开着；\n我们将不知‘现在’为何物，\n我们将不能把“现在”抓住；\n\n我们将不能把我们的欢笑和眼泪，\n织进一个长长的，长长的梦里——\n那怕是荒凉的，黯淡的，难解的……\n\n而春天啊！我们将不会认识？\n我们岂可是生活在一群谎言中？\n\n哦，春天，美丽的春天，\n给我们真理，给我们幸福，\n给我们狂暴的抒情诗的感情！\n\n如果这是真的，唉，如果这是真的，\n请给我们以死！”\n\n2\n于是春天来了。\n\n一丛桃花在墙里\n悄悄地探出了粉色的下巴，\n用渴望的眼神望着路的那边。\n突然一阵风，\n那群含羞的姑娘一下子全都张开了脸，\n在阳光下晒得绯红。\n\n墙外是一个喧嚣的世界：\n几只燕子衔泥飞过，几只麻雀吵闹着，\n在枯草里，在湿土上，叽叽喳喳，\n好像说：这儿真好，这儿真好！\n\n一个小女孩赤脚踏过了田野，\n向溪边走来，她挎着篮子，\n里面装满了嫩绿的荠菜。\n她的笑声清脆地响着，\n像是对春天的呼唤。\n\n而他却在室内，\n正埋头在一堆苍白的卷宗中，\n读着一行行枯燥无味的文字。\n他的脸愁苦而阴郁，\n因为他的心为一些不幸的事所牵动，\n那些事情仿佛是一些黑色的花朵，\n开在他的心灵之田里，\n散发着忧郁的气息。\n\n3\n当太阳西斜的时候，\n一对恋人携手走过街头，\n他们的眼睛充满了温柔，\n他们的手紧紧握在一起，\n仿佛要永远这样走下去。\n在黄昏的微光中，\n他们在街头散步，\n谈论着未来的计划，\n憧憬着美好的生活。\n\n在一间静寂的房子里，\n一位老人独自坐在窗前，\n他凝视着窗外的天空，\n心中充满了孤独和寂寞。\n他回忆起过去的岁月，\n那些欢乐和悲伤，\n如今都已成为遥远的记忆。\n他叹了口气，闭上了眼睛，\n等待着夜幕降临。\n\n而在另一间房间里，\n一位年轻的女子，\n轻轻地拨弄着钢琴，\n弹奏着一首哀怨的曲子，\n那是关于爱和失去的歌。\n她的手指轻盈地滑过琴键，\n每一个音符都充满了情感，\n仿佛在诉说着她的内心深处的秘密。\n\n4\n在城门下面，在桥底下，\n流浪者躺在尘土上，\n他们裹着单薄的"}}, {"i": 14, "prompt": "以《春日》为题写一首现代诗。", "pk": "tp-034", "A": {"id": "621df980cf9e7240", "body": "四月的风\n吹得桃花\n笑出嘴唇来\n\n桃树下\n几个女子\n捂着脸\n\n笑出了嘴唇\n春天 一树花一树哈哈大笑"}, "B": {"id": "0dffb74360e77368", "body": "四月的风\n吹得好猛烈\n把柳絮\n吹得飞起来\n把我\n也吹醒了\n\n我睁开眼的时候\n春天早已开始\n窗外的桃花\n迫不及待地告诉我\n好多好多人\n都到南方去了\n\n我的书桌上\n躺着一叠信\n有泪痕的\n是给母亲的信\n有口香糖粘着的\n是给女朋友的信\n有狗毛沾着的\n是给一位诗人的信\n有一枚长长的齿痕印着的\n是我自己写的信\n\n早晨起床时\n枕边有一朵落花\n早上梳洗时\n镜中有一朵落花\n中午散步时\n脚下有一朵落花\n黄昏回家时\n阶前有一朵落花\n\n我便想着：\n如果有一天我在黄昏死去\n你们在何处安放我的骸骨？\n\n当我想到这一点的时候\n窗外的桃花\n突然全部红了"}}, {"i": 15, "prompt": "以《哭泣或者遗忘》为题写一首现代诗。", "pk": "tp-017", "A": {"id": "42862bb4b4f1c8ab", "body": "哭泣或者遗忘。\n哭泣，把我们所知道的告诉你：\n他从你的赞美中取得了自信，\n他去寻求更肯定的批评；\n在你的讽刺里他重见了自己，\n在别人的掌声中他听到危险。\n\n你已厌倦了，你要歇息么？\n他却要加紧进行他的工作，\n他说他必须把你造成\n一个更复杂的人，一个真人——\n为了爱你而恨你，而痛苦！\n\n然而你爱着简单和真理，\n你宁肯哭泣或者遗忘。\n你怕你会错：你选择了遗忘。"}, "B": {"id": "e3b1b0e376373c31", "body": "哭泣或者遗忘：\n在时间中遗忘\n是我们的愿望\n但不能够。\n在我们之中哭泣\n是我们共同的记忆。\n\n哭泣或者遗忘：\n哭泣，是在他人的死亡中\n辨认出自己的死亡\n并说出自己的生命。\n遗忘，则意味着遗忘他人，\n也遗忘自己。"}}, {"i": 16, "prompt": "以《春日》为题写一首现代诗。", "pk": "tp-034", "A": {"id": "a8f3d8dfa8d80559", "body": "四月的风\n吹得桃花\n笑过了头\n而去年秋天\n贴上你门墙的\n那张红纸\n却早已随北风而去\n留下一片苍凉的空白\n不知该不该再补一张\n其实\n在你的眉间\n早有一张小小的地图\n只是未曾被\n那些叽哩呱啦的外来语填满\n而我总想用中文告诉你：\n春天来了！"}, "B": {"id": "71f989bbd4602054", "body": "四月的风\n吹动草原上\n成群的牛羊\n\n云在天上\n人在地下\n\n落雨了\n羊子们\n咩咩叫着\n闹雷公"}}, {"i": 17, "prompt": "以《海边的驱逐》为题写一首现代诗。", "pk": "tp-010", "A": {"id": "ccc696f9d40dd97a", "body": "1\n“……海啊，你是多少个黎明的见证，\n当你的大风在我阴郁的心上吹拂，\n我曾为你流过热泪；虽然现在\n我也为你悲哀——你有这样不幸的女儿。\n我是谁？我的罪恶有多深？\n为什么我把你的盐和你的波涛诅咒？\n\n“从什么时候起，我的心中有了这样的阴影，\n像一个黑色的大鸟，在我灵魂上栖息；\n它用毒汁喂养自己，并且不断的扇动它的翅膀\n使我在黑暗中迷失。于是我想逃开你——大海\n到那些没有你的气味、没有你的声音的地方，\n也许我可以忘记你，也许那里的天空是蓝的。”\n\n2\n“但是，没有你，我不能呼吸！\n我不能生活——没有你的风暴在我的耳边喧响，\n没有你的泡沫吻着我的赤裸的两脚，\n没有你的暗礁刺痛了我的爱情，\n我宁愿死在你的怀抱里，我愿意被你卷走\n投进深渊，只要你知道我曾经活过的意义。\n\n“我是一个孤独的人，我不能忍受寂寞，\n而你的声音使我发狂：当我听见了海潮\n在岸上叹息，或是乌云下涌来可怕的暗影，\n或是渔夫的船摇摆着，像一只垂死的鸟，\n于是我便疯狂地想把你抱住，把你撕裂，\n为了让你知道我的爱是这样残酷！\n\n“我愿化成一只鸟，或者一条鱼，或者一滴水，\n不管你是怎样把你自己的形态显现，\n我愿意跟你一同沉沦，跟你同飞翔，\n如果我能把你从一切苦难中救出——\n但你却把我的愿望粉碎，你对我狞笑着：\n‘如果你愿意，你可以得到我的一切。’\n\n“但是，只有你把我从你自己里面拯救出来，\n只有你能给我光明，因为我已厌倦了自己的生活，\n在这污浊的世界中，我渴望着死亡，\n我渴望着死亡——但不是毁灭，而是重生！”\n\n3\n“海呵，别拒绝我，让我投入你的怀抱，\n我已经厌倦了自己的生活，我要向你忏悔，\n因为只有你能了解我全部的秘密，\n并且能把我所犯的罪恶都洗去。虽然我曾对你有过\n不忠：当你平静的时候，我便觉得失望，\n于是我便投向陆地上那些虚假的女神们的怀里。\n\n“但是，她们不能满足我内心的渴求，\n于是我又回到你身边，虽然我常常怀疑，\n因为我曾经看到过许多善良的人们\n都被你吞食，他们曾为你哭过笑过，\n最后他们都沉默下去，好像从未存在过。\n所以我害怕，我不敢完全向你投降，\n\n“但是，除了你之外，我不知道"}, "B": {"id": "eb3923a19727c66c", "body": "海边的驱逐\n海上的驱逐\n海里的驱逐\n\n三重的驱逐啊\n这弃绝，这放逐，这被迫离乡背井\n在我们身上是如此沉重\n——我们的血肉之躯\n带着灵魂和骨骸\n一同奔向大海\n\n而大海是驱逐也是召唤：\n“到我怀抱中来！”\n于是我们走向大海。\n\n然而大海太远。\n我们的路程太远。\n从摇篮到坟墓，\n从人世到天堂，\n我们的行程太远。"}}, {"i": 18, "prompt": "以《秋语》为题写一首现代诗。", "pk": "tp-001", "A": {"id": "8c54cf2be3ee883f", "body": "1\n初秋的雨\n淅沥\n从昨夜便开始在窗口听秋了\n雨声中我感觉着屋宇的疏漏\n以及自己对季节之过渡的恐惧\n2\n秋蝉的鸣叫\n是在夏末开始的\n它们用尽全身的力量\n把生命的哀曲\n唱给风听\n风\n吹过木樨树梢时\n便带着几许哀伤的余韵了\n3\n白露\n一滴落在我的额上\n凉意渗透了层层皮肤\n以及血液\n我忽然想起\n今夜子时月将盈满\n4\n木樨开了\n开得并不惊心\n却颇动魄\n满阶的落花\n让清洁夫颇感棘手\n5\n秋天是肃杀的季节\n黄叶随风而舞\n草色亦不如春日之鲜美\n但秋菊的傲骨\n却可与雪梅争一日长短\n6\n落叶\n纷纷扬扬地\n跌碎在街衢上\n当寒风起兮白云飞\n流浪汉瑟缩于桥洞下\n对着瑟瑟的秋雨\n叹息人生多苦辛\n7\n深秋的天空\n雁阵向南去\n孤寂的旅人站在山巅仰首\n目送南飞的雁群\n直到夕阳西下\n8\n霜降之后\n冷气渐浓\n早晨出门发现\n自己的影子比昨日短了一截\n9\n立冬前一日\n偶然看到一只蝴蝶\n翩然飘落\n躺在地上\n它已不再挣扎\n不知它曾栖息于哪一朵花间\n10\n冷极了\n冬天\n终于来临"}, "B": {"id": "58be2c40b02a8acc", "body": "1\n初秋的天空蔚蓝\n是孩子们的天空，\n成群结队的鸽子\n飞向自由的方向。\n\n蓝天之下是一片新收割过的田野。\n一望无垠的大地\n闪着太阳的光芒。\n几株杨柳像长辫下垂\n在风中舒展柔美的身躯。\n\n2\n啊！又是秋天了，\n我们久别重逢；\n让我们紧紧拥抱，\n诉说思念之苦；\n\n啊！又是季节轮替，\n生命匆匆流逝，\n可否能把握永恒？\n我们仰望高高的天空：\n几只白鸽在俯冲、翱翔……\n\n3\n燕子已从北方万里迢迢返回故乡。\n花匠正移植一株从南方带来的美丽山茶，\n将它栽种于庭院。\n孩子们把风筝放上了天。\n\n这是秋日晴和的一天。\n人们无忧无虑，笑容可掬。\n但你听——一位流浪汉在街边喃喃自语：\n“……燕子归巢，\n而我却得四处漂泊……”"}}, {"i": 19, "prompt": "以《翻译秘诀十则》为题写一首现代诗。", "pk": "tp-013", "A": {"id": "ee8de90746056220", "body": "1.不要把你的母语的\n某些暧昧难明的曲折\n（它们是那么自然\n以至于你认为那是真理）\n强加给另一种语言。\n2.要警惕形而上的诱惑\n——那种超越语言大同小异的表达\n对词义作绝对化的解释，\n而忽略其具体情境和细微差别；\n不要满足于概念的大团圆。\n3.要避免用逻辑推理代替语言描述。\n4.在可能的情况下，尽可能地\n保留被译语言中的文化印记，\n包括方言土语和历史细节，\n以及那些已经失去意义的词语。\n5.注意节奏感，押韵有时重要。\n6.要尊重被译文本的风格，\n无论是华丽还是质朴，\n庄重或是诙谐，\n保持它原有的情感色彩和叙事方式。\n7.不要让自己的偏见左右翻译。\n8.不要试图改变原作的意思去迎合某种目的。\n9.忠实不是目的，\n而是一种过程，\n通过努力寻找最合适的表达。\n10.记住：翻译是一项再创造的艺术，\n它要求我们既要有严谨的学术态度，\n又要有丰富的想象力和创造力。"}, "B": {"id": "06faed9025edc8d8", "body": "1.不要把你的母语的\n某些枝头\n当作神的唯一的居所。\n2.不要把未完成的道\n当作绝美的音乐。\n3.要警惕那些在梦中\n不断游荡而无家可归者。\n4.不要把梦中的酒杯\n作为人生的惟一容器。\n5.不要让语言\n扼杀真理。\n6.要善待他人的语言\n如同善待自己的孩子。\n7.不要把梦中的食粮\n当作现实中的毒草。\n8.要把梦中的星光\n撒遍人间阡陌。\n9.要倾听他人的声音\n如倾听自己的心跳。\n10.不要用你的理性\n囚禁灵魂深处的火焰。"}}, {"i": 20, "prompt": "以《选择》为题写一首现代诗。", "pk": "tp-006", "A": {"id": "36cfe1a3295239cd", "body": "1\n“我愿意”和“我愿意长久地”\n哪一个更合乎逻辑？\n时间啊\n哪一个更能使你感到充实？\n哪一种方式\n较能肯定事物的本身？\n\n2\n我愿意长久地凝视着你，\n用我的一生凝视着你，\n凝视着你凝视过的一切：\n那小小的河流与树\n那爬满了青苔的墙壁\n和那条阴晴不定的天空。\n\n我愿意停留在你沉默的中心，\n像停留在海水深深的地方，\n四周是涌动着的人民。\n而他们将渐渐衰老，\n渐渐变为另外的人民，\n从你永恒的眼里流出，\n又被你的目光迎回来。\n\n3\n如果世界没有太阳，\n没有生命，\n没有梦，\n我愿意在泥土里沉睡，\n永远不醒。\n\n4\n或者，在风中飘荡，\n追逐那无家的云影，\n在水上，陆上，空中，\n无论我停留到哪里，\n我都将为你祝福——\n呵，大地，母亲！\n\n5\n当我厌倦了人类的声音，\n厌倦了这一切争吵和哭泣，\n我愿意走入深山，\n和野兽在一起，\n和寂寞的星月对话；\n当我厌倦了日光的刺激，\n厌倦了万物的形状和色彩，\n我愿意走入海底，\n和水草纠缠，\n任由海水冲洗着我的身体。\n\n6\n但是你知道，我已经选择了：\n我将把我的爱情交给人类\n和他们的苦难。"}, "B": {"id": "ee5a1abe0c6e1462", "body": "1\n“我愿意是山间的溪流，\n是山中的流泉；\n在幽深的涧谷里，\n在静寂的林间，\n我喜欢寂寞地\n唱着清透的歌：\n静静地，悄悄地，\n却把甜美的声音，\n送远到远方的人们的耳底。\n\n我愿意是草场的泉水，\n是草地的草叶，\n是大海的小鱼，\n愿给风带来远一点欢乐。\n\n我愿意是黄昏的湖水，\n是我自己的梦，\n是我自己的世界。”\n\n2\n但是，我们选择了太阳，\n选择了海上的风浪，\n选择了地层里的矿苗，\n选择了高空里的雁行，\n选择了人世里的光荣与悲苦，\n选择了人世里的纷争，\n选择了人世里的爱情与仇恨……\n\n3\n当我们选择了太阳，\n选择了海上的风浪，\n选择了地层里的矿苗，\n选择了高空里的雁行，\n选择了人世里的光荣与悲苦，\n选择了人世里的纷争，\n选择了人世里的爱情与仇恨，\n\n——我们就选择了流泪的眼睛，\n选择了沉重的脚步，\n选择了难安的心！\n\n4\n而我们却仍然要选择\n——选择人世里的光荣与悲苦，\n选择人世里的纷争，\n选择人世里的爱情与仇恨，\n选择流泪的眼睛，\n选择沉重的脚步，\n选择难安的心……"}}, {"i": 21, "prompt": "写一首现代诗，其中出现「脊椎」与「问题」。", "pk": "ip-027", "A": {"id": "ec5cb011437760d0", "body": "脊椎骨有病，他便\n在一张白纸上画下自己的症状：\n一串变形的钥匙。\n于是，问题就来自\n那把最末一次旋转过去而不能够再回来的\n锁。"}, "B": {"id": "2fe6632db942e6f8", "body": "脊椎骨有病，疼痛的\n是那条虫子\n在它内部翻筋斗\n据说：那是上帝的绳梯\n从那里\n他登上我们的头顶去工作……"}}, {"i": 22, "prompt": "以《庭院》为题写一首现代诗。", "pk": "tp-021", "A": {"id": "ca6db90014513c05", "body": "庭院内有三棵树：\n一棵苹果树\n一棵樱桃树\n一棵柿子树\n苹果是科学的果实\n樱桃是美丽的果实\n柿子是寂寞的果实"}, "B": {"id": "781c9fb041fc2658", "body": "庭院内有三棵树：\n一棵苹果树，\n两棵松树。\n\n它们在风和日丽的中午\n围起一片浓荫。\n\n苹果树是年龄最大的。\n它记得人世沧桑，\n记得许多老名字：\n——比如：玉堂春。\n\n现在，人们已忘记了许多熟识的面孔；\n但那些一度在此徘徊沉思、涕泗滂沱、感慨系之的名字如今却都镌刻在那两棵松树上了。那是两个妇人的名字；一个较长，另一个较短，但是同样哀丽动人。因此，这两株松树又分别称作“长名”和“短名”。她们常常从苹果树的浓荫中向人招手；说些很文雅的古语。\n苹果树也总是颔首致答，有时甚至连声叹息。\n\n孩子们则不太懂得这些道理，他们常常用树枝去搔胳肢这两个爱笑的女子。\n\n冬天来了，雪积在她们满披大雪的发间，\n于是，孩子们又围着她们歌唱……"}}, {"i": 23, "prompt": "写一首现代诗，其中出现「花粉」与「飞蛾」。", "pk": "ip-039", "A": {"id": "d0e3d91f79db19af", "body": "花粉的季节\n蜜蜂们忙于酿造幸福，\n人们却在谈论爱情，\n说它是一场梦。\n\n飞蛾的季节。\n夜色温柔而多情：\n无数的小灯被点燃，\n引诱那些蠢笨的飞蛾。\n\n其实我早想这样说——\n是春天欺骗了花朵？\n是爱情背弃了我们？……\n夏天，暴君般统治着万物。"}, "B": {"id": "5bf464ae1c3edc79", "body": "四月的风\n吹着南国的落发\n春风吹着南国的落发\n一朵朵\n飘落在我的门前\n被我一一扫进筐篓里\n在春天的早晨\n我的筐篓里装满\n一筐筐黑色的忧愁\n\n四月的风\n吹着南方的落发\n春风吹着南方的落发\n在春天的早晨\n我的筐篓里装满\n一筐筐黑色的忧愁\n\n在春天的早晨\n一只绿色的小蜜蜂\n闯入了我的心房\n在我的心里\n酿制甜蜜的忧伤\n\n小蜜蜂\n你是黄昏时飞来\n还是黎明中飞去？\n在春天的早晨\n你的翅膀系着多少根花粉的铃铛？"}}, {"i": 24, "prompt": "写一首现代诗，其中出现「河谷」与「黄河」。", "pk": "ip-028", "A": {"id": "137ce7e3c12b1fae", "body": "在河谷，在黄河的怀抱中\n牧羊人的木屋就是我的家，\n我是他的养子，是在他乳下成长。\n我从不记得自己的母亲。\n\n放牧着绵羊和山羊，\n我在旷远的原野上度过了童年，\n熟悉每一株草叶和小溪涧，\n还有那些古堡的幽深的穴窟。\n当我长大成人之后，我又随同父亲\n到邻近的村庄去做客；\n有时也随同他到山里去砍伐树木，\n背回来作柴禾、作建筑材料，\n或者卖出去换回粮食。\n\n在我少年的时候\n我常常陪伴父亲外出远行，\n我们骑乘着骏马，\n穿过阴沉沉的森林，\n越过那荒芜的崖岸，\n到了大山的那一边，\n我们又翻过几道山岭，\n才走到陌生的村落。\n这时太阳已经向西倾斜，\n天色渐渐暗淡，\n父亲便在村头的路口下马，\n把缰绳递给主人，\n然后走进茅房，脱下毡帽，\n向主人一家亲切地问好，\n主人也就热情地挽留我们在家中吃饭。\n等我们吃饱了肚子，父亲便要告辞，\n我又要陪送父亲走出村子。\n这时，我的心情总是十分愉快，\n因为我可以看到许多陌生人，\n听到一些动人的故事。\n\n在艰苦的岁月里\n我们曾受到土匪的袭击，\n有一次，我坐在车上睡觉，\n忽然听到了枪声，\n车子被劫，货物丢尽，\n父亲受了伤，卧床不起，\n幸亏后来终于恢复了健康。\n另一次，我们在夜里赶路，\n因为没有找到宿处，\n我们只好躲在山岩底下，\n露宿了一夜，冻得浑身发抖。\n\n然而最使我难忘的是\n在春天的早晨\n我在牧场上醒来，\n我呼吸着新鲜的空气，\n看到朝霞从原野升起，\n听到百灵鸟的歌唱，\n看到成群的鹿在林间跳跃，\n……\n这是多么美丽的时刻啊！"}, "B": {"id": "11dfcdc45c4b3b2d", "body": "在河谷，在黄河的怀抱中\n牧羊人的木屋正轻轻酣睡，\n而太阳却在他梦寐里舞蹈，\n使他深信明日是丰饶的一天。\n\n在河谷，在黄河的怀抱中\n牛、羊、马匹都在酣睡，\n梦见草木开花，水草茂美，\n于是夜气又将它们轻轻笼罩。\n\n在河谷，在黄河的怀抱中——\n我听见一片歌声从东方升起：\n“太阳出来哕！太阳出来哕！”"}}, {"i": 25, "prompt": "以《习惯》为题写一首现代诗。", "pk": "tp-025", "A": {"id": "3ab9ba5982188b4b", "body": "习惯把你的名字\n写在烟头\n然后把它\n丢进炉火中取暖\n而习惯又把你\n锁入一个冷冷的盒子\n用冬天抗拒冬天"}, "B": {"id": "b468c67fc33d6909", "body": "习惯\n是时间的债户。\n\n当太阳从窗口移向墙上的钟面，\n我们便习惯于把早晨的衣襟\n披上黄昏；\n当燕子在檐下衔来新泥，\n我们便习惯于把去年的草帽\n挂在今年的柳梢头。\n\n于是乎\n春花秋月都成了司空见惯的事物，\n而年华也被习惯得渐渐老去。\n\n其实，这全是时间的罪过。"}}, {"i": 26, "prompt": "写一首现代诗，其中出现「书桌」与「黑衣」。", "pk": "ip-021", "A": {"id": "ead4858a2cc15379", "body": "书桌上一枝蜡烛\n夜战时被敌军的炮火击中\n壮烈地倒下了，\n死前还高呼着：\n“打倒法西斯”\n\n另一枝轻蔑地冷笑着\n瞪视着桌面的一颗蝇屎，\n突然觉得自己太小，\n便伸长身子，爬到窗台上去了。"}, "B": {"id": "1ae0d80e4b3a5846", "body": "书桌上一枝蜡烛\n夜战小组的灯火\n突然熄灭\n（灯罩下\n五张绯红的脸）\n\n马门外\n桃花疾近\n催稿的短柬大如车轮\n花瓣纷纷\n凋落在\n军事地图的重要关隘"}}, {"i": 27, "prompt": "写一首现代诗，其中出现「头颅」与「躯体」。", "pk": "ip-002", "A": {"id": "0b6b55d350655b21", "body": "头颅和躯体，悬在旷野中，\n像一件从刚刚收割的麦田里\n拾起的谷禾。\n\n它那浓密的胡须\n垂在风中。\n它的眼睛\n曾经是绿色的。现在\n闭着。\n\n当秋雨降落，\n这头颅便低垂得更低了：\n仿佛承受着\n大地之外的一击。"}, "B": {"id": "7413d8132d0cc449", "body": "1\n“……如果在人脑里\n装着一个装满火药的炮弹，\n而炮管对着自己的心脏。”\n\n“……但是头颅是不能\n被砍掉的，它要\n继续活着。”\n2\n……头颅继续活着，\n但不再装有灵魂，\n而只是盛放\n从灵魂中流出来的血浆。\n\n没有了灵魂的头颅\n仍在活着，\n像一件摆出来给人看的展品。\n3\n……而灵魂却早已离开了\n被斩下的头颅，\n飞走了。但是它仍会回来，\n回到原来的地方安身。\n\n虽然灵魂已经飞走，\n躯体仍继续活着，\n并且活了很久很久。\n4\n……灵魂，当它还是个孩子的时候，\n就藏在母亲温暖的子宫里。\n\n灵魂，当它还是个婴儿，\n就已有了眼睛、耳朵和小嘴，\n能够感受外界的一切刺激。\n\n灵魂，当它长大成人以后，\n便住在头颅之中，\n就像住在一个舒适的壳里，\n可以保护自己不受伤害。\n5\n……因此，当灵魂被人用斧子劈开，\n一半留在躯体内，\n另一半随着头颅一起离开。\n\n因此，当一个人被砍下脑袋之后，\n他的灵魂便会随着头颅一起飞走，\n永远地逃离了肉体。\n6\n……但是那半边的灵魂仍然留在身体内，\n它依然拥有感官知觉，\n但却失去了思考的能力。\n\n因此，他无法理解周围的事物，\n也无法表达内心的感受，\n只能沉默不语。\n7\n……当灵魂离开躯体，\n躯体也就不复存在了，\n只剩下了一具空壳。\n\n因此，当灵魂被人砍下头颅，\n那颗脑袋也就不复存在了，\n只剩下一堆灰烬。\n8\n……因此，当灵魂被人砍下头颅，\n那颗脑袋也就不复存在了，\n只剩下一片荒凉的土地。\n\n而在这片土地上，\n曾经有一个生命在那里生活过，\n现在却化为了泥土。\n9\n……而在这片泥土之下，\n还埋藏着许多人的头颅，\n\n有的还在呼吸，\n有的已经死了，\n有的已经变成了白骨。\n\n有的还在思考，\n有的已经忘记了过去，\n有的已经忘记了未来。\n10\n……而在这片泥土之上，\n长出了茂密的树木，\n结出丰硕的果实。\n\n有的树很老，\n有的树很年轻，\n有的树很高大，\n有的树很低矮。\n\n有的果子很甜，\n有的果子很酸，\n有的果子很红，\n有的果子很绿。"}}, {"i": 28, "prompt": "写一首现代诗，其中出现「头颅」与「躯体」。", "pk": "ip-002", "A": {"id": "461695a64a35ff88", "body": "1\n在那高高的山冈上\n是谁的窗口这么亮\n是你推开黑夜迎接我\n如迎接新生的婴儿\n\n2\n在这之前\n我曾和你在田野走路\n去陌生的路上\n如今夜一样寂静\n\n3\n在这之前\n多少回我们一同藏起感情\n多少回你和我悄悄话\n说着说着就沉默\n\n4\n如今我们不愿隐藏\n也不愿有沉默\n如今你是我的心灵\n\n5\n是你的天空落下了月亮\n是你的身子使我安详\n而永远的秋天是你的梦\n你这山中的人\n\n6\n你站着，你human\n为了爱我而站在山冈"}, "B": {"id": "b30f71ec927d2e64", "body": "1\n在那高高的山冈上\n是谁喊出那样响亮的声音：\n“我是太阳！我是太阳！”\n\n谁听见了？\n风说：是山冈上的流云。\n树梢的鹌鹑扑翅而起，\n说是：大概是山那边的老金兵……\n\n2\n当夜半的流星闯进幽暗的湖沼\n睡眼惺忪的水妖抱住了他，\n用她湿润的乳房阻止着燃烧：\n\n“你是从我们湖里飞出来的吗？\n如果你答应，我就是你的恋人。”\n\n可那流星笑过几声就飞走了，\n并且对天作了几个揖。\n老金兵也听到了那声响亮如一斧槌：\n“我是太阳！我是太阳！”\n\n3\n在那高高的山冈上\n有人锯开了一条大树，\n一个种下了秧苗，\n另一个灌上了水。\n\n可是谁去听见了那一声雷鸣？\n谁去看见了那闪电如银？\n\n4\n在那高高的山冈上\n有一行向南的坟茔，\n立着几个蹲伏的雁形的大字：\n“解放十三省之先烈墓”。\n\n谁去问他们？在清明节，\n为什么他们埋着的魂灵\n却总是向着西南方向肃立？"}}, {"i": 29, "prompt": "写一首现代诗，其中出现「体温」与「长发」。", "pk": "ip-035", "A": {"id": "e17915388d3e2a8b", "body": "体温\n在你的长发间隐藏\n而你美丽的肌肤\n正把世界照亮"}, "B": {"id": "fe3e3a7c0e9a620f", "body": "体温\n和长发的\n香气\n是通往春天的两条小路\n我选择了你\n我选择了长发的你"}}, {"i": 30, "prompt": "以《庭院》为题写一首现代诗。", "pk": "tp-021", "A": {"id": "22826f37f9f80b49", "body": "庭院内有三棵树：\n一棵苹果树。\n一棵樱桃树。\n一棵柿子树。\n\n苹果红了，我不曾拾取。\n樱桃落了，我不曾拾起。\n柿子熟了，我拾了一筐。\n\n其余的\n仍在枝上悬着，\n仍在地上躺着，\n仍在空中飞着……"}, "B": {"id": "75466147e42bab0f", "body": "庭院内有三棵树：\n一棵苹果树，\n两棵松树。\n\n苹果树在左，\n一棵松树在右，\n另一棵松树在更西边一点。\n苹果树并不高大，\n叶子发黄了。\n秋天就要来临。\n\n我在扫落叶，\n将要扫到苹果树下面时\n忽然听到\n从树冠那个凉亭似的空间传来\n一声自嘲的独语：\n“唉，我多么向往\n一株法国薰衣草之哀悼啊……”"}}, {"i": 31, "prompt": "写一首现代诗，其中出现「河谷」与「黄河」。", "pk": "ip-028", "A": {"id": "71618e30e6ee16fa", "body": "在黎明中，在黄河的河谷\n太阳升起，并未带来多少光明。\n我沿着水渠步行，看见\n村庄里，几头黄牛\n正对着朝阳咀嚼它们的反刍。\n\n在河岸上，我看到\n一些采葵花的女孩\n像一群蜂子似的隐入葵花盘，\n直到她们的头发散发出香气——\n一种来自太阳的香气。\n\n太阳啊，你真是一个神奇的治疗师。\n当我凝望那一排透过树冠射进\n鸡群的身体，那些虚幻的光斑\n竟使它们的身子一跳一跳地动了起来：\n多么久以来我都不曾记得\n这些快活的小东西了！\n\n太阳把它的光线倾注到山边，\n使那个废弃已久的大坑\n变成了一个湖泊；\n而我在湖面行走着。为了显示我的力量\n我踏出大步，溅起的波浪\n被我的影子吞吃。\n\n太阳又上升了一些。\n在河谷里，风刮起来了。\n我站在水渠中间，看着两岸\n那些挺立的杨树——\n它们的细长的手臂在呼唤什么？\n它们的腰肢弯了下去。是的，我听见\n一阵阵低沉的呜咽\n如同竖琴的旋律从它们身上流出；\n接着它们站直起来，抖一抖身子\n让阳光再照得它们浑身发亮。"}, "B": {"id": "76628efbb4ffda47", "body": "河谷中\n有我\n埋头赶路的身影\n有时是三五成群的\n野羊\n\n黄河，就在身边流着\n在山西和陕西之间\n隔着一道晋陕大断层\n其间有一条古长城\n如今已多半为牧草所覆\n\n我是从雁门关外\n一路南行来的\n一路上\n只闻水声汩汩\n不见黄河一泓\n\n直到日近黄昏\n才远远望见一条土黄色的浊流\n像一条卧倒的大灰蛇似的\n自西向东蜿蜒而来\n\n及至逼近，方才知道那就是黄河了\n这时我忽然想起\n我的祖先\n曾在这里饮马\n\n而今我要渡过了\n我要到对岸去\n可是船夫在哪里？\n他是不是也像野羊一样\n散游去了？\n\n我于是脱下长衫\n涉入水中\n走向前去……"}}, {"i": 32, "prompt": "写一首现代诗，其中出现「女王」与「泪水」。", "pk": "ip-004", "A": {"id": "062b82d8fadbcd18", "body": "女王\n在她那座华丽的宫殿里\n向她的臣民们宣布：\n“我们都是水做的。”\n\n于是，人们开始哭泣了。\n\n其实，我是一个\n从未当过大臣的人，\n我甚至不曾\n领受过皇室赐给我的\n一枚小小勋章，\n因此我不相信\n女王的话，\n我相信我是火做的。\n所以当我\n从一堆厚厚的灰尘中站起来，\n抖抖身子，\n一阵风似的消失之后，\n我确信：\n泪水是假的，\n只有火是真的。"}, "B": {"id": "2029d80e37e23e34", "body": "女王把一顶王冠放在地上\n她从窗口看见一个卖火柴的小女孩\n也蹲在那儿\n她们谁也不认识谁\n却都拥有一样东西——\n一个空空的脑袋\n一个寒冷的冬天\n这时，小女孩划亮一根火柴\n照亮了那顶王冠\n这时，女王划亮一根火柴\n照亮了一颗脑袋\n这时，卖火柴的小女孩死了\n这时，女王死了\n而王冠上仍坐着一位女伯爵\n手握着她的鼻子"}}, {"i": 33, "prompt": "以《给晚霞命名》为题写一首现代诗。", "pk": "tp-037", "A": {"id": "be452fdddf2abcc7", "body": "1\n晚霞\n在城市上空\n燃烧着\n红得像一盘炒坏的\n五花肉\n\n2\n我们端起酒杯\n隔着千山万水\n去把\n洛阳城里那位老兄\n去年冬天埋下的那坛好酒\n挖出来喝\n\n3\n秋风\n从北方的第一座城门\n走了出去\n像一个沉默的客人\n他啥话都不说\n一路走一路看\n看到天黑才停下歇脚\n坐在石头上生火做饭\n第二天早上又匆匆上路\n不知去了何方"}, "B": {"id": "0e08ef0d4c58418c", "body": "1\n晚霞的美丽照见了旧日的城阙。\n在黄昏中，我们看见归鸟，归入了层层的\n浓稠的暮色。谁说这是一道淡淡的烟？\n\n2\n我仿佛看见：我们的祖先在山野，\n猎鹿者弯起了长弓，射倒了一大片\n悠闲的野牛；熊罴抖抖身子，从树上\n又悄悄地溜回了深深的谷壑；鱼鳖\n藏进了水藻……而采菊的人满载着秋实，\n踏上了归途。\n\n3\n我仿佛看见：我们的祖先在河滨：\n芦荻丛中，有舟，有人。是渔人。他的双手\n沾满了腥膻和血污；他狞笑着，向同伴炫耀着\n刚从水中捞起的一只鳄鱼，那鳄鱼\n扭动着，挣扎着，鳞甲闪着光……\n\n4\n而织女的手指在纺车旁，\n把棉桃纺成一缕缕丝线；\n染坊里，年轻的助手们\n正细心地，将一块块布匹浸染，\n涂上美丽的图案……\n夜已降临，街衢冷寂，\n我仿佛听见：一阵阵铜钱的叮当\n自店铺深处传来。\n\n5\n在城外，在月光照临下，\n有几辆篷车，装满了货物，\n吱呀呀摇了过来。骆驼队也来了，\n驮着许多皮口袋；他们卸下了\n货物，搭起了帐幕。在篝火下，\n他们围坐起来，一边烤着肉，\n一边唱着古老的歌谣……\n我仿佛听见。\n\n6\n而夜，渐渐暗了。浓稠的暮色\n掩盖了山川。只有天边，星星点点，\n像是燃烧着的炭火，映出了斑斓的光芒。\n是谁点燃了它们？我知道：我的眼睛闭起来了，\n但是，我却知道——\n在遥远的地方，人们\n已经点燃了无数盏灯……"}}, {"i": 34, "prompt": "以《从感觉出发》为题写一首现代诗。", "pk": "tp-009", "A": {"id": "26b996cab8792fa4", "body": "从感觉的原野，我们采撷\n那最富于色彩的花朵，\n为了把我们的生命染上\n一点深，一点浅的欢娱；\n\n然而却有一阵莫名的心悸\n潜入我们的血流里，\n叫我们不能够满足于\n眼前的花红柳绿，\n\n而渴望着一个无边的远景，\n虽然它永远是朦胧的——\n那是从感觉所生长出来的\n梦：冷淡的现实所孕育的梦。"}, "B": {"id": "b9743e0bd0747506", "body": "感觉\n是鸟\n在脑中\n飞过的痕迹\n有时是\n振翅而出的\n一瓣花\n有时是\n无声的惊呼\n有时是\n黎明时分\n突然升起于\n窗口的一朵笑\n有时是\n风中的\n一朵笑\n有时是\n从烟囱冒出的\n一朵笑\n有时是\n泪\n有时是\n火\n有时是\n冷\n有时是\n热"}}, {"i": 35, "prompt": "以《夜曲》为题写一首现代诗。", "pk": "tp-033", "A": {"id": "d226847d2bb17f09", "body": "夜曲。\n\n晚风在窗口徘徊。\n窗外的灯火像是红玻璃的花朵，\n映照着云影：时而淡紫，\n时而绛蓝。\n淡淡的星辉从林梢之上穿过\n夜色\n也显得朦胧了。\n偶尔传来一两声犬吠，\n几声虫鸣。\n还有，是远村中隐隐约约的笛声。\n我仿佛置身在一个梦幻之中……\n\n啊，夜曲！你是梦的织梭。"}, "B": {"id": "11a900fa9efeb771", "body": "夜色中我正梦见你\n梦到你睫毛的颤动\n突然有个人把灯打开\n你的脸儿像一面镜子破碎了\n而我又不能把你叫醒\n那梦就变成了真正的空虚\n你沉默着\n你的眼睛凝视着什么\n也许在想一个遥远的故事吧\n然而我却想拥抱你\n让你和我的影子合在一起\n当我熄灭了灯\n房间里一下子黑了起来\n你脸上的微笑也消失了"}}, {"i": 36, "prompt": "以《手艺》为题写一首现代诗。", "pk": "tp-027", "A": {"id": "7af7a55d559b8a04", "body": "——读《手艺的黄昏》\n\n我曾长久地注视他\n在街角的手艺人。\n他修造木屐，钉马掌，\n补锅盆……\n他的手锤出金属的\n一排星宿：金、木、水、火、土…\n\n我曾长久地注目于\n他弯了的背影。\n他仿佛是驼队的一头，\n向着远方的大漠走去。\n那隆起的背影\n恰似一位苦行僧的弥满袈裟。\n\n但是，当我穿过喧哗的大街，\n进入宁静的寺院，\n我看到卧佛庄严的侧影：\n肃然无声。"}, "B": {"id": "3f3763d384840b70", "body": "他的手像一块磨刀的石头\n是修钢丝床的手艺人\n是补瓷器的手艺人\n他修钟表和锁匙的手艺人\n他补伞的手艺人\n他有各种各样的小手钻\n他是穿耳眼的手艺人\n他装假牙的手艺人\n是接骨的手艺人\n他是理发的手艺人\n他是刮脸的手艺人\n是挖金鱼池的手艺人\n是种玫瑰草的手艺人\n……\n他修收音机的手艺人\n是制造爱情的手艺人"}}, {"i": 37, "prompt": "以《秋语》为题写一首现代诗。", "pk": "tp-001", "A": {"id": "cc984488e4d941c5", "body": "1\n初秋的天空蔚蓝\n是孩子们的天空，\n成群结队的鸽子\n如云彩，划过天际。\n\n2\n初秋的阳光明净，\n是孩子们的阳光，\n金色的光芒洒满\n一望无际的原野。\n\n3\n从原野升起炊烟，\n像五光十色的精灵，\n是孩子们的梦。\n\n4\n孩子们在林间小道上\n排成一行队列，\n如同一株大树整齐的枝杈，\n朝气蓬勃地前进。\n他们走向远方的田野，\n去收获劳动的果实。\n\n5\n金黄的玉米，\n红彤彤的辣椒，\n碧绿的黄瓜，\n还有紫盈盈的地瓜……\n这些多姿多彩的蔬菜，\n像宝石一样镶嵌在地盘，\n让大地闪烁着斑斓的色彩。\n孩子们兴奋极了。\n\n6\n孩子们在地里干活，\n有的挥舞镰刀，\n有的弯下腰来拔草，\n还有的蹲在地上培土，\n汗水从额角流到脖颈。\n\n7\n但是，太阳正西斜，\n天边涌起一片片橘红色的霞光，\n像是熊熊烈火映红半边天空，\n把世界烧得一片通红。\n这时，一群群牛儿，\n披着金纱缓缓从原野归来，\n它们悠闲自在地咀嚼着\n夕照下的青草……\n\n8\n是啊，初秋的天空蔚蓝，\n初秋的阳光明净，\n只有这样的天空和阳光，\n才配称是属于孩子的。"}, "B": {"id": "f0165d90a6ac5c47", "body": "——致林清玄先生：\n\n从那年秋天的枫林下\n我便记住了你\n一袭青衫挟着书香而来\n从此江南便多了\n一位饮茶赏月的诗人\n在烟雨中漫步\n在寒风中独行\n有时是几株枯木\n有时是一片落叶\n有时是一朵残花\n有时是一缕炊烟……\n\n而不论何时何地\n你的笔总在书写\n那永远也写不完的秋天……"}}, {"i": 38, "prompt": "以《翻译秘诀十则》为题写一首现代诗。", "pk": "tp-013", "A": {"id": "06864117d7a95c8f", "body": "1.勿忘形而上的存在\n2.不可迷信直觉\n3.切忌望文生义\n4.慎防误读原作\n5.莫要自我陶醉\n6.不可画蛇添足\n7.不可玩弄文字游戏\n8.切勿自命清高\n9.勿失之于片面\n10.不求完美，但求真实"}, "B": {"id": "033e8e383ff17dbc", "body": "1.勿忘形而上之玄思。\n\n2.勿使语词成为可触摸的实物。\n\n3.勿作概念之婢女。\n\n4.勿自命是超然物外的哲学家。\n\n5.勿掉入逻辑的陷阱。\n\n6.勿作理性主义者的梦呓。\n\n7.勿让直觉随风而逝。\n\n8.勿任情感受逐浪而去。\n\n9.勿作实证论者之孤魂。\n\n10.勿失之于唯美主义者之感伤。"}}, {"i": 39, "prompt": "写一首现代诗，其中出现「樟脑」与「身旁」。", "pk": "ip-014", "A": {"id": "498883abedd10ba7", "body": "樟脑的气味\n不知是谁的梦魇\n在夏天的正中\n像一只受伤的野兽，在徘徊。\n\n谁也不知道它将到哪里去。\n太阳照着，也流泪。\n没有一滴水\n能够落到它坚硬的头上。\n\n也许会遇见几只蝴蝶，\n可是它们怕这样的负重者，\n飞了一会儿又一起飞走，\n留下一个长长的影子。\n\n它来到一块草地上，\n躺下了。它想歇息一会儿。\n风轻轻吹着，\n把远处的声音\n送了过来：\n那是孩子们的歌声。"}, "B": {"id": "e302d9ab69ca3b67", "body": "樟脑的气味\n在阳光中\n缓缓上升\n我站在那里\n守着身边的白桦林\n一株，两株\n三株，四株……\n直到夕阳将我的影子\n投向最末的那一株"}}, {"i": 40, "prompt": "写一首现代诗，其中出现「下山」与「高山」。", "pk": "ip-030", "A": {"id": "ccc4b15848e93db7", "body": "下山的路多啊\n每条路都通向远方\n而我选择的是上山路\n一条向着更高的境界攀登的路"}, "B": {"id": "78849e0367962cbd", "body": "下山的路真长\n而且越来越陡\n腿\n酸得快断了\n而背上的包裹\n还愈来愈重"}}, {"i": 41, "prompt": "以《海边的驱逐》为题写一首现代诗。", "pk": "tp-010", "A": {"id": "98626096331ce7f4", "body": "1\n“……海啊，我们来自你，我们的父亲，\n大海啊，我们回到你，我们的心。”\n\n我们，已经回到大海了，可是为什么\n却感到这样陌生？\n\n在遥远的岁月里，我们的祖先\n曾经从这里出发，走向世界各个角落，\n他们用辛勤的劳动创造了历史，\n而今天，我们又回到了这片熟悉的土地。\n\n2\n大海啊，我们爱你，\n就像爱上了故乡的泥土一样，\n那里有我们的家，有我们的亲人，\n还有那永不消逝的记忆。\n\n但是，我们也要面对现实，\n看看这被污染的海水，听听那些嘈杂的声音，\n是不是也该好好地清理一下，\n让我们的孩子们也能在这里玩耍嬉戏？\n\n3\n大海啊，我们爱你，\n可是我们更爱的是你自己，\n一个纯洁而又美丽的地方，\n而不是现在这个样子。\n\n让我们一起努力吧，\n为了明天更加美好的生活，\n为了子孙后代能够继承这份宝贵遗产，\n让我们共同守护好这片蓝色的家园。"}, "B": {"id": "be12b615fac40210", "body": "1\n“……海啊，你是那\n古老的老人\n你的盐在大沙漠上流淌成河……”\n\n我听懂了。\n我听懂了他的歌。\n\n2\n当黄昏在海边升起\n一个浪\n打到了我的脚背上\n我惊呼：\n好疼！\n\n这疼直通到历史里\n从那里，我听懂了他的歌——\n“……海啊，你是那\n古老的老人。”\n\n3\n“……而我们是被你放走的小女儿，\n像小羊一样……”\n\n我听懂了。\n我听懂了他的歌。\n\n4\n当黄昏在海边升起\n一只船\n向大海深处驶去\n我惊呼：\n快回来呀！\n\n我惊呼的声音传不到船上去\n这船向着大海深处驶去\n我听懂了他的歌——\n“……而我们是被你放走的小女儿……”"}}, {"i": 42, "prompt": "写一首现代诗，其中出现「樟脑」与「身旁」。", "pk": "ip-014", "A": {"id": "d3cf0534ad9c57ee", "body": "樟脑的气味\n绕过篱笆\n潜入我的梦中\n我侧身躲避\n却撞进你怀里\n你温驯如一只猫\n你身上有月光的味道\n你用嘴\n尝我额上的汗\n你用舌头\n舔我睫毛上的露水\n而你的一双大腿\n像两片浓荫\n将我罩住……"}, "B": {"id": "886922abbd188794", "body": "樟脑的气味\n不知是谁的梦魇\n从窗口吹出去的风\n被夕阳染成了橘红色\n不久便迷失在青山脚下"}}, {"i": 43, "prompt": "写一首现代诗，其中出现「脊椎」与「问题」。", "pk": "ip-027", "A": {"id": "fb6d1a7ad6da522c", "body": "脊椎骨是竖起来的问题。\n\n当太阳从树冠上跌下来\n它们便以尖锐的刺背对着我们，\n把我们的影子钉在地里，\n让我们回答一个又一个的问题：\n——生命是什么？\n——死是什么？\n\n有时，我们仰卧在草地上\n看云朵在天空中飘游，\n但它们总是不肯告诉我们答案。\n直到夜幕降临，星星像一粒粒沙子洒落，\n才终于找到一种方式\n让我们在沉默中呼吸着空气。"}, "B": {"id": "1451b84598d26927", "body": "脊椎骨有病，他便\n在云间寻找另一条路。\n我见过他的背影，从一扇窗子到另一扇，\n永远是那么笔直。\n这一阵疾风，把他的\n笑语吹进我的屋子。\n他说：这儿太温暖了，\n我真想回到荒野中去呵！\n\n晚霞映红了天，\n他仿佛已乘着光浪赶出郊外去了。"}}, {"i": 44, "prompt": "以《我梦着》为题写一首现代诗。", "pk": "tp-003", "A": {"id": "365e355ac2df0519", "body": "我梦着\n天空的火焰\n和裸露的土地\n梦到刚刚降生的王子\n坐在王座上死去\n梦到血泊中漂满了百合花\n梦到在北方草原\n埋着的父亲\n双手扶持着\n一株光明的野葵\n我这样坐着做梦\n像一个黑人\n拖着哭声唱诗"}, "B": {"id": "082e359a252f9a35", "body": "我梦着，\n在日间也做梦。\n梦见我不在，\n正像现在，\n正像太阳\n从西边出来的时候。\n\n我的梦醒了，\n却更觉做了长久的梦——\n（谁知道有多久？）\n恍惚间，我在别处，\n我知道我在，\n虽然我不知道我是谁。\n\n那里是水，\n是你的眼睛：\n静静的呵！\n睡去了似的，\n睡去，好把你自己的梦\n给我。"}}, {"i": 45, "prompt": "写一首现代诗，其中出现「东方」与「时代」。", "pk": "ip-012", "A": {"id": "7cbe6b43996182cc", "body": "东方\n一株巨木\n横在太阳之肩\n以千年的姿容\n向世界\n伸展层层叠叠的叶子\n（东方\n是太阳\n之母）\n在每一轮\n日出之前\n东方都已起身梳洗\n为全人类\n铺一条金光闪闪的道路\n\n我们\n来自不同的国家\n不同的语言\n不同的文化传统\n却同样走向同一个方向：\n东方\n\n那是我们的家园\n在那里，\n一个时代的英雄们\n正从泥土中升起\n——他们的骨骼\n成为桥墩\n他们的头发\n飘起一袭旗帜\n他们粗壮的手臂\n撑起一片蓝天……"}, "B": {"id": "1494615a25cfddc6", "body": "东方\n一株巨木轰然倒塌。\n从树洞中看到的天空比往日更为广阔。\n而我们，已习惯在废墟上长大。\n\n太阳\n是最早的钟表。\n当它升起，人们开始劳动；\n当它落下，大家便去休息。\n只是偶尔有谁会停下手中的活儿，\n看云来云往，想心事，\n——那叫作“发呆”。\n\n风\n有时轻柔如母亲的手，\n把花儿们梳理得井井有条；\n有时狂暴似恶神的鼾息，\n吹得树叶哗哗响，吹得天旋地转。\n孩子们最爱追逐它，任凭它把自己吹得东倒西歪……\n\n雨\n没有缘由地下一阵。\n洗洗尘土也罢，浇浇庄稼也好，\n反正大地又湿润了许多。\n孩子们爱它；农民爱它；\n连最不喜欢它的人也在某个晚上\n突然梦见了它。\n可是，谁也不喜欢屋漏。\n\n火\n是一堆灰烬。\n一堆刚被利用过的灰烬。\n一堆被人遗忘在路旁的灰烬。\n一堆人视而不见的灰烬。\n一堆烟视默默的灰烬。\n一堆灰飞烟灭的灰烬。\n一堆令人感伤莫名的灰烬。\n\n人\n在山中行走。\n山中有很多人行走。\n他们行走，山也行走。\n他们走到哪儿，山就到哪儿。\n他们走了，山仍在走。\n他们走了千百代，山也走了千百年。\n永远没有人能追上山。\n\n夜\n黑得像一块抹过猪油的肥皂。\n黑得像一只偷吃燕麦的耗子。\n黑得像……唉！算了，干脆睡觉吧。\n月亮会替我照亮整个梦哩。"}}, {"i": 46, "prompt": "写一首现代诗，其中出现「地平线」与「祖国」。", "pk": "ip-003", "A": {"id": "3379119b51afa6f1", "body": "1\n在北方有无数城市，\n在城市中有无数餐馆，\n在餐馆里有无数人群。\n而我们，是这人群中的陌生人。\n\n我们是来自同一国度的同乡，\n为了午餐来到同一城市，\n来到同一城市中的同一餐馆，\n为了和新认识的朋友谈一谈。\n\n2\n让我们握手吧，朋友！\n你好，久等了。请坐。\n请用茶。请用面包和火腿。\n你的旅途很顺利吗？……\n\n啊，请不要生疏嘛，朋友！\n我们都是来自同一国土的同乡。\n这儿的一切都还习惯吗？\n你不是也觉得有点寂寞？\n\n3\n让我们碰一碰酒杯吧，朋友们！\n我祝贺你们在这里安顿下来，\n希望你们很快就能喜欢这里。\n请尝尝这道菜，这是很好的法国菜……\n\n啊，别客气嘛，朋友们！\n为了我们共同的事业，\n我们大家聚到一起，\n为了我们共同的事业干一杯！\n\n4\n我们的家人都还好吗？\n孩子们都还好吗？……\n愿上帝保佑他们平安无恙，\n愿上帝保佑他们幸福地生活着……\n\n啊，请多包涵，朋友们！\n我们的祖国正遭受着侵略，\n我们的家园正在受着摧残，\n我们都是来寻求新的生存。\n\n5\n让我们唱一支歌吧，朋友们！\n我们唱什么呢，朋友们？\n唱一支欢迎歌吧，朋友们！\n\n啊，请不要嫌我们噜苏，\n我们唱这支歌是为了我们的欢欣，\n为了我们的离别，\n为了我们共同的事业和前途。"}, "B": {"id": "8442918a5e65755f", "body": "——致诗人李日新\n\n……\n太阳从我们的背后升起\n在黎明中我们向东方行进\n我们走向那一片广阔的地平线\n那是一个伟大的国家，那是我们的家乡。\n\n那时候我们还年轻\n那时候我们在地上行走\n那时候我们正走向祖国，\n我们的祖国在远方召唤。\n\n那时候我们多么幸福啊：\n自由的风流过我们的头发，\n温暖的大地托起了我们的双足\n向着那光辉灿烂的未来前进。\n\n可是后来\n在那阴冷而残酷的日子里\n我们的血染红了天空和大海，\n我们的魂魄散失在阴暗的牢狱，\n我们的家园被敌人践踏成一片废墟……\n\n但是今天又来了一个黎明，\n我们再次走向那一片地平线，\n我们看见祖国已变得富强而且美丽。\n\n我们看见\n我们的人民团结得更坚强，\n我们的军队英勇无敌，\n我们的科学技术发展迅速，\n我们的心愿终于变成现实。\n\n啊！祖国，我们为你歌唱！\n啊！地平线，我们向你欢呼！"}}, {"i": 47, "prompt": "以《无题 二》为题写一首现代诗。", "pk": "tp-008", "A": {"id": "7bc862c19064717f", "body": "无题·二\n——致叶维廉先生\n\n在我们这没有神的日子，\n我们以血来补我们底信仰；\n我们以肉来补我们底情爱。\n然而在那没有神的地方，\n我们的血已化为一滩泥！\n我们的肉也只剩一堆灰！\n\n“然而在那没有神的地方，\n我们有神吗？”\n\n是啊，我们有神吗？\n我们在那没有神的地方。\n\n我们用我们的手去创造神\n在那没有神的地方。"}, "B": {"id": "2830f174d2617417", "body": "1\n月黑透了。山影是峭冷的古剑。\n马蹄下传来霜声。\n篝火堆里，残烟早已化为青灰。\n夜半风来，犹有土香。\n\n2\n黎明前还是那么静悄，\n山那边传来隐隐隆隆之声——\n莫非是远古洪荒之神\n正在那迷漫的云雾后面\n滚动他的巨眼？\n\n3\n太阳刚刚冒出地平线，\n山河便像熔化的银子般泛起了光晕。\n山鸟啁啾，林泉泠泠。\n一阵阵带草叶香的湿风，\n从四面八方向山谷汇聚……\n\n4\n骤然响起的一声炮鸣，\n把一切都炸成苍白。\n天地间只有时间在奔走……"}}, {"i": 48, "prompt": "以《我坐在一棵木头中》为题写一首现代诗。", "pk": "tp-016", "A": {"id": "de6d67c435933507", "body": "我是一株花\n住在古旧的瓶中，\n我有永远的香气，\n\n我是时间的俘虏。\n我是一株花\n在无人的地方开着，\n当蝴蝶来到我的身旁。\n\n你是看我\n从墙上褪色下来吗？\n我是时间的俘虏\n戴着假面具穿墙而过；\n我是一株花\n从墙上褪色下来了。"}, "B": {"id": "e2a38587026f7145", "body": "我是一株草\n我是一棵木\n我是木头中的火\n我是一团灰\n一滴泪\n一盏灯\n我是一张废纸上写下的姓名"}}, {"i": 49, "prompt": "写一首现代诗，其中出现「城池」与「我会」。", "pk": "ip-013", "A": {"id": "0528c227f14385ce", "body": "城墙上那面红旗在风中\n猛力张开的翅膀\n向我招手说：来吧！\n我曾是一个爱做文章的人\n用尽所有的比喻来描写它\n我甚至把它的血色比成\n乡间一位养蚕女的眼睛\n那时我从不怀疑\n我所热爱的是一片虚假的声音\n直到今天，当我赤裸着身子\n走向远方的山巅\n我终于发现那些山峰和河流\n都是些沉默而真实的言语\n我终于发现，只有这面红旗\n仍像一个永不疲倦的情人\n对着我，向我招手说：\n来吧，让我充满你的内心"}, "B": {"id": "7b0f1c033d00c90b", "body": "城池啊，在你的秋天\n在我的秋天\n我该说些什么呢？\n\n我真想把秋天\n比作一座城池，\n如今却有另一种想法：\n当我在秋天里走着，\n好像走进一座空了的城池，\n一切都还在那里，\n只是不见什么人！\n\n在那街上，那时——\n多么热闹啊，如今\n却是一片寂寞。\n我仿佛听见你在城里\n走来走去，但你总也找不到\n那一个会跟你说话的人，\n因为所有的人都走了。\n\n城池，我想念你，\n就像秋天想念那些\n已经过去了的日子，\n我也想念那些日子里的你，\n那时候我们还年轻，\n还不懂得那么多，\n现在却只能在这里，\n在这座空了的城池里，\n等待着下一个季节的来临。\n\n城池啊，我知道你还会回来，\n带着新的故事和风景，\n但我希望你能记得\n曾经在这里，有过一个我，\n也曾爱过这里的每一个角落，\n直到它们变得陌生而遥远。"}}, {"i": 50, "prompt": "以《我梦着》为题写一首现代诗。", "pk": "tp-003", "A": {"id": "5a5588abeffd091d", "body": "我梦着\n在秋天\n一个\n瘦小的\n穿白衬衣的\n中国少年\n捧着一卷线装书\n站在一条\n长长的石桥上\n\n想着想着\n就\n跌进\n那水中去了……"}, "B": {"id": "5876fd222a32dac8", "body": "我梦着，\n我在梦中看见了美丽的你，\n你站在高高的云端，\n穿着洁白的衣裳。\n\n我梦着，\n我的心里燃起一团火焰。\n那团火焰越燃越光明，\n直烧到太阳的中心。\n\n我梦着，\n你的脸红得好像要落下了，\n你含泪的眼光像是要笑。\n\n我梦着，\n我要向你奔来，\n让你在我的怀抱中哭泣、歌唱……\n\n醒来吧！\n从你沉睡的地方，\n让我把你抱在怀里，\n像风抱着花朵一样；\n\n醒来吧！\n你已回到我温暖的心里。"}}, {"i": 51, "prompt": "以《夜曲》为题写一首现代诗。", "pk": "tp-033", "A": {"id": "994b2c90b05be5b2", "body": "夜静，\n灯火\n在窗口\n耗尽了\n一盏又一盏……"}, "B": {"id": "cd64f35293c70d91", "body": "夜曲。\n\n我是一个诗人。一个来自东方的诗人。\n一个东方的忧郁的诗人。\n一个东方的忧郁的多思的诗人。\n一个东方的忧郁的多思的浪漫的诗人。\n一个东方的忧郁的多思的浪漫的孤独的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的颓废的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的颓废的悲观的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的颓废的悲观的可鄙的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的颓废的悲观的可鄙的令人厌倦的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的颓废的悲观的可鄙的令人厌倦的平庸的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的颓废的悲观的可鄙的令人厌倦的平庸的失败的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的颓废的悲观的可鄙的令人厌倦的平庸的失败的绝望的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的颓废的悲观的可鄙的令人厌倦的平庸的失败的绝望的不祥的诗人。\n一个东方的忧郁的多思的浪漫的孤独的落魄的潦倒的没有才华而仅有激情的阴冷的颓废的悲观的可鄙的令人厌倦的平庸的失败的绝望的不祥的病中的诗人。\n一个东方的忧郁的多思的"}}, {"i": 52, "prompt": "写一首现代诗，其中出现「书桌」与「黑衣」。", "pk": "ip-021", "A": {"id": "d35564736f89bc1c", "body": "书桌上搁着一杯水\n搁着一枝玫瑰\n桌上搁着一封信\n信上写着：别哭！\n桌子上还搁着一把火\n搁着一口井"}, "B": {"id": "aa763024751abb5a", "body": "黑衣诗人，在书桌上写着：\n夜是黑色的\n光也是黑色的\n灯是黑色的\n书也是黑色的\n字不是黑色的\n字，只是黑色中的白色"}}, {"i": 53, "prompt": "以《无题 二》为题写一首现代诗。", "pk": "tp-008", "A": {"id": "89c516ce54d28902", "body": "无题·二\n——致叶维廉先生\n\n在月夜的窗口我正梦见你\n梦着我们是一对黑水鸭\n悠游于你那片绿色的湖光，\n忽然有人敲门而且疾急\n说是：雨来了…………\n\n可是，老友啊！\n你那儿既有着远从峨嵋采来\n可供下锅的燃料的白石，\n又有着一屋子写作中之沉思，\n而我是住在一座风雨飘摇的\n茅屋里。\n\n所以，我不能邀你来这儿\n这儿没有你所爱好的风景。\n虽然，我知道你在来时的路上\n准要经过一场风雨，\n并且还要跋涉不少泥泞；\n但是我却深信你定会把车子\n停在一条生了青苔的巷子里，\n或者一所荒芜的小庙旁，\n然后步行前来和我说话，\n并且说：雨是晴朗的！\n\n老友啊！\n让我们一起到湖边去散步，\n且看我们的黑水鸭儿怎样地\n在雨霁后的波心追逐嬉戏，\n并且在黄昏的时候分饮一杯\n你特为酿造给我的酒汁。"}, "B": {"id": "9d19e5525f23e747", "body": "1\n月是今夜的心\n心是秋裳的月\n在水中的月\n是一对眼睛\n\n2\n今夜月亮的光辉\n是我对她的情谊\n月光照着我的心\n心照亮了她的脸\n\n3\n月亮照着她\n如儿子把母亲照亮\n此刻，我感到\n自己和大地一样渺小\n\n4\n月亮是她的眼睛\n也是我的眼睛\n我们在月光下品尝酒\n一枝黄花插在他头上"}}, {"i": 54, "prompt": "写一首现代诗，其中出现「落日」与「鸟巢」。", "pk": "ip-015", "A": {"id": "3165cbf173dfda58", "body": "落日的余晖在山头渐渐消逝，\n鸟巢空着，鸦声嘈杂，\n村外的小河沿岸长满了芦苇，\n芦花像是浸湿了雨点。\n\n秋天的天空显得格外深远，\n几只野鹭飞过，\n掠过收割后的田野，\n留下的一串脚印很快又被风抹去。\n\n远处传来一声枪响，\n也许是一个猎人，\n他的目标是那片茂密的灌木丛，\n那里藏匿着一只肥硕的野兔。\n\n夜色降临，星星开始闪烁，\n月亮慢慢升起，\n照亮了一条条小路和村庄，\n也照亮了一个个疲惫归家的身影。"}, "B": {"id": "d6666cd837017e84", "body": "落日中鸟巢的光辉\n被太阳逼出林子\n在天空中飘荡，在归人的头顶盘旋\n仿佛还在想着那个树\n那棵树想什么呢？\n\n归人突然想起\n在某一个黄昏\n他曾这样凝望过这只离群的鸟\n那时他多么渴望飞啊！\n从自己沉重的躯体中飞出来\n像这落日中的鸟巢一样地飞翔"}}, {"i": 55, "prompt": "写一首现代诗，其中出现「世上」与「花瓣」。", "pk": "ip-010", "A": {"id": "c90e59e79c0ce345", "body": "1\n“我愿意是山间的溪流，\n是山中的流泉；\n在幽深的涧谷里，\n隐藏着深深的忧郁。\n\n我愿意是草场的河流，\n静静地漫过无人知道的小河，\n\n闪着银鳞，在太阳下跳跃，\n给运河以生命，\n\n任羊群和牛经过我胸膛……”\n\n2\n“我是月光下的新娘，\n你是太阳底新郎。”\n\n3\n“我们如两只蝴蝶，\n恋过春天的艳阳，\n爱花儿，爱柳丝，\n也爱她们的死亡，\n\n我们曾为一片落叶跳开舞，\n又因一只蝴蝶而断肠；\n我们尝过蜜一样醉心的话语，\n又尝过刀片一样薄的感情。\n\n如今你和我就变成了一张旧信纸上的字迹，\n在人家的遗忘里衰老了，枯干了，\n只有那几行情诗还活着，在纸上，\n像一朵新鲜的花瓣。”\n\n4\n“我愿意是急流，\n山里的洪流，\n冲开拦路的巨石，涌向茫茫的海洋。\n\n我愿意是瀑布，\n是静静的火山，\n向黑夜吐出火红滚烫的岩浆……\n\n愿是奔腾的大海呵，\n掀起人类欢乐的浪……\n\n但，最让我喜悦的是：\n在秋天的果园里\n你和我\n并排地靠着果树\n沉默——沉思。”"}, "B": {"id": "1a0051bf9270b966", "body": "1\n世上的泪水\n收殓在一口谷仓\n2\n在两条河流之间\n村庄\n村庄中孤独的王\n3\n我是永恒的人\n我不朽的语言\n我在天空上\n我有一头大象\n我的灵魂\n打一只蓝色的小碗\n4\n在众神的花园里\n我就是上帝\n5\n王\n孤独而荒芜的国王"}}, {"i": 56, "prompt": "写一首现代诗，其中出现「东方」与「时代」。", "pk": "ip-012", "A": {"id": "8e22967627d8e2ef", "body": "东方\n有鸟\n衔领我们做梦的绳子\n飞走了\n时代的鼓点急促如逃遁之狼\n大山哪 请收藏我于一块冰中\n那年代久远得像一件粗瓷陶器\n东方的孩子 你们是东方一朵会笑的棉花\n\n大山\n藏起弓箭但没藏起心中的火炭\n于是牛毛洞口便多了几条溪泉\n东方的孩子 你们是东方一朵会笑的棉花"}, "B": {"id": "e5bc4c915810f313", "body": "东方\n一株巨木轰然倒塌。\n从它的年轮\n我们读出了历史的许多奥义。\n\n而我们永远失去了它。"}}, {"i": 57, "prompt": "写一首现代诗，其中出现「心脏」与「肢体」。", "pk": "ip-025", "A": {"id": "73f7b1b21aa995c5", "body": "1\n心脏跳动的瞬间\n那树死而复青\n在火中\n鸟儿睁开了双眼\n在灰烬中\n有果子成熟的清香\n2\n在岩石下\n我听见种子爆裂的声音\n一只受伤的小鹿\n穿过我的身体\n从伤口流出血来\n3\n大地倾斜了\n河流冻结了\n树木伸着腰肢睡去\n太阳也倦于燃烧\n宇宙是一只巨大的壳\n空空地\n盛满了黑夜和星光\n4\n风，吹着她的头发\n云，在天空上飘游\n草，摇晃着绿色的身体\n花，在断折的地方继续生长\n万物都拥有一颗不死的心\n5\n当太阳升起时\n露珠开始蒸发\n河里的水慢慢变冷\n石头被晒得发烫\n生命在阳光里滋长\n死亡随阴影来临\n6\n在这片原野上\n牛儿嚼食着青草\n马匹奔腾如疾风\n蜜蜂在花朵间忙碌\n孩童在树荫下嬉戏\n一切都如此和谐而美好\n7\n山峦起伏如巨兽之背\n海浪拍打着礁石发出轰鸣\n雷霆在远方滚滚而来\n闪电划破天际照亮一切黑暗\n暴风雨将临之前宁静而紧张\n8\n岁月流逝如流水一般\n青春不再，白发苍苍\n昔日的梦想已成为遥远的记忆\n泪水早已干涸\n只剩下对过往的回忆和未来的期待\n9\n爱情啊，甜蜜而又痛苦\n它让人心碎却又令人渴望\n在无数个孤独的夜晚\n我思念着你的温柔和美丽\n直至黎明到来，世界再次苏醒\n10\n死亡是一种解脱吗？\n谁也无法知道答案\n也许只有时间才能解答这个谜团\n让我们静静地等待吧，在这无边的沉默中\n直到最后一片叶子落下，最后一声鸟鸣消散"}, "B": {"id": "a09929cd95e7b691", "body": "1\n心脏跳着，跳着\n是那条河的波浪吗？\n\n是河流啊\n流动的血，我的血液\n流过石头，流过石头\n在石头中流动\n2\n我的头颅上立着鹭鸟\n像竖起了白色的火焰\n我用火把照亮河水\n我就是火王\n3\n我就是那流动的血液\n是血液淋湿了火\n我就是火\n我烧遍众神的尸骨\n4\n我烧遍众神的尸骨\n和肢体\n他们像一具破烂的房屋\n只剩下一片荒地\n5\n我从大海来到\n大海\n托负着我的骨骼\n使孤独的骨骼\n连在一起\n6\n我是河流的肺\n我在上面呼吸\n是鹭鸟的丈夫\n是岩石的情人\n7\n我看见你们\n我听见你们\n我们只有一颗心脏\n8\n心脏跳着，跳着\n心脏飞出鲜血，使大鸟飞翔\n9\n太阳乘手扶着河流\n河流流去\n那是我血液流淌的身子\n那是我心中悲痛的王\n10\n那时我含泪歌唱\n悲凉而哀伤\n11\n那时我含泪歌唱\n悲伤而哀伤"}}, {"i": 58, "prompt": "写一首现代诗，其中出现「下山」与「高山」。", "pk": "ip-030", "A": {"id": "35c70bbc3ff92c47", "body": "下山而去，\n如日落时分的一群白鹭，\n从高高的谷底，\n\n而我们是在更高的地方，\n在更高的山上，\n迎风而立。\n\n我们看到那下山而去的\n一队人马，\n他们已渐渐成为远方一条灰色的小溪，\n随着山路蜿蜒而前，\n愈走愈远，愈走愈细，\n终于消失于远方的地平线。\n\n然而，那条小溪却永远留在我们的记忆里。"}, "B": {"id": "27b5ba9b8bed94de", "body": "下山的路多啊\n每条路都通向远方\n而我曾沿着一条山路\n走进你的内心深处\n甚至我的血也有一部分是山中的水分"}}, {"i": 59, "prompt": "写一首现代诗，其中出现「落日」与「鸟巢」。", "pk": "ip-015", "A": {"id": "3a711e44db341bfd", "body": "落日的余晖在山头\n群鸟归林\n空山中回荡着寂寞的钟声……"}, "B": {"id": "534decf53fa3ecee", "body": "落日的余晖在山头\n群鸟归巢\n空山中回荡着牧羊人的吆喝"}}];
const KEY = "cyberpoet_prefs_M1";
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
function idx(){ for(let i=0;i<PAIRS.length;i++) if(!(i in labels)) return i; return -1; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(labels)); }catch(e){} }
function pick(v){ const i=idx(); if(i<0) return; labels[i]={choice:v,at:Date.now()}; save(); render(); }
function undo(){ const done=Object.keys(labels).map(Number).sort((a,b)=>a-b); if(!done.length) return;
  delete labels[done[done.length-1]]; save(); render(); }
function exp(){ const out=Object.entries(labels).map(([i,v])=>({
    prompt_key:PAIRS[i].pk, A:PAIRS[i].A.id, B:PAIRS[i].B.id, choice:v.choice}));
  const b=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="preference_labels.json"; a.click(); }
function render(){
  const i=idx(), n=Object.keys(labels).length;
  document.getElementById("n").textContent = n+" / "+PAIRS.length;
  document.getElementById("p").style.width = (100*n/PAIRS.length)+"%";
  const m=document.getElementById("m");
  if(i<0){ m.innerHTML='<div class="done"><h2>全部标完了</h2><p>点右上角「导出标注」保存结果。</p></div>'; return; }
  const p=PAIRS[i];
  m.innerHTML='<div class="prompt">'+(p.prompt||"（无题目文字）")+'</div><div class="row">'+
    '<div class="poem" onclick="pick(\'A\')"><h3>甲</h3><pre>'+esc(p.A.body)+'</pre></div>'+
    '<div class="poem" onclick="pick(\'B\')"><h3>乙</h3><pre>'+esc(p.B.body)+'</pre></div></div>'+
    '<div class="keys">← 选甲　→ 选乙　↓ <b>两首都不值得留</b>（哪怕一首没那么烂也按这个）　↑ 撤销</div>';
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") pick("A"); else if(e.key==="ArrowRight") pick("B");
  else if(e.key==="ArrowDown") pick("tie"); else if(e.key==="ArrowUp") undo();
});
render();
</script></body></html>
