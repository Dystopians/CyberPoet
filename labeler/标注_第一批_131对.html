<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>诗歌偏好标注</title><style>
:root{--bg:#faf9f7;--fg:#1c1a17;--card:#fff;--line:#e3ded6;--accent:#7c5c3e;--muted:#6b655c}
@media(prefers-color-scheme:dark){:root{--bg:#16151300;--bg:#161513;--fg:#eae6df;--card:#1f1e1b;--line:#33302b;--accent:#c79a6c;--muted:#9a938a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
font:16px/1.75 "Noto Serif CJK SC","Songti SC",Georgia,serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;z-index:9}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px}
.bar div{height:100%;background:var(--accent);border-radius:2px;transition:width .2s}
main{max-width:1100px;margin:0 auto;padding:20px}
.prompt{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
padding:12px 16px;margin-bottom:18px;font-size:15px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.row{grid-template-columns:1fr}}
.poem{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;cursor:pointer}
.poem:hover{border-color:var(--accent)}
.poem h3{margin:0 0 10px;font-size:13px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.poem pre{margin:0;font:inherit;white-space:pre-wrap}
.keys{margin-top:18px;color:var(--muted);font-size:14px;text-align:center}
button{font:inherit;padding:7px 14px;border:1px solid var(--line);background:var(--card);
color:var(--fg);border-radius:5px;cursor:pointer;margin-left:8px}
button:hover{border-color:var(--accent)}
.done{text-align:center;padding:60px 20px}
</style></head><body>
<header><b>诗歌偏好标注</b>　<span id="n"></span>
<button onclick="undo()">撤销 ↑</button><button onclick="exp()">导出标注</button>
<div class="bar"><div id="p" style="width:0"></div></div></header>
<main id="m"></main>
<script>
const PAIRS = [{"i": 0, "prompt": "写一首河流改道后的现代诗。桥还在原处，桥下长出高草，附近孩子把这里当作球场。", "pk": "cp-v1-006", "A": {"id": "8c4cb770c8b36eb2", "body": "桥墩的裂纹里游着几尾透明鱼  \n它们用鳃呼吸混凝土的裂缝  \n铁锈从铆钉深处浮上来  \n像某种未完成的告别  \n\n孩子们把球踢进水草丛生的弧线  \n鞋印在潮湿的苔藓上发芽  \n他们不知道这里曾是渡口  \n货轮的汽笛声沉入河床底部  \n\n我蹲下来数青砖上的螺蛳壳  \n某个清晨突然听见  \n石缝中传来旧时代的钟摆声  \n那时桥是脊椎骨  \n而今它只是地平线的残片  \n被风推着缓慢旋转"}, "B": {"id": "174e2a62dbdf5648", "body": "河改道了。我看见\n\n旧河道上的一座石桥——\n\n它的背影是那样忧伤。\n\n那桥下，河水的波纹，\n\n曾经多么亲切地摇荡。\n\n现在桥上却长满青草\n\n孩子们在这里踢球玩耍：\n\n“快！铲球！”“喂！传球！”\n\n河的另一边，一片荒凉。\n\n那河水流过桥头，\n\n不再流过这桥下的老地方，\n\n就像我们的记忆，\n\n被岁月推得越来越远。\n\n呵，我的青春！\n\n像河水般流向远方。"}}, {"i": 1, "prompt": "写一首关于图书馆归还箱的现代诗。雨夜里一本受潮的书被投进去，机器给出正常回执。", "pk": "cp-v1-019", "A": {"id": "d11f7146f469ce03", "body": "雨夜里一本受潮的书被投进归还箱\n一叠废纸从它身边滑过\n机器发出一声叹息\n吐出一张回执\n说一切正常"}, "B": {"id": "4be03b864cc806dc", "body": "潮湿的纸页在金属腔体内蜷缩  \n雨滴正从通风口渗入  \n某个编号代替了书脊的指纹  \n荧光屏亮起 一声吞咽  \n\n铁锈在暗处生长  \n折叠的黄昏被压成薄片  \n归还箱吐出绿字  \n像某种植物在水泥地里发芽  \n\n墨迹洇开成地图  \n而制度是永不闭合的折扇  \n我们反复练习如何将思想  \n塞进指定的凹槽  \n\n此刻 一册水渍正在归档  \n它将在某次检索中醒来  \n成为系统内部  \n一个无法解析的标点"}}, {"i": 2, "prompt": "写一首关于夜间无人仓库的现代诗。自动搬运车避开地上一只误入的麻雀，路线因此不断重算。", "pk": "cp-v1-025", "A": {"id": "317d056d9742f339", "body": "自动搬运车绕过麻雀  \n麻雀惊起  \n绕了两圈又落回原处  \n绕过一扇门  \n绕过一排货架  \n绕过一堆箱子  \n绕过一盏灯  \n绕过一道墙  \n\n避开了麻雀  \n避开了电线杆上的鸽子  \n避开了树上的知了  \n避开了池塘里的蛙  \n避开了大路上的一块砖  \n避开了草地上的一株花  \n避开了屋檐下的一只猫"}, "B": {"id": "cfe71f374b891ea9", "body": "金属脊背在黑暗中滑动  \n冷光切开寂静的腹腔  \n麻雀蜷缩成灰影  \n悬在激光的刃口  \n\n输送带吞下最后一块钢板  \n算法在云端反复折叠  \n路径如蛛丝垂落  \n重新编织成网  \n\n钢轮碾过锈斑  \n溅起细小的星尘  \n那只鸟仍站在原地  \n羽毛沾满电子脉冲的余温  \n\n叉车抬起货箱  \n阴影在墙上游移  \n像某种未完成的姿势  \n凝固在黎明前的指令里"}}, {"i": 3, "prompt": "写一首冬季渡口的现代诗：最后一班船离岸后，一只手套留在系缆柱上。", "pk": "cp-v1-008", "A": {"id": "09cf631b2f622f51", "body": "我看见最后那艘船\n\n驶向暮色苍茫的港口\n\n它留下了一只黑色的手套\n\n孤寂地挂在粗大的桅杆上\n\n仿佛一个诀别的姿势"}, "B": {"id": "bfc4a2a16c749efc", "body": "水声中最后一艘船远去，码头边\n一双手套挂在木桩上。\n风把它的指节吹得更粗壮了，\n仿佛一个冬天的寒流穿过指缝，\n将雪地中的脚印冻结——\n那手套上的毛色，像一片落叶\n披着霜白的冬日，凝固在空气里；\n而它原本属于某个人的右手，\n或许正被另一双手暖着。"}}, {"i": 4, "prompt": "写一首关于祖屋拆除前最后一次测量的现代诗。测量员报出数字，灰尘不断落在卷尺上。", "pk": "cp-v1-014", "A": {"id": "268e4b7768d7fa44", "body": "我用目光丈量这间老屋\n\n老屋如坐，容得下几百年岁月？\n\n从西墙到东墙\n\n五步一丈量，七步一标号\n\n像丈量一块被雨水泡软了的木料\n\n门楣上的雕花已经斑驳失色\n\n木楼梯扶手的铜把手已经生了绿锈\n\n梁柱间的尘埃像时光中浮起的一缕叹息\n\n窗外，树影婆娑\n\n屋外的风穿过了这栋房子\n\n也穿过了我的童年岁月\n\n房主是位白发老者\n\n他眯着一双昏黄的眼睛\n\n静静地注视着他的旧居\n\n他的脸庞如这栋老屋一般苍凉而温暖\n\n我突然觉得，他就是这栋老屋的主人\n\n老屋就是他身体的一部分\n\n老屋如坐，容得下几百年岁月？"}, "B": {"id": "c09d1ae36bac9a06", "body": "测量员的喉结滚动  \n像石块坠入深井  \n他读出最后一组数据  \n尘埃便从天花板迁徙而来  \n\n墙缝渗出盐粒  \n砖块在指腹下酥软  \n楼梯扶手蜷缩成问号  \n门框正以毫米为单位  \n缓慢地失去轮廓  \n\n木梁咬住自己的影子  \n钉子锈蚀成沉默的密码  \n窗玻璃内侧  \n有二十年前的蝉蜕  \n正在剥落  \n\n数字沿着墙体爬行  \n它们不是丈量工具  \n而是某种古老的咒语  \n此刻所有刻度都在呼吸  \n而地板下  \n旧时光正以厘米为单位  \n塌陷"}}, {"i": 5, "prompt": "写一首现代诗：老式电梯的指示灯逐层熄灭。让楼层数成为时间刻度，但不说破。", "pk": "lp-09", "A": {"id": "2bba81cb73648a16", "body": "32楼的灯泡闪了三下\n在夜色中缓缓亮起\n\n16楼的灯泡闪了三下\n在夜色中缓缓熄灭\n\n9楼的灯泡闪了三下\n在夜色中缓缓亮起\n\n6楼的灯泡闪了三下\n在夜色中缓缓熄灭\n\n5楼的灯泡闪了三下\n在夜色中缓缓亮起\n\n4楼的灯泡闪了三下\n在夜色中缓缓熄灭\n\n3楼的灯泡闪了三下\n在夜色中缓缓亮起\n\n2楼的灯泡闪了三下\n在夜色中缓缓熄灭\n\n1楼的灯泡闪了三下\n在夜色中缓缓亮起"}, "B": {"id": "b2cb8341332bcfdb", "body": "一十九  \n十八  \n十七  \n十六  \n十五  \n十四  \n十三  \n十二  \n十一  \n十  \n九  \n八  \n七  \n六  \n五  \n四  \n三  \n二  \n一  \n零"}}, {"i": 6, "prompt": "写一首现代诗，题材：清晨渡口的第一班船。", "pk": "fp-01", "A": {"id": "0b91c8d4139d6ec4", "body": "一只小船从天边摇来。\n\n船尾坐着个男子汉，\n\n他的长发被风吹得飘飘荡荡。\n\n他用一只手扶着舵把子，\n\n另一只手却向水中捞月亮。\n\n船头站着个白发苍苍的老太婆，\n\n她也用一只手扶着木栏杆，\n\n另一只手却向着水面撒花儿。\n\n他们好像在争论一个问题：\n\n“我年轻时比你年老时漂亮！”\n\n于是，他们各自摇橹而行，\n\n一个往西去，一个向东去。\n\n当他们的背影消失在朝霞里，\n\n一个红脸蛋的少年却悄悄地登上了那只小船。"}, "B": {"id": "e89db90acb5b6f3a", "body": "一叶小舟，从岸边划出，\n\n船头扬起一缕晨雾。\n\n远天的云霞，悄然染红了天际，\n\n水鸟惊飞，掠过水面的一缕涟漪。"}}, {"i": 7, "prompt": "根据《母亲的手》写一首现代诗。", "pk": "title:母亲的手:sys", "A": {"id": "4013676f4439e893", "body": "我曾在许多地方看到过你的手  \n摊开在一块粗布上  \n缝补衣服的指节弯曲如月牙  \n它们像一排小树，从指尖到手腕  \n从腕骨到前臂  \n从肘弯到肩头  \n\n我记得你第一次为我剪指甲  \n指甲盖里嵌着血痂，像黑色的小太阳  \n那一年，我在河畔的麦田割伤了脚踝  \n你把我的伤口含在嘴里，用舌头舔舐  \n直到疼痛被稀释成泪水，渗进泥土里"}, "B": {"id": "bd2ae0fd9e96e361", "body": "针尖在布匹上划出细小的银河  \n线头游走时  \n褶皱便有了年轮  \n\n她总把裂痕藏进袖口  \n像藏起一枚枚未拆封的月亮  \n掌纹里沉睡的种子  \n在黄昏时分悄然发芽  \n\n我曾数过她手背上的河流  \n每道沟壑都通向  \n一个未曾命名的清晨  \n\n当她的手指穿过我的发丝  \n时间忽然变得柔软  \n如同旧毛衣上  \n一缕被风抚平的毛边"}}, {"i": 8, "prompt": "写一首盐湖边废弃电影院的现代诗。银幕被风吹动，湖面的反光偶尔投进大厅。", "pk": "cp-v1-010", "A": {"id": "1c2d8c95bb7642e6", "body": "风是唯一的观众  \n银幕在黑暗中缓缓摆动  \n像一只疲惫的手  \n试图抓住  \n正在消失的影子  \n\n湖水的倒影  \n偶然进入大厅  \n像一扇打开的门  \n我们以为自己在看  \n而实际上  \n是它在看我们  \n\n幕布上残缺的画面  \n仍在诉说  \n一些无人知晓的故事  \n而我们只是  \n坐在黑暗里  \n等待下一个故事开始"}, "B": {"id": "9e7d6871a8d6a18c", "body": "一扇窗是暗红的，一排排椅子是黑的  \n银幕飘起风  \n一滴雨从天花板流下来  \n\n一盏灯灭了，又一盏亮起来  \n空荡荡的大厅里  \n满是水的声音  \n\n那水是蓝色的，那水  \n是透明的，那水是白的，那水是  \n咸的  \n银幕上是一片荒原，沙漠，  \n一个没有水的地方  \n一只野鸭子飞来，落在池塘里  \n\n一片荒原，一片湖泊  \n两只野鸭子游过去，一只飞走了  \n银幕上  \n有一群人走过来了，一排排座位  \n有人坐在那里，没有人坐起身来"}}, {"i": 9, "prompt": "写一首旧港口钟楼被新楼遮住后的现代诗。附近居民仍凭听不准的钟声判断涨潮。", "pk": "cp-v1-035", "A": {"id": "d998287a05714622", "body": "那座大石塔还在\n\n但已被高耸的新楼包围\n\n它那曾为全城人所听到的\n\n铜钟之响\n\n如今也常被隔断\n\n人们不再习惯地\n\n从声音判断潮涨潮退了\n\n只是偶尔有人会说：\n\n“今天又该涨潮了！”"}, "B": {"id": "dc9c55a1046d6c82", "body": "那口大钟还在敲\n\n但不再像从前那样清楚\n\n它总是在黄昏敲响\n\n钟楼在海雾中若隐若现\n\n当新楼盖起的时候\n\n人们发现钟声变得模糊了\n\n涨潮的时间也变了\n\n有些人开始依靠自己的感觉来判断\n\n是否该出门了"}}, {"i": 10, "prompt": "写一首退潮后的防波堤现代诗。石缝里卡着一只塑料玩具船，真正的货轮正驶向雾中。", "pk": "cp-v1-027", "A": {"id": "eb99670bafc720f3", "body": "在防波堤下边的石阶上\n我坐下来\n看海\n\n涨潮的时候是那样\n海浪把整个海岸都拥起来\n拥得很高\n涌得非常猛烈\n\n退潮之后却是这样\n海水又沉下去了\n石头裸露出来\n像许多赤裸的乳房\n\n我的身子紧贴着一块大岩石\n我的手伸开在另一块小岩石上面\n我在那里坐着\n一直坐着\n\n一直到晚霞映红整个天宇\n一直到月亮从海平面升起\n一直到夜色把我淹没在黑暗之中\n\n在防波堤的尽头上有一只木桶\n我看见它被海浪卷起，然后又被放下来\n在防波堤的尽头上有一只木桶\n木桶的里面盛满了海水\n\n在防波堤下边的石阶上有一群儿童\n他们用双手把木桶捧起来摇晃\n使水珠溅到他们的脸上和身上\n\n防波堤的尽头上有一只木桶\n木桶里面盛满海水\n防波堤下边的石阶上一群儿童\n他们在用双手捧起那木桶，摇晃着"}, "B": {"id": "6216903860c3dd53", "body": "潮水退去时  \n石缝里卡住一只塑料玩具船  \n它不再摇晃  \n\n货轮正驶向雾中  \n铁锈色的浪花  \n在混凝土裂缝里结痂  \n\n贝壳紧闭嘴唇  \n沙粒正在重新排列  \n某种古老的密码  \n\n海鸟掠过水面  \n衔走最后一片泡沫  \n而石头沉默如未完成的句子"}}, {"i": 11, "prompt": "写一首凌晨四点面包房的现代诗，把发酵、炉火与尚未醒来的城市放在同一时间结构里。", "pk": "cp-v1-003", "A": {"id": "81a96bc585f51596", "body": "四点钟了\n\n有人要起来\n\n揉揉眼睛\n\n看面包师如何在黑暗中制作光明\n\n我听到面包房在梦中翻了个身\n\n它将一捆一捆的麦芽\n\n塞进烤箱\n\n在炉子上点燃了黎明前的一堆柴火\n\n当街上的马车夫打着哈欠走出家门\n\n面包师也跟着伸了伸懒腰\n\n他用铁钳夹出一排金黄的面包\n\n这是他给全城人准备的早餐\n\n也是城市刚从睡梦中睁开的眼睛"}, "B": {"id": "41c3d46607277cbe", "body": "面团在沉默中膨胀  \n像一个未被命名的黎明  \n铁皮门吱呀，漏进几粒星子  \n炉火舔舐着黑暗，吐出金黄的裂纹  \n\n烤箱深处，麦香正在突围  \n蒸汽爬上玻璃，凝结成雾的指纹  \n街道仍蜷缩在梦里  \n而酵母早已开始搬运时间  \n\n面粉簌簌落下，如同雪  \n落在尚未睁眼的城市肩头  \n每一个气孔都在等待  \n被光撕开一道微小的缝隙"}}, {"i": 12, "prompt": "写一首关于小城公共泳池冬季排水的现代诗。池底显出褪色的泳道线，一个维修人员从深水区走向浅水区。", "pk": "cp-v1-030", "A": {"id": "85cf69359716922c", "body": "空荡的泳池像一只巨大的眼睛。  \n它的瞳孔是褪了色的蓝色泳道线，  \n水已抽干，剩下的一摊水，  \n正沿着排泄管汩汩地滴淌。  \n我看见了一个人，他的衣袖沾满水迹，  \n赤裸着上身，从深水区慢慢走来。  \n他走得有点吃力，像是在跋涉一片荒原，  \n脚下的泥泞正在一点点地凝固。"}, "B": {"id": "9095546b2bb27d62", "body": "空荡荡的泳池\n如一间被劫掠一空的教室\n它正等待新学期的到来\n像一个女孩坐在那里\n用一根粉笔描画着她的梦想\n\n那条蓝色泳道的白线已经褪了色\n像一张被岁月磨旧的地图\n我听见一个维修工人踏着水声走来\n仿佛踩着一只船儿向远方驶去\n\n我看见他在泳池的一角停下脚步\n凝视着那些裸露出来的瓷砖\n仿佛它们是某种密码\n正在诉说一个无人知晓的故事\n\n然后他开始用脚踩动地面\n好像在演奏一曲无声的乐章\n他一直走到泳池的另一端\n那里躺着几只浮漂\n如同搁浅的小舟"}}, {"i": 13, "prompt": "写一首以“没有寄出的语音消息”为核心事件的现代诗。不要呈现消息全文，只写录制、删除与周围环境。", "pk": "cp-v1-011", "A": {"id": "cdc9a0716228926e", "body": "我正要把你的消息录下来  \n电话突然断了线  \n\n再拨过去  \n却只听见一个女人的声音：  \n“您要查询的号码不存在……”\n\n我望着窗外  \n天还亮着  \n远处有几辆送奶车  \n一晃一晃地开过来"}, "B": {"id": "2fe1b0afde6c3ed7", "body": "我对着麦克风说了一些话  \n没有按下发送键  \n手指悬停在屏幕上方  \n像悬停在悬崖上方  \n\n窗外飘着雪片  \n阳台上的铁皮盆栽  \n被积雪压得摇晃  \n一只麻雀从树上飞起  \n抖落几片羽毛\n\n我删掉这段语音  \n又重新录了一遍  \n再次删除  \n反复数次之后  \n最终什么也没留下"}}, {"i": 14, "prompt": "写一首围绕修表匠午睡时的梦展开的现代诗。梦中所有钟表指向不同的潮汐时刻。", "pk": "cp-v1-007", "A": {"id": "3316b38b034eb250", "body": "铜针在眼睑上凿出涟漪  \n秒针游向搁浅的贝壳  \n他的喉结卡住了一枚生锈齿轮  \n\n午睡的褶皱里  \n石英开始分泌月光  \n发条蛇盘踞在枕下  \n吞吐着潮声  \n\n他梦见自己是座立交桥  \n每个岔口都悬着沙漏  \n雨水滴穿青铜指针  \n在玻璃穹顶下  \n凝固成盐粒  \n\n突然有鲸鱼从怀表深处浮现  \n用尾鳍拍打十二个时区  \n他伸手去接  \n却捞起半块正在溶解的黄昏"}, "B": {"id": "3c2d0001cb481601", "body": "中午，一个修表工在柜台前酣然入睡，梦到他修理过的那些表，都重新走动了，纷纷从桌上跳下，向大海奔去，表的表面显示着不同的时间。\n\n一只显示七点，一只四点过五分，一只二点半……到了海里，它们就是不同的潮水——有的高一些，有的低一些。\n\n于是大海变得丰富而复杂，波涛此起彼伏，仿佛许多心事在下面涌动。\n\n修表工仍在梦中，梦里有一只表已经停了下来——没有它就没有这平静的海面了。"}}, {"i": 15, "prompt": "写一首清晨垃圾转运站的现代诗。一面碎镜子在传送带上依次照见不同工人的手。", "pk": "cp-v1-031", "A": {"id": "3f8bbddc57385a5f", "body": "早晨七点三十分，一个搬运工把一堆垃圾倒进垃圾桶，另一个搬运工接着往车上装垃圾，第三个搬运工就将垃圾搬走。\n\n他们用铁皮桶装垃圾，用木柄铲子翻垃圾，用手推车运垃圾，最后用拖车拉垃圾。\n\n他们满身是汗，却还是笑着说：“多累也没关系！”\n\n他们穿破旧的衣服，却还是觉得好笑地说：“我们最懂幽默！”\n\n他们是垃圾工人，也是垃圾场里唯一还保留人性的人类。\n\n他们是城市里唯一的清洁工，更是城市里最值得尊敬的人类。\n\n他们就是这个世界上最不起眼的主角。\n\n但是在这个世界的另一端，他们却是别人心中的英雄。\n\n他们用自己的双手擦亮了城市的脸庞。\n\n他们是这个世界上的无名小卒，却又是这个世界上最伟大的人。\n\n他们是垃圾工人，也是我们心中永远的英雄。"}, "B": {"id": "4d15d4bbc531592b", "body": "镜子裂成六块，照见六个男人的掌心：\n\n第一个黑手背贴着一只小鸡，\n\n第二个白手背沾着几滴鱼肝油，\n\n第三个青手背粘着一块橡皮，\n\n第四个黄手背涂满沥青，\n\n第五个紫手背留着一指血痕，\n\n第六个红手背长着七颗金牙。"}}, {"i": 16, "prompt": "写一首植物园闭馆后的现代诗。一株夜间开花的植物无人观看，监控摄像头缓慢转动。", "pk": "cp-v1-013", "A": {"id": "ab52812d5ae1dba2", "body": "金属关节在暗处咬合  \n镜头扫过第七个回廊  \n一株蓝花正从褶皱里抽出触须  \n\n月光是液态的盐  \n渗入茎脉的裂缝  \n年轮在地下交换密码  \n\n铁门闭合的刹那  \n所有呼吸都凝结成霜  \n监控屏闪烁着  \n某种未被命名的绿"}, "B": {"id": "5f2d321b52e8966c", "body": "一朵花在暗处开放  \n监控镜头缓缓旋转  \n它的香气飘向空荡的游廊  \n\n一只夜莺在枝桠间鸣唱  \n它的歌声惊扰了黑夜  \n一只白猫悄悄爬出窗外  \n\n月亮升起了  \n照亮了整个花园  \n也照亮了一朵悄然绽放的花"}}, {"i": 17, "prompt": "写一首现代诗，题材：夜里加油站唯一亮着的那盏灯。", "pk": "fp-08", "A": {"id": "3d775bfa2b116c2b", "body": "油罐在暗处吞吐星辰  \n金属肋骨间渗出盐粒  \n汽油泵低吟  \n\n守夜人把影子浇进地缝  \n锈蚀的阀门咬住月光  \n一滴露水悬在黎明前……"}, "B": {"id": "6c62a4526086c8ea", "body": "夜，黑色的天使\n在风中旋转\n马达嘶鸣\n我的车\n滑进一个岔路\n一盏灯照亮了\n一个小小的停车站\n仿佛是宇宙唯一的中心……"}}, {"i": 18, "prompt": "写一首现代诗，题材：养老院窗台上晒着的一排药瓶。", "pk": "fp-06", "A": {"id": "ebb7d960d1d99784", "body": "一排药瓶，从老人的窗口伸出来了。\n\n它们像一群迟暮之鹤\n把最后的夕阳，衔向远方了结前世之缘。\n\n谁来拾取这满地的药片，\n谁来饮下这满地的苦水？\n\n谁来拾取这满地的药片？"}, "B": {"id": "7dc59daf56d40ffd", "body": "玻璃肚子里  \n漂浮着黄昏的倒影  \n塑料盖子咬住光线  \n\n金属支架托起  \n半透明的沉默  \n像某种未完成的钟摆  \n\n白色标签在风里  \n翻动身体的密码  \n每个名字都沉入底部  \n\n谁会来认领  \n这串沉默的星群？"}}, {"i": 19, "prompt": "写一首山中隧道维修夜班的现代诗。工人敲击岩壁，以回声判断空洞，偶尔有水滴落在安全帽上。", "pk": "cp-v1-012", "A": {"id": "e40c4f57d2b3f52f", "body": "一队矿灯，从石山深处浮来\n像一大把银钥匙，把地层\n打开\n\n当铁锤敲响\n我看见一群小人儿正忙于\n为大地打补丁\n\n叮\n当\n\n叮\n当\n\n他们用钢钎\n挑亮黑夜里\n每一颗星子"}, "B": {"id": "3e030008fd867ef6", "body": "你听到那凿岩机的叮咚，\n是黑夜的钟摆；\n岩石裂开了，\n山那边的灯火亮了，\n一束光从石缝里射出来。"}}, {"i": 20, "prompt": "写一首沙尘暴过后教室里的现代诗。黑板上昨天的公式仍在，窗槽积了一层细沙。", "pk": "cp-v1-016", "A": {"id": "2431594c428f3e3b", "body": "一粒沙子击穿玻璃\n\n像一声惊呼，惊动了整个课堂\n\n数学公式还在黑板上\n\n昨夜的风把它们吹得更清晰了\n\n窗外，风正卷着一地的沙砾\n\n从操场的角隅\n\n沿着墙根一路狂奔而去\n\n教室里，那道擦亮的三角函数\n\n仿佛也在向我们眨着眼睛\n\n好像什么也没发生过\n\n好像只是被一种巨大的宁静所取代\n\n窗外的天空依旧湛蓝如洗\n\n阳光斜斜照进来了\n\n照在黑板上的粉笔字迹上\n\n也照在我们的脸上\n\n照在那些还来不及擦去的一串串算式中\n\n只有课桌下的一把小扫帚还在那儿\n\n它似乎已经忘了昨日的风暴\n\n它似乎已经习惯了这一切\n\n而它永远也不会知道\n\n昨天曾经发生了一场怎样的巨变\n\n只有窗外的天空依旧湛蓝如洗"}, "B": {"id": "6d80d8a6c4064f85", "body": "粉笔灰与砂砾在窗台达成共识  \n静默堆积成某种地质纪年  \n\n三角函数仍悬于黑板右上角  \n像未完成的化石  \n\n风从裂缝中撤退时  \n留下几粒细沙在桌脚  \n缓慢结晶  \n\n午后三点钟方向  \n阳光斜切过空荡的座位  \n阴影在墙上游移如未归的标本  \n\n窗外的树正在脱落旧皮  \n而讲台上  \n一支半截粉笔  \n正被时间慢慢  \n磨成齑粉"}}, {"i": 21, "prompt": "写一首现代诗，题材：搬走后房东来收钥匙。", "pk": "fp-04", "A": {"id": "069ba595bb075deb", "body": "钥匙插进锁孔里了  \n我搬走了  \n我的书桌椅子  \n还有那把铁皮沙发  \n\n房东来了  \n他用钥匙开门  \n说我要把钥匙拿回去  \n我要走了  \n我的钥匙也走了"}, "B": {"id": "498227da551143d7", "body": "一扇门关了\n另一扇门开着\n我们已经搬走了\n而房东才来收钥匙"}}, {"i": 22, "prompt": "写一首以旧气象站为场景的现代诗。风向标坏了，但纸带记录仪还在走，值班员听见远处雷声。", "pk": "cp-v1-004", "A": {"id": "3cab64ac04f47cc8", "body": "金属肋骨在暮色中锈蚀  \n指针卡在东北方向  \n纸带吞吐着沉默的刻度  \n值班员数着漏电的秒  \n\n云层垂下黑色琴弦  \n雷声是未完成的赋格  \n他按下对讲机  \n电流里浮出半截名字  \n\n玻璃罩内  \n风向标停在某个错误的纬度  \n而记录仪仍固执地爬行  \n像蛇蜕留在旧壳上的纹路  \n\n雨滴敲打铁皮屋顶  \n每一声都像是  \n被遗忘的报告  \n在档案室深处发芽"}, "B": {"id": "4af937567dba0c52", "body": "旧气象站在暴雨后仍守着老规矩\n风向标坏了\n值夜的人听雨打铁皮屋顶\n如听到远天一声巨响\n他便用脚尖点地\n将一张张白纸送进纸带机"}}, {"i": 23, "prompt": "写一首关于旱季水库的现代诗。水位下降后露出旧村的屋脊，叙述者只在岸上观察，不进入回忆说明。", "pk": "cp-v1-002", "A": {"id": "133a05b40422a749", "body": "水瘦了，山就高了\n风穿过干涸的峡谷发出呜咽\n水面浮着几条死鱼\n像漂泊的尸体\n草叶蔫黄如秋叶\n牛群早已离散\n空旷的田野裸露着苍老的皮肤\n老牛伏在田埂上咀嚼一块草根\n它曾把春天拱成一个圆润的果实\n如今只能把土地刨出一寸寸裂缝"}, "B": {"id": "6dbd47c4419bf4e9", "body": "水位下降后  \n露出旧村的屋脊  \n青苔如锈蚀的铜锁  \n挂在残墙上  \n\n白鹭掠过水面  \n没有激起一丝涟漪  \n它们似乎知道  \n这里已不再是湖  \n\n有人从山外而来  \n坐在岸边抽着烟  \n望着水中倒影  \n像望着一具遗体"}}, {"i": 24, "prompt": "写一首矿区恢复成湿地后的现代诗。候鸟停在旧轨道旁，铁锈从浅水中显出。", "pk": "cp-v1-020", "A": {"id": "b958e9d02cfc15a3", "body": "候鸟停在旧轨道旁  \n铁锈从浅水中显出  \n像某种褪色的密码  \n\n挖掘机的齿痕仍嵌在地层褶皱里  \n苔藓正缓慢咬合那些金属的伤口  \n去年埋下的种子  \n如今浮出水面  \n成为芦苇丛中  \n一簇簇银亮的呼吸  \n\n风把矿坑吹成凹面镜  \n反射出更早的年代  \n那时推土机尚未碾碎地平线  \n一只白鹭曾在同样的位置  \n啄食水中的星辰  \n\n铁轨在黄昏中生锈  \n而新芽正在裂缝里  \n练习如何避开  \n旧日的阴影"}, "B": {"id": "47bd48c008bb7a71", "body": "候鸟栖息于铁路之侧  \n一列火车正驶向远方  \n铁锈浮现于水浅处  \n\n荒野之中的芦苇丛生  \n沼泽地之上的天鹅嬉戏  \n昔日煤灰覆盖的土地上  \n草木繁茂  \n林中鸟鸣声声  \n\n曾经矿工们辛勤劳作的地方  \n如今已变成大自然的一片绿洲  \n孩子们放飞了梦想  \n父母们踏上了幸福之路"}}, {"i": 25, "prompt": "写一首关于一台老式电梯的现代诗。它每天在十三层短暂停顿，楼里却没有十三层按钮。", "pk": "cp-v1-017", "A": {"id": "056619e2ce26628a", "body": "13楼是假的。\n这台破旧的电梯在13楼停顿，\n门一开就是荒芜。\n有人在那儿站过，\n有人在里面哭过，\n也有人在那里面生了孩子。\n\n楼里没有13楼的按钮。\n谁要上13楼，\n只能从14楼下来，\n或是从地下室上去。"}, "B": {"id": "43c5d6b051939d19", "body": "金属喉咙吞下最后一粒光  \n锈蚀的齿痕咬住黄昏  \n十三层的门从未开启  \n却总在深夜发出叹息  \n\n指纹在面板上结出盐霜  \n数字沉默如未寄出的信  \n有人把名字刻进按键凹陷处  \n以为这样就能抵达某个未被命名的维度  \n\n电梯在第七次停顿后  \n开始讲述一个没有结局的故事  \n楼层指示灯眨着眼睛  \n像守着秘密的哑巴  \n\n我们习惯了这个缺失的数字  \n如同习惯夜晚比白天更真实  \n而那道门后  \n或许藏着所有未曾发生的可能"}}, {"i": 26, "prompt": "写一首发生在末班地铁停运后的现代诗：一个清洁工在空站台发现一枚仍然温热的硬币。不要解释硬币的来历，让动作和声音推动诗。", "pk": "cp-v1-001", "A": {"id": "d83401c16413b84d", "body": "金属在掌纹里发烫  \n他弯腰时听见铁轨吞下最后一声叹息  \n拖把划过地面  水渍漫过瓷砖的裂痕  \n像某种未完成的句号  \n\n通风管道漏出旧报纸的气味  \n他捏住那枚硬币  像攥紧一枚未熟的果核  \n指节泛白处  有锈迹在缓慢结晶  \n楼梯间突然传来玻璃碎裂的声音  \n\n他抬头  看见自己的影子正被月光折叠  \n成一张褪色车票  \n站台尽头  有人用脚尖踢动  \n一串沉默的纽扣"}, "B": {"id": "88ff8abf0efccfe5", "body": "凌晨两点，末班列车进站了\n月台上只有一盏灯亮着\n两个戴鸭舌帽的男人走了进来\n他们把烟灰缸扔给了清洁工\n又将一元硬币丢给了清洁工\n然后说：我们下一辆车会回来\n说完就消失得无影无踪\n\n而那个清洁工却独自坐在台阶上\n一边听着列车缓缓驶出轨道的声音\n一边摸着手中的硬币喃喃自语道：\n这枚硬币真温暖啊……"}}, {"i": 27, "prompt": "根据《晚风》写一首现代诗。", "pk": "title:晚风:sys", "A": {"id": "3c4ef0f2e913c761", "body": "黄昏的褶皱里  \n风在玻璃上画出裂纹  \n一滴水悬停于窗台  \n倒映着未完成的句子  \n\n树影摇晃  \n像许多沉默的手指  \n试图解开  \n被时间缠绕的绳结  \n\n远处传来钟声  \n碎成羽毛  \n落在无人拾起的  \n旧信封上  \n\n我站在门口  \n看风把门缝  \n吹成一条细长的河  \n而所有未说出口的话  \n正在其中缓缓漂浮"}, "B": {"id": "0f97c7b89081f3dd", "body": "我看到一匹马走进了夜色\n\n它的鬃毛被夕阳剪断"}}, {"i": 28, "prompt": "写一首夜班便利店换价格标签的现代诗。店员发现一件商品连续三次涨价，而窗外第一场雪刚落下。", "pk": "cp-v1-033", "A": {"id": "96eeea11820031a6", "body": "货架一格格翻动着黑影\n店员的白围裙被冻成了白大褂\n三块三到五块五\n再加到八块七\n他像钟摆那样从这一排走到那一排\n把标签撕掉贴上\n他的手比窗台上的月光更苍白\n雪片飘进来了\n落在那件商品上\n那件商品是暖瓶"}, "B": {"id": "f88e8d00baf80f9c", "body": "荧光屏蓝光漫过货架\n数字在塑料贴纸里缓慢生长\n第五次核对时\n那罐咖啡的价格已爬上三楼\n\n玻璃门外 雪片正将城市折叠成\n某种未命名的几何体\n冰棱悬在空调外机边缘\n像等待签收的快递\n\n他摘下眼镜\n看标签与商品之间\n浮出透明的税\n而暖气管发出轻微的叹息\n仿佛整个冬天\n都卡在了价格带的褶皱里"}}, {"i": 29, "prompt": "写一首凌晨渔船回港的现代诗。一名年轻船员第一次看见城市灯光倒映在装鱼的水箱里。", "pk": "cp-v1-023", "A": {"id": "bbad19fdff69514c", "body": "渔火，被月光洗亮了，\n\n白帆上缀着星星点点的泪光。\n\n当渔人摇橹归来，夜航船拖着长长的黑影驶入港湾。哗的一声，渔网撒开了，撒开了……\n\n他忽然想起自己那艘小船，正泊在灯影朦胧处。\n\n他忽然感到自己的船也该撒一网了。\n\n于是，他走进灯火辉煌的城市，像一条刚脱了壳的小螃蟹似的，张开双臂，四处窥探。"}, "B": {"id": "70f56423f34770d2", "body": "渔火，被浪涛洗亮了——  \n天光未启的港口，  \n晨雾像一缕银丝。  \n\n他仰头饮尽最后一口淡酒，  \n把烟蒂踩灭，  \n推开了船舱门。  \n\n水面泛起一层红晕，  \n仿佛是新采的菱花。  \n昨夜，那渔火多明亮啊！  \n它照亮了河岸上的一排木桩，  \n也照亮了他心爱的姑娘……  \n\n当渔船靠了码头，  \n他望见自己的脸庞，  \n在清水箱里晃荡着。  \n那一刹那，  \n他忽然惊异，  \n这城里的人们呵——  \n是否也在某处的水箱里，  \n映照着他们的悲欢？"}}, {"i": 30, "prompt": "写一首关于祖屋拆除前最后一次测量的现代诗。测量员报出数字，灰尘不断落在卷尺上。", "pk": "cp-v1-014", "A": {"id": "8cdd9ef9dbcb58d2", "body": "1.09米\n一扇窗的宽度\n\n1.46米\n一个门的高度\n\n2.55米\n一间房的深度\n\n3.45米\n一条梁的跨度\n\n5.20米\n一道墙的长度\n\n7.54米\n一幢楼的高度\n\n22.62米\n这间老屋的周长"}, "B": {"id": "268e4b7768d7fa44", "body": "我用目光丈量这间老屋\n\n老屋如坐，容得下几百年岁月？\n\n从西墙到东墙\n\n五步一丈量，七步一标号\n\n像丈量一块被雨水泡软了的木料\n\n门楣上的雕花已经斑驳失色\n\n木楼梯扶手的铜把手已经生了绿锈\n\n梁柱间的尘埃像时光中浮起的一缕叹息\n\n窗外，树影婆娑\n\n屋外的风穿过了这栋房子\n\n也穿过了我的童年岁月\n\n房主是位白发老者\n\n他眯着一双昏黄的眼睛\n\n静静地注视着他的旧居\n\n他的脸庞如这栋老屋一般苍凉而温暖\n\n我突然觉得，他就是这栋老屋的主人\n\n老屋就是他身体的一部分\n\n老屋如坐，容得下几百年岁月？"}}, {"i": 31, "prompt": "写一首雨季种子仓库的现代诗。屋顶漏水，保管员把不同年份的种子一袋袋移到干处，标签逐渐模糊。", "pk": "cp-v1-036", "A": {"id": "d560c8fa0c9bbe80", "body": "潮湿的屋檐上滴着水\n我们把新种子装进旧袋子\n把旧袋子放在旧箱子\n把旧箱子抬到高高的架上\n那怕是秋天来得太早了\n我们还留着去年的谷子\n和前年的麦种\n在这些箱子里我们还留着\n更老的豆子和高粱\n它们都长得很好\n只是没有名字了\n因为标签都被雨水洗掉了"}, "B": {"id": "de4060137e4d0d7a", "body": "潮湿在天花板上爬行  \n铁皮桶渗出年轮  \n保管员用肩膀顶住漏雨的缺口  \n一粒稻种从他指缝滑落  \n\n标签正在褪色  \n像那些被遗忘的名字  \n麻袋在墙角堆积成山  \n每一道褶皱都藏着未发芽的春天  \n\n雨水漫过脚踝时  \n他数了第七个空仓  \n锈蚀的钥匙在锁孔里打转  \n门轴发出远古的叹息  \n\n抽屉深处躺着1987年的玉米  \n玻璃纸剥落成蝉蜕  \n霉斑在纸页上蔓延  \n如同某种隐秘的翻译  \n\n忽然所有钟表停摆  \n漏斗倒悬着将黄昏注入地窖  \n他伸手接住一滴水  \n掌纹中浮起无数未命名的黎明"}}, {"i": 32, "prompt": "写一首围绕修表匠午睡时的梦展开的现代诗。梦中所有钟表指向不同的潮汐时刻。", "pk": "cp-v1-007", "A": {"id": "e6dcc062a10b5ef7", "body": "他的午休是钟表的黄昏  \n指针游走于蓝光之间  \n在幽暗的小房间  \n一扇门后堆满了时间  \n\n一只鸟儿停在他的肩上  \n他看见了潮水的退却和上涨  \n月亮是一枚银币  \n正在桌上旋转  \n\n他梦到自己走进一个深巷  \n那里钟声在风中回荡  \n一片荒芜的海滩上  \n有一艘破船搁浅  \n\n海浪拍打沙滩  \n发出阵阵喧哗  \n一条木梯伸向大海深处  \n有人正沿着它爬下"}, "B": {"id": "7ffc34f98dd90fcf", "body": "他枕着齿轮的震颤入睡  \n铜锈渗入睫毛  \n一只怀表在耳畔涨潮  \n\n梦里所有的指针都游动起来  \n分针划开水面  \n秒针在浪尖跳跃  \n时针沉入海底  \n数着沙粒的呼吸  \n\n他的手悬停半空  \n试图拧紧时间的裂缝  \n却摸到一片贝壳  \n壳内传来遥远的滴答声  \n像某个未被命名的黎明  \n正在缓慢苏醒"}}, {"i": 33, "prompt": "写一首现代诗，题材：夜里加油站唯一亮着的那盏灯。", "pk": "fp-08", "A": {"id": "fb7caa0b8d884d01", "body": "夜色像一个巨大的油罐车，\n静静停驻在公路边。\n而唯一的光是那盏小小的灯，\n照亮了油箱上的一朵小花。\n那是一朵蓝色的风信子。\n它的香味随风飘去……"}, "B": {"id": "8b1bd16761ff5954", "body": "油箱吐出最后一口叹息  \n铁皮桶吞下整个夜晚的沉默  \n柴油在喉间凝结成霜  \n\n守夜人把影子浇进水泥地  \n黄铜开关咬住时间的关节  \n锈蚀的光沿着管道爬行……"}}, {"i": 34, "prompt": "写一首清晨海鲜市场的现代诗，从一块正在融化的冰的视角观察摊贩、鱼鳞和天光。", "pk": "cp-v1-015", "A": {"id": "a87db7e35aaaac72", "body": "我的棱角正在消失  \n水珠沿着纹路爬行  \n像某种隐秘的语言  \n摊贩用刀背敲打木板  \n金属碰撞声漫过潮湿的褶皱  \n\n鱼鳞在晨光中翻转  \n银屑簌簌飘落  \n如同被遗忘的密码  \n我听见鳃裂开的声音  \n腥咸的风灌进每道缝隙  \n\n天光斜切下来  \n将影子钉入水泥地缝  \n有人弯腰拾起我的残骸  \n指腹擦过冰面  \n留下一道湿润的刻痕  \n市场尚未苏醒  \n而我已经融化成  \n一汪透明的沉默"}, "B": {"id": "c6721c2621d776d3", "body": "我的脊背是湿漉漉的一片冰\n我凝视着水族箱里的银鱼\n它们在灯光下像一排发亮的小刀\n一个渔人把一条大鱼摔在我的胸上\n血溅了开来\n像玫瑰花似的美丽\n卖蛤蜊的妇人用铁铲敲打着贝壳\n发出清脆的声音\n好像敲击着我的头颅\n阳光照到了我脸上\n我感到温暖而舒服\n我的身子开始融化\n流下了一滴滴晶莹的水珠"}}, {"i": 35, "prompt": "屠宰场清晨冲洗地面的水流进下水道｜不出现动物，只写水的颜色", "pk": "sc-004-f4", "A": {"id": "ee98fcbc123d5de1", "body": "水在地面拖出一道青黑的舌\n金属管喉中涌出冰凉的呼吸\n暗流卷走昨夜的残影\n沉默在沟槽里沉淀\n\n清洁剂撕开旧日的皮肤\n泡沫浮起褪色的光斑\n水纹漫过砖缝的裂痕\n像某种未愈合的伤口\n\n灰蓝渗入水泥的毛孔深处\n带走所有名字与形状\n只剩下空洞的回响\n在管道尽头凝结成霜。"}, "B": {"id": "6c774635f3b89ec5", "body": "水在地面漫漶\n铁锈渗入波纹\n暗红沿着缝隙爬行\n像某种未愈合的旧伤\n\n管道吞吐着沉默\n金属咬住流逝的光\n冷色在深处凝结\n成为记忆的碎屑\n\n最后的清洁剂褪去\n所有颜色沉入黑洞\n水走了，地面仍留着\n它曾存在的证明。"}}, {"i": 36, "prompt": "写一首夏夜高速公路服务区的现代诗。长途司机洗脸时，一群飞蛾围住坏掉一半的招牌。", "pk": "cp-v1-018", "A": {"id": "84f3c8814c27434c", "body": "水龙头吐出一串沉默的银针  \n他仰头吞下盐粒般咸涩的黄昏  \n碎玻璃在水泥地上生长  \n铁锈渗入混凝土裂缝  \n像某种未完成的古老文字  \n\n霓虹灯管抽搐着  \n把“住宿”两个字切成两半  \n飞蛾撞进残缺的字母里  \n翅膀粘满塑料与沥青的气味  \n它们绕着他的影子跳圆舞曲  \n\n柴油味漫过脚手架  \n路灯突然睁眼  \n照亮他掌纹中未干的机油  \n以及那些被轮胎碾碎的  \n星辰的碎屑"}, "B": {"id": "8eb7f70a089ad07c", "body": "一车人\n睡了。月亮\n是圆的\n灯也圆了\n我睡得正熟\n突然被叫醒——\n这是一只飞蛾\n它停在我脸上\n一只大黑蛾\n它的翅膀扑着我的眼睛\n它是从哪里来的？\n它要到哪里去？\n我睁开了眼\n看到我的脸很白净\n像一片没有水的湖"}}, {"i": 37, "prompt": "写一首旧照相馆清点底片的现代诗。几张底片上的人脸因受潮黏在一起，无法完整分开。", "pk": "cp-v1-024", "A": {"id": "0868a06b05beea90", "body": "玻璃暗红，灯泡摇晃\n白瓷水杯边几粒青橄榄\n被水浸泡发黑，像\n几个没有头的脸\n墙上挂着一些照片\n它们是黑色的背景\n一个男人站在前面\n对着镜头露出微笑\n我看见了他\n却不知道他是谁"}, "B": {"id": "ca4f7ec80bea1956", "body": "玻璃柜里浮出几粒银盐  \n指纹在暗房深处发芽  \n那些被水渍揉皱的脸孔  \n正从显影液中浮起  \n\n胶卷蜷缩如未拆封的信  \n潮湿将轮廓缝合成茧  \n某张嘴裂开一道光的缝隙  \n另一只眼眶里结出霜花  \n\n我数着剥落的颗粒  \n像清点散落的星子  \n有人从画面边缘渗出  \n留下半截衣领与模糊的肩线  \n\n相纸在灯下褪色  \n往事的褶皱里  \n藏着未对焦的叹息  \n以及  \n被时间腐蚀的姓名"}}, {"i": 38, "prompt": "鱼贩把冰重新铺一遍盖住昨天的鱼｜让冰的重量与时间挂钩", "pk": "sc-007-f4", "A": {"id": "de625dc2738c2fb0", "body": "鱼贩把冰重新铺一遍盖住昨天的鱼\n金属秤盘颤动如钟摆摇晃黄昏的余温\n刀刃划开银鳞时溅起细小的光斑\n冰层下呼吸缓慢成某种无声的韵律\n冷藏柜深处沉睡着未被唤醒的黎明\n水纹在塑料桶里一圈圈扩散记忆\n鱼眼凝视虚空仿佛在丈量潮汐的刻度\n冰块相互碰撞发出岁月的清脆回响\n码头风掠过留下一串湿漉漉的脚印"}, "B": {"id": "fc3745318bafe545", "body": "冰在砧板上裂开细纹\n鱼贩的手指浸入凉意\n昨夜的鳞片沉入水底\n冰层下呼吸被压缩成雾\n金属秤砣摇晃黄昏的影子\n冰块咬住鱼鳃的刹那\n时间在刀刃上凝结成霜\n水珠沿着铁桶滑落\n鱼眼映出冰面的星空"}}, {"i": 39, "prompt": "写一首清晨垃圾转运站的现代诗。一面碎镜子在传送带上依次照见不同工人的手。", "pk": "cp-v1-031", "A": {"id": "3f8bbddc57385a5f", "body": "早晨七点三十分，一个搬运工把一堆垃圾倒进垃圾桶，另一个搬运工接着往车上装垃圾，第三个搬运工就将垃圾搬走。\n\n他们用铁皮桶装垃圾，用木柄铲子翻垃圾，用手推车运垃圾，最后用拖车拉垃圾。\n\n他们满身是汗，却还是笑着说：“多累也没关系！”\n\n他们穿破旧的衣服，却还是觉得好笑地说：“我们最懂幽默！”\n\n他们是垃圾工人，也是垃圾场里唯一还保留人性的人类。\n\n他们是城市里唯一的清洁工，更是城市里最值得尊敬的人类。\n\n他们就是这个世界上最不起眼的主角。\n\n但是在这个世界的另一端，他们却是别人心中的英雄。\n\n他们用自己的双手擦亮了城市的脸庞。\n\n他们是这个世界上的无名小卒，却又是这个世界上最伟大的人。\n\n他们是垃圾工人，也是我们心中永远的英雄。"}, "B": {"id": "fb33e31ec74645f5", "body": "碎玻璃在传送带尽头裂出黎明  \n指节蜷缩成铁锈色的弧度  \n汗水滴落处 镜面碎屑  \n折射出无数个未完成的早晨  \n\n手套摩擦金属的钝响  \n是某种古老仪式的回声  \n指纹在镜中游移  \n像被风揉皱的旧地图  \n\n某个瞬间  \n所有手掌都成了反射面  \n照亮彼此沉默的沟壑  \n阴影在褶皱里生长  \n如同未说出的词语  \n\n传送带继续转动  \n碎镜将光切分成棱角  \n每个碎片都藏着  \n一个未曾命名的黎明"}}, {"i": 40, "prompt": "写一首台风登陆前理发店里的现代诗。店员用胶带贴玻璃，顾客坚持把最后一侧头发剪完。", "pk": "cp-v1-021", "A": {"id": "150361ce09ef6bc9", "body": "我听到\n\n风声了\n\n老王\n\n别留着\n\n等台风来了\n\n刮到后面\n\n就难办了\n\n“那我也得走啊”\n\n他边说\n\n边用红漆\n\n刷我头顶上的小灯泡"}, "B": {"id": "b508a6c358e6ad28", "body": "胶带在玻璃上爬行  \n像某种古老的咒语  \n风正从裂缝中  \n练习发音  \n\n剪刀咬住发丝的瞬间  \n城市忽然安静下来  \n仿佛所有喧嚣  \n都藏进了地底的暗河  \n\n你盯着镜子  \n说这发型能抗住十级风  \n我点头  \n把碎发扫进抽屉深处  \n那里还躺着去年的雷声  \n\n窗外的树开始摇晃  \n我们却还在讨论  \n该不该修整鬓角的弧度  \n像修理一艘即将沉没的船"}}, {"i": 41, "prompt": "写一首以失灵的门禁系统为场景的现代诗。暴雨中住户互相替陌生人撑门，系统恢复后门立刻合上。", "pk": "cp-v1-028", "A": {"id": "ecc673ca03d42fc8", "body": "雨水在金属门板上冲刷出电流  \n指纹锁吞下第七次错误尝试  \n楼道里的呼吸声开始发酵  \n\n三楼的钥匙串撞响楼梯拐角  \n穿红雨衣的人将伞倾斜向右侧  \n门缝渗入的风裹挟着潮湿的体温  \n\n五楼窗台垂下晾衣绳  \n像某种未完成的求救信号  \n穿西装的男人用鞋尖抵住门框  \n直到对讲机里传来短暂的嗡鸣  \n\n系统重启的瞬间  \n铁门咬合如犬齿  \n所有等待者退入各自的暗室  \n唯有积水倒映着  \n一串未曾被记录的指纹"}, "B": {"id": "c3fb4660f43d9d42", "body": "雨水从天空倒下来  \n打在玻璃上  \n像碎了一地的镜子  \n我们把钥匙塞进门里  \n门一打开 就是一片水的世界  \n谁也看不见对面的人影  \n只有雨声在耳边飘荡  \n像在诉说一段遥远的故事  \n忽然有人喊道 这是隔壁邻居  \n让我们帮他一把吧  \n于是 大家都伸出了手  \n扶着门不让它关上  \n直到天放晴了  \n我们才发现 门早已被雨水泡软  \n轻轻一推就开了  \n原来那是一个会呼吸的门"}}, {"i": 42, "prompt": "写一首凌晨渔船回港的现代诗。一名年轻船员第一次看见城市灯光倒映在装鱼的水箱里。", "pk": "cp-v1-023", "A": {"id": "a057763506acd2da", "body": "渔网在甲板上摊开  \n像一张被风揉皱的旧地图  \n他蹲下身，指尖划过水面  \n涟漪抖落最后一块银鳞  \n\n远处灯塔旋转着  \n把光切成细碎的盐粒  \n撒进深蓝的褶皱里  \n\n水箱突然亮了  \n城市倒悬其中，玻璃幕墙  \n与鱼鳃一同翕动  \n霓虹在波纹里游弋  \n仿佛整个陆地正在沉没  \n\n他望着自己的影子  \n在透明的牢笼中  \n慢慢长出鳞片  \n咸涩的潮气爬上喉头  \n某种东西正从海底升起  \n带着潮湿的、未命名的名字"}, "B": {"id": "bbad19fdff69514c", "body": "渔火，被月光洗亮了，\n\n白帆上缀着星星点点的泪光。\n\n当渔人摇橹归来，夜航船拖着长长的黑影驶入港湾。哗的一声，渔网撒开了，撒开了……\n\n他忽然想起自己那艘小船，正泊在灯影朦胧处。\n\n他忽然感到自己的船也该撒一网了。\n\n于是，他走进灯火辉煌的城市，像一条刚脱了壳的小螃蟹似的，张开双臂，四处窥探。"}}, {"i": 43, "prompt": "写一首现代诗：医院走廊的自动贩卖机在深夜发出光。让等待的人和机器互为对方的证明。", "pk": "lp-04", "A": {"id": "1fa52932c5f8e332", "body": "金属喉咙吞咽着午夜的寂静  \n玻璃幕墙倒映出无数个自己  \n消毒水味道渗进指纹的褶皱  \n键盘敲击声是唯一的节拍  \n\n铝罐碰撞出星群的碎屑  \n荧光屏亮起时  \n有人把影子叠进易拉罐的弧度  \n锈蚀的门把手转动  \n带出一串未命名的编号  \n\n输液管滴落的秒针  \n正在校准某种隐秘的尺度  \n而自动机吐出的  \n是月光兑换的硬币  \n24"}, "B": {"id": "2944d342251c6427", "body": "夜深了\n医院的走廊亮着惨白的灯\n一列自动贩卖机闪烁着微光\n像一群沉默的守卫\n\n我走进医院\n寻找一位病人\n却找不到他的床号\n只有那些寂寞的机器\n闪着幽蓝的光芒\n\n在一间昏暗的病房里\n我看到他正对着一瓶矿泉水微笑\n那是他唯一的安慰\n仿佛那是\n一颗星"}}, {"i": 44, "prompt": "写一首现代诗：夜班公交上，一个乘客始终没有按下车铃，车到终点站。不要解释他为什么不下车，让司机的动作和车厢的声音承担全部。", "pk": "lp-01", "A": {"id": "7f5ebc2981de4d59", "body": "金属门在暗处吞下最后一声叹息  \n玻璃映出褶皱的影子  \n像未拆封的信  \n\n报站声在空腔里来回撞击  \n锈蚀的扶手攥住  \n某个未被命名的时刻  \n\n司机转动钥匙  \n仪表盘亮起幽蓝的瞳孔  \n引擎轰鸣是某种古老的咒语  \n\n他始终没有按下  \n那个银色的按钮  \n直到终点站的光  \n刺破车厢的沉默  \n\n司机摇下车窗  \n风卷走所有未说出口的词语  \n而他仍坐着  \n手指悬停在  \n半空中"}, "B": {"id": "486f19cff53b5ea7", "body": "夜深了，我正坐卧在车里，\n这辆夜班客车缓缓驶来。\n\n一扇门关着，另一扇门开着。\n一位穿西装打领带的先生坐在座位上，\n像等待什么人似的。\n\n我问司机：这是去哪？\n司机说：“等会儿就知道啦。”\n他似乎已察觉到了什么。\n\n车到了终点站，他依旧\n静静地坐着，好像没有听到那声“叮”……\n\n于是，我把脸贴在窗上——"}}, {"i": 45, "prompt": "写一首发生在末班地铁停运后的现代诗：一个清洁工在空站台发现一枚仍然温热的硬币。不要解释硬币的来历，让动作和声音推动诗。", "pk": "cp-v1-001", "A": {"id": "30d5f5a0822b8aed", "body": "硬币还热着，它来自哪位乘客\n清洁工把硬币装进口袋\n又掏出来\n放在站台上\n他扫了扫地上的垃圾\n弯下腰来，听见一阵低语\n是硬币的声音\n他用脚踩了一下硬币\n又把它放回原处\n这时他听见一声尖叫\n从隧道深处传来\n他惊惶四顾\n看见月光下的硬币闪烁着微弱的光芒"}, "B": {"id": "88ff8abf0efccfe5", "body": "凌晨两点，末班列车进站了\n月台上只有一盏灯亮着\n两个戴鸭舌帽的男人走了进来\n他们把烟灰缸扔给了清洁工\n又将一元硬币丢给了清洁工\n然后说：我们下一辆车会回来\n说完就消失得无影无踪\n\n而那个清洁工却独自坐在台阶上\n一边听着列车缓缓驶出轨道的声音\n一边摸着手中的硬币喃喃自语道：\n这枚硬币真温暖啊……"}}, {"i": 46, "prompt": "写一首冬季渡口的现代诗：最后一班船离岸后，一只手套留在系缆柱上。", "pk": "cp-v1-008", "A": {"id": "357cd468a405d8d0", "body": "铁锈在暮色中扩张  \n缆柱咬住半截指纹  \n风把影子吹成薄纸  \n折叠进渡轮的尾波  \n\n雪落时  \n所有声音都沉入水底  \n只剩线头在寒气里  \n缓慢地  \n抽搐"}, "B": {"id": "317cc196fb97a90a", "body": "水声退去  \n缆绳松弛如一根指节  \n在暮色中，手指缓缓蜷缩  \n握紧了最后的温度  \n\n风从对面吹来  \n卷走一些东西  \n留下一个轮廓  \n像是谁未完成的句子"}}, {"i": 47, "prompt": "写一首关于图书馆归还箱的现代诗。雨夜里一本受潮的书被投进去，机器给出正常回执。", "pk": "cp-v1-019", "A": {"id": "47479bad86ad7d72", "body": "雨夜送还的书中夹着几片叶子\n\n图书馆的电脑上显示\n\n书籍潮湿，系统无法识别"}, "B": {"id": "0d2ebdd62a8bc69b", "body": "潮湿的纸页在金属腔体内蜷缩  \n雨滴正从通风口渗入  \n某个编号代替了书脊的指纹  \n荧光屏亮起 一声吞咽  \n\n铁锈在暗处生长  \n折叠的黄昏被压成薄片  \n归还箱吐出绿字  \n像某种植物在水泥地里发芽  \n\n墨迹洇开成地图  \n而制度是永不闭合的折扇  \n我们反复练习如何将思想  \n塞进指定的凹槽  \n\n此刻 一册水渍正在归档  \n它将在某次检索中醒来  \n成为系统内部  \n一个无法解析的标点"}}, {"i": 48, "prompt": "写一首现代诗：早市上卖鱼的人往塑料袋里灌水。让水成为整首诗唯一在动的东西。", "pk": "lp-07", "A": {"id": "16d0f337fbfc8efa", "body": "卖鱼人从市场回来\n把鱼摊摆开\n将一尾鱼解剖后\n用塑料袋装着水\n再放进冰箱冷藏室\n当有买主上门时\n就拎出一条鱼\n用秤杆称完分量后\n再把塑料袋里\n的水倒回盆里"}, "B": {"id": "5e2a87c4cf190915", "body": "冰碴在铁盆底部裂开  \n银鳞滑入塑料袋的褶皱  \n他弯腰时，水便从指缝  \n游向清晨尚未苏醒的街道  \n\n鱼鳃翕动，像未完成的呼吸  \n被装进透明的囚笼  \n秤杆悬垂，等待某个  \n尚未命名的重量  \n\n水珠沿着摊位边缘坠落  \n溅起的回声在潮湿空气中  \n缓慢沉降，如同  \n所有未曾说出的词语  \n\n金属碰撞声惊醒了  \n蜷缩在纸箱里的影子  \n而称盘正将一段沉默  \n缓缓压向地心"}}, {"i": 49, "prompt": "写一首现代诗：候鸟经过一座正在通电的输电塔。不要把鸟写成自由的象征。", "pk": "lp-06", "A": {"id": "b81d04d929fd6791", "body": "候鸟们\n在南方飞，在北方飞，\n在云上飞，在草上飞，\n在天上飞，在地上飞。\n\n当太阳下山的时候，\n它们停歇在田野上，\n它们停歇在河流旁，\n在麦子成熟的田野上，\n在豆荚胀大的田埂旁。\n\n它们是天空的旅伴，\n它们曾栖息在一棵棵树上，\n今天却站在一片草场上，\n明天就要飞往另一片草场去了。"}, "B": {"id": "a87ed88cfac99115", "body": "候鸟经过一座正在通电的输电塔。\n\n一只白鹭从电线杆上惊飞而起。\n\n它被雷击了？\n\n还是它自己撞上了那根电线？\n\n反正它掉下来了，\n\n掉在了河里，\n\n又游走了。\n\n我看见那只大雁停在高压铁塔上\n\n久久不动，\n\n像一尊石像。"}}, {"i": 50, "prompt": "屠宰场清晨冲洗地面的水流进下水道｜不出现动物，只写水的颜色", "pk": "sc-004-f1", "A": {"id": "e87ee7d9e502521e", "body": "铁锈在瓷砖缝隙里苏醒\n水的脊背弯成一道弧线\n黑影漫过水泥的裂痕\n像某种未完成的遗言\n\n水管发出金属的叹息\n地面积聚着沉默的盐\n流动的暗色舔舐石阶\n把昨日的重量冲刷成泥\n\n漩涡吞下所有倒影\n地面成为吞噬者的嘴\n水在管道深处翻涌\n如同未曾说出的词\n\n灰蓝渗入裂缝深处\n寂静在排水口凝固\n最后的回声沉入地下\n一声不响地消失。"}, "B": {"id": "b6a87f443ba6a37d", "body": "水在地面上铺开灰蓝的皮肤\n金属管道喉咙里发出低沉的嗡鸣\n暗流在砖缝间寻找出口\n沉默的漩涡吞没了所有回声\n\n清洁剂撕碎了昨日的倒影\n波纹在瓷砖上划出冷峻的裂痕\n蒸汽从排水口升起\n像某种未说出口的告别\n\n水色在缝隙中缓慢沉淀\n潮湿的空气凝固成透明的墙\n地板在寂静中缓缓呼吸\n每一道裂纹都藏着未解的谜语\n\n最后一滴坠入黑洞般的深处\n带走所有关于光的记忆\n水与地面交换着秘密\n直到一切归于深不见底的沉默。"}}, {"i": 51, "prompt": "写一首关于一台老式电梯的现代诗。它每天在十三层短暂停顿，楼里却没有十三层按钮。", "pk": "cp-v1-017", "A": {"id": "479bb94a4cf68b4c", "body": "在十二层与十四层之间  \n我们停了六秒钟  \n那六秒里  \n一个穿白大褂的人  \n在楼顶放了一只鸽子  \n\n十二层是一所医院  \n十四层是一所大学  \n电梯停在十三层上  \n是怕鸽子掉下来砸到人头吗？"}, "B": {"id": "056619e2ce26628a", "body": "13楼是假的。\n这台破旧的电梯在13楼停顿，\n门一开就是荒芜。\n有人在那儿站过，\n有人在里面哭过，\n也有人在那里面生了孩子。\n\n楼里没有13楼的按钮。\n谁要上13楼，\n只能从14楼下来，\n或是从地下室上去。"}}, {"i": 52, "prompt": "修鞋摊上一只鞋等了三个月没人来取｜不写等待，只写鞋的形状变化", "pk": "sc-002-f1", "A": {"id": "4162df308feeef42", "body": "鞋底的弧度渐渐弯向黄昏\n摊边的风总在午夜翻面\n橡皮筋松了两圈\n鞋带垂落成两根枯枝\n鞋帮渗出暗色的苔痕\n鞋尖朝北\n鞋跟朝南\n鞋舌卷起时像一片落叶\n鞋面被雨反复折叠\n鞋孔里积满尘土的星群\n鞋钉生出细小的绒毛\n鞋最后被塞进摊主的旧衣兜\n轻轻晃动"}, "B": {"id": "85339ae5b8641204", "body": "鞋底的弧度渐渐弯成问号\n摊边的铁锈爬上鞋面\n鞋舌垂落如被遗忘的钟摆\n鞋跟在风里摇晃成半截脊椎\n鞋带松散成两条枯枝\n鞋面褶皱堆积成山峦\n鞋的轮廓在暮色中溶解\n鞋的影子被黄昏拉长又折叠\n鞋的呼吸在潮湿里缓慢氧化\n鞋的沉默压住所有回声\n鞋的重量沉入地缝深处\n摊主挪走最后一块木板"}}, {"i": 53, "prompt": "写一首现代诗，题材：养老院窗台上晒着的一排药瓶。", "pk": "fp-06", "A": {"id": "0b0219cafb169bda", "body": "一只白鹭从天空飞过\n我看见了夕阳下的老年公寓\n在一片花丛中\n一群老人正仰望天空"}, "B": {"id": "499c72d52db30178", "body": "玻璃肚子里  \n浮着半枚月亮  \n药片在阳光下翻身  \n\n黄昏把影子  \n浇铸成青铜  \n沉默在瓶口发芽  \n\n护士的手指  \n翻动彩色密码  \n每个标签都藏着谜语  \n\n明天会是  \n哪颗胶囊的形状  \n轻轻摇晃？"}}, {"i": 54, "prompt": "写一首关于一次失败的月食观测的现代诗。云始终未散，观测者只记录了周围人的呼吸和器材结露。", "pk": "cp-v1-034", "A": {"id": "e947b8e1bc5c97f5", "body": "望远镜的瞳孔里  \n雾气持续攀爬  \n金属外壳凝出细小的星辰  \n\n人群蜷缩成一串省略号  \n呼吸在玻璃上  \n画出短暂的地貌  \n\n我们等待一个被取消的事件  \n像等待钟摆垂向深渊  \n而云层始终未散  \n\n脚手架间漏下的光  \n被仪器吞食  \n只剩指针在表盘里  \n反复确认零点  \n\n风掠过校准螺丝的螺纹  \n发出类似叹息的颤音  \n所有数据最终归于沉默  \n如同月亮从未出现"}, "B": {"id": "6db957e2162a76c3", "body": "天狗咬掉了月亮的头\n\n于是人们开始议论\n\n月亮为何瘦了\n\n有人认为是地球遮住了它\n\n有人说是太阳偷吃了它的肉\n\n还有人说那是一块陨石\n\n但没有人相信天狗吃月亮\n\n那是多么大的一块骨头啊"}}, {"i": 55, "prompt": "写一首山中隧道维修夜班的现代诗。工人敲击岩壁，以回声判断空洞，偶尔有水滴落在安全帽上。", "pk": "cp-v1-012", "A": {"id": "c0fc6eb0cb9dc566", "body": "铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n水珠坠入安全帽  \n叮——  \n时间裂开一道缝  \n\n铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n钢钎插入裂缝  \n碎石簌簌落下  \n黑暗吞食了它们  \n\n铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n汗水滴落  \n混着水珠的声音  \n在耳后凝结成盐  \n\n铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n岩壁渗出叹息  \n工人们交换眼神  \n沉默比言语更沉重  \n\n铁锤叩击岩层  \n回声在隧道深处游走  \n像某种古老的密码  \n\n光斑在头顶摇晃  \n影子被拉长又缩短  \n如同他们未说出口的梦"}, "B": {"id": "e40c4f57d2b3f52f", "body": "一队矿灯，从石山深处浮来\n像一大把银钥匙，把地层\n打开\n\n当铁锤敲响\n我看见一群小人儿正忙于\n为大地打补丁\n\n叮\n当\n\n叮\n当\n\n他们用钢钎\n挑亮黑夜里\n每一颗星子"}}, {"i": 56, "prompt": "写一首现代诗：一个人在自助洗衣店等衣服烘干，玻璃门映出他自己。写两个影像之间的时差。", "pk": "lp-08", "A": {"id": "025b00f1b9fc0b4b", "body": "水珠从金属架上滑落  \n像钟表里漏下的沙  \n他站在玻璃门前  \n影子被烘干机吞吐成灰烬  \n\n对面的镜子正翻阅他的骨骼  \n褶皱在布料中缓慢舒展  \n如同某种未完成的翻译  \n而时间在滚筒里旋转  \n\n此刻的他与彼刻的他  \n隔着蒸汽与寂静对峙  \n像两枚硬币卡在命运的缝隙  \n\n突然  \n他转身离去  \n留下一地潮湿的沉默"}, "B": {"id": "99c385a3463341e4", "body": "玻璃门外一个男子站着\n玻璃窗内另一个男子坐着\n男子站立着看男子坐立着\n男子静坐着想男子站立着\n男子坐着看着窗外的男子\n男子立着望着玻璃中的自己\n男子立着望着镜中的男子\n男子坐着望着窗外的男子\n男子坐着望着镜中的人影\n男子立着望着窗外的男子\n男子坐着望着窗外的人影"}}, {"i": 57, "prompt": "写一首现代诗：拆迁前最后一天，有人回到空屋量窗户的尺寸。让丈量这个动作反复出现，每次量的东西不同。", "pk": "lp-02", "A": {"id": "f49837484ef4e301", "body": "一丈三尺九寸——\n\n老宅子东厢房的窗口。\n\n“就是这尺寸？”\n\n是母亲的声音。\n\n她用一把铜质皮尺\n\n从窗棂到窗棂\n\n在墙根儿比划着：\n\n一丈三尺九寸，\n\n又一丈三尺九寸，\n\n再一丈三尺九寸……\n\n直到那窗口消失，\n\n只剩下一堵断墙。"}, "B": {"id": "beb9771b274c7376", "body": "她来了一次又一次  \n每次都要把门窗测一测  \n有一次量了桌子  \n另一次是沙发  \n然后是椅子和床  \n她量过厨房里每一件器具  \n连挂在墙上的铁锅也量了  \n她说这是最后一次测量  \n因为明天就要拆掉房子了  \n她把每一间屋子都走了几遍  \n然后坐在床上哭起来"}}, {"i": 58, "prompt": "写一首现代诗：一场雨把整条街的伞打开。写伞面之下看不见的部分，不写雨本身。", "pk": "lp-03", "A": {"id": "c7ce62f2c7637767", "body": "雨来之前\n天空是蓝玻璃做的\n没有谁看得见里面的光亮\n\n在一家花店的屋檐下\n我看见了她\n像一株含羞草躲在一把透明的伞下\n\n而她也看见了我\n用一只湿漉漉的眼睛"}, "B": {"id": "b8ace592dd1a102c", "body": "夜雨。\n\n街上没有一个人。雨点在路灯下织着金丝线。\n\n我看见一个穿粉红夹克的小姑娘\n\n正踮起脚，用一根长竹竿敲打着\n\n那家咖啡馆的门环：\n\n“来呀！来呀！\n\n雨天多好哇！”\n\n我看见\n\n一只黑猫\n\n正蹑手蹑脚地\n\n从那扇半开的玻璃窗里溜出去……"}}, {"i": 59, "prompt": "写一首现代诗，题材：夏夜屋顶乘凉的人听见远处火车。", "pk": "fp-03", "A": {"id": "1204f11eb3f16a72", "body": "七月的夜晚\n在小城的屋顶上\n乘凉的人听到远方火车的声音\n\n他们知道那是幸福的声响\n像一只大鸟飞向星空\n像一段梦境缓缓展开\n\n而他们的脸庞映照着月光\n是宁静的，是满足的\n如同时光深处的微笑\n\n这是生活赐予我们的一份礼物\n在夏夜的顶上，枕着星光入睡\n枕着火车那遥远的轰鸣入睡\n\n直到天边泛起一抹晨曦\n直到岁月轻轻翻过一页\n直到生命之舟继续前行……"}, "B": {"id": "1bbcdafe9a7fb288", "body": "一列汽笛在午夜吹奏，\n\n风儿从四边八方赶来应和。\n\n那是一支古老而苍劲的长箫，\n\n它用自己粗犷的声音把夏夜唤醒：\n\n“快起来吧，睡了这么久的人们——\n\n今晚没有星星，\n\n没有梦。”\n\n一个老汉摇着蒲扇说：“这声音像不像我的牛？\n\n哦，不，是我们的火车……”"}}, {"i": 60, "prompt": "写一首以失灵的门禁系统为场景的现代诗。暴雨中住户互相替陌生人撑门，系统恢复后门立刻合上。", "pk": "cp-v1-028", "A": {"id": "ecc673ca03d42fc8", "body": "雨水在金属门板上冲刷出电流  \n指纹锁吞下第七次错误尝试  \n楼道里的呼吸声开始发酵  \n\n三楼的钥匙串撞响楼梯拐角  \n穿红雨衣的人将伞倾斜向右侧  \n门缝渗入的风裹挟着潮湿的体温  \n\n五楼窗台垂下晾衣绳  \n像某种未完成的求救信号  \n穿西装的男人用鞋尖抵住门框  \n直到对讲机里传来短暂的嗡鸣  \n\n系统重启的瞬间  \n铁门咬合如犬齿  \n所有等待者退入各自的暗室  \n唯有积水倒映着  \n一串未曾被记录的指纹"}, "B": {"id": "7ffda4b57d17adca", "body": "“别动！”一位穿睡衣的先生喊道，“让我先扶着这扇门！”\n\n大雨滂沱，楼道里人头涌动，像一场黑色风暴。人们把门推开，又将之关上。那些被暴雨打湿了身子的人们，在门里门外进进出出，谁都不想再回去淋雨。\n\n“喂，那边那位穿白衬衫的，麻烦你帮忙按住那扇门。”一个穿西装的年轻人叫道。\n\n“喂，那边那个胖乎乎的老板，麻烦你帮一下忙。”\n\n“哦，原来是这样啊？”那胖老板笑起来：“我以为你们是在演什么滑稽剧呢！”\n\n大家你一言我一语，都在抢着扶起那扇门。直到突然传来一声巨响——门禁系统自动启动。哗啦一下，所有的门都重新合上了。"}}, {"i": 61, "prompt": "写一首现代诗：老式电梯的指示灯逐层熄灭。让楼层数成为时间刻度，但不说破。", "pk": "lp-09", "A": {"id": "e7ba4dec835315da", "body": "十六层  \n十五层  \n十四层  \n十三层  \n十二层  \n十一层  \n十层  \n九层  \n八层  \n七层  \n六层  \n五层  \n四层  \n三层  \n二楼  \n一楼"}, "B": {"id": "efb48fedfa5fbc39", "body": "金属喉咙吞下最后一声呼喊  \n数字在玻璃里结霜  \n十二层的呼吸被折叠成薄片  \n指纹在按钮上留下潮湿的年轮  \n\n七楼的灯光开始褪色  \n像未寄出的信纸在抽屉深处发黄  \n四楼的门缝渗出旧日黄昏  \n楼梯间漂浮着锈蚀的叹息  \n\n此刻  \n地下一层的铁门正缓缓开启  \n黑暗伸出湿润的手掌  \n接住所有坠落的影子"}}, {"i": 62, "prompt": "写一首关于被导航反复纠正路线的现代诗。骑车人穿过正在消失的城中村，屏幕上的道路比现实更完整。", "pk": "cp-v1-022", "A": {"id": "808898057c5a45fa", "body": "你的车轮碾过最后一块青砖  \n导航提示音切开潮湿的巷弄  \n铁门在身后合拢 成为地图上  \n一道未命名的褶皱  \n\n信号塔吞下黄昏  \n你数着第七次重定向  \n水泥裂缝里野草正练习  \n如何在数据流中扎根  \n\n墙皮剥落处露出旧地址  \n像被删除的快捷方式  \n孩童用粉笔画出不存在的路口  \n而你的手机正重新计算  \n这座城市的重心  \n\n混凝土正在溶解  \n成为算法能理解的平面  \n你停下车 看见自己  \n在高德地图里  \n变成一个红色的光点  \n被折叠进某个更完整的虚构"}, "B": {"id": "d7218a52462b1c5c", "body": "他骑车穿过城中村\n他的车轮碾过泥地与碎瓦\n一条街的名字刚被记住又忘记\n另一条街的名字尚未抵达\n已经换了方向\n导航说：前面左转\n他照办了\n导航又说：再左转\n他照办了\n导航又说：再右转\n他照办了\n导航又说：再左转……"}}, {"i": 63, "prompt": "鱼贩把冰重新铺一遍盖住昨天的鱼｜让冰的重量与时间挂钩", "pk": "sc-007-f2", "A": {"id": "a341a2858e962e94", "body": "鱼贩把冰重新铺一遍\n盖住昨天的鱼\n金属秤杆震颤着清晨的重量\n冰层下呼吸被压缩成薄片\n刀锋划开沉默的蓝\n鳞片闪动如碎玻璃\n水汽爬上冷藏柜的肋骨\n时间在冰棱中结晶\n鱼眼凝视着自己的倒影\n冰块坠落时\n世界轻轻晃动一句句无声的告别。"}, "B": {"id": "9f49d338f1b5a62a", "body": "鱼贩把冰重新铺一遍\n盖住昨天的鱼\n金属秤杆震颤着沉默\n冰层下呼吸缓慢如钟摆\n刀刃划开银白的寂静\n鳃缝里漏出盐粒与星光\n水洼倒映着未售出的黎明\n冰块在黄昏中融化成记忆\n鱼眼凝视着自己的倒影\n冰的重量正与时间交换筹码\n码头风掠过空荡的竹筐\n将昨日的鳞片吹成细沙。"}}, {"i": 64, "prompt": "根据《旧站台》写一首现代诗。", "pk": "title:旧站台:bare", "A": {"id": "8fc577ae2655aa7e", "body": "**《旧站台》**\n\n锈蚀的铁轨在暮色中延伸，  \n像一条未说完的叹息，  \n风穿过空荡的月台，  \n卷起几片枯叶，  \n仿佛时光也在这里停顿。\n\n曾经的汽笛声早已沉入地底，  \n只留下回音，在记忆里徘徊。  \n那些匆忙的身影，  \n是否还记得这里曾是他们的起点？  \n还是终点？\n\n站牌上的字迹模糊不清，  \n如同岁月悄然抹去的名字。  \n我站在原地，  \n听见自己的心跳，  \n与远方传来的一声汽笛重叠。\n\n旧站台，你沉默如诗，  \n承载着太多未寄出的信，  \n和未曾说出口的告别。  \n而我，只是路过的人，  \n带着些许遗憾，  \n走向下一个未知的方向。"}, "B": {"id": "4547376c615cea3d", "body": "《旧站台》  \n是夜的尽头，  \n是月的边缘。  \n\n当风停了，你便听见了钟声——  \n在远方。  \n\n铁轨上没有轮子，  \n只有时间，  \n从一个钟头跑向另一个钟头，  \n像一匹马。  \n\n有人睡在木板上，  \n他的呼吸是火车的汽笛。  \n而有人醒来，在深夜里，  \n听见铁轨上一声叹息，  \n像是一只鸟，  \n飞向远方。"}}, {"i": 65, "prompt": "写一首矿区恢复成湿地后的现代诗。候鸟停在旧轨道旁，铁锈从浅水中显出。", "pk": "cp-v1-020", "A": {"id": "47bd48c008bb7a71", "body": "候鸟栖息于铁路之侧  \n一列火车正驶向远方  \n铁锈浮现于水浅处  \n\n荒野之中的芦苇丛生  \n沼泽地之上的天鹅嬉戏  \n昔日煤灰覆盖的土地上  \n草木繁茂  \n林中鸟鸣声声  \n\n曾经矿工们辛勤劳作的地方  \n如今已变成大自然的一片绿洲  \n孩子们放飞了梦想  \n父母们踏上了幸福之路"}, "B": {"id": "945818d94281bc26", "body": "候鸟停在旧轨道旁  \n铁锈从浅水中显出  \n像某种褪色的密码  \n\n挖掘机的齿痕仍嵌在地层褶皱里  \n苔藓正缓慢咬合那些金属的伤口  \n去年埋下的种子  \n如今浮出水面  \n成为芦苇丛中  \n一簇簇银亮的呼吸  \n\n风把矿坑吹成凹面镜  \n反射出更早的年代  \n那时推土机尚未碾碎地平线  \n一只白鹭曾在同样的位置  \n啄食水中的星辰  \n\n铁轨在黄昏中生锈  \n而新芽正在裂缝里  \n练习如何避开  \n旧日的阴影"}}, {"i": 66, "prompt": "写一首旧照相馆清点底片的现代诗。几张底片上的人脸因受潮黏在一起，无法完整分开。", "pk": "cp-v1-024", "A": {"id": "60a7a6e590fff15d", "body": "玻璃柜里浮出几粒银盐  \n指纹在暗房深处发芽  \n那些被水渍揉皱的脸孔  \n正从显影液中浮起  \n\n胶卷蜷缩如未拆封的信  \n潮湿将轮廓缝合成茧  \n某张嘴裂开一道光的缝隙  \n另一只眼眶里结出霜花  \n\n我数着剥落的颗粒  \n像清点散落的星子  \n有人从画面边缘渗出  \n留下半截衣领与模糊的肩线  \n\n相纸在灯下褪色  \n往事的褶皱里  \n藏着未对焦的叹息  \n以及  \n被时间腐蚀的姓名"}, "B": {"id": "0868a06b05beea90", "body": "玻璃暗红，灯泡摇晃\n白瓷水杯边几粒青橄榄\n被水浸泡发黑，像\n几个没有头的脸\n墙上挂着一些照片\n它们是黑色的背景\n一个男人站在前面\n对着镜头露出微笑\n我看见了他\n却不知道他是谁"}}, {"i": 67, "prompt": "写一首雨季种子仓库的现代诗。屋顶漏水，保管员把不同年份的种子一袋袋移到干处，标签逐渐模糊。", "pk": "cp-v1-036", "A": {"id": "de4060137e4d0d7a", "body": "潮湿在天花板上爬行  \n铁皮桶渗出年轮  \n保管员用肩膀顶住漏雨的缺口  \n一粒稻种从他指缝滑落  \n\n标签正在褪色  \n像那些被遗忘的名字  \n麻袋在墙角堆积成山  \n每一道褶皱都藏着未发芽的春天  \n\n雨水漫过脚踝时  \n他数了第七个空仓  \n锈蚀的钥匙在锁孔里打转  \n门轴发出远古的叹息  \n\n抽屉深处躺着1987年的玉米  \n玻璃纸剥落成蝉蜕  \n霉斑在纸页上蔓延  \n如同某种隐秘的翻译  \n\n忽然所有钟表停摆  \n漏斗倒悬着将黄昏注入地窖  \n他伸手接住一滴水  \n掌纹中浮起无数未命名的黎明"}, "B": {"id": "97c84f430df62e07", "body": "1\n五月下起大雨来\n雨脚斜打种子仓库屋顶\n木瓦片上漏下雨水\n滴在墙角草皮上\n长出几丛小蘑菇\n2\n保管员老吴\n将各品种的谷种一袋袋搬开\n搬到墙根下晾干\n他打开铁皮箱子\n发现去年的花生粒已发芽\n3\n仓库屋顶的木瓦片\n被大雨打下三片\n掉在晒场角落里\n老吴捡起拿回仓库门口\n用钉锤敲平再镶上去\n4\n今天上午九点四十五分\n仓库屋顶的木瓦片\n被大风掀翻两片\n老吴正在仓库门前擦汗\n他看见那两片瓦翻在田埂外边\n5\n雨后云破日出\n老吴将各品种谷种搬回原位\n仓库屋顶木瓦片全部修妥\n谷种袋上的标示牌又重新插好\n仓库地面留着一些水渍未干"}}, {"i": 68, "prompt": "写一首现代诗：地铁末班车的清洁工把失物一件件登记。让登记这个动作显出它的荒谬。", "pk": "lp-12", "A": {"id": "44f48fcb7dfefa82", "body": "一列南下的列车从隧道口钻出来，\n车轮在枕木上摇响铜钟的回声，\n车厢里一个戴眼镜的男子脱下衣裳，\n说他要去游泳，把衬衫叠好放进旅行袋里。\n\n另一个男子从他的衣夹上取下一张照片\n夹进一本精装书里，书脊上印着\n“巴黎风光”，照片背面写着\n“赠给艾迪特——我最美丽的天使。”\n\n当列车驶入月台，\n一个穿围裙的妇人将她的提包搁在行李架上，\n又把装着一把雨伞的一只黑手提包\n放在另一个男人的腿底下。\n\n当列车驶离月台，\n一个穿背心的男人打开他的公文包\n取出一叠文件，用打火机点燃了它们，\n然后把灰烬撒向窗外的河流。\n另有一个女人把她的太阳镜摘下来，\n塞进她那件淡蓝色连衣裙的口袋里，\n接着又把它掏出来，仔细地擦过了。\n\n当列车缓缓地开过一道铁桥，一个男子\n倚在窗前望着桥下一条河里的船队，\n他突然想起自己把钥匙忘在了家里，\n便打开他的皮夹子，从里面的一张证件上\n撕下一角纸，用一只圆珠笔写下：\n“请代为转交我妻子。”"}, "B": {"id": "8024ec508a3dc5e5", "body": "他弯腰时，铁皮盒里  \n亮起一串编号，像星群坠落  \n在瓷砖缝中。  \n碎玻璃被擦进角落，  \n塑料袋裹着半截伞骨，  \n还有谁遗落的  \n呼吸频率？  \n\n他用红笔画圈，  \n每个名字都成了标本。  \n钥匙扣叮当，  \n却解不开某个黄昏的锁。  \n口香糖粘住椅背，  \n像未完成的句号。  \n\n最后，他摊开掌心——  \n一只断线的蝴蝶，  \n翅膀上写着  \n无人认领的经纬度。"}}, {"i": 69, "prompt": "写一首关于一次失败的月食观测的现代诗。云始终未散，观测者只记录了周围人的呼吸和器材结露。", "pk": "cp-v1-034", "A": {"id": "6db957e2162a76c3", "body": "天狗咬掉了月亮的头\n\n于是人们开始议论\n\n月亮为何瘦了\n\n有人认为是地球遮住了它\n\n有人说是太阳偷吃了它的肉\n\n还有人说那是一块陨石\n\n但没有人相信天狗吃月亮\n\n那是多么大的一块骨头啊"}, "B": {"id": "b2640572fa038e8c", "body": "望远镜的瞳孔里  \n雾气持续攀爬  \n金属外壳凝出细小的星辰  \n\n人群蜷缩成一串省略号  \n呼吸在玻璃上  \n画出短暂的地貌  \n\n我们等待一个被取消的事件  \n像等待钟摆垂向深渊  \n而云层始终未散  \n\n脚手架间漏下的光  \n被仪器吞食  \n只剩指针在表盘里  \n反复确认零点  \n\n风掠过校准螺丝的螺纹  \n发出类似叹息的颤音  \n所有数据最终归于沉默  \n如同月亮从未出现"}}, {"i": 70, "prompt": "写一首现代诗，题材：台风过后有人在海边捡拾漂来的木板。", "pk": "fp-07", "A": {"id": "855a7d19c4769e79", "body": "一\n\n风暴过去，海滩上浮起一块木头，\n像一条搁浅的小蛇。\n\n一个渔民拾起它，\n说：“这是飓风给我们的。”\n孩子们一拥而前，把它当作\n从大海那边捎来的玩具。\n\n二\n\n风暴过去，一艘沉船被浪卷到\n港口来，桅樯倾侧，龙骨折断。\n水手们围着这残骸\n像围绕一桩古老的凶杀案：\n“是它航行时自杀了？还是\n凶手把舵柄扭向了这里？”\n老水手默默俯身拾起一片残甲\n像是拾起自己旧日的铠胄。\n\n三\n\n风暴过去，海水退去。\n渔人拾回一只瓶子。\n里面装满陌生的文字。"}, "B": {"id": "b044cd5fa27db5d0", "body": "一只乌鸦从天空飞过  \n我正在翻晒谷子  \n它用嘴叼走了我的一粒谷子  \n天空中有一只鸟儿  \n它用翅膀扇起了一个飓风  \n那一只乌鸦便被吹得不知去向  \n我的谷子也全都撒了出去  \n天呀！这多不公平！  \n那只乌鸦为什么要偷我的谷子？  \n它要是饿了，可以飞到别的地方去呀！  \n它为什么偏偏要来偷我的谷子呢？  \n难道它没有看到我正在翻晒谷子吗？"}}, {"i": 71, "prompt": "写一首现代诗：早市上卖鱼的人往塑料袋里灌水。让水成为整首诗唯一在动的东西。", "pk": "lp-07", "A": {"id": "f183599349ccc85e", "body": "一筐青菜，几粒大蒜\n\n一个戴草帽的胖汉\n\n正在街角摆开他的小摊\n\n一位老太婆走来\n\n用布满皱纹的手\n\n将几枚硬币\n\n丢进一只黑乎乎的碗里\n\n卖鱼人把鱼放进塑料袋\n\n又往里面灌满了水\n\n那条鱼还在游来游去\n\n像一条真正的河\n\n水在塑料袋里涌动\n\n而天光正慢慢亮了\n\n卖鱼人的称杆已经翘起\n\n他要称量一整个城市的生活"}, "B": {"id": "318944ed08191eca", "body": "一清早，街角就响起剁排骨的声音。\n\n小贩们把担子支在地上，摆开了各种摊子：油锅里沸腾着香喷喷的肉丸子，竹筐里码放着鲜嫩的春笋丝，刀板上的大鱼大肉被剁得砰砰响。卖河鲫鱼的老汉一边往鱼盆里撒盐，一边向我打招呼：“老张，来几条？”我应了声“嗯”便侧转身去翻找零钱，不料他已将一尾大鲫鱼装进了塑料袋，并且往袋子里猛灌了几口清水。我拎起鱼儿，突然发现那条胖胖的鱼居然还在扭动身子！我有点儿奇怪地问：“咋还活呀？”“废话！”老汉一面剁排骨，一面朝我瞪起了眼珠，“活鱼才新鲜哪。”我恍然，遂提着鱼儿往家中赶去。刚走出两步又想起什么似的折回身，从老汉的木桶中捞起一条小鲫鱼塞进自己的口袋，然后匆匆忙忙地走开了。"}}, {"i": 72, "prompt": "根据《九月》写一首现代诗。", "pk": "title:九月:sys", "A": {"id": "0f124dd4e93d7501", "body": "我看到一匹马走进了秋天  \n马身上的鬃毛是秋天的草  \n马的眼睛是秋天的河流  \n马蹄下的泥土是秋天的泥土  \n\n我看到一个老人站在河岸上  \n他的头巾是一顶破旧的帽子  \n他对着河水发呆  \n他好像看见了二十年前的自己  \n\n我看到一只鸟飞过天空  \n它的翅膀掠过了秋天的树梢  \n它落在一片叶子上  \n那片叶子飘进了水中  \n\n我看到一片云飘向远方  \n它像一朵棉花糖一样柔软  \n它在阳光下慢慢消散  \n留下了一道淡淡的痕迹  \n\n我看到一棵树站在风中  \n树叶在风中摇曳  \n树叶落到了地上  \n树叶回到了大地的怀抱"}, "B": {"id": "0ce085d0e765446a", "body": "风在枝头剥落最后一枚蝉蜕  \n黄昏把影子拉长成未寄出的信  \n\n邮筒锈蚀了喉咙  \n而候鸟正用翅膀丈量天空的褶皱  \n\n落叶是大地翻动的书页  \n每一道裂痕都藏着年轮的密语  \n\n有人站在桥上数着涟漪  \n水波却把倒影揉碎成  \n无数个沉默的自己  \n\n钟摆摇晃着暮色  \n时间在窗台凝结成霜  \n我们都在等待某个  \n未曾命名的季节"}}, {"i": 73, "prompt": "写一首现代诗：候鸟经过一座正在通电的输电塔。不要把鸟写成自由的象征。", "pk": "lp-06", "A": {"id": "a87ed88cfac99115", "body": "候鸟经过一座正在通电的输电塔。\n\n一只白鹭从电线杆上惊飞而起。\n\n它被雷击了？\n\n还是它自己撞上了那根电线？\n\n反正它掉下来了，\n\n掉在了河里，\n\n又游走了。\n\n我看见那只大雁停在高压铁塔上\n\n久久不动，\n\n像一尊石像。"}, "B": {"id": "c8a06d27bcb1a571", "body": "一只白鹭从电线杆旁飞过。\n\n在高空盘旋了一小会儿又降下来了。\n\n我看见它用喙啄着什么，\n\n像是在寻找吃的。\n\n我仰起头来仔细看，\n\n只见那只白鹭停在一根\n\n从高空中垂下来的光裸的铁丝上，\n\n像一滴水珠挂在叶尖上不动。\n\n这时我发现这根铁丝是通电的，\n\n因为从它两头的铁架上\n\n我看到一些火花在跳跃。"}}, {"i": 74, "prompt": "根据《空房间》写一首现代诗。", "pk": "title:空房间:sys", "A": {"id": "f42c309e5252d177", "body": "尘埃在窗缝里游动  \n像被遗忘的钟摆  \n悬停在某个未完成的时刻  \n\n墙纸剥落处  \n爬出几条暗色的静脉  \n它们曾经输送过光  \n现在只剩下回声  \n\n门把手上结着盐粒  \n有人用钥匙  \n在锁孔里种下沉默  \n\n地板裂开细小的缝隙  \n仿佛大地在呼吸  \n而所有家具都学会了  \n如何隐身  \n\n唯一的镜子  \n仍坚持映照出  \n一个空荡荡的轮廓  \n像影子在寻找自己的名字"}, "B": {"id": "6b94fbb67b0a5b4f", "body": "我走进一间空房间  \n看到一只鸟从墙里飞出来  \n它的翅膀拍打墙壁  \n发出沙哑的声音  \n\n一个男人坐在椅子上  \n他的手放在膝盖上  \n他望着窗外的一棵树  \n树上有几片叶子在摇晃  \n\n一个女人站在门口  \n她的手握着一把钥匙  \n她望着这个男人  \n好像在等待什么  \n\n一只猫蹲在窗台上  \n它看着这个女人  \n好像也在等待什么  \n\n房间里很安静  \n只有那只鸟还在拍打着墙壁"}}, {"i": 75, "prompt": "写一首现代诗：搬家工人把一架钢琴抬下六楼。写重量如何在几个人之间转移。", "pk": "lp-05", "A": {"id": "2c33c5bb81cb721a", "body": "搬家的工人把一架钢琴抬下六楼。\n两个人扶着它，另一个人托住它的底座。\n\n它很重。\n他们说：“要小心。”\n那是一架黑色的钢琴。\n这是一架钢琴。"}, "B": {"id": "ca0f36badce94c94", "body": "搬家工人的脚步，沉重缓慢。\n\n他们用木棍撬动钢琴底部。\n\n一个人托住前面的琴盖，两个人合力抬起。\n\n四个人抬着，一阶一阶往下挪。\n\n六层楼下是街心花园。\n\n那架黑漆斑驳的旧钢琴被搬到马路上。\n\n一个穿西服的中年人指着钢琴说：\n\n“这架钢琴真漂亮。”"}}, {"i": 76, "prompt": "写一首关于医院走廊自动售货机的现代诗：深夜，机器退回一枚硬币，等待的人没有再次投入。", "pk": "cp-v1-005", "A": {"id": "a6feae6184cba7fb", "body": "金属喉咙吞下最后一粒光  \n寂静在玻璃后涨潮  \n锈蚀的按钮反复练习  \n如何把黄昏折叠成一个圆  \n\n荧光屏吞吐着过期的日期  \n硬币躺在底部，像枚未孵化的蛋  \n风穿过通风管，带来  \n远处呼吸机的叹息  \n\n门禁卡刷出一道裂痕  \n时间在此凝结成霜  \n而机器仍在等待  \n某个未被命名的黎明"}, "B": {"id": "a0ea1863b4d5647a", "body": "深夜里一排排冷光闪烁\n只有我这台自动售货机醒着  \n我吞下了三枚硬币  \n把一瓶汽水退了回来  \n我的身体是铁做的  \n但也是会生病的  \n我从没像今晚这样期待过  \n一个病人的到来"}}, {"i": 77, "prompt": "写一首台风登陆前理发店里的现代诗。店员用胶带贴玻璃，顾客坚持把最后一侧头发剪完。", "pk": "cp-v1-021", "A": {"id": "9a829aec825b621e", "body": "玻璃上贴满蓝色的胶带\n像一张被撕碎了的地图\n雨刮器已经停止了工作\n窗外是一片铅灰色的水域\n\n店长卷起袖子，擦洗着镜子\n我正坐在理发椅上，准备剪去\n右边的一撮头发，他告诉我\n这是最后一位客人了\n\n他的刀子闪了一下\n然后是哗啦啦的声响，雨水\n从天空倾泻下来，天地之间\n一片昏暗"}, "B": {"id": "b508a6c358e6ad28", "body": "胶带在玻璃上爬行  \n像某种古老的咒语  \n风正从裂缝中  \n练习发音  \n\n剪刀咬住发丝的瞬间  \n城市忽然安静下来  \n仿佛所有喧嚣  \n都藏进了地底的暗河  \n\n你盯着镜子  \n说这发型能抗住十级风  \n我点头  \n把碎发扫进抽屉深处  \n那里还躺着去年的雷声  \n\n窗外的树开始摇晃  \n我们却还在讨论  \n该不该修整鬓角的弧度  \n像修理一艘即将沉没的船"}}, {"i": 78, "prompt": "写一首关于夜间无人仓库的现代诗。自动搬运车避开地上一只误入的麻雀，路线因此不断重算。", "pk": "cp-v1-025", "A": {"id": "317d056d9742f339", "body": "自动搬运车绕过麻雀  \n麻雀惊起  \n绕了两圈又落回原处  \n绕过一扇门  \n绕过一排货架  \n绕过一堆箱子  \n绕过一盏灯  \n绕过一道墙  \n\n避开了麻雀  \n避开了电线杆上的鸽子  \n避开了树上的知了  \n避开了池塘里的蛙  \n避开了大路上的一块砖  \n避开了草地上的一株花  \n避开了屋檐下的一只猫"}, "B": {"id": "526e4dd91cbe4f0a", "body": "我走进仓库深处\n\n那里没有灯光\n\n也没有人\n\n只有那些自动搬运车\n\n在无人注意中\n\n悄无声息地运作着\n\n一只误入其中的麻雀\n\n惊动了它的一条路径\n\n它避开了地上那只\n\n仓皇逃窜的麻雀\n\n又绕了个弯儿\n\n继续朝着它要去的地方前行\n\n直到一声巨响把它吓住——\n\n那是远处传来的那架大吊车的轰鸣\n\n此刻，我站在黑暗的深处\n\n听见它发出的指令：\n\n“快退！”\n\n而它的履带仍在向前移动\n\n像一场无法停止的梦"}}, {"i": 79, "prompt": "根据《空房间》写一首现代诗。", "pk": "title:空房间:bare", "A": {"id": "dff29530e087da7d", "body": "《空房间》\n\n墙上的时针早已睡去  \n在那扇紧闭的门后，  \n你留下的一双鞋静静地躺着  \n等待着一双手  \n再将它们穿起\n\n桌上的茶杯还留有一滴水  \n窗外的风轻轻吹动窗帘  \n我看见了你的影子  \n一闪而过  \n像一只鸟儿从天空飞过"}, "B": {"id": "be4dbd8efecf49ae", "body": "**《空房间》**\n\n风在门缝里游荡，  \n像一个无人认领的信使，  \n轻轻叩打墙壁，  \n却敲不开记忆的门。\n\n窗帘还在摇晃，  \n仿佛昨日有人走过，  \n留下一串未说完的话，  \n和一地破碎的光斑。\n\n镜子依旧沉默，  \n映不出谁的轮廓，  \n只有尘埃在光线中起舞，  \n像是时间遗落的标点。\n\n床铺整齐如初，  \n却再无梦来栖息，  \n枕头下压着的纸张，  \n字迹模糊，似曾相识。\n\n墙角的钟摆仍在走动，  \n只是不再为谁停留，  \n每一个滴答声，  \n都像一声叹息，回荡在空旷之中。\n\n这里曾经有温度，  \n现在只剩下回音。  \n我站在这里，  \n仿佛是另一个自己，  \n在寻找一个早已消失的影子。"}}, {"i": 80, "prompt": "写一首现代诗，题材：清晨渡口的第一班船。", "pk": "fp-01", "A": {"id": "d230eec1717ab915", "body": "铁锈在缆绳上凝结成霜  \n水汽漫过石阶，吞没最后一声叹息  \n钟摆摇醒沉睡的铆钉  \n钢铁骨架开始呼吸  \n\n雾从舱底升起，裹住未拆封的黎明  \n乘客们低头检查衣褶里的地图  \n而风正穿过空座位，翻阅  \n被潮汐折叠的旧地址  \n\n汽笛撕开沉默的皮肤  \n我们是否都曾在某次启程中  \n遗落了归途的坐标？"}, "B": {"id": "6fb28cd295c8b049", "body": "一只小船摇进了黎明，\n\n摇进了一个喧哗的世界。\n\n啊！第一班渡船！\n\n你满舱装的是些男儿，\n\n他们的脸像一排树的颜色，\n\n他们的脚穿着草鞋，\n\n他们的眼睛像两盏灯……\n\n船夫，他们是不是都睡了？\n\n是不是还有人醒着做梦？"}}, {"i": 81, "prompt": "写一首关于医院走廊自动售货机的现代诗：深夜，机器退回一枚硬币，等待的人没有再次投入。", "pk": "cp-v1-005", "A": {"id": "502a009096d12b1e", "body": "金属喉咙吞下最后一粒光  \n寂静在玻璃后涨潮  \n锈蚀的按钮反复练习  \n如何把黄昏折叠成一个圆  \n\n荧光屏吞吐着过期的日期  \n硬币躺在底部，像枚未孵化的蛋  \n风穿过通风管，带来  \n远处呼吸机的叹息  \n\n门禁卡刷出一道裂痕  \n时间在此凝结成霜  \n而机器仍在等待  \n某个未被命名的黎明"}, "B": {"id": "a0ea1863b4d5647a", "body": "深夜里一排排冷光闪烁\n只有我这台自动售货机醒着  \n我吞下了三枚硬币  \n把一瓶汽水退了回来  \n我的身体是铁做的  \n但也是会生病的  \n我从没像今晚这样期待过  \n一个病人的到来"}}, {"i": 82, "prompt": "写一首夏夜高速公路服务区的现代诗。长途司机洗脸时，一群飞蛾围住坏掉一半的招牌。", "pk": "cp-v1-018", "A": {"id": "bbb01ed4b714814f", "body": "一车人\n从遥远的地方\n奔向另一个遥远\n\n天黑了\n在路标旁休息\n我们擦汗\n洗尘土飞扬的脸\n擦亮眼睛\n\n这时我看见一只蝴蝶\n悄悄地停落在车窗上\n像一幅画\n\n于是我就有了一个想法\n明天会很美"}, "B": {"id": "84f3c8814c27434c", "body": "水龙头吐出一串沉默的银针  \n他仰头吞下盐粒般咸涩的黄昏  \n碎玻璃在水泥地上生长  \n铁锈渗入混凝土裂缝  \n像某种未完成的古老文字  \n\n霓虹灯管抽搐着  \n把“住宿”两个字切成两半  \n飞蛾撞进残缺的字母里  \n翅膀粘满塑料与沥青的气味  \n它们绕着他的影子跳圆舞曲  \n\n柴油味漫过脚手架  \n路灯突然睁眼  \n照亮他掌纹中未干的机油  \n以及那些被轮胎碾碎的  \n星辰的碎屑"}}, {"i": 83, "prompt": "写一首春运候车室的现代诗。一位老人把纸质车票夹进透明手机壳，广播多次更换检票口。", "pk": "cp-v1-026", "A": {"id": "7c2d828e4fda1cae", "body": "一列火车从大山走出，\n挤满了一车人。\n一个老人站在月台上，\n手里紧紧握着一张车票，\n好像它是一块肉皮，\n或者像一个女人的脸蛋。\n\n他从一个很远的城市来，\n坐了很长时间的长途汽车，\n又转火车。\n他穿着一件洗得发白的灰布衫，\n一副疲惫的样子，\n仿佛是从地狱里逃出来似的。\n\n列车员大声喊道：\n“上车吧，要开啦！”\n老人抖了抖身子，\n才想起自己还在人间。\n于是他走进车厢，\n找到自己的座位坐下。\n\n这时，我看见一个中年男子走过来，嘴里嚼着口香糖。\n他说：“大爷，这车票是你的吗？”\n老人点点头。\n那中年人便说：“大爷，我是列车员。”\n说着话他就把车票抽了过去，\n然后又放回去，\n说：“大爷，你的车票有点问题，不能上车。”\n\n老人急了，脸都涨红了，\n声音也变了：“你是谁？凭什么不让我上车？\n我可是有票的！”\n\n那中年人说：“大爷，你仔细看看这张车票……”\n他指着背面的一个小字，\n好像是一个小黑点。\n接着他又说，“大爷，这个车票不是本车的，你上不了车。”\n\n老人低头看了看，\n脸上露出困惑的表情。\n他喃喃地说：“不会吧……这是我在长途汽车上买的一张车票啊……\n怎么会变成这样了呢？\n\n那中年人说：“大爷，\n现在都是自动售票机了，\n没有人工窗口了。”\n然后他又补充一句，\n“大爷，你要是实在想去那个城市的话，\n我们可以给你安排下一班火车，\n不过你要等一下哦。”\n\n老人摇摇头，叹了口气，\n似乎有些失落。\n但过了一会儿，\n他又抬起头来，\n眼神坚定地说：\n“好，那我就在这里等着下一辆火车。”\n\n说完他就坐下了，\n拿出手机开始拍照，\n好像要把这瞬间永远定格下来。\n\n就在这时，\n列车员又跑了过来，\n手里拿着一把钥匙，\n说是要检查一下厕所门锁的情况。\n\n原来列车上的厕所门被人撬开了，\n里面的东西全被偷走了。\n\n列车员打开门一看，\n果然如此。\n他皱起眉头，\n一边嘟囔着，\n一边打电话给前方车站报警。\n\n整个候车室一片混乱，\n大家都纷纷议论起来。\n\n有人说是小偷偷的，\n也有人说是铁路工人干的……\n\n这时，\n一位警察模样的人也走了进来，\n他问列车员发生了什么事。\n\n列车员就把刚才发生的事情告诉了他。\n\n那警察听了之后，\n马上掏出对讲机呼叫前方警力支援。\n\n不一会儿，\n几辆警车呼啸而来，\n停在了站台上。\n\n警察们迅速下车，\n拿起手电筒往厕所里照，\n只见里面有东西散落一地，\n显然是被人翻动过的痕迹。\n\n他们随即展开调查，\n并对现场进行了封锁处理。\n\n就在我望着这一切发生的\n时候，\n又一阵嘈杂声传来，\n原来是另一个车厢出现了问题。\n\n只见一个小伙子满脸通红，\n气喘吁吁地跑了出来，\n口中还带着哭腔，\n好像是遇到了什么麻烦。\n\n旁边的人连忙上前安慰他，\n并问他怎么了。\n\n那小伙子抽泣着说：\n“我的身份证丢了，\n人家不让上车……”\n\n众人一听，\n纷纷围上来，\n询问详情。\n\n那小伙子解释道：\n他是刚从大学毕业的学生，\n第一次独自坐火车出门，\n结果不小心把自己随身携带的身份证弄丢了。\n\n大家听后都表示同情，\n有人还主动提出帮他想办法找回丢失的东西。\n\n有人提议，\n可以先到车站派出所报案，\n说不定能查到丢在哪里。\n\n也有人大胆猜测，\n会不会是被人偷去了？\n\n小伙子听后更加"}, "B": {"id": "36669dc43091de6a", "body": "老人将车票夹进透明手机壳  \n像往玻璃瓶里投掷一枚旧年份  \n广播声在天花板上打滑  \n第三次更改检票口编号  \n\n塑料椅背上的褶皱  \n记录着无数脊椎的弯曲  \n有人用指甲在桌板刻下  \n一串未完成的电话号码  \n\n电子屏蓝光漫过  \n褪色的行李标签  \n母亲数着站台灯  \n说这是她第七次  \n看见自己的影子被拉长  \n\n铁轨在远处吞吐呼吸  \n而此刻所有钟表  \n都停在了同一个  \n等待的瞬间"}}, {"i": 84, "prompt": "写一首关于小城公共泳池冬季排水的现代诗。池底显出褪色的泳道线，一个维修人员从深水区走向浅水区。", "pk": "cp-v1-030", "A": {"id": "219e6dfa7f73785a", "body": "排水管发出金属的叹息  \n水珠沿着瓷砖缝爬行  \n褪色的蓝色泳道线浮出水面  \n像某种远古地图  \n\n维修工的靴子踩碎镜面  \n他弯腰时  \n影子被拉长成另一条游动的鱼  \n\n深水区残留半截呼吸管  \n浮标沉入池底  \n成为石英脉络中的一粒盐  \n\n他走向浅滩  \n脚步丈量着  \n被季节遗忘的弧度  \n水位线正在退潮  \n露出混凝土的皮肤  \n以及那些未被命名的褶皱"}, "B": {"id": "85cf69359716922c", "body": "空荡的泳池像一只巨大的眼睛。  \n它的瞳孔是褪了色的蓝色泳道线，  \n水已抽干，剩下的一摊水，  \n正沿着排泄管汩汩地滴淌。  \n我看见了一个人，他的衣袖沾满水迹，  \n赤裸着上身，从深水区慢慢走来。  \n他走得有点吃力，像是在跋涉一片荒原，  \n脚下的泥泞正在一点点地凝固。"}}, {"i": 85, "prompt": "写一首博物馆修复室的现代诗。修复师用极细的笔补一幅古画中的裂隙，窗外正在修高架桥。", "pk": "cp-v1-029", "A": {"id": "5750a719c1532837", "body": "针尖悬停于绢帛裂缝之上  \n墨色渗入千年未干的褶皱  \n铜尺量过残缺的山脊  \n一粒尘埃落在青石阶  \n\n高架桥的钢索绷紧黄昏  \n电钻咬碎混凝土的骨骼  \n水泥浆沿着脚手架攀爬  \n像某种缓慢的呼吸  \n\n他蘸取赭石填补断裂的云层  \n笔锋游走处 碎玉重组为完整的月光  \n窗外铁锤敲打钢筋的声音  \n正将一座城的轮廓重新浇铸  \n\n颜料在宣纸里苏醒  \n而桥墩刺穿地层的沉默  \n两种修补术在玻璃幕墙内外对峙  \n时间的碎屑不断坠落"}, "B": {"id": "da1ac2829d76fdcb", "body": "一只黑漆乌龟从窗下走过\n穿了件蓝布长衫\n一旁的黄狗儿对着它汪汪直叫\n乌龟不答\n埋头啃吃草料场里的麦秸\n谁也不知那是什么年代\n反正很旧了\n一只破瓷碗放在那里\n碗里躺着一颗枣子\n枣核上刻着一行小楷\n字迹已模糊难辨\n只有最后一句尚可看得出来：\n“请不要把我的脸涂黑”"}}, {"i": 86, "prompt": "写一首现代诗：地铁末班车的清洁工把失物一件件登记。让登记这个动作显出它的荒谬。", "pk": "lp-12", "A": {"id": "44f48fcb7dfefa82", "body": "一列南下的列车从隧道口钻出来，\n车轮在枕木上摇响铜钟的回声，\n车厢里一个戴眼镜的男子脱下衣裳，\n说他要去游泳，把衬衫叠好放进旅行袋里。\n\n另一个男子从他的衣夹上取下一张照片\n夹进一本精装书里，书脊上印着\n“巴黎风光”，照片背面写着\n“赠给艾迪特——我最美丽的天使。”\n\n当列车驶入月台，\n一个穿围裙的妇人将她的提包搁在行李架上，\n又把装着一把雨伞的一只黑手提包\n放在另一个男人的腿底下。\n\n当列车驶离月台，\n一个穿背心的男人打开他的公文包\n取出一叠文件，用打火机点燃了它们，\n然后把灰烬撒向窗外的河流。\n另有一个女人把她的太阳镜摘下来，\n塞进她那件淡蓝色连衣裙的口袋里，\n接着又把它掏出来，仔细地擦过了。\n\n当列车缓缓地开过一道铁桥，一个男子\n倚在窗前望着桥下一条河里的船队，\n他突然想起自己把钥匙忘在了家里，\n便打开他的皮夹子，从里面的一张证件上\n撕下一角纸，用一只圆珠笔写下：\n“请代为转交我妻子。”"}, "B": {"id": "676dc960ab580c8e", "body": "一列黑色列车疾驰过城市，\n留下满地的脏污与尘埃。\n\n一只被丢弃的红色袜子\n在风中摇摆，如同哭泣的脸。\n\n一位清洁工提着一个大布袋，\n将地上所有东西一一捡起：\n\n一张皱巴巴的电影票根，\n一枚生锈了的旧硬币，\n\n一条被撕烂的小手帕，\n一只沾满泥浆的塑料杯，\n\n一根断裂的粉笔头，\n一顶破旧的草帽……\n\n最后他从布袋里掏出一个\n用报纸包好的小盒子。\n\n打开一看——里面是颗\n被老鼠咬得面目全非的心。"}}, {"i": 87, "prompt": "写一首现代诗，题材：台风过后有人在海边捡拾漂来的木板。", "pk": "fp-07", "A": {"id": "845edc30beee95aa", "body": "一男子坐在沙丘上\n\n用一根绳子系住一块木板\n\n他想把它拉到山那边去\n\n另一男子用脚踩着它\n\n把那块木板踢向海里"}, "B": {"id": "f5694e849c325ef4", "body": "七月的海风很凉爽。\n\n我坐在礁石上，看一个渔夫在捡拾昨夜风暴卷来的树干。\n\n他把它们一一码放好。然后他蹲下身去，用一把小刀削着一段木板，说这是做箱子的好材料。他说这木板是昨天从大海那边刮来的。\n\n我问他是怎么发现这木板的。他说是在海边的沙滩上找到的。我说既然它被海浪冲上了岸，那它就一定是从海上来的。他听了点点头，又继续削下去。"}}, {"i": 88, "prompt": "写一首现代诗：夜里给一株快死的植物换盆。写根须离开旧土时的那几秒。", "pk": "lp-11", "A": {"id": "5d7b5043f824b156", "body": "——我听见了泥土深处传来的悲鸣。\n我的眼睛湿润。\n我看见了\n一根被剪断的根茎在空气中伸长\n它痛苦地蜷缩了一下\n就枯萎了。\n而另一些根茎正埋头向泥土中钻去。\n我仿佛看见它们的牙齿\n咬破了黑暗。\n我感到自己正站在一块\n不断增大的\n黑色土地上……\n我把这株植物移进一个新花盆。"}, "B": {"id": "073d724a5e2af165", "body": "指腹触到褶皱的裂痕  \n泥土在掌心碎成灰白的盐粒  \n根系蜷缩如溺水者的手臂  \n挣脱腐殖质的桎梏  \n\n暗红血管在月光下抽搐  \n旧陶罐渗出锈色的叹息  \n新泥未干的裂缝里  \n有虫蛹在等待一场未命名的迁徙  \n\n剪刀咬住茎部的刹那  \n汁液溅落成星图  \n所有隐秘的支脉正被重新丈量  \n而你的名字  \n仍悬在瓷瓶边缘摇晃"}}, {"i": 89, "prompt": "写一首关于山区信号塔检修的现代诗。云层低于塔顶，检修员收到一条来自山下的延迟消息。", "pk": "cp-v1-032", "A": {"id": "88f9a1cbb61a7f1b", "body": "一早我便登高望远\n山脚下是浓密的晨雾\n山顶上是一片宁静的天空\n那座信号塔矗立在那里\n像一座神秘的灯塔\n召唤着远方的人们\n\n我的手机突然响了\n是一条来自山下的信息\n“山上天气不好\n请尽快回来”\n我看了看天空\n云层很低\n似乎随时都会飘过来\n我赶紧整理了一下工具\n准备下山\n\n走在路上\n我忽然感到一丝寒意\n抬头一看\n天边乌云密布\n狂风怒号\n我加快了脚步\n向山下奔去"}, "B": {"id": "18d67a2a35d7637b", "body": "云层压住金属脊背  \n螺丝刀在锈色褶皱里寻找缺口  \n对讲机吞下三分钟前的问候  \n山下传来  \n“灯泡该换了”  \n\n他解开安全绳结  \n像解一道未完成的算术题  \n风在铁架间穿针引线  \n把电流织进更深的褶皱  \n\n工具箱里躺着  \n半截铅笔与生锈的钥匙  \n它们曾在某次停电中  \n替他写下过密码  \n\n云层翻涌如未干的墨迹  \n信号波纹在玻璃罩内打转  \n他摘下耳机  \n听见自己的心跳  \n比所有指令更早抵达  \n\n山下再次响起  \n“灯泡该换了”  \n他举起手电筒  \n光柱刺破雾霭  \n落下时  \n已变成另一个名字"}}, {"i": 90, "prompt": "写一首现代诗：拆迁前最后一天，有人回到空屋量窗户的尺寸。让丈量这个动作反复出现，每次量的东西不同。", "pk": "lp-02", "A": {"id": "a8a054c6125df745", "body": "卷尺在墙上划出一道白线  \n指节抵住裂缝，像测温的探针  \n他数着玻璃碎渣的厚度  \n把黄昏切成薄片  \n\n第二次测量时  \n窗框已倾斜成问号  \n他用脚步丈量阴影的弧度  \n钉子在木板里发出叹息  \n\n第三次他摸黑进来  \n用掌纹替代刻度  \n黑暗吞下所有数据  \n只剩风在空荡的房间里  \n反复校准自己的形状"}, "B": {"id": "f49837484ef4e301", "body": "一丈三尺九寸——\n\n老宅子东厢房的窗口。\n\n“就是这尺寸？”\n\n是母亲的声音。\n\n她用一把铜质皮尺\n\n从窗棂到窗棂\n\n在墙根儿比划着：\n\n一丈三尺九寸，\n\n又一丈三尺九寸，\n\n再一丈三尺九寸……\n\n直到那窗口消失，\n\n只剩下一堵断墙。"}}, {"i": 91, "prompt": "写一首现代诗：一个人在自助洗衣店等衣服烘干，玻璃门映出他自己。写两个影像之间的时差。", "pk": "lp-08", "A": {"id": "3c2b633e188975f0", "body": "水珠从金属表面滚落  \n像秒针划过表盘  \n他站在玻璃门前  \n看另一个自己  \n正被烘干机吞吐  \n\n褶皱在衣物间游移  \n如同记忆的暗流  \n门外的霓虹渗入  \n镜中人的瞳孔  \n染上黄昏的锈迹  \n\n时间在此刻裂开缝隙  \n影子与现实交换密码  \n他伸手触碰  \n那道虚线  \n却只握住潮湿的空气  \n\n忽然有风掀起衣角  \n他转身  \n背对光影的深渊"}, "B": {"id": "99c385a3463341e4", "body": "玻璃门外一个男子站着\n玻璃窗内另一个男子坐着\n男子站立着看男子坐立着\n男子静坐着想男子站立着\n男子坐着看着窗外的男子\n男子立着望着玻璃中的自己\n男子立着望着镜中的男子\n男子坐着望着窗外的男子\n男子坐着望着镜中的人影\n男子立着望着窗外的男子\n男子坐着望着窗外的人影"}}, {"i": 92, "prompt": "根据《母亲的手》写一首现代诗。", "pk": "title:母亲的手:bare", "A": {"id": "922eeb00e6f7adfc", "body": "**《母亲的手》**\n\n你曾托起我最初的啼哭，  \n在深夜的摇篮里，轻如风。  \n那双手，是岁月最温柔的笔，  \n写下无数个未眠的黎明。\n\n粗糙的纹路，藏着风雨的痕迹，  \n却始终为我擦去泪滴。  \n在厨房的烟火中，在田埂的尘土里，  \n它从未停下，只为给我一个安稳的归期。\n\n当我学会奔跑，它便退后成影子，  \n默默守望，不言疲惫。  \n而如今，我终于读懂了那些沉默，  \n在掌心的温度里，听见了整个世界的爱。\n\n母亲的手，  \n是时间的茧，也是生命的光，  \n在我心中，永远柔软如初见的模样。"}, "B": {"id": "602bd924d0521ed5", "body": "《掌纹》\n\n你曾用这双手\n为我折纸船\n一只只驶向深海的远方\n那时的浪花\n是银色的梦，是我最初的故乡\n\n后来你用这双手\n种下一片片绿油油的菜畦\n春天和秋天在你的指缝中生长\n阳光从掌心透出\n把四季晒得通亮\n\n直到有一天\n我看见你坐在窗前\n将一缕白发编进自己的头发里\n像编织一件古老的蓑衣\n披上它，就能走进风雨飘摇的岁月"}}, {"i": 93, "prompt": "写一首现代诗：暴雨后的操场积水，几个孩子把纸船放进去。让纸的吸水速度决定全诗的节奏。", "pk": "lp-10", "A": {"id": "82068755fdfb2e79", "body": "雨来之前孩子们就为操场浇了水\n为了使他们小小的船在纸上航行\n雨一停他们便将船放入水中\n看谁的纸被水最先打湿\n\n水是他们唯一的财富\n他们用它来漂走自己的童年"}, "B": {"id": "d82269e409807603", "body": "积水在黑色的跑道上缓慢爬行  \n鞋印是褪色的地图  \n风掀动校服下摆  \n像某种未完成的信号  \n\n纸船浮起时  \n褶皱正被雨水泡软  \n墨迹洇开成模糊的轮廓  \n他们用脚尖丈量波纹的边界  \n\n树影斜切过水面  \n碎金在褶皱里闪烁  \n某个瞬间  \n所有倒影都开始倾斜  \n\n纸张吸饱了水  \n沉入深处的寂静  \n不再有桨声  \n只有苔藓爬上水泥裂缝  \n悄然生长"}}, {"i": 94, "prompt": "写一首现代诗：医院走廊的自动贩卖机在深夜发出光。让等待的人和机器互为对方的证明。", "pk": "lp-04", "A": {"id": "2944d342251c6427", "body": "夜深了\n医院的走廊亮着惨白的灯\n一列自动贩卖机闪烁着微光\n像一群沉默的守卫\n\n我走进医院\n寻找一位病人\n却找不到他的床号\n只有那些寂寞的机器\n闪着幽蓝的光芒\n\n在一间昏暗的病房里\n我看到他正对着一瓶矿泉水微笑\n那是他唯一的安慰\n仿佛那是\n一颗星"}, "B": {"id": "8acb1a37f85536fa", "body": "夜色像一堵墙。  \n药水在瓶里摇晃，  \n灯光是唯一清醒的脑袋。\n\n它把我们当客人，  \n它把我们当病人。  \n我们被它关在笼子里。\n\n而它自己又是什么？  \n它的嘴是空的，  \n它的胃是空的。\n\n它只是亮着灯，  \n让我们看见自己的病，\n\n我们的痛苦。"}}, {"i": 95, "prompt": "写一首现代诗，题材：搬走后房东来收钥匙。", "pk": "fp-04", "A": {"id": "1071e47f8fc73bcc", "body": "门锁在寂静中生锈  \n空房间吞下最后一粒尘埃  \n墙皮剥落成褪色的信笺  \n指纹在电闸上结出霜花  \n\n水表停转了整个季节  \n晾衣绳悬着未干的黄昏  \n钥匙圈叮当坠入深井  \n沉默是唯一的租客。"}, "B": {"id": "089bb4b0a120ca7f", "body": "我们走了\n房子空了\n你留下一把钥匙在桌上\n我们再也不会回来\n\n房东来了\n收回钥匙\n我们的家也跟着搬走了"}}, {"i": 96, "prompt": "修鞋摊上一只鞋等了三个月没人来取｜不写等待，只写鞋的形状变化", "pk": "sc-002-f4", "A": {"id": "0abf8410adba8de6", "body": "鞋底的弧度渐渐弯成问号\n摊边的风把线头吹成绳结\n鞋帮渗出暗红锈迹\n像某种未干的墨水\n\n鞋舌垂落时总带点歉意\n摊主用木钉叩响黄昏的门\n鞋跟在尘土里种出年轮\n沉默比修补更接近完整\n\n鞋面裂开一道缝\n摊前的雨滴钻进去游荡\n鞋带松垮如搁浅的船\n被时间推着向前\n\n鞋的轮廓终于学会弯曲\n摊上落满清晨的碎光\n它不再需要脚掌的温度\n只是安静地结束了旅程。"}, "B": {"id": "8ad5c4b61c205ba7", "body": "鞋底裂开一道弧线\n像被风揉皱的信纸\n摊边的铁锈爬上鞋帮\n凝固成褐色的褶皱\n\n雨水在鞋尖积成镜面\n倒映出无数个自己\n鞋舌垂落如沉睡的舌头\n舔舐着潮湿的黄昏\n\n鞋跟磨损成圆润的石子\n被时间反复打磨\n摊主扫去落叶时\n它便沉默地偏转角度\n\n鞋面泛起微光\n仿佛某人正从远处走来\n摊前的黄昏缓缓倾斜\n鞋终于闭合了眼睛。"}}, {"i": 97, "prompt": "写一首以“没有寄出的语音消息”为核心事件的现代诗。不要呈现消息全文，只写录制、删除与周围环境。", "pk": "cp-v1-011", "A": {"id": "2fe1b0afde6c3ed7", "body": "我对着麦克风说了一些话  \n没有按下发送键  \n手指悬停在屏幕上方  \n像悬停在悬崖上方  \n\n窗外飘着雪片  \n阳台上的铁皮盆栽  \n被积雪压得摇晃  \n一只麻雀从树上飞起  \n抖落几片羽毛\n\n我删掉这段语音  \n又重新录了一遍  \n再次删除  \n反复数次之后  \n最终什么也没留下"}, "B": {"id": "a06f5dcd5d935cf7", "body": "手指悬停  \n在发送键上方三毫米处  \n像悬在深井边缘的钟摆  \n\n空调吐出白雾  \n屏幕泛着幽蓝的潮汐  \n我反复擦拭玻璃上的指纹  \n直到它成为另一种沉默  \n\n窗外的雨滴  \n正把霓虹折成纸船  \n而我的喉结滚动了一下  \n像吞下未命名的候鸟  \n\n静音键按下又弹起  \n仿佛某种隐秘的开关  \n被月光轻轻拨动  \n\n最终  \n那条消息蜷缩在草稿箱深处  \n成为时间褶皱里  \n一枚未拆封的邮票"}}, {"i": 98, "prompt": "写一首关于山区信号塔检修的现代诗。云层低于塔顶，检修员收到一条来自山下的延迟消息。", "pk": "cp-v1-032", "A": {"id": "b48c2e0e750c9eda", "body": "一早我便登高望远。山腰以下的云层很厚，像是积雨。我从山上下来，到了半山亭，看见一只鸟儿在电塔上歇脚。它好像也在眺望远方。我想，这只鸟儿大约是来寻找食物了。\n\n后来，我才知道，这是一只候鸟，每年春天，它们都要从南方迁徙到北方。迁徙途中，常常要找些地方休息，补充能量。这只鸟儿便是在这里歇歇脚，为继续北上做准备。\n\n我看着它一会儿张开翅膀，像是要起飞；一会儿又缩回翅膀，静静地看着远处的天空。它仿佛在等待着什么，又仿佛在思索着什么。\n\n过了一会儿，鸟儿终于振翅飞起，向着天边飞去。我想，它一定是去追寻那片更蓝的天空去了。"}, "B": {"id": "18d67a2a35d7637b", "body": "云层压住金属脊背  \n螺丝刀在锈色褶皱里寻找缺口  \n对讲机吞下三分钟前的问候  \n山下传来  \n“灯泡该换了”  \n\n他解开安全绳结  \n像解一道未完成的算术题  \n风在铁架间穿针引线  \n把电流织进更深的褶皱  \n\n工具箱里躺着  \n半截铅笔与生锈的钥匙  \n它们曾在某次停电中  \n替他写下过密码  \n\n云层翻涌如未干的墨迹  \n信号波纹在玻璃罩内打转  \n他摘下耳机  \n听见自己的心跳  \n比所有指令更早抵达  \n\n山下再次响起  \n“灯泡该换了”  \n他举起手电筒  \n光柱刺破雾霭  \n落下时  \n已变成另一个名字"}}, {"i": 99, "prompt": "写一首现代诗：夜班公交上，一个乘客始终没有按下车铃，车到终点站。不要解释他为什么不下车，让司机的动作和车厢的声音承担全部。", "pk": "lp-01", "A": {"id": "eafebcec270f4e2d", "body": "夜色像墨汁一般在车窗上流淌  \n乘客的脸庞映在玻璃里  \n被路灯染得惨白  \n他紧靠着门柱  \n双臂交叉着抱在胸前  \n眼睛直视前方  \n一动不动  \n车厢里充满着一种  \n令人窒息的沉默  \n司机摇摇头说：“该下车了。”  \n那乘客依然没有反应  \n仿佛他已沉睡千年  \n当车子驶入车站时  \n司机伸出手来推他一下  \n他却像块木头一样  \n纹丝不动"}, "B": {"id": "cd7e39690d322e60", "body": "夜深了，这辆夜班公交车像一条在暗流中漂浮的木筏。\n\n乘客们有的坐着打瞌睡，有的蜷缩着身子，还有的盯着窗外黑漆漆的街灯。\n\n“快到了。”不知谁嘟囔了一句。司机也点点头。\n\n“还有两站呢。”另一个人说。\n\n没人再说话。只有发动机发出一阵沉闷的嗡鸣。\n\n这时，前排的一位乘客缓缓起身，摇摇晃晃地走道后方去。只见他打开手提包，翻出一张钞票和一串钥匙。\n\n当这人转身要朝回走时，司机忽然猛踩刹车。"}}, {"i": 100, "prompt": "写一首沙尘暴过后教室里的现代诗。黑板上昨天的公式仍在，窗槽积了一层细沙。", "pk": "cp-v1-016", "A": {"id": "6152fad94ddd5174", "body": "昨夜的公式还在黑板上  \n昨日的阳光晒化了粉笔灰  \n昨日的笑声仍回荡  \n昨夜的风刮走了沙尘  \n窗外的天空湛蓝湛蓝的  \n一滴雨水也未落下  \n昨夜的沙子还在窗槽里静静地躺着"}, "B": {"id": "cefe0e8806170509", "body": "粉笔灰与砂砾在窗台达成共识  \n静默堆积成某种地质纪年  \n\n三角函数仍悬于黑板右上角  \n像未完成的化石  \n\n风从裂缝中撤退时  \n留下几粒细沙在桌脚  \n缓慢结晶  \n\n午后三点钟方向  \n阳光斜切过空荡的座位  \n阴影在墙上游移如未归的标本  \n\n窗外的树正在脱落旧皮  \n而讲台上  \n一支半截粉笔  \n正被时间慢慢  \n磨成齑粉"}}, {"i": 101, "prompt": "根据《旧站台》写一首现代诗。", "pk": "title:旧站台:sys", "A": {"id": "cd673e597eb763dd", "body": "月光是唯一的乘客  \n铁轨伸向更远的月光  \n\n一只水壶在桌上  \n等待着被取走  \n\n一个男人坐在长椅上  \n他的头像一粒种子"}, "B": {"id": "c3faf9e76ad3f870", "body": "锈蚀的铁轨在暮色中蜷缩  \n一只麻雀啄食着  \n碎玻璃里残留的黄昏  \n\n风穿过空荡的月台  \n把旧时刻表吹成  \n一张张发黄的皮肤  \n\n长椅上积满尘埃的指纹  \n正在缓慢地褪色  \n如同被遗忘的姓名  \n\n汽笛声从记忆深处浮起  \n却找不到  \n那列从未抵达的列车"}}, {"i": 102, "prompt": "根据《晚风》写一首现代诗。", "pk": "title:晚风:bare", "A": {"id": "a72f96d35eb47c8b", "body": "**《晚风的回声》**\n\n暮色在天边缓缓铺开，  \n像一张未干的水彩画，  \n晚风从远方走来，  \n带着白天的余温与尘埃。\n\n它掠过树梢，  \n惊醒了沉睡的叶语；  \n它穿过小巷，  \n撩动了街角的灯影。\n\n我站在时光的缝隙里，  \n听它低语，  \n仿佛是旧日的呢喃，  \n又像是未来的预告。\n\n它不问归期，  \n也不问为何停留，  \n只是轻轻地，  \n把一天的故事吹进我的掌心。\n\n夜色渐浓，  \n晚风依旧在走，  \n而我，  \n成了它路过的风景。"}, "B": {"id": "53bce9dbe6b89f50", "body": "《晚风》\n\n黄昏的尽头，有人\n用一块碎玻璃\n擦亮了天边的云\n\n一只鸟飞过\n像一滴墨在纸面晕开\n我看见了天空的伤口\n和它下面的一片田野\n\n风吹动着草叶\n仿佛吹动了一群低语的嘴唇\n它们说：\n秋天来了\n\n我想起一个人\n他走远了\n留下的只是一串脚印\n和一颗等待着春天的心"}}, {"i": 103, "prompt": "写一首现代诗：一场雨把整条街的伞打开。写伞面之下看不见的部分，不写雨本身。", "pk": "lp-03", "A": {"id": "c889383af9198e7e", "body": "——雨中偶见\n\n街上一排黑伞。\n\n伞下是一排灰脸。\n\n灰脸的后面是一排花裙。\n\n花裙的一角是一排白袜子。\n\n白袜子下有一排白脚趾。\n\n白脚趾上是一排红指甲。\n\n红指甲旁是一排白手。\n\n白手边是一排黑衣裳。\n\n黑衣裳外是一排白皮肤。\n\n白皮肤里是一排粉血肉。\n\n粉血肉中是一排红心。\n\n红心里是几行黑字：\n\n“请看我怎样活着。”"}, "B": {"id": "b8ace592dd1a102c", "body": "夜雨。\n\n街上没有一个人。雨点在路灯下织着金丝线。\n\n我看见一个穿粉红夹克的小姑娘\n\n正踮起脚，用一根长竹竿敲打着\n\n那家咖啡馆的门环：\n\n“来呀！来呀！\n\n雨天多好哇！”\n\n我看见\n\n一只黑猫\n\n正蹑手蹑脚地\n\n从那扇半开的玻璃窗里溜出去……"}}, {"i": 104, "prompt": "写一首关于旱季水库的现代诗。水位下降后露出旧村的屋脊，叙述者只在岸上观察，不进入回忆说明。", "pk": "cp-v1-002", "A": {"id": "d8cdc46dec078509", "body": "山峦像一个巨大的犁头\n\n把天空翻动起来\n\n我看见一个村庄\n\n在山腰上晒着太阳\n\n几株老树枯瘦的手臂\n\n扶住了一些茅草屋\n\n水田已经干涸\n\n一条条裂缝像伤口\n\n一洼浅水盛满了月亮\n\n一只白鹭走来走去"}, "B": {"id": "13eee935911a0211", "body": "混凝土裂纹爬出几条鱼骨  \n水线退至第七根电线杆  \n铁皮屋顶在泥缝里发芽  \n\n浮标锈蚀成某种古老货币  \n被蜻蜓反复折叠  \n褶皱中渗出盐粒  \n\n芦苇丛深处传来凿墙声  \n某个黄昏的砖块正在松动  \n苔藓爬上水泥台阶  \n像缓慢的判决书  \n\n石阶尽头有半截晾衣绳  \n悬着去年未干透的云  \n风经过时总要带走  \n几滴未命名的蓝  \n\n岸边的影子比水面更薄  \n它正把旧地址  \n翻译成一串沉默的坐标"}}, {"i": 105, "prompt": "写一首博物馆修复室的现代诗。修复师用极细的笔补一幅古画中的裂隙，窗外正在修高架桥。", "pk": "cp-v1-029", "A": {"id": "f9c625bdc853cea8", "body": "针尖悬停于绢帛裂缝之上  \n墨色渗入千年未干的褶皱  \n铜尺量过残缺的山脊  \n一粒尘埃落在青石阶  \n\n高架桥的钢索绷紧黄昏  \n电钻咬碎混凝土的骨骼  \n水泥浆沿着脚手架攀爬  \n像某种缓慢的呼吸  \n\n他蘸取赭石填补断裂的云层  \n笔锋游走处 碎玉重组为完整的月光  \n窗外铁锤敲打钢筋的声音  \n正将一座城的轮廓重新浇铸  \n\n颜料在宣纸里苏醒  \n而桥墩刺穿地层的沉默  \n两种修补术在玻璃幕墙内外对峙  \n时间的碎屑不断坠落"}, "B": {"id": "a79e6129b15cc1a9", "body": "一只黑鸟掠过天窗  \n窗框是一根断裂的横梁，  \n一扇门开在它的对面，  \n门后是空墙。  \n\n他凝视着墙上那幅残缺的《寒江独钓图》  \n鱼竿正指向画面外  \n一条看不见的小河。  \n\n有人在窗下敲打钢钉，  \n声音像锤子击打钟声，  \n钉尖刺破了窗外的阳光，  \n阳光从钉孔流进室内。"}}, {"i": 106, "prompt": "写一首现代诗：搬家工人把一架钢琴抬下六楼。写重量如何在几个人之间转移。", "pk": "lp-05", "A": {"id": "b6116f6d122e1051", "body": "搬运队到了。\n\n三个汉子肩扛绳索，一前两后，抬着那架黑漆的钢琴，\n\n如一座古堡，行走在街边的树影里。\n\n“慢些儿！”\n\n一个戴白围裙的老者扶着门框说：\n\n“这是你们家的吗？”\n\n“是啊。”他们答。\n\n“那么重！”\n\n“嗯。”\n\n“从六楼往下运啊？”\n\n“是啊。”\n\n老者默然。\n\n他望着他们远去的身影，想：钢琴上该放一把钥匙吧，不然谁会来开门呢？"}, "B": {"id": "6d5b908d3d84fc89", "body": "搬运工的手掌嵌进木纹  \n汗水在琴盖上洇出年轮  \n三个人的肩膀构成三角形  \n稳住一个世纪的沉默  \n\n铁轨在楼梯拐角咬出缺口  \n金属支架渗出暗红锈迹  \n有人喊停  \n像旧时代信号员举起旗语  \n\n琴凳被撬开时  \n露出内里发霉的纸张  \n某人用指甲刮去尘垢  \n指腹残留着盐粒  \n\n他们轮流背负这具沉睡的躯体  \n楼道灯忽明忽暗  \n影子在墙缝间游移  \n如同被剥离的旧时光  \n\n“它比想象中轻。”  \n邻居倚在门框说。"}}, {"i": 107, "prompt": "写一首现代诗，题材：修表匠拆开一只停走的表。", "pk": "fp-02", "A": {"id": "e758ac68be4f25d2", "body": "一只表  \n被打开的胸膛  \n像一朵花  \n\n铜做的心在跳动  \n铁做的血红了  \n他的脸"}, "B": {"id": "6428266b25961360", "body": "一\n\n一个修表匠打开一只表。\n\n在表盘上看到一座小城。\n\n城里有一片广场。\n\n广场上有个人头。\n\n头上有几缕白发。\n\n二\n\n他把表放在膝头\n\n开始修理。\n\n用镊子夹起一根头发，\n\n轻轻地拔掉。\n\n然后他拧紧了螺丝。"}}, {"i": 108, "prompt": "根据《铁轨旁的野花》写一首现代诗。", "pk": "title:铁轨旁的野花:sys", "A": {"id": "63d9ea1ac145d9e6", "body": "铁轨在暮色中延伸  \n野花从缝隙里探出头来  \n它们的名字被风带走  \n只剩根须紧紧咬住泥土  \n\n蒸汽在远处嘶鸣  \n一列火车正撕开黄昏的皮肤  \n花瓣在震动中颤抖  \n像某种未完成的告别  \n\n有人把旧信封埋进土里  \n邮戳早已模糊不清  \n而野花年复一年  \n用沉默翻译着铁轨的语言  \n\n它们不需要轨道  \n却始终朝着远方生长  \n仿佛所有旅程  \n都始于一次偶然的偏离"}, "B": {"id": "ee1e259470e0d072", "body": "月光是唯一的水手  \n在夜航中  \n被波涛推着走  \n推到河岸的尽头  \n\n一朵小花，突然从土里站起来  \n它用叶子的手  \n抓住月亮的衣襟  \n然后又把月亮轻轻放回水面"}}, {"i": 109, "prompt": "写一首关于城市停电十分钟的现代诗。叙述在不同楼层间移动，只通过窗、脚步和短暂亮起的手机呈现人群。", "pk": "cp-v1-009", "A": {"id": "08936e85902cdd1d", "body": "电梯停止在第七层  \n有人敲击铁门  \n声音被黑暗吞没  \n\n楼梯间亮着一串幽蓝的光  \n像萤火虫在墙缝里游移  \n脚步声从高处坠落  \n碎成几粒星子  \n\n二楼的窗突然亮了  \n一束光切开夜的绸缎  \n有人举起手机  \n影子在玻璃上摇晃  \n如同钟摆悬停在午夜  \n\n三楼传来孩子的哭声  \n被另一盏光安抚  \n我们各自成为灯塔  \n在黑潮中漂浮  \n直到电流重新咬合时间"}, "B": {"id": "3718a7cb0cc3b0e0", "body": "我住七楼\n楼下忽然传来\n一阵惊慌的骚动\n人们举着蜡烛和火把\n在各层楼奔跑\n好像发生了大劫难\n我打开窗户\n看见人群正涌向\n一楼门洞处\n我问：“到底出了什么问题？”\n回答是“停电了”\n我说：“那又怎么样？”\n一个声音吼叫：“快跑！”\n大家便呼啦一下散尽\n我回到房里\n想点支烟\n才发现连火柴也看不见了\n这时我摸到床头的手机\n忽然被点亮\n只见屏幕上显示：\n“十分钟后恢复供电”"}}, {"i": 110, "prompt": "写一首现代诗，题材：冬天早晨给自行车链条上油。", "pk": "fp-05", "A": {"id": "35d49bfa0785144b", "body": "一冬天的早晨，我总是第一个来。\n\n在马房，在马厩，在马棚里边，\n\n我总要把我的马儿们赶出栏杆。"}, "B": {"id": "252a76b16bf00c7f", "body": "铁锈在暗处呼吸  \n金属咬住黎明的碎屑  \n齿轮吞下昨夜的霜  \n\n机油沿着脊椎游走  \n沉默的关节开始舒展  \n旧伤疤泛起微光  \n\n车把轻颤  像一声叹息  \n轮毂转动时  晨雾裂开缝隙  \n世界在辐条间苏醒！"}}, {"i": 111, "prompt": "根据《铁轨旁的野花》写一首现代诗。", "pk": "title:铁轨旁的野花:bare", "A": {"id": "afdf130530859af5", "body": "**铁轨旁的野花**\n\n你从泥土里抬起头，  \n没有名字，却有坚定的根，  \n在钢铁的轰鸣中生长，  \n像一个倔强的沉默者。\n\n风穿过铁轨的缝隙，  \n带来远方的故事与尘埃，  \n你轻轻摇曳，不为谁停留，  \n只为那一瞬的阳光与雨滴。\n\n列车呼啸而过，  \n带走了时间的碎片，  \n而你在轨道边静静盛开，  \n仿佛从未被世界打扰。\n\n人们匆匆走过，  \n不曾驻足看你一眼，  \n可你依旧挺立，  \n用最柔软的姿态，对抗世界的坚硬。\n\n你是铁轨旁的一朵野花，  \n不属于任何站台，  \n却让每一个经过的人，  \n在心中留下一缕淡淡的芬芳。"}, "B": {"id": "6c3f1944f18cb292", "body": "在铁轨旁，一株野花静静地躺着  \n它的茎上没有铁锈  \n只有风，吹着它那柔软的身躯  \n\n火车驶过时，它是多么的安静  \n像一只受伤的蝴蝶，静静地躺在那里  \n它不知道，自己是活着的  \n\n当月光洒下时，它才感觉到  \n自己的存在，它才觉得  \n这个世界是多么的美好"}}, {"i": 112, "prompt": "邮局最后一天营业，有人来寄一封无地址的信｜不解释信的内容", "pk": "sc-008-f4", "A": {"id": "a17de5321b823371", "body": "信在玻璃窗前发烫\n邮局闭门前最后一盏灯\n把影子钉进黄昏的褶皱\n指腹摩挲邮戳凹陷的纹路\n像触摸某种未被命名的痛\n墨迹在纸面洇开成雾\n没人接住下坠的沉默\n风穿过空荡的柜台\n卷走所有未拆封的叹息\n信封躺在传送带尽头\n等待一个不存在的地址。"}, "B": {"id": "5d223d5dcdc2fa76", "body": "信在玻璃窗前站了整整一天\n邮局的门铃再没响过\n黄昏把最后一张邮票\n贴在无人认领的信封上\n墨迹在纸面洇出深色的岛屿\n柜台上积满尘埃的铜秤\n沉默地丈量着虚空\n穿堂风卷走所有可能的地址\n黄昏的影子斜斜切开黄昏\n信终于被放进抽屉深处\n像一枚沉睡的月亮\n邮局熄灯时\n它仍在等待某个不会到来的黎明。"}}, {"i": 113, "prompt": "写一首夜班便利店换价格标签的现代诗。店员发现一件商品连续三次涨价，而窗外第一场雪刚落下。", "pk": "cp-v1-033", "A": {"id": "2b2063ade7d4cec6", "body": "荧光屏蓝光漫过货架\n数字在塑料贴纸里缓慢生长\n第五次核对时\n那罐咖啡的价格已爬上三楼\n\n玻璃门外 雪片正将城市折叠成\n某种未命名的几何体\n冰棱悬在空调外机边缘\n像等待签收的快递\n\n他摘下眼镜\n看标签与商品之间\n浮出透明的税\n而暖气管发出轻微的叹息\n仿佛整个冬天\n都卡在了价格带的褶皱里"}, "B": {"id": "96eeea11820031a6", "body": "货架一格格翻动着黑影\n店员的白围裙被冻成了白大褂\n三块三到五块五\n再加到八块七\n他像钟摆那样从这一排走到那一排\n把标签撕掉贴上\n他的手比窗台上的月光更苍白\n雪片飘进来了\n落在那件商品上\n那件商品是暖瓶"}}, {"i": 114, "prompt": "写一首旧港口钟楼被新楼遮住后的现代诗。附近居民仍凭听不准的钟声判断涨潮。", "pk": "cp-v1-035", "A": {"id": "362392ad2e13d70c", "body": "铜管在混凝土裂缝中生长  \n锈蚀的齿轮咬碎最后一声正午  \n居民们仍用耳朵丈量潮汐  \n像某种未被更新的密码  \n\n混凝土吞下钟楼的轮廓  \n只剩金属喉咙在暮色里痉挛  \n有人把错频的滴答  \n缝进钥匙孔，当作涨潮的预警  \n\n黄昏是半透明的唱片  \n风翻过几页，就失真了  \n他们重复着错误的韵律  \n直到海浪也学会说谎  \n\n石阶上盐粒结晶成星图  \n钟摆悬停于虚空中  \n某个瞬间，所有表都开始倒转  \n而潮水依旧准时漫过  \n那些尚未被遗忘的刻度"}, "B": {"id": "d998287a05714622", "body": "那座大石塔还在\n\n但已被高耸的新楼包围\n\n它那曾为全城人所听到的\n\n铜钟之响\n\n如今也常被隔断\n\n人们不再习惯地\n\n从声音判断潮涨潮退了\n\n只是偶尔有人会说：\n\n“今天又该涨潮了！”"}}, {"i": 115, "prompt": "写一首现代诗，题材：夏夜屋顶乘凉的人听见远处火车。", "pk": "fp-03", "A": {"id": "8dca7ee5d379253c", "body": "一只猫儿从石栏跃下——\n跳上我的膝头。\n在那顶满是星星的天盖之下，\n我们说着一些古老的话：\n讲着关于一个遥远的帝国的故事，\n那里的人民都戴着金丝眼镜；\n说他们如何把马车改装成了火车——\n这辆黑铁怪物轰隆轰隆地来了，\n它拖着一列长长的客车，\n像一列飞鸟掠过天空，\n穿过一座座古老的城门。"}, "B": {"id": "1204f11eb3f16a72", "body": "七月的夜晚\n在小城的屋顶上\n乘凉的人听到远方火车的声音\n\n他们知道那是幸福的声响\n像一只大鸟飞向星空\n像一段梦境缓缓展开\n\n而他们的脸庞映照着月光\n是宁静的，是满足的\n如同时光深处的微笑\n\n这是生活赐予我们的一份礼物\n在夏夜的顶上，枕着星光入睡\n枕着火车那遥远的轰鸣入睡\n\n直到天边泛起一抹晨曦\n直到岁月轻轻翻过一页\n直到生命之舟继续前行……"}}, {"i": 116, "prompt": "写一首植物园闭馆后的现代诗。一株夜间开花的植物无人观看，监控摄像头缓慢转动。", "pk": "cp-v1-013", "A": {"id": "656c9dc5fc8d7468", "body": "（镜头摇移）\n花盆里的植物夜合欢开花了。\n（镜头推进，画面定格）\n花儿在月光中绽放\n（镜头拉回）\n植物园已经关门了。"}, "B": {"id": "ab52812d5ae1dba2", "body": "金属关节在暗处咬合  \n镜头扫过第七个回廊  \n一株蓝花正从褶皱里抽出触须  \n\n月光是液态的盐  \n渗入茎脉的裂缝  \n年轮在地下交换密码  \n\n铁门闭合的刹那  \n所有呼吸都凝结成霜  \n监控屏闪烁着  \n某种未被命名的绿"}}, {"i": 117, "prompt": "写一首清晨海鲜市场的现代诗，从一块正在融化的冰的视角观察摊贩、鱼鳞和天光。", "pk": "cp-v1-015", "A": {"id": "fdc2ed0986e1f88f", "body": "一扇冰凉的大门突然洞开\n\n我，是被冻僵的第一块冰\n\n我看到一只大海螺躺在船头\n\n它的眼睛是两粒晶莹的小白果\n\n渔家女们赤着脚把虾皮串上晾衣绳\n\n那上面还留有昨夜阳光晒过的温度\n\n太阳升起来了\n\n在鲜红的珊瑚和大黄鱼鳞片上反射出万丈光芒\n\n小螃蟹们举起了螯钳\n\n仿佛要把自己武装到牙齿"}, "B": {"id": "fc45dc429dce0b54", "body": "我的棱角正在消失  \n水珠沿着纹路爬行  \n像某种隐秘的语言  \n摊贩用刀背敲打木板  \n金属碰撞声漫过潮湿的褶皱  \n\n鱼鳞在晨光中翻转  \n银屑簌簌飘落  \n如同被遗忘的密码  \n我听见鳃裂开的声音  \n腥咸的风灌进每道缝隙  \n\n天光斜切下来  \n将影子钉入水泥地缝  \n有人弯腰拾起我的残骸  \n指腹擦过冰面  \n留下一道湿润的刻痕  \n市场尚未苏醒  \n而我已经融化成  \n一汪透明的沉默"}}, {"i": 118, "prompt": "写一首以旧气象站为场景的现代诗。风向标坏了，但纸带记录仪还在走，值班员听见远处雷声。", "pk": "cp-v1-004", "A": {"id": "e7d92efbe9384a23", "body": "金属的舌苔长满锈蚀的菌斑  \n风向标垂着头  \n像一株折断的芦苇  \n\n值班室的玻璃窗上  \n雨滴在划动  \n它们是另一组数据  \n\n纸带记录仪继续行走  \n它知道  \n自己正走向一个未命名的变量  \n\n雷声从远方传来  \n它不是一种情绪  \n而是一种物理现象  \n就像我们无法理解  \n自己的声音为什么会突然中断"}, "B": {"id": "4af937567dba0c52", "body": "旧气象站在暴雨后仍守着老规矩\n风向标坏了\n值夜的人听雨打铁皮屋顶\n如听到远天一声巨响\n他便用脚尖点地\n将一张张白纸送进纸带机"}}, {"i": 119, "prompt": "写一首现代诗：暴雨后的操场积水，几个孩子把纸船放进去。让纸的吸水速度决定全诗的节奏。", "pk": "lp-10", "A": {"id": "58d83a97132c6d7f", "body": "雨后的操场上\n小英雄们\n正在比赛谁的纸船儿跑得快呢！\n\n我的玩具也想加入一次竞赛：\n我把它搁在积水里，\n可是它一沾上水就软了。\n\n“喂！你的纸船儿怎么啦？\n怎么不上跑道呢？”\n一个戴红领巾的小男孩\n朝我这边望了望，\n又跑回他自己的跑道去了。"}, "B": {"id": "35d0c50c79680d92", "body": "积水漫过操场，如一张巨大的纸。\n\n孩子们折了纸船，放入水中。\n\n一只船漂得最远——它吸了太多水。\n\n其余几只，已经沉没。\n\n雨下得更大了。\n\n一滴雨水，从天空掉进池塘里。\n\n涟漪荡开，水声传来。"}}, {"i": 120, "prompt": "写一首关于城市停电十分钟的现代诗。叙述在不同楼层间移动，只通过窗、脚步和短暂亮起的手机呈现人群。", "pk": "cp-v1-009", "A": {"id": "cd29013368b597ff", "body": "我住七楼\n楼下忽然传来\n一阵惊慌的喧哗——\n整座城市陷入黑暗\n连月亮都失了颜色\n\n我打开窗\n看见六楼窗内有一盏灯\n正被一双手熄灭\n于是，我开始下楼\n我看见五楼窗前\n有一束手电的光柱\n正在照亮一朵晚霞\n于是，我又继续向下走\n四楼窗中的一对男女\n正用手机照明阅读\n三楼有一人\n站在窗边等待电梯\n二楼有一个婴儿\n哇哇大哭\n一楼，一只野狗\n对着黑洞洞的楼梯狂吠"}, "B": {"id": "aa3dc16144897432", "body": "电梯吞下最后一粒光  \n楼梯间浮出无数瞳孔  \n指纹在铁门上结霜  \n\n二十层的风突然停止  \n手机屏里游动着  \n一尾磷火的鱼  \n\n有人用玻璃敲击摩尔斯电码  \n暗处传来鞋跟的碎裂声  \n像某种古老仪式的回音  \n\n七楼窗口飘下半块蛋糕  \n被黑影接住  \n融化成糖浆状的沉默  \n\n地下车库的车灯次第睁眼  \n如同深海鱼群  \n游向地心深处的钟摆  \n\n我们都在等  \n某个未被命名的信号  \n重新缝合城市的血管"}}, {"i": 121, "prompt": "写一首现代诗：夜里给一株快死的植物换盆。写根须离开旧土时的那几秒。", "pk": "lp-11", "A": {"id": "5d7b5043f824b156", "body": "——我听见了泥土深处传来的悲鸣。\n我的眼睛湿润。\n我看见了\n一根被剪断的根茎在空气中伸长\n它痛苦地蜷缩了一下\n就枯萎了。\n而另一些根茎正埋头向泥土中钻去。\n我仿佛看见它们的牙齿\n咬破了黑暗。\n我感到自己正站在一块\n不断增大的\n黑色土地上……\n我把这株植物移进一个新花盆。"}, "B": {"id": "5b5ef534f7fffcf5", "body": "夜深了，我为一株垂死的植物换盆：\n拔开泥土时，它根须断落的一瞬，\n是它一生最辉煌的时刻。\n我小心地把它移植进一只洁白的瓷钵。"}}, {"i": 122, "prompt": "写一首现代诗，题材：修表匠拆开一只停走的表。", "pk": "fp-02", "A": {"id": "3d147e8f5eee54dd", "body": "一只表\n被打开\n像一扇门\n一个世界走进另一个世界\n\n一只表\n被打开\n像一部车\n我们来到某处\n却不再回到原地\n\n一只表\n被打开\n像一段历史\n里面什么也没有\n\n一只表\n被打开\n像一场梦\n醒来时\n一切如昨\n\n一只表\n被打开\n像一块石头\n剥开它\n里面的沉默更长"}, "B": {"id": "7b6204efafb0d3b4", "body": "一\n\n一个修表匠打开一只表。\n\n在表里看到一串小齿轮\n\n像被钉在木头里的蚂蚁，\n\n而摆轮游丝是\n\n一条黑蛇。\n\n二\n\n他把它们都取出来放在桌上：\n\n一只表，一堆零件。\n\n这时，他的小女儿问：\n\n“爸爸，天上的星星会掉下来吗？”\n\n他答：“不会。”\n\n但第二天，他发现一只蚂蚁死在他家窗子下。"}}, {"i": 123, "prompt": "写一首春运候车室的现代诗。一位老人把纸质车票夹进透明手机壳，广播多次更换检票口。", "pk": "cp-v1-026", "A": {"id": "a8538501fb8fae79", "body": "老人将车票夹进透明手机壳  \n像往玻璃瓶里投掷一枚旧年份  \n广播声在天花板上打滑  \n第三次更改检票口编号  \n\n塑料椅背上的褶皱  \n记录着无数脊椎的弯曲  \n有人用指甲在桌板刻下  \n一串未完成的电话号码  \n\n电子屏蓝光漫过  \n褪色的行李标签  \n母亲数着站台灯  \n说这是她第七次  \n看见自己的影子被拉长  \n\n铁轨在远处吞吐呼吸  \n而此刻所有钟表  \n都停在了同一个  \n等待的瞬间"}, "B": {"id": "7c2d828e4fda1cae", "body": "一列火车从大山走出，\n挤满了一车人。\n一个老人站在月台上，\n手里紧紧握着一张车票，\n好像它是一块肉皮，\n或者像一个女人的脸蛋。\n\n他从一个很远的城市来，\n坐了很长时间的长途汽车，\n又转火车。\n他穿着一件洗得发白的灰布衫，\n一副疲惫的样子，\n仿佛是从地狱里逃出来似的。\n\n列车员大声喊道：\n“上车吧，要开啦！”\n老人抖了抖身子，\n才想起自己还在人间。\n于是他走进车厢，\n找到自己的座位坐下。\n\n这时，我看见一个中年男子走过来，嘴里嚼着口香糖。\n他说：“大爷，这车票是你的吗？”\n老人点点头。\n那中年人便说：“大爷，我是列车员。”\n说着话他就把车票抽了过去，\n然后又放回去，\n说：“大爷，你的车票有点问题，不能上车。”\n\n老人急了，脸都涨红了，\n声音也变了：“你是谁？凭什么不让我上车？\n我可是有票的！”\n\n那中年人说：“大爷，你仔细看看这张车票……”\n他指着背面的一个小字，\n好像是一个小黑点。\n接着他又说，“大爷，这个车票不是本车的，你上不了车。”\n\n老人低头看了看，\n脸上露出困惑的表情。\n他喃喃地说：“不会吧……这是我在长途汽车上买的一张车票啊……\n怎么会变成这样了呢？\n\n那中年人说：“大爷，\n现在都是自动售票机了，\n没有人工窗口了。”\n然后他又补充一句，\n“大爷，你要是实在想去那个城市的话，\n我们可以给你安排下一班火车，\n不过你要等一下哦。”\n\n老人摇摇头，叹了口气，\n似乎有些失落。\n但过了一会儿，\n他又抬起头来，\n眼神坚定地说：\n“好，那我就在这里等着下一辆火车。”\n\n说完他就坐下了，\n拿出手机开始拍照，\n好像要把这瞬间永远定格下来。\n\n就在这时，\n列车员又跑了过来，\n手里拿着一把钥匙，\n说是要检查一下厕所门锁的情况。\n\n原来列车上的厕所门被人撬开了，\n里面的东西全被偷走了。\n\n列车员打开门一看，\n果然如此。\n他皱起眉头，\n一边嘟囔着，\n一边打电话给前方车站报警。\n\n整个候车室一片混乱，\n大家都纷纷议论起来。\n\n有人说是小偷偷的，\n也有人说是铁路工人干的……\n\n这时，\n一位警察模样的人也走了进来，\n他问列车员发生了什么事。\n\n列车员就把刚才发生的事情告诉了他。\n\n那警察听了之后，\n马上掏出对讲机呼叫前方警力支援。\n\n不一会儿，\n几辆警车呼啸而来，\n停在了站台上。\n\n警察们迅速下车，\n拿起手电筒往厕所里照，\n只见里面有东西散落一地，\n显然是被人翻动过的痕迹。\n\n他们随即展开调查，\n并对现场进行了封锁处理。\n\n就在我望着这一切发生的\n时候，\n又一阵嘈杂声传来，\n原来是另一个车厢出现了问题。\n\n只见一个小伙子满脸通红，\n气喘吁吁地跑了出来，\n口中还带着哭腔，\n好像是遇到了什么麻烦。\n\n旁边的人连忙上前安慰他，\n并问他怎么了。\n\n那小伙子抽泣着说：\n“我的身份证丢了，\n人家不让上车……”\n\n众人一听，\n纷纷围上来，\n询问详情。\n\n那小伙子解释道：\n他是刚从大学毕业的学生，\n第一次独自坐火车出门，\n结果不小心把自己随身携带的身份证弄丢了。\n\n大家听后都表示同情，\n有人还主动提出帮他想办法找回丢失的东西。\n\n有人提议，\n可以先到车站派出所报案，\n说不定能查到丢在哪里。\n\n也有人大胆猜测，\n会不会是被人偷去了？\n\n小伙子听后更加"}}, {"i": 124, "prompt": "写一首关于被导航反复纠正路线的现代诗。骑车人穿过正在消失的城中村，屏幕上的道路比现实更完整。", "pk": "cp-v1-022", "A": {"id": "aa155a0e9bf0c97d", "body": "你的手机不断提醒你  \n你偏离了方向。  \n你说你不记得怎样走。  \n\n你把城市当作一张地图。  \n你的地图是电子化的。  \n你在屏幕上看见了你所没有看见的东西。  \n\n你说你不知道如何选择道路。  \n你把所有的道路都看作一条路。  \n你对每条路都一无所知。  \n\n你看到一座城市的街道在消失。  \n你看到一些房屋像影子一样漂浮着。  \n你也看到一个女孩像一只白鸽那样飞过街道。  \n\n你说你是这座城市里的一份财产。  \n你也说你是这个世界的一个流浪者。  \n\n你问你的手机，它告诉你你的位置。"}, "B": {"id": "d7218a52462b1c5c", "body": "他骑车穿过城中村\n他的车轮碾过泥地与碎瓦\n一条街的名字刚被记住又忘记\n另一条街的名字尚未抵达\n已经换了方向\n导航说：前面左转\n他照办了\n导航又说：再左转\n他照办了\n导航又说：再右转\n他照办了\n导航又说：再左转……"}}, {"i": 125, "prompt": "写一首退潮后的防波堤现代诗。石缝里卡着一只塑料玩具船，真正的货轮正驶向雾中。", "pk": "cp-v1-027", "A": {"id": "c65ac03bb880d34f", "body": "潮水退去时  \n石缝里卡住一只塑料玩具船  \n它不再摇晃  \n\n货轮正驶向雾中  \n铁锈色的浪花  \n在混凝土裂缝里结痂  \n\n贝壳紧闭嘴唇  \n沙粒正在重新排列  \n某种古老的密码  \n\n海鸟掠过水面  \n衔走最后一片泡沫  \n而石头沉默如未完成的句子"}, "B": {"id": "eb979c7514cf9680", "body": "潮水缩回海那边的远方  \n沙砾闪现如鱼鳞  \n我拾起一只玩具小船  \n它正漂向被遗弃的旧港  \n\n暮色沉入水中  \n我赤足踏浪而来  \n又踩着浪花回去  \n像一只归巢的鸥鸟"}}, {"i": 126, "prompt": "写一首凌晨四点面包房的现代诗，把发酵、炉火与尚未醒来的城市放在同一时间结构里。", "pk": "cp-v1-003", "A": {"id": "87a1527104ca775b", "body": "面粉在玻璃罐中呼吸  \n金属台面渗出冷汗  \n烤箱吞吐着暗红光晕  \n像某种未被命名的星体  \n\n面团正在体内起义  \n酵母是叛军的密码  \n蒸汽从裂缝逃逸  \n在墙角凝结成盐  \n\n街灯将影子钉入砖缝  \n城市蜷缩成未拆封的信  \n而炉火持续折叠自己  \n直到黎明成为一种褶皱  \n被揉进面包的裂痕里"}, "B": {"id": "ee499038bc3d381c", "body": "四点钟了\n有人推门进来\n揉皱一张脸\n面包房还睡着\n像一只大肚子猫\n在窗边打盹儿\n它梦见一捆一捆\n刚割下来的麦子\n在炉子里吐出热气\n它梦见一个\n赤脚的农夫从田埂上跑来\n披着满身露水\n把麦粒撒在炉前\n撒得遍地都是"}}, {"i": 127, "prompt": "写一首盐湖边废弃电影院的现代诗。银幕被风吹动，湖面的反光偶尔投进大厅。", "pk": "cp-v1-010", "A": {"id": "1c2d8c95bb7642e6", "body": "风是唯一的观众  \n银幕在黑暗中缓缓摆动  \n像一只疲惫的手  \n试图抓住  \n正在消失的影子  \n\n湖水的倒影  \n偶然进入大厅  \n像一扇打开的门  \n我们以为自己在看  \n而实际上  \n是它在看我们  \n\n幕布上残缺的画面  \n仍在诉说  \n一些无人知晓的故事  \n而我们只是  \n坐在黑暗里  \n等待下一个故事开始"}, "B": {"id": "c7c3b66249d296e3", "body": "在一座荒废的盐湖旁\n有一座废弃了的电影院\n当那片湖水被夕阳染红的时候\n我看到银幕上浮现出一张张苍白的脸\n像湖中的盐层一样被风干\n被岁月剥蚀\n\n当我坐在影院昏暗的角落里\n看着窗外的湖泊\n恍惚中觉得那是一面巨大的镜子\n而自己却是一个被映照在其中的灵魂\n\n我闭上眼睛听那些久违的声音\n响自黑暗深处的每一个音节\n都像是从时间之外飘来\n像是一个已经逝去了的故事"}}, {"i": 128, "prompt": "写一首现代诗，题材：冬天早晨给自行车链条上油。", "pk": "fp-05", "A": {"id": "a0ad33abb84e5b6a", "body": "冷得很。\n\n呵着白气，我开始给自行车链条上油了。\n手在裤兜里摸索着烟盒。\n哈，还有一支“牡丹”。\n我得把它“报销”。\n\n好家伙！\n天已大亮了。"}, "B": {"id": "2d8b949661ff219c", "body": "一\n\n冬晨，我骑车去上班。\n风很冷。\n我给自行车链条上了一点油。\n\n二\n\n在一家修鞋店前边，我把自行车停好后，\n掏出一小瓶润滑油来。\n我拧开盖子，往车链上抹了一点。\n\n三\n\n天是冷的。\n我刚抹完油，就听见一个男人在大声喊叫：\n“哎哟！这油可真香啊！”"}}, {"i": 129, "prompt": "根据《九月》写一首现代诗。", "pk": "title:九月:bare", "A": {"id": "26fc5d65c396b484", "body": "**《九月的回声》**\n\n风，卷起最后一片蝉鸣，  \n树叶在枝头颤抖，  \n仿佛在告别夏日的余温。  \n\n天空低垂，云像未干的墨迹，  \n在灰蓝的宣纸上缓缓晕开。  \n有人把夏天的梦，  \n悄悄藏进抽屉最深处。\n\n田野里，稻穗低头沉思，  \n金黄的沉默比任何言语都重。  \n候鸟掠过天际，  \n翅膀划破时间的边界，  \n带走一个季节的叹息。\n\n我站在路口，  \n看影子被夕阳拉得细长，  \n像是某种未完成的诗句，  \n悬在黄昏与黑夜之间。\n\n九月，是秋天的第一道门，  \n而我，仍握着夏天的钥匙，  \n迟迟不愿转身。"}, "B": {"id": "86306e5e2156ecc6", "body": "《九月》\n\n月亮是夜的门\n我坐在门口\n守着你\n\n风，从远方来\n带来了你的名字\n像一缕炊烟，轻轻飘过田野\n\n田埂上，稻子低垂\n如同你沉默的脸\n你的心事\n都埋在深深的土里\n\n你没有说话\n只是默默地望着远方\n仿佛那是一扇窗\n通向另一个世界\n\n我问你：你在想什么？\n你说：我在想家\n我想我的父亲和母亲\n他们还在遥远的村庄里等着我"}}, {"i": 130, "prompt": "写一首河流改道后的现代诗。桥还在原处，桥下长出高草，附近孩子把这里当作球场。", "pk": "cp-v1-006", "A": {"id": "6adb0949742498f5", "body": "河改道了。我看见\n\n一座桥躺在河边，没有用\n\n桥洞里住着水鼠和青蛙\n\n它们是这座老桥唯一的记忆\n\n孩子们常在桥上踢球\n\n他们不知道这是座废弃了的桥\n\n更不知道这条河曾流经此处\n\n河改道了。我看见\n\n一座桥躺在河边，没有用\n\n桥头生满了蓬草\n\n桥下也长满了蓬草"}, "B": {"id": "174e2a62dbdf5648", "body": "河改道了。我看见\n\n旧河道上的一座石桥——\n\n它的背影是那样忧伤。\n\n那桥下，河水的波纹，\n\n曾经多么亲切地摇荡。\n\n现在桥上却长满青草\n\n孩子们在这里踢球玩耍：\n\n“快！铲球！”“喂！传球！”\n\n河的另一边，一片荒凉。\n\n那河水流过桥头，\n\n不再流过这桥下的老地方，\n\n就像我们的记忆，\n\n被岁月推得越来越远。\n\n呵，我的青春！\n\n像河水般流向远方。"}}];
const KEY = "cyberpoet_prefs_v1";
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
function idx(){ for(let i=0;i<PAIRS.length;i++) if(!(i in labels)) return i; return -1; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(labels)); }catch(e){} }
function pick(v){ const i=idx(); if(i<0) return; labels[i]={choice:v,at:Date.now()}; save(); render(); }
function undo(){ const done=Object.keys(labels).map(Number).sort((a,b)=>a-b); if(!done.length) return;
  delete labels[done[done.length-1]]; save(); render(); }
function exp(){ const out=Object.entries(labels).map(([i,v])=>({
    prompt_key:PAIRS[i].pk, A:PAIRS[i].A.id, B:PAIRS[i].B.id, choice:v.choice}));
  const b=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="preference_labels.json"; a.click(); }
function render(){
  const i=idx(), n=Object.keys(labels).length;
  document.getElementById("n").textContent = n+" / "+PAIRS.length;
  document.getElementById("p").style.width = (100*n/PAIRS.length)+"%";
  const m=document.getElementById("m");
  if(i<0){ m.innerHTML='<div class="done"><h2>全部标完了</h2><p>点右上角「导出标注」保存结果。</p></div>'; return; }
  const p=PAIRS[i];
  m.innerHTML='<div class="prompt">'+(p.prompt||"（无题目文字）")+'</div><div class="row">'+
    '<div class="poem" onclick="pick(\'A\')"><h3>甲</h3><pre>'+esc(p.A.body)+'</pre></div>'+
    '<div class="poem" onclick="pick(\'B\')"><h3>乙</h3><pre>'+esc(p.B.body)+'</pre></div></div>'+
    '<div class="keys">← 选甲　→ 选乙　↓ 都不行 / 分不出　↑ 撤销</div>';
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") pick("A"); else if(e.key==="ArrowRight") pick("B");
  else if(e.key==="ArrowDown") pick("tie"); else if(e.key==="ArrowUp") undo();
});
render();
</script></body></html>
