### RCA 干预实验·对照：与 dpo_pt9 完全相同（sft_pt9 桥 + dpo_v1），只把策略底座改为 nf4（与 SFT 段一致）；参考模型仍是 LLaMA-Factory 默认（禁用 adapter = 裸底座）
model_name_or_path: models/Qwen3-14B
adapter_name_or_path: /data/peilincai/CyberPoetTraining/claude_night_20260827/outputs/sft_pt9
create_new_adapter: false
trust_remote_code: true
quantization_bit: 4
quantization_method: bitsandbytes
quantization_type: nf4
double_quantization: true
flash_attn: auto

stage: dpo
pref_beta: 0.1
pref_loss: sigmoid
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

dataset_dir: /data/peilincai/CyberPoetTraining/claude_night_20260827/data
dataset: cyberpoet_dpo
template: qwen3_nothink
cutoff_len: 2048
preprocessing_num_workers: 24
overwrite_cache: true

output_dir: /data/peilincai/CyberPoetTraining/claude_night_20260827/outputs/dpo_pt9_ctrl4
logging_steps: 5
save_strategy: epoch
save_total_limit: 3
save_only_model: true
plot_loss: true
report_to: none
run_name: rca-dpo_pt9_ctrl4

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optim: paged_adamw_8bit
max_grad_norm: 1.0
seed: 20260825
