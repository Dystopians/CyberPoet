### M8 候选 DPO（09-08 修正做法）：底座 = 已合并 sft_pt9b 的完整权重(nf4 加载)，新建 LoRA，参考 = 桥本身；
### 偏好数据 = 主人票建的当代对（cyberpoet_dpo_v6，build_dpo_next.py，v11/v12/v13 票到后生成）；模板 qwen3+enable_thinking=false 与桥一致。
model_name_or_path: /data/peilincai/CyberPoetTraining/claude_night_20260827/outputs/merged_sft_pt9b
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb   # 09-22 改：库只认 bnb；此配置从未跑过
quantization_type: nf4
double_quantization: true
flash_attn: auto

stage: dpo
pref_beta: 0.1
pref_loss: sigmoid
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

dataset_dir: /data/peilincai/CyberPoetTraining/claude_night_20260827/data
dataset: cyberpoet_dpo_v6
template: qwen3
enable_thinking: false
cutoff_len: 2048
preprocessing_num_workers: 24
overwrite_cache: true

output_dir: /data/peilincai/CyberPoetTraining/claude_night_20260827/outputs/dpo_pt9b_v6
logging_steps: 5
save_strategy: epoch
save_total_limit: 3
save_only_model: true
plot_loss: true
report_to: none
run_name: cyberpoet-dpo_pt9b_v6-m8

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optim: paged_adamw_8bit
max_grad_norm: 1.0
seed: 20260825
