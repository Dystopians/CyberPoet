# 实验 1「M4R」（09-22 19:50 主人批准）：M4 的桥 sft_pt6 合并成完整权重 merged_sft_pt6，其上做与 dpo_m8b 完全相同的偏好训练（参考=桥、v6 数据、nf4、lr 2e-5、3 轮）。
# 与 dpo_m8b 只差 model_name_or_path / output_dir / run_name。存档不按验证损失挑：主臂 = 训满 3 轮的末档（M4R），另存训练奖励差最接近 2.0 的工作点（M4Rw）。
### M8b（09-21 归因修复版）：桥换成面板过线的那座（由 run_m8b_post.sh 指定并合并成 merged_sft_m8b），其余与 dpo_m8 完全相同。
### M8 的偏好训练（09-21）：底座 = 已合并新桥的完整权重 merged_sft_m8（nf4 加载）+ 新建 LoRA ⇒ 参考模型 = 桥本身；
### 数据 = 偏好数据 v6（训练 357 对 / 验证 41 对，按题面不跨集）；lr 2e-5（09-16 剂量实验的档位）、β 0.1、3 轮，每 9 步（0.2 轮）评一次并存档；
### 选存档规则（训前写死）：验证损失最低者；并列（差 <0.01）取更早的；面板字数中位须在 120–300 之间，否则向更早一档退。
model_name_or_path: /data/peilincai/CyberPoetTraining/claude_night_20260827/outputs/merged_sft_pt6
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb   # 09-21：库里的枚举值是 bnb；写 bitsandbytes 不报错、直接不量化（此前 93 份配置全中招）
quantization_type: nf4
double_quantization: true
flash_attn: auto

stage: dpo
pref_beta: 0.1
pref_loss: sigmoid
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

dataset_dir: /data/peilincai/CyberPoetTraining/claude_night_20260827/data
dataset: cyberpoet_dpo_v6
eval_dataset: cyberpoet_dpo_v6_val
template: qwen3
enable_thinking: false
cutoff_len: 2048
preprocessing_num_workers: 24
overwrite_cache: true

output_dir: /data/peilincai/CyberPoetTraining/claude_night_20260827/outputs/dpo_m4r
logging_steps: 3
save_strategy: steps
save_steps: 9
eval_strategy: steps
eval_steps: 9
per_device_eval_batch_size: 2
save_total_limit: 20
save_only_model: true
plot_loss: true
report_to: none
run_name: cyberpoet-dpo_m4r

per_device_train_batch_size: 2   # 09-21：原 1×8 累积；4×2 在 6 号卡上溢出（偏好训练要算整张词表的打分，4 对一批多占约 6 GB）→ 2×4：每步还是同样的 8 对、同样的顺序、损失按对平均不变，约 16 GB，和别人的任务同卡时留得出余量
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optim: paged_adamw_8bit
max_grad_norm: 1.0
seed: 20260825
