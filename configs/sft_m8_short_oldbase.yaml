### 归因对照：与 sft_m8_short 完全相同（桥数据 v5、300 步退火、4 位量化），只把预训练底座换成上一代的 pt9_s3（bf16 训、三段全跑）→ 隔离「底座」这一项。
### M8 桥·短程退火版（09-21 12:45，归因实验）：假设——早停取到的第 50/250 步存档是「学习率还在高位的半成品」（2 轮的余弦曲线上，第 250 步学习率仍是峰值的 88%），
### 上一代健康的桥取的是第 1050/1242 步（学习率已退到接近 0）。本臂只训 300 步，但学习率在这 300 步内完整退到 0：若循环率回落，病因就是「没退火」而不是「训得少」。
