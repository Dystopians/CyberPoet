### SFT 桥 v4（09-08 主人裁决）：题面含「以《X》为题」、47 位诗人、单家 ≤15%（build_sft_v4.py）。
### 起点 = pt9_s3（M7 同一预训练），与 sft_pt9 唯一差别 = 桥数据 + 模板改 qwen3(enable_thinking=false，与推理 HF 模板一致，训练/推理不再两样) + 按 dev 早停取最优。
model_name_or_path: models/Qwen3-14B
adapter_name_or_path: /data/peilincai/CyberPoetTraining/claude_night_20260827/outputs/pt9_s3
create_new_adapter: false
trust_remote_code: true
quantization_bit: 4
quantization_method: bitsandbytes
quantization_type: nf4
double_quantization: true
flash_attn: auto
enable_liger_kernel: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

dataset_dir: /data/peilincai/CyberPoetTraining/claude_night_20260827/data
dataset: cyberpoet_sft_v4_train
eval_dataset: cyberpoet_sft_v4_dev
template: qwen3
enable_thinking: false
cutoff_len: 2048
packing: false
train_on_prompt: false
preprocessing_num_workers: 24
overwrite_cache: true

output_dir: /data/peilincai/CyberPoetTraining/claude_night_20260827/outputs/sft_pt9b
logging_steps: 10
save_strategy: steps
save_steps: 50
eval_steps: 50
save_total_limit: 3
save_only_model: false
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
report_to: wandb
run_name: cyberpoet-sft_pt9b-v4bridge

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optim: paged_adamw_8bit
weight_decay: 0.01
max_grad_norm: 1.0
seed: 20260825

per_device_eval_batch_size: 1
eval_strategy: steps
load_best_model_at_end: true
