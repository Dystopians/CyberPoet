### 参数，但 LLaMA-Factory 0.9.5 没有暴露成 yaml 项（trainer_utils.py:436 处按默认 False
### 实例化）。重开时二选一：
###   a) 请 codex 在 vendor/LLaMA-Factory/src/llamafactory/train/trainer_utils.py:436
###      的 BlockOptimizer(...) 调用里加 include_embedding=True, include_lm_head=True（一行）；
###   b) 或接受输出头不动，靠后段 LoRA（含 lm_head 目标模块）补输出头适配——需另行验证。
