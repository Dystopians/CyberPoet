### 继续预训练：在 1591 首现代诗上学语感，不带任何指令
### 与 v3/configs/sft_v3_p1.yaml 保持同样的模型与量化设置，便于对比
model_name_or_path: models/Qwen3-14B
trust_remote_code: true
quantization_bit: 4
quantization_method: bitsandbytes
quantization_type: nf4
double_quantization: true
flash_attn: auto

stage: pt
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

dataset_dir: /data/peilincai/CyberPoetTraining/claude_parallel_20260825/pretrain/data
dataset: cyberpoet_pt_train
eval_dataset: cyberpoet_pt_dev
template: qwen3_nothink
cutoff_len: 2048
packing: false
preprocessing_num_workers: 24
dataloader_num_workers: 4
overwrite_cache: true

output_dir: /data/peilincai/CyberPoetTraining/claude_parallel_20260825/pretrain/outputs/e8
logging_steps: 10
save_strategy: epoch
eval_steps: 50
save_total_limit: 10
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: wandb
run_name: cyberpoet-pt-e8

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 8.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optim: paged_adamw_8bit
weight_decay: 0.01
max_grad_norm: 1.0
include_num_input_tokens_seen: true
include_tokens_per_second: true
logging_nan_inf_filter: false
seed: 20260825
data_seed: 20260825
ddp_timeout: 180000000
resume_from_checkpoint: null

per_device_eval_batch_size: 1
eval_strategy: steps
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false
