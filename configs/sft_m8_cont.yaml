### M8 桥续训（09-21 12:40，归因修复）：干净开发集早停把桥停在第 50 步——那条规则是退化的：留出诗的损失从第一次评估起就单调上升（每 50 步 +0.002），
### 「最低点」永远是第一次评估，选出来的存档只取决于评估间隔；而它量不到桥真正要学的东西（写完就停、不拿首行当副歌循环）。
### 面板实测：第 50 步循环 10.6%、第 250 步 15.9%（上一代桥训满 1050 步：0.5–2.0%；量化推理、生成参数、合并再量化三项已逐一排除）。
### 修复：从第 250 步存档原样续训到 2 轮（同数据、同顺序、同学习率曲线），每 50 步留存档，逐档出面板，取「分布过线的最早一档」；留出诗损失只做护栏（不高出最低点 0.05）。
