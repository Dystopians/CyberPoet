*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
font:16px/1.75 "Noto Serif CJK SC","Songti SC",Georgia,serif}

<script>
const PAIRS = [{"i": 0, "prompt": "以《西班牙》为题写一首现代诗。", "pk": "np-010", "A": {"cond": "dpo_full", "body": "马德里有条巷子叫“花”，\n花街是女人的天下。\n红裙，白裙，绿裙，\n一队又一队，\n从巷子的头走来，\n到巷子的尾。\n她们有的用大把的银元买酒喝，\n有的拿铜钱换香烟抽，\n有的捧着一杯咖啡发呆，\n有的对着镜子化妆。\n谁也说不清她们从哪儿来，\n也猜不出她们要上哪儿去。\n她们走过的铺子一家接一家，\n铺子上的小灯一盏连一盏，\n照得满街都是光。\n花街是女人的天下，\n女人是花街的主人。\n花街是马德里的小巷子，\n小巷子是马德里的一个角落。\n在那个角落里，\n女人和男人一样多。"}, "B": {"cond": "human", "body": "茀拉，到窗口来！茀拉\n在橡树园中\n在吊着一只猫的橡树园中，\n我已把我有毒的书埋下。\n\n一朵玫瑰刺在月光的边沿。\n一枚金针噙在死人的嘴里。\n一个红领巾的斗牛士，\n女人们的扇子搧起他小小的风闻。\n\n还是那个马德里呀，茀拉\n在风筝之下，\n在粗重的吉他摇撼下；\n七把小刀追逐节奏，\n牛角使每一瞬成为一生。\n\n而谁也不想回到昨天去；\n镜子抄袭你眼中\n天鹅绒的生活，\n在沉香木的后面\n我的名字是费特列珂。\n\n在瞿麦花的远方，茀拉\n蟾蜍在吃你的额头。\n在空开的露台那厢，茀拉\n一颗星走过河流。"}}, {"i": 1, "prompt": "写一首现代诗，其中出现「平原」与「无人」。", "pk": "ni-001", "A": {"cond": "dpo_full", "body": "当平原上没有人在，\n我们便去到河那边：\n坐在河对岸的田埂上，\n\n看河水把人送过去。\n而河水流过的地方\n有一群鸭子飞了回来。"}, "B": {"cond": "human", "body": "噙住泪水，在神秘的\n二月的时光\n\n神秘的二月的时光\n经过北方单调的平原\n来到积雪的山顶\n群山正在下雪\n山坳中梅树流淌着今年冬天的血\n无人知道的，寂静的鲜血"}}, {"i": 2, "prompt": "以《无题》为题写一首现代诗。", "pk": "np-027", "A": {"cond": "human", "body": "给我粮食\n给我婚礼\n给我星辰和马匹\n给我歌曲\n给我安息！\n\n我的生日\n这是位美丽的\n折磨人的女俘虏\n坐在故乡的打麦场上\n\n在月光下\n使村子里的二流子\n如痴如醉！"}, "B": {"cond": "dpo_full", "body": "我看见一只鸟在天空中盘旋\n我看见一个女人坐在屋檐下\n我听见风从远方吹来\n穿过森林和田野\n把她的头发吹乱\n她站了起来\n对着天空张开双臂\n喊道：飞吧！飞吧！飞吧！"}}, {"i": 3, "prompt": "以《回声如霹雳炸响》为题写一首现代诗。", "pk": "np-003", "A": {"cond": "dpo_full", "body": "一滴水，从天而降\n砸中一块石头，溅起一朵花\n在无声的寂静里，爆破开来\n如一声呐喊\n在山谷中震荡着\n像雷，轰鸣\n一滴水，从天而降\n如一支箭，在山林中穿行\n在树上留下一道伤口\n一滴水，从天而降\n如一颗子弹，击中靶心"}, "B": {"cond": "human", "body": "劫机暴徒的手榴弹\n\n讲的是阿拉伯话\n\n咱听不懂\n\n突击队的轻机枪\n\n讲的是埃及话\n\n咱听不懂\n\n电视记者的录影机\n\n讲的是法国话\n\n咱听不懂\n\n而六十名乘客的鲜血\n\n讲的是最最原始的话\n\n其声尖锐如啸\n\n掩盖了\n\n我那句越来越低沉的话：\n\n“咱听懂了”\n\n而回声如霹雳炸响\n\n自我内部"}}, {"i": 4, "prompt": "以《死亡航行》为题写一首现代诗。", "pk": "np-001", "A": {"cond": "dpo_full", "body": "风浪里，他们用绳子\n捆紧了头发。\n船首像一支利剑，\n劈开黑暗的海水。\n\n我问：在哪儿？\n他们说：看不见的地方。\n我问：什么时候？\n他们说：永远没有到达的时分。\n我问：为什么要出发？\n他们说：因为没有别的路。\n——我们是水手，是死人。"}, "B": {"cond": "human", "body": "夜。礁区\n死亡航行十三日\n\n灯号说着不吉利的坏话\n钟响着\n\n乘客们萎缩的灵魂\n瘦小的苔藓般的\n胆怯地寄生在\n老旧的海图上，探海锤上\n以及船长的圆规上\n\n钟响着\n\n桅杆晃动\n那锈了的风信鸡\n啄食着星的残粒\n\n而当晕眩者的晚祷词扭曲着\n桥牌上孪生国王的眼睛寂寥着\n镇静剂也许比耶稣还要好一点吧"}}, {"i": 5, "prompt": "以《秋末事件》为题写一首现代诗。", "pk": "np-006", "A": {"cond": "human", "body": "放逐了果实\n\n何苦还在枝头留下一些疏星残月\n\n路过的雁子看到\n\n梧桐正以巴掌大的落叶\n\n丈量从秋天到地面的距离\n\n擦汗是去夏的事\n\n扇子的事\n\n而扇子给隔壁的女房客借去了\n\n据说她用来收藏\n\n秋蝉脱壳最后的一声惨叫"}, "B": {"cond": "dpo_full", "body": "一匹马，从远方来\n没有带它的同伴\n也没有带它的妻子和女儿们\n它说：“我是从秋天来的”\n它说：“我曾经是秋天的一匹马”\n于是我们把它关在屋子里\n不让它出去\n我们说：\n“你是从秋天来的\n那么你就是冬天的了”"}}, {"i": 6, "prompt": "以《遥远的路程》为题写一首现代诗。", "pk": "np-021", "A": {"cond": "dpo_full", "body": "我们正走过一条遥远的路程。\n它像一面镜子一样映出我们的脸，\n而我们已不再记得镜中是谁。\n\n在我们身后，有一条路\n从没有被铺上一块石子：\n它通向一个地方，\n那里只有风和一些不知名的鸟。\n\n当我们看到一座高山时，\n它的影子就投下来了，\n而它本身已经不存在。\n于是我们就问自己说：\n\n这是什么地方？\n我们为什么要走这么远？\n\n我们不知道答案。"}, "B": {"cond": "human", "body": "十四行献给89年初的雪\n\n我的灯和酒坛上落满灰尘\n而遥远的路程上却干干净净\n我站在元月七日的大雪中，还是四年以前的我\n我站在这里，落满了灰尘，四年多像一天，没有变动\n大雪使屋子内部更暗，待到明日天晴\n阳光下的大雪刺痛人的眼睛，这是雪地，使人羞愧\n一双寂寞的黑眼睛多想大雪一直下到他内部\n\n雪地上树是黑暗的，黑暗得像平常天空飞过的鸟群\n那时候你是愉快的，忧伤的，混沌的\n大雪今日为我而下，映照我的肮脏\n我就是一把空空的铁锹\n铁锹空得连灰尘也没有\n大雪一直纷纷扬扬\n远方就是这样的，就是我站立的地方"}}, {"i": 7, "prompt": "以《生命》为题写一首现代诗。", "pk": "np-013", "A": {"cond": "human", "body": "我记得。\n我记得生命\n有过非常的恐惧——\n那一瞬，大海冻结了。\n在大海冻结的那一瞬\n无数波涌凝作兀立的山岩，\n小船深深沉落于涡流的洼底。\n从石化的舱房\n眼望石化的大海只剩一片荒凉，\n梦中的我\n曾有非常的恐惧。\n其实，我们本来就不必怀疑，\n自然界原有无可摧毁的生机。\n你瞧，那位对着秋日\n吹送蒲公英绒羽的\n小公主\n依然是那么淘气，\n那么美丽！"}, "B": {"cond": "dpo_full", "body": "生命是树上的一朵花\n从根里长出来的\n从枝桠间生发的\n它有颜色\n有香味和形状\n有阳光照着\n有露水润着\n风吹了它摇一摇头\n雨打它点点头\n它在绿叶中间张开笑脸\n它把世界看在眼里\n它用蜜蜂的语言\n告诉小草要怎么长高\n告诉蝴蝶该飞到哪里去\n告诉月亮别睡得太久\n告诉星星别笑得太多\n它是一朵花\n它也是风中的一个梦"}}, {"i": 8, "prompt": "以《光棍》为题写一首现代诗。", "pk": "np-025", "A": {"cond": "human", "body": "神秘客人那位食玉米担玉米 草筐中埋着牛肝的那光棍\n在春天用了一把大火\n烧光家园 使众人受伤\n\n大家伤心唏嘘不已\n空得丁当响的酒柜上\n光棍光芒万丈\n\n老英雄\n走上前来\n抱住那光棍\n坐在黄昏\n歌唱江山\n布满眼泪"}, "B": {"cond": "dpo_full", "body": "一条腿\n是光棍的一条腿\n两条腿\n是光棍的两条腿\n两片脸\n是光棍的两片脸\n两根胳膊\n是光棍的两根胳膊\n光棍把裤子脱了\n一条腿就比两条腿多了一半\n他把上衣也脱了\n两只袖子就比四只袖子少了一半\n而他就是他自己\n这半截身子的光棍"}}, {"i": 9, "prompt": "以《出峡而去》为题写一首现代诗。", "pk": "np-029", "A": {"cond": "dpo_full", "body": "一叶扁舟\n正驶过\n三峡口的断崖\n\n两岸的山峦已呈平展的波纹\n而那条\n从青藏高原\n一路奔腾\n一路咆哮\n一路怒吼\n一路呜咽\n一路低吟的水\n却在陡然间变得安详了\n它不再狂暴\n不再躁急\n不再愤懑\n不再激荡\n\n它像一位母亲\n温柔地拥着自己的骨肉\n一路顺流而下\n一路放歌而行\n\n而我\n就在它的怀抱里\n静静地\n听到了\n一曲来自大地深处的\n天籁之音"}, "B": {"cond": "human", "body": "人家说“少不入川 老不出川”\n十五岁离你而去该正是时候\n洋船上的少年\n滟滪堆前一点犹豫都没有你不是说“对我来”吗何况掌舵的又不是我自己便对着你对着不可知的未来\n入峡而去\n穿峡而去\n对着水漩中的夔府\n说杜甫再见\n对着雾里的巫山\n说朝云再见\n还有那传说中的神女\n峰中之峰再见\n诸葛亮再见 八阵图再见\n再见再见 杜鹃再见\n用不着唤我“归去”\n三闾大夫犹在七百里外的那头\n我这就要去秭归\n去汨罗\n只有出发才是归去\n去去去 过西陵\n出峡而去\n记忆中你窄窄的天空是一条长长的路\n而我失落的童年\n遂在两岸的猿啼声中随轻舟流逝"}}, {"i": 10, "prompt": "以《清明读诗》为题写一首现代诗。", "pk": "np-012", "A": {"cond": "human", "body": "无家信的日子\n\n又逢清明\n\n风雨说着宇宙性的悲怆\n\n翻读自己的诗集时\n\n实在忍不住\n\n对着那一颗颗，形同\n\n被打落的牙齿般的\n\n六号宋体铅字\n\n苦笑不已\n\n藏在一页空白中的意义\n\n是何种意义\n\n而黑色的标题\n\n哑如盲瞳\n\n这些\n\n全都给我吞下去了\n\n连血\n\n连碎肉\n\n连无牙可咬的痛楚\n\n每个意象\n\n都被强烈的胃酸溶解\n\n吐出来时\n\n竟是一大堆\n\n热得烫手的铁钉\n\n风雨中\n\n凛然面对窗外的青山\n\n大声独诵\n\n一首关于清明的诗\n\n居然有鬼哭狼嗥惊天撼地之声势\n\n而远处传来的回响\n\n则有如\n\n深一脚\n\n浅一脚的\n\n雨鞋踢踏而来的苍凉"}, "B": {"cond": "dpo_full", "body": "清明雨中\n读一卷诗\n诗中的水声潺潺而下\n仿佛从远古的竹简间\n汩汩地流进\n我潮湿的眼眶里\n\n青石小径上\n一树梨花\n簌簌抖落如雪的花瓣\n仿佛是千年前\n那位诗人\n轻轻拂去书页上的尘埃\n\n烟雨朦胧中\n一行行字迹\n在纸张上洇开成墨色的云\n恍惚看见那双凝视远方的眼睛\n正穿越千年岁月\n静静注视着我\n这一个阅读者\n\n细雨敲打窗棂的声音\n如同平仄交错的韵律\n每一个音节都带着泥土的芬芳\n每一处留白\n都是未说出的思念\n\n清明时节\n最适合与诗同醉\n且让心灵沉入那澄澈的溪流\n任思绪随春波荡漾"}}, {"i": 11, "prompt": "以《羊年十二行》为题写一首现代诗。", "pk": "np-014", "A": {"cond": "human", "body": "卡特吃不吃羊肉\n\n这不是问题\n\n问题乃在\n\n北平东来顺的火锅中\n\n正在燉的究竟是\n\n谁的肉？\n\n欲雪的下午\n\n天安门的石狮子冷得发抖\n\n拥轻裘而饮茅台的大爷们\n\n不会不知道\n\n剥制羊皮的过程\n\n就是一部中国现代史的过程"}, "B": {"cond": "dpo_full", "body": "天降祥瑞\n羊儿在草地上吃着春天\n大年初一，羊群奔向山岗\n老农把红纸剪成羊的形状\n贴到门上\n春联上写着：天增岁月人增寿\n羊儿在阳光下奔跑\n像一群跳动的心脏\n它们跳跃在田野中\n像音符从牧笛中飘出\n在蓝天下旋转，旋转\n在风中旋转"}}, {"i": 12, "prompt": "以《极地民居》为题写一首现代诗。", "pk": "np-015", "A": {"cond": "human", "body": "原野苍苍。\n所有道路都被一宿风声洒扫。\n天下好像不曾走动过脚踵。\n记不起有无客来。布幡褴褛。\n穹隆甚低。野鸡翎插在墙壁。\n酒杯已朽。我不再擦拭铜壶或礼器。\n烛光在窗纸晾干。屋脊不再呜咽如狼。\n书稿摊开撒满废字。是鱼目刺痛眼珠。\n山阿里有融融唢呐声融蚀烈女的郁结。\n冰河与红灯谨守着北方庭除。\n一切平静。一切还会照样平静。\n一弹指顷六十五刹那无一失真。\n青山已老只看如何描述。"}, "B": {"cond": "dpo_full", "body": "在北极圈内，有座木屋\n屋顶是两排铁罐头盒\n排列成三角形，遮住风雪\n门楣上悬着一串冰雕的鱼干\n窗棂前晒着几块冻肉\n一只黑熊抱着火炉睡了\n它的脚上长满了鳞片\n它梦里一定在水下奔跑\n我从南极来，也住在这屋里\n我们同用一个烟囱取暖\n但我们的语言不通\n我只能画些符号\n你指着墙上的地图说：这里\n是我的国家，那里是你的国土\n我们各自把名字刻在一堵墙上"}}, {"i": 13, "prompt": "写一首现代诗，其中出现「中央」与「炮声」。", "pk": "ni-002", "A": {"cond": "human", "body": "什么塑造了你\n\n当你塑造了暴风雨的中心\n\n正午，我往往站在中央\n\n往往使自己觉得距太阳最近\n\n影子自无必要\n\n说汗水将如何如何肥沃一部历史\n\n亦无必要\n\n广场上\n\n鸽子啄去了我半个下午\n\n另一半浪费在\n\n与铜像深深的对视上\n\n我在等待炮声\n\n而炮声响起时又将如何\n\n降旗的号音\n\n一再强调我们明日的辉煌\n\n咯咯而去的靴子啊\n\n你岂可装作不懂"}, "B": {"cond": "dpo_full", "body": "我们从中央的\n一座山巅下来\n我们走过\n几座村庄，\n我们在村口停了一停：\n一匹马\n牵着一只母牛\n正向草坡上爬去。\n我们继续走。\n忽然有\n一声炮响\n轰隆隆地\n把我们惊散到\n四面八方去了……"}}, {"i": 14, "prompt": "以《影子与我》为题写一首现代诗。", "pk": "np-016", "A": {"cond": "human", "body": "我恋慕我的身影：\n黧黑的他，更易遭受粗鄙讹诈。\n看哪，我保护他。与其共哀荣。\n只有我准确地辨析他的体线。\n他的躯干黑棕榈般端庄。\n我陪伴他常年走在高山雪野。在风中\n与他时时沐浴湍流，洗去世俗尘垢。\n当我点燃锻炉，朝铁砧重重抡起锻锤，\n在铁屑迸射释出的星火\n他抽搐，瞬刻拉长体驱，像放声的笑，\n像躲藏的谜底，倒向四壁，为光华倾泻\n而兴奋得陡然苍白。"}, "B": {"cond": "dpo_full", "body": "你是一匹马，在我的身后奔跑。\n我是一匹马，在你的身后奔跑。\n我们互相追逐着。从早晨到夜晚，\n从黑暗的山林到光明的城市。\n\n我问你：你可曾看见一个影子？\n你说，你看见了，你正站在它的旁边。\n你向它打招呼，它却不再回答。\n因为，当你转身的时候，它已经消失不见。\n\n你告诉我：那是一匹死马。\n而我告诉自己：那是一匹活马。\n我们继续互相追逐着。从早晨到夜晚，\n从黑暗的山林到光明的城市。"}}, {"i": 15, "prompt": "写一首现代诗，其中出现「射手」与「篱笆」。", "pk": "ni-009", "A": {"cond": "human", "body": "请看，晚云的血……\n我忽然想到先王的铜鉴或已生锈！\n啊，是的，铜鉴生锈了，菌落斑驳覆满青铜。\n我们无从体味母体的滋润了。\n\n但你侧立打靶场向环靶扣机点发的短枪射手，\n弹无虚发，阵阵滚雷雄气勃勃挟着硝烟推进，\n像礼炮齐鸣滞涩地覆盖过城市屋宇。\n文明地施暴，你有的是贵族青年的冷酷。\n我们已无从指认故乡的畈田篱笆。"}, "B": {"cond": "dpo_full", "body": "在山边的\n射手，把一只白羊射死\n然后，脱下一件毛皮大衣\n披在身上，他开始走路\n从一条小路，经过一座教堂\n和一所学校的篱笆，走到一片空地\n那里有一棵苹果树\n他的脚是黑色的\n像秋天的树干，他的手是黑色的\n像冬天的树枝，当风走过\n他便站到篱笆的另一边\n望着自己黑色的身体\n在篱笆里，一株草正在长高"}}, {"i": 16, "prompt": "以《博尔赫斯的遗产》为题写一首现代诗。", "pk": "np-002", "A": {"cond": "human", "body": "在他不再是他时\n他的模仿者肩扛两支大桨\n把从白昼盗来的光贩运过去\n一块可让理性流动的大理石\n仅藏匿深度所需之空间\n于是过去成为现在\n告诉严肃的尘埃：\n大理石内在的神没有迟疑\n任黎明持久装饰\n任坏死的智力啄食风景\n战胜了言辞的石头，开始奔驰\n便再次瞥见摇撼时间的高峰\n他离去，为保持它。"}, "B": {"cond": "dpo_full", "body": "在图书馆，在那间藏书室\n我们翻阅了他所有的著作\n没有找到一张照片\n我们读他的诗，读他的故事\n读他那双眼睛里的星空\n读他的沉默，读他的孤独\n我们问：他是谁？\n没有人知道，但我们都记得\n他在那里，像一本厚重的书\n我们合上书页，走出门去\n在阳光下，我们想起他说过的\n“我是一匹驮着书籍的骆驼”"}}, {"i": 17, "prompt": "以《彩色骚动》为题写一首现代诗。", "pk": "np-030", "A": {"cond": "dpo_full", "body": "一株玫瑰\n在黄昏的光晕里\n抖落自己满身的色彩\n一片花瓣\n是蝴蝶扇动的翅膀\n它把春天从树上吹了下来\n另一片花瓣\n则将夏天\n从池塘里捞起\n当一阵秋雨打皱了叶子\n它便开始编织自己的梦境\n梦中没有季节\n只有色彩的骚动"}, "B": {"cond": "human", "body": "有一群炮弹从他的童年呼啸而过\n他战栗的素描为烈酒所熏香\n他迈出炽热的步伐\n他紧握一掌绢丝\n他推动一支滚筒\n他架构一座城市\n他掷出六面命运\n他推翻一付骨牌\n彩色在他的排笔下骚动\n月亮也在他线魂的峰峦\n吟唱变调的情歌\n金漆般闪光的声音\n仿佛乌云后面的太阳\n仿佛暴雨即将来临前的变幻\n而竟是一撇忧、一捺喜\n有时枯 有时焦 有时淡\n有时浓\n彩色在心中骚动"}}, {"i": 18, "prompt": "写一首现代诗，其中出现「和马」与「黑夜」。", "pk": "ni-003", "A": {"cond": "dpo_full", "body": "夜雨后\n我带了酒和马出了门\n在一条\n长着野菊花的小路上\n我对着自己的影子喝着醉酒\n我牵着马走了很久\n我唱了一首关于黑夜的歌给它听\n然后我就睡着了\n马也睡着了\n而黑夜则从四面八方涌来\n把我紧紧地包围起来"}, "B": {"cond": "human", "body": "火的叫声传来\n火的叫声微弱\n山坡上牛羊拥挤\n想起你使我眩晕\n\n﹡\n\n英雄的猎人\n拥着一家酒店\n坐在白雪中\n心中的黑夜寒冷\n\n﹡\n\n在黑夜里为火写诗\n在草原上为羊写诗\n在北风中为南风写诗\n在思念中为你写诗\n\n﹡\n\n夜的中心幽暗\n边缘发亮 寒冷\n这是 火儿\n照亮雪山和马\n\n﹡\n\n大地薄弱\n两端锋利\n使中心幽暗\n难以分辨"}}, {"i": 19, "prompt": "以《军火贩子之死》为题写一首现代诗。", "pk": "np-018", "A": {"cond": "dpo_full", "body": "我用猎枪\n杀死了我的一个\n敌人\n我用我的\n手和脚\n捆起他的尸首\n将他装进棺材\n我用一箱炸药\n点燃了火焰\n我用手枪\n射穿他的头颅\n用子弹\n射穿他妻子的胸脯\n我用一把铁锤\n砸碎了他的眼睛\n用一把铁斧\n劈开他的头盖骨\n把他的脑浆\n挖出来\n扔进一条河里"}, "B": {"cond": "human", "body": "他\n\n萎萎缩缩地\n\n被押往第二刑场\n\n从手铐中伸出的指头\n\n细细掐算着：\n\n冲锋枪每支三十八万\n\n手枪每支十二万\n\n手榴弹每颗一万五\n\n子弹奉送，或按时价另议\n\n第一枪射中他的左胸\n\n有点火辣辣地痛\n\n子弹蛇行于体内\n\n却又在某一深处突然停住的痛\n\n但绝非他卖出的枪所制造的\n\n那种痛\n\n他从未如此清醒\n\n血泊中\n\n他仔细打量行刑者手中的枪\n\n唉！\n\n居然用这种旧货"}}, {"i": 20, "prompt": "写一首现代诗，其中出现「唢呐」与「泡沫」。", "pk": "ni-015", "A": {"cond": "dpo_full", "body": "唢呐的旋律在空气中飘荡，\n像那泡沫一样地消失。\n谁曾想那泡沫\n也会有如此大的音量。\n\n唢呐的声音从高到低，\n像是那泡沫般变幻多端。\n我望着那天空，\n那天空也仿佛是一块大大的泡沫。\n\n那泡沫有时会破，\n然后又变成一滴滴的小水珠，\n滴答着掉下来，\n滴落在我的心上。\n\n唢呐的声音是那么地响亮，\n让我忘记了时间。\n我抬头看那天空，\n那天空也是一片片的泡沫。\n\n唢呐，那唢呐的声音\n就像那一层层的泡沫一样地美丽，\n却又那样地脆弱，\n一不小心就会破碎。\n\n唢呐啊，唢呐，\n你可知道你的声音是多么地吸引人吗？\n我是多么地喜欢听你的歌声，\n那歌声里有着无限的希望。"}, "B": {"cond": "human", "body": "无穷的泡沫，夜的泡沫，夜的过滤器。\n半失眠者介于健康与不净之间，\n在梦的泡沫中浮沉，梦出梦入。\n街边的半失眠者顺理成章地成了大街的看守。\n\n寡淡乏味，醉鬼们的歌喉\n撕扯着人心，谁能对他们说教仁爱礼义？\n一会儿是夜归人狠揍一扇铁门。\n唢呐终于吹得天花乱坠，陪送灵车赶往西天。\n安寝的婴儿躺卧在摇篮回味前世的欢乐。\n只有半失眠者最为不幸，他的噩梦\n通通是其永劫回归的人生。\n但黎明已像清澈的溪流贯注其间，\n摇滚的幽蓝像钢材的镀层真实可信，\n一切的魑魅魍魉暂时不复困扰。"}}, {"i": 21, "prompt": "以《谣辞》为题写一首现代诗。", "pk": "np-022", "A": {"cond": "human", "body": "（那刻月光凄清迷离）\n\n山坡，五座圆圆的垄堆。\n啊，是圆圆的五座垄堆。\n其中只有一座生长着茂密的茅草。\n不长茅草的垄堆真孤单，真是孤单。\n而那时我看到了奇迹发生：\n我看到一片茅草地飞来，嗖的一声飞来像鸟儿。\n像鸟儿飞落窠巢稳稳飞落窠巢若无其事。\n除了我，无人发觉一片茅草地像鸟儿飞落窠巢。\n不要担心，很快就会有另一片茅草地凭空飞来，\n竟像鸟儿飞落窠巢若无其事。"}, "B": {"cond": "dpo_full", "body": "秋色好，秋色好，秋色在树上。\n树叶红了，小花谢了，\n树下人儿多又少。\n秋色好，秋色好，秋色在树上。\n\n月儿圆，月儿圆，月儿满天飞。\n月亮白了，云朵黑了，\n天上星星稀又稀。\n月儿圆，月儿圆，月儿满天飞。\n\n牛栏空，牛栏空，牛栏有青草。\n牛儿吃着，猪儿睡着，\n鸡儿咕噜咕噜叫。\n牛栏空，牛栏空，牛栏有青草。"}}, {"i": 22, "prompt": "以《无题》为题写一首现代诗。", "pk": "np-026", "A": {"cond": "human", "body": "尾随着太阳绿色的光芒\n又在我微妙的心里，把象征点燃：\n幻觉，开始出入思想的林莽\n伏在无数狂奔的野兽背上\n沐浴在朦胧的夕光中\n黄昏金色的尘埃\n附上我视觉中的一切影像\n这样深刻的与丰富的\n好像许多陌生人\n正从他们的声音里\n慢慢向我走来\n好像山谷中有病的荆棘\n红色的，黑色的\n它们秘密开遍我的周围……"}, "B": {"cond": "dpo_full", "body": "雨滴在铁皮屋顶上跳华尔兹\n我坐在沙发里\n把一杯咖啡喝完再续一次\n书页翻动的声音像一只小猫\n从地板上跳到窗台\n窗外是风的呼啸和树的摇摆\n我在自己的影子里找一扇门\n打开它 一屋子月光\n有人在打电话 声音断断续续\n像一条受伤的小鱼搁浅在岸边\n而我的眼睛已经习惯于黑暗\n于是我就这样睡着了\n梦里有花 雨和一个女孩\n她正对着镜子梳头"}}, {"i": 23, "prompt": "以《独自在黑暗里》为题写一首现代诗。", "pk": "np-007", "A": {"cond": "dpo_full", "body": "没有光的灯\n在夜里，亮起\n在黑夜中，熄灭\n我在灯下\n我不能离开我的房间\n我不愿离开我的房间\n我是独自的\n我是一只孤独的蜘蛛\n我是一个独自的人\n在自己的房间里\n在自己的灯下\n一个人，独自地生活着"}, "B": {"cond": "human", "body": "你也是，在隔壁\n为了语言中绝望的相遇\n沉默中，有一盏灯：\n触摸是语言，告别是触摸\n哀伤还在练习：\n结束，也需要热情\n死亡还在泄漏：别\n离开我，别靠近我\n坟墓以外，全是黑暗……"}}, {"i": 24, "prompt": "以《葡萄园之西的话语》为题写一首现代诗。", "pk": "np-019", "A": {"cond": "human", "body": "也好\n我感到\n我被抬向一面贫穷而圣洁的雪地\n我被种下，被一双双劳动的大手\n仔仔细细地种下\n\n于是，我感到所罗门的帐幔被一阵南风掀开\n所罗门的诗歌\n一卷卷\n滚下山腰\n如同泉水\n打在我脊背上\n\n涧中黑而秀美的脸儿\n在我的心中埋下。也好\n我感到我被抬向一面贫穷而圣洁的雪地\n你这女子中极美丽的，你是我的棺材，我是你的棺材"}, "B": {"cond": "dpo_full", "body": "从你那儿我才知道\n葡萄架下有那么一片阴凉\n在七月的中午\n我曾坐了好久\n而你坐在我的对面\n你向我解释说\n这就是“无事忙”\n——你用一只空杯\n不断地往我这儿倒水\n你说：“你喝吧！”\n我说：“不要了。”\n你说：“你喝吧！”\n我说：“不要了。”\n于是我就想：葡萄熟了以后\n这园子里的主人将如何\n对待那些\n不肯吃葡萄的人呢？"}}, {"i": 25, "prompt": "写一首现代诗，其中出现「双重」与「密集」。", "pk": "ni-016", "A": {"cond": "human", "body": "斜靠着收割下来的多数\n闲散，密集的暴风雨\n广大园林，歌声的屏障\n怎样在风尘配音的叙述里\n穿过抵抗的断层\n沿让步那一个又一个的关节\n朝死亡省力，当合力乏力\n推牌般艰辛的稻束，倒伏又向前\n巨型荒芜，忠诚，大雷\n那牵动里程的累\n怎样在沙子忠实的流逝中\n从悲怆的突破处\n为补充碑文的残缺而来\n水泥村庄把我们全都围成追悼者\n对着光与先人的双重哀悼——"}, "B": {"cond": "dpo_full", "body": "双重的光亮下\n在双重的时间内\n我看见了双重的\n一个世界里两个世界\n两个世界里的一个世界\n\n那双眼睛——\n从哪儿来？去哪？\n我问它们。\n“是这儿的”它们说\n它们是那儿来的。\n密集的云中，\n密集的雨，密集的风。\n没有路也没有桥\n我却站在那儿\n用一只鞋走路，\n用一只手拥抱。"}}, {"i": 26, "prompt": "写一首现代诗，其中出现「海洋」与「陆地」。", "pk": "ni-014", "A": {"cond": "human", "body": "倾向于宏伟的母亲\n抱着白虎走过海洋\n\n陆地上有堂屋五间\n一只病床卧于故乡\n\n倾向于故乡的母亲\n抱着白虎走过海洋\n\n扶病而出的儿子们\n开门望见了血太阳\n\n倾向于太阳的母亲\n抱着白虎走过海洋\n\n左边的侍女是生命\n右边的侍女是死亡\n\n倾向于死亡的母亲\n抱着白虎走过海洋"}, "B": {"cond": "dpo_full", "body": "陆地和海洋，\n在它们的接触点上，\n海水和泥土相遇，\n于是便有了一条边界。\n当风从海洋吹来时，\n它带来咸味；\n而来自陆地的风吹去沙粒。\n两者之间有一段距离，\n在阳光下形成一条光带。\n这是一条分界线——\n它让海涛和浪花停止，\n让鸟儿盘旋着飞过。"}}, {"i": 27, "prompt": "写一首现代诗，其中出现「原野」与「战场」。", "pk": "ni-010", "A": {"cond": "dpo_full", "body": "那是一片原野。\n是的，一片荒原，\n没有道路，\n也没有树木，\n只有风声。\n\n一只鹰掠过头顶，\n一只狐狸钻入地洞，\n一匹马从山崖上跌下，\n血流了一地，\n染红了草叶，\n和岩石上的苔藓。\n\n这是你的原野，\n我的战友，\n也是我们的家园，\n我们的战场。\n我们曾在那上面搏斗，\n用双手，\n用牙齿，\n用刀和枪，\n用鲜血和生命，\n把一个世界埋葬在另一个世界下面。"}, "B": {"cond": "human", "body": "黎明手捧亲生儿子的鲜血的杯子\n捧着我，光明的孪生兄弟\n走在古波斯的高原地带\n神圣经典的原野\n太阳的光明像洪水一样漫上两岸的平原\n抽出剑刃般光芒的麦子\n走遍印度和西藏\n从那儿我长途跋涉 走遍印度和西藏\n在雪山、乱石和狮子之间寻求\n天空的女儿和诗\n波斯高原也是我流放前故乡的山巅\n\n采纳我光明言辞的高原之地\n田野全是粮食和谷仓\n覆盖着深深的怀着怨恨\n和祝福的黑暗母亲\n地母啊，你的夜晚全归你\n你的黑暗全归你，黎明就给我吧\n让少女佩戴花朵般鲜嫩的嘴唇\n让少女为我佩戴火焰般的嘴唇\n让原始黑夜的头盖骨掀开\n让神从我头盖骨中站立\n一片战场上血红的光明冲上了天空\n火中之火，\n他有一个粗糙的名字：太阳\n和革命，她有一个赤裸的身体\n在行走和幻灭"}}, {"i": 28, "prompt": "以《上升的巨石世界，无光》为题写一首现代诗。", "pk": "np-011", "A": {"cond": "human", "body": "逆光，向光\n心是这样的\n它蔑视权力\n自我赋予自由\n海竖起来了\n万山千山舞蹈而来\n对着光，校正光\n这深渊般的明镜——眼中之眼\n只捕捉要去灯塔的人"}, "B": {"cond": "dpo_full", "body": "上升的巨石世界\n无光\n无影\n无尘埃\n\n石头上长满头发\n树上\n长满眼睛\n\n一个\n没有太阳的世界"}}, {"i": 29, "prompt": "写一首现代诗，其中出现「手中」与「雨点」。", "pk": "ni-011", "A": {"cond": "dpo_full", "body": "你手中没有伞。\n雨点，一滴一滴地\n从天空掉下来。\n\n你站在屋檐下，\n听它们\n敲着你的额头，\n像在说：\n“别淋湿了。”"}, "B": {"cond": "human", "body": "风风雨雨\n\n适于独行\n\n而且手中无伞\n\n不打伞自有不打伞的妙处\n\n湿是我的湿\n\n冷是我的冷\n\n即使把自己缩成雨点那么小\n\n小\n\n也是我的小"}}];
const LABEL = {"human": "真实诗人原作", "dpo_full": "夜训版（全参预训练+SFT+DPO）", "pt3_sft": "夜训版B（扩语料预训练+SFT）"};
const KEY = "cyberpoet_night_quiz_v1";
let labels = JSON.parse(localStorage.getItem(KEY) || "{}");
function idx(){ for(let i=0;i<PAIRS.length;i++) if(!(i in labels)) return i; return -1; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(labels)); }catch(e){} }
function pick(v){ const i=idx(); if(i<0) return; labels[i]={choice:v,at:Date.now()}; save(); render(); }
function undo(){ const done=Object.keys(labels).map(Number).sort((a,b)=>a-b); if(!done.length) return;
  delete labels[done[done.length-1]]; save(); render(); }
function exp(){ const out=Object.entries(labels).map(([i,v])=>({
    pk:PAIRS[i].pk, A:PAIRS[i].A.cond, B:PAIRS[i].B.cond, choice:v.choice}));
  const b=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="night_quiz_labels.json"; a.click(); }
function tally(){
  const wins={}, losses={}, bad={}, mat={};
  for(const c in LABEL){ wins[c]=0; losses[c]=0; bad[c]=0; }
  for(const [i,v] of Object.entries(labels)){
    const p=PAIRS[i], a=p.A.cond, b=p.B.cond;
    const k=[a,b].sort().join(" vs ");
    mat[k]=mat[k]||{};
    if(v.choice==="A"){ wins[a]++; losses[b]++; mat[k][a]=(mat[k][a]||0)+1; }
    else if(v.choice==="B"){ wins[b]++; losses[a]++; mat[k][b]=(mat[k][b]||0)+1; }
    else { bad[a]++; bad[b]++; mat[k]["都差"]=(mat[k]["都差"]||0)+1; }
  }
  let rows=Object.keys(LABEL).map(c=>({c,w:wins[c],l:losses[c],b:bad[c]}));
  rows.sort((x,y)=>(y.w-y.l)-(x.w-x.l));
  let h='<div class="done"><h2>结算（已解盲）</h2>';
  h+='<p class="legend">你在标注时看不到条件名；下面按净胜排序，仅是计票，怎么定夺仍由你。</p>';
  h+='<table><tr><th>配置</th><th>胜</th><th>负</th><th>卷入「都差」</th><th>净胜</th></tr>';
  for(const r of rows) h+='<tr><td style="text-align:left">'+LABEL[r.c]+'</td><td class="'+(r.w>r.l?"win":"")+'">'+r.w+'</td><td>'+r.l+'</td><td>'+r.b+'</td><td>'+(r.w-r.l)+'</td></tr>';
  h+='</table><h3>两两对阵</h3><table><tr><th>对阵</th><th>比分</th></tr>';
  for(const k of Object.keys(mat).sort()){
    const m=mat[k], parts=Object.entries(m).map(([c,n])=>(LABEL[c]||c).split("：")[0].split(" +").join("+")+" "+n);
    h+='<tr><td style="text-align:left;font-size:13px">'+k+'</td><td style="font-size:13px">'+parts.join("　")+'</td></tr>';
  }
  h+='</table><p>解盲统计只是计票；导出 JSON 发我即可归档并驱动下一轮。</p></div>';
  return h;
}
function render(){
  const i=idx(), n=Object.keys(labels).length;
  document.getElementById("n").textContent = n+" / "+PAIRS.length;
  document.getElementById("p").style.width = (100*n/PAIRS.length)+"%";
  const m=document.getElementById("m");
  if(i<0){ m.innerHTML=tally(); return; }
  const p=PAIRS[i];
  m.innerHTML='<div class="prompt">'+(p.prompt||"（无题目文字）")+'</div><div class="row">'+
    '<div class="poem" onclick="pick(\'A\')"><h3>甲</h3><pre>'+esc(p.A.body)+'</pre></div>'+
    '<div class="poem" onclick="pick(\'B\')"><h3>乙</h3><pre>'+esc(p.B.body)+'</pre></div></div>'+
    '<div class="keys">← 选甲　→ 选乙　↓ <b>两首都不值得留</b>　↑ 撤销　（标完自动解盲结算）</div>';
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") pick("A"); else if(e.key==="ArrowRight") pick("B");
  else if(e.key==="ArrowDown") pick("tie"); else if(e.key==="ArrowUp") undo();
});
render();
</script></body></html>
